name: Deploy to GCP VM (dev)

# dev에 push(=PR 머지)되면 자동 배포. 수동 실행(workflow_dispatch)도 가능.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 VM 접속 → git pull + 재빌드
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd ~/job_simulator
            git fetch origin dev
            git reset --hard origin/dev
            docker compose -f infra/docker-compose.yml --env-file .env up -d --build
            docker image prune -f
            docker compose -f infra/docker-compose.yml ps
            # 헬스체크 게이트 — up 성공(컨테이너 뜸)과 '실제로 응답함'은 다르다.
            # 마이그레이션 크래시 등으로 api가 재시작 루프면 up은 성공해도 /health가 안 뜬다.
            # 60초 안에 200이 없으면 배포를 실패로 처리하고 api 로그를 남긴다 → '배포 성공인데 죽어있음'을 CI가 잡음.
            for i in $(seq 1 20); do
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "✅ API 헬스체크 통과"; exit 0
              fi
              sleep 3
            done
            echo "❌ API가 60초 내에 응답하지 않음 — 배포 실패"
            docker compose -f infra/docker-compose.yml logs api --tail 50
            exit 1
