name: jobsimulator

services:
  api:
    build: ../services/api
    env_file:
      - path: ../.env
        required: false
    environment:
      # DATABASE_URL은 .env에서 주입 (Supabase 클라우드 DB).
      # 로컬 DB를 쓰려면: .env에 postgresql+asyncpg://app:app@db:5432/jobsim 설정 후
      # `docker compose --profile localdb up -d` 로 기동.
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
      - ../storage:/app/storage
      - ../secrets:/app/secrets:ro  # GCP 서비스계정 JSON(Vertex AI)용 — 없으면 빈 디렉토리(무해)
    depends_on:
      redis:
        condition: service_healthy

  db:
    profiles: ["localdb"]  # 기본은 Supabase — 로컬 DB가 필요할 때만 활성화
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: jobsim
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d jobsim"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # React 앱 스캐폴딩 후 주석 해제 (apps/web/Dockerfile + infra/nginx/nginx.conf 필요)
  # web:
  #   build: ../apps/web
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - api

volumes:
  pgdata:
