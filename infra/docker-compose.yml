name: jobsimulator

services:
  api:
    build: ../services/api
    env_file:
      - path: ../.env
        required: false
    environment:
      # DATABASE_URL은 .env에서 주입 (Supabase 클라우드 DB).
      # 로컬 DB를 쓰려면: .env에 postgresql+asyncpg://app:app@db:5432/jobsim 설정 후
      # `docker compose --profile localdb up -d` 로 기동.
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
      - ../storage:/app/storage
      - ../secrets:/app/secrets:ro  # GCP 서비스계정 JSON(Vertex AI)용 — 없으면 빈 디렉토리(무해)
    depends_on:
      redis:
        condition: service_healthy

  db:
    profiles: ["localdb"]  # 기본은 Supabase — 로컬 DB가 필요할 때만 활성화
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: jobsim
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d jobsim"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../apps/web
      args:
        # 브라우저가 백엔드를 호출할 공개 주소 — 배포 VM에선 .env에 VITE_API_BASE_URL=https://<도메인>
        # (https면 endpoints.ts가 ws→wss도 자동 치환). 값 변경 시 --build 필수(빌드에 baked).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    expose:
      - "80"  # 호스트 포트 미개방 — 앞단 caddy가 TLS 종단 후 web:80 으로 프록시
    depends_on:
      - api

  # 엣지 리버스 프록시 — PUBLIC_DOMAIN에 대해 자동 HTTPS(Let's Encrypt) 발급 후 web으로 프록시.
  # 배포 VM: .env에 PUBLIC_DOMAIN=<서브도메인>.duckdns.org 설정 + 방화벽 tcp:80,443 개방 필요.
  # 로컬은 PUBLIC_DOMAIN 미설정 → localhost 내부 인증서(https://localhost)로 동작.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 발급받은 인증서 영속화 (재배포 시 재발급 방지)
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
