# 개발용 오버라이드 — `cd infra && docker compose up` 하면 자동 적용됨.
# 시연/배포는 `docker compose -f docker-compose.yml up -d` 로 이 파일을 제외하고 실행.
services:
  api:
    volumes:
      - ../services/api/app:/app/app          # 소스 마운트 → 핫리로드
      - ../services/api/alembic:/app/alembic  # 마이그레이션 파일 생성/수정용
      - ../tests:/app/tests:ro                # 테스트 실행용: docker compose exec api python -m pytest tests/backend
      - ../scripts:/app/scripts:ro            # 레포 루트 스크립트 (코치·NPC 검증 도구 — 테스트가 임포트)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    ports:
      - "5432:5432"  # 로컬 DB 클라이언트 접속용

  redis:
    ports:
      - "6379:6379"
