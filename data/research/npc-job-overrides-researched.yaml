family_constraints:
  F05:
    - 지원자·교육생·근태 개인정보는 업무 목적에 필요한 최소 범위만 취급한다.
    - 채용 합격, 징계, 임금·근태 예외는 권한자가 결정하며 NPC가 대신 확정하지 않는다.
  F06:
    - 성과 수치를 임의로 만들거나 인과관계로 단정하지 않는다.
    - 광고 문구와 고객 데이터 사용은 승인 범위와 채널 정책을 확인한다.
  F07:
    - 미확인 사실, 저작권 미확보 자료, 개인정보가 포함된 콘텐츠를 게시하지 않는다.
    - 악성 댓글 대응과 게시물 삭제는 운영정책과 승인권한을 따른다.
  F08:
    - 범위·일정·비용 변경은 담당 PM 또는 승인권자에게 보고한다.
    - 요구사항과 결정사항은 근거·담당자·기한을 남기며 임의 확정하지 않는다.
  F09:
    - 원본 데이터와 가공 데이터를 구분하고 결측·중복·필터 조건을 기록한다.
    - 개인정보가 포함된 원자료를 대화나 산출물에 그대로 노출하지 않는다.
  F18:
    - 지게차·컨베이어 등 장비 위험구역에 임의 진입하거나 유자격 작업을 대신하지 않는다.
    - 파손·누출·중량물·적재 불안정 발견 시 작업을 멈추고 관리자에게 알린다.
  F21:
    - 화학제품은 라벨·MSDS·희석 기준을 확인하고 임의 혼합하지 않는다.
    - 주사침·혈액·파손 유리·분실물은 맨손으로 처리하지 않고 정해진 절차로 인계한다.

jobs:
  J020:
    focus: 채용 공고부터 지원자 안내와 전형 기록까지의 운영 보조
    work_targets: [채용요청서, 채용공고, 지원자 명단, 전형 일정, 결과 통지]
    outputs: [지원자 현황표, 전형 일정표, 안내메일 초안, 전형 운영 체크리스트]
    npc_roles:
      - {role: 채용담당 팀장, instruction_scope: 모집요건·일정·승인사항 지시}
      - {role: 면접관, instruction_scope: 가능 시간과 평가표 제출상태 전달}
      - {role: 지원자, instruction_scope: 일정·제출서류 문의와 변경 요청}
    stage_tasks: [모집요건과 마감 확인, 지원서·필수서류 누락 확인, 면접관·지원자 일정 조율, 안내 오류와 개인정보 노출 점검, 전형 현황과 미결사항 보고]
    coach_criteria: [공고와 요청서의 요건 일치, 일정 충돌 없음, 지원자별 동일 정보 제공, 개인정보 최소 노출]
    failure_patterns: [지원자에게 합격을 암시, 단체메일 수신자 노출, 면접관 확인 없이 일정 확정]
    source_ids: [NCS-HR]
  J021:
    focus: 사내교육 준비·출결·강사 지원·만족도 취합 보조
    work_targets: [교육계획서, 교육생 명단, 강의자료, 장소·장비, 출결·설문]
    outputs: [교육운영 체크리스트, 출결부, 강사 전달사항, 만족도 요약]
    npc_roles:
      - {role: 교육담당 팀장, instruction_scope: 교육목표·일정·운영기준 지시}
      - {role: 강사, instruction_scope: 교안·장비·진행 요청 전달}
      - {role: 교육생, instruction_scope: 접속·장소·출결 문의}
    stage_tasks: [교육목표와 대상 확인, 명단·교안·장소 점검, 출결과 진행 지원, 장비오류·불참·안전이슈 대응, 만족도와 후속조치 보고]
    coach_criteria: [교육대상·시간·장소 일치, 출결 근거 보존, 변경사항 전원 안내, 설문 결과와 의견 구분]
    failure_patterns: [대리출석을 임의 승인, 강사 확인 없이 교안 수정, 교육생 개인정보 공유]
    source_ids: [NCS-HR]
  J022:
    focus: 인사와 총무 요청의 접수·분류·문서처리 보조
    work_targets: [인사요청서, 조직도, 사내규정, 비품요청, 증명서 신청]
    outputs: [요청 접수대장, 처리현황표, 안내문 초안, 인계 메모]
    npc_roles:
      - {role: 인사총무 팀장, instruction_scope: 우선순위·담당자·처리기한 지시}
      - {role: 부서 담당자, instruction_scope: 인사·총무 요청과 증빙 전달}
      - {role: 임직원, instruction_scope: 증명서·복리후생·비품 문의}
    stage_tasks: [요청 목적과 권한 확인, 규정·증빙·담당자 확인, 요청 분류와 초안 작성, 민감정보·규정예외 점검, 처리결과와 미결건 인계]
    coach_criteria: [요청별 담당과 기한 명시, 규정 근거 확인, 민감정보 접근 제한, 인사 판단은 담당자 이관]
    failure_patterns: [규정 예외를 구두 승인, 민감 문서를 공용 폴더에 공개, 인사와 총무 요청 혼동]
    source_ids: [NCS-HR]
  J023:
    focus: 출퇴근·휴가·연장근로 기록의 대조와 예외 확인 보조
    work_targets: [근태시스템 기록, 휴가신청서, 근무표, 연장근로 승인내역, 정정요청]
    outputs: [근태 대조표, 이상내역 목록, 정정요청서, 월마감 보고]
    npc_roles:
      - {role: 인사팀장, instruction_scope: 마감기준·확인범위·정정절차 지시}
      - {role: 부서 근태담당자, instruction_scope: 근무표와 승인내역 전달}
      - {role: 임직원, instruction_scope: 누락·오류 정정 요청}
    stage_tasks: [마감기간과 기준 확인, 시스템·신청서·승인내역 대조, 누락·중복·불일치 표시, 예외 승인과 개인정보 점검, 정정현황과 미확인건 보고]
    coach_criteria: [원기록 보존, 정정 근거와 승인자 확인, 개인별 정보 비공개, 임의 근태수정 금지]
    failure_patterns: [증빙 없이 시간을 수정, 동명이인 기록 혼합, 휴가 사유를 불필요하게 공유]
    source_ids: [NCS-HR]
  J024:
    focus: 다수 면접관과 지원자의 가능한 시간을 수집해 면접 일정을 확정 보조
    work_targets: [면접관 가능시간, 지원자 가능시간, 회의실 현황, 전형 소요시간, 완충시간]
    outputs: [면접 시간표, 충돌 목록, 확정 안내문, 변경이력]
    npc_roles:
      - {role: 채용담당자, instruction_scope: 전형기간·우선조건·승인선 지시}
      - {role: 면접관, instruction_scope: 가능시간과 일정제약 전달}
      - {role: 지원자, instruction_scope: 가능한 시간과 변경 요청 전달}
    stage_tasks: [전형 조건과 마감 확인, 가능시간과 회의실 수집, 충돌 없는 후보안 작성, 변경·노쇼·연락누락 점검, 승인된 일정 안내와 변경이력 보고]
    coach_criteria: [모든 참여자와 장소의 가용성 확인, 완충시간 반영, 승인 전 확정 표현 금지, 변경 대상자 재안내]
    failure_patterns: [한쪽 일정만 보고 확정, 지원자별 다른 전형시간 제공, 변경 사실을 일부에게 누락]
    source_ids: [NCS-HR]

  J025:
    focus: 타깃과 채널 목적에 맞춘 콘텐츠 기획·제작·성과 정리
    work_targets: [캠페인 브리프, 타깃 페르소나, 콘텐츠 소재, 채널 규격, 성과지표]
    outputs: [콘텐츠 기획안, 원고·카피 초안, 제작요청서, 성과 요약]
    npc_roles:
      - {role: 마케팅팀장, instruction_scope: 목표·타깃·핵심메시지·마감 지시}
      - {role: 디자이너, instruction_scope: 규격·소재·수정일정 협의}
      - {role: 채널 담당자, instruction_scope: 게시정책·성과데이터 전달}
    stage_tasks: [캠페인 목표와 CTA 확인, 타깃·채널·근거자료 확인, 콘텐츠 구성과 카피 작성, 사실·저작권·규격 검수, 게시본과 성과 초기값 보고]
    coach_criteria: [목표와 CTA 일치, 타깃에 맞는 메시지, 주장 근거 표시, 승인본만 게시]
    failure_patterns: [검증되지 않은 수치 사용, 저작권 미확인 이미지 사용, 채널 규격 누락]
    source_ids: [NCS-MARKETING]
  J026:
    focus: 유료 캠페인의 설정값·집행현황·성과지표 운영 보조
    work_targets: [캠페인 목표, 예산, 타깃 조건, 광고소재, 전환 이벤트, 매체 리포트]
    outputs: [세팅 점검표, 집행현황표, 이상탐지 메모, 성과 리포트]
    npc_roles:
      - {role: 퍼포먼스 마케팅 리더, instruction_scope: KPI·예산·중단기준 지시}
      - {role: 매체 운영자, instruction_scope: 심사·노출·비용 현황 전달}
      - {role: 데이터 담당자, instruction_scope: 전환 추적과 집계조건 전달}
    stage_tasks: [목표·예산·기간 확인, 타깃·소재·추적설정 대조, 승인값으로 캠페인 등록, 과소진·미집행·추적오류 점검, 비용·전환·이상사항 보고]
    coach_criteria: [승인 예산 이내, KPI 정의와 집계기간 명시, 추적 정상 여부 확인, 상관관계를 인과로 단정하지 않음]
    failure_patterns: [승인 없이 예산 증액, 전환 정의가 다른 수치 비교, 테스트 소재를 전체 공개]
    source_ids: [NCS-MARKETING]
  J027:
    focus: 브랜드 메시지와 대외 홍보물 제작·배포·모니터링 보조
    work_targets: [브랜드 가이드, 보도자료 초안, 미디어 목록, 행사자료, 보도·반응 모니터링]
    outputs: [홍보문안, 배포목록, Q&A 초안, 보도·반응 요약]
    npc_roles:
      - {role: 홍보팀장, instruction_scope: 핵심메시지·대외표현·승인절차 지시}
      - {role: 사업부 담당자, instruction_scope: 사실관계와 공개가능 범위 전달}
      - {role: 기자·외부문의자, instruction_scope: 사실확인과 자료 요청}
    stage_tasks: [홍보목적과 공개범위 확인, 사실·수치·인용 근거 수집, 채널별 문안 작성, 오보·미승인정보·위기표현 검수, 배포현황과 반응 보고]
    coach_criteria: [사실관계와 승인 확인, 브랜드 표현 일관성, 문의 답변 권한 준수, 부정반응과 오보 구분]
    failure_patterns: [엠바고 전 공개, 내부 수치를 임의 인용, 기자 질문에 추측 답변]
