methodology: >
  통합조사 연결맵에 명시되지 않은 31개 직무를 NCS 공식 능력단위·직무기술서와
  안전보건공단 자료에 맞춰 입문자용 보조업무로 재구성했다. 출처가 직무군 수준인
  경우 세부 업무 분리는 연구자의 해석이며, 실제 배포 전 현업 검수를 권고한다.

