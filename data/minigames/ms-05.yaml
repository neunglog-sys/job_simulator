# 4단계 미니게임 — ms-05 생산·품질관리 사무
# 근거: 돌발 "불량률이 평소 1%에서 8%로 올랐습니다. 출하 전에 조치하세요." / 모범답안
#       "③ 격리 ④ 임시조치" → 컨베이어에서 부적합품을 집어 격리함으로 보내는 게임.
#       2스텝 "입고 자재 성적서 검토" — 흔한 실수 "외관이 정상이라는 이유로 투입" /
#       모범답안 "성적서가 없는 자재에 격리 표시를 부착한다" → 겉은 멀쩡해도 품질 도장이
#       없는 로트는 격리 대상(target)으로 넣어 '외관만 보고 통과'를 함정으로 남긴다.
#       불량 유형(균열·변색·찌그러짐)은 아이콘·색으로만 판단하게 한다(규칙 1).
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: ms-05
engine: spot
title: 불량 골라내기
intro: 컨베이어를 지나는 제품 중 균열·변색·찌그러진 것과 품질 도장이 없는 로트를 집어 격리함으로 보내세요. 정상 제품을 집으면 감점입니다.
time_limit: 60
pass_score: 70

data:
  scene: 생산라인_컨베이어벨트
  mark: tag                     # 집어서 격리 태그를 붙인다

  # 격리해야 할 부적합품 — 전부 원문에 근거한 유형만
  targets:
    - id: 제품_균열1
      sprite: 제품_균열
      at: [150, 210]
      label: 표면 균열
    - id: 제품_균열2
      sprite: 제품_균열
      at: [470, 300]
      label: 표면 균열
    - id: 제품_변색
      sprite: 제품_변색
      at: [300, 170]
      label: 변색
    - id: 제품_찌그러짐1
      sprite: 제품_찌그러짐
      at: [620, 195]
      label: 찌그러짐
    - id: 제품_찌그러짐2
      sprite: 제품_찌그러짐
      at: [810, 285]
      label: 찌그러짐
    # 2스텝 트릭 — 겉은 정상이나 품질 성적서(도장)가 없는 로트. 외관만 보고 통과시키면 실수.
    - id: 자재_성적서없음
      sprite: 제품_정상외관_도장없음
      at: [720, 350]
      label: 성적서(품질 도장) 없는 로트

  # 정상인데 눌리기 쉬운 것 — 누르면 mistakes +1 (찍기 방지)
  decoys:
    - { id: 제품_물방울,     sprite: 제품_정상_물기,       at: [220, 340] }   # 물기=정상, 변색으로 오인
    - { id: 제품_반사,       sprite: 제품_정상_조명반사,   at: [390, 240] }   # 조명 반사, 찌그러짐으로 오인
    - { id: 제품_정상_도장,  sprite: 제품_정상_도장있음,   at: [560, 350] }   # 성적서 정상품
    - { id: 제품_정상,       sprite: 제품_정상,            at: [900, 200] }

# 채점 — 6개 부적합품 중 몇 개를 격리했나에서 오탐을 뺀다
# accuracy = (격리한 targets / 6) * 100 − (누른 decoys * 10), 하한 0
scoring:
  target_count: 6
  decoy_penalty: 10
