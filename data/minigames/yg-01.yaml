# 4단계 미니게임 — yg-01 디자인·영상·콘텐츠 제작
# 근거: 1스텝 "이벤트 배너 시안 검수" — 박도윤: "이 이벤트 배너 시안 3종, 브리프랑
#       검수표 기준으로 하나씩 대조해서 통과·보완 판정해 줘." / mission: "오탈자·색상·
#       해상도·규격 오류를 찾아 표시하고" / 검수표 판단품질기준: 목적·대상·매체 부합,
#       규격 준수, 오탈자·색상 정확성 / 보기 e: "글자 오기, 색상 왜곡, 사이즈 불일치".
# 설계 메모: 배너 3종의 시각 결함을 찾아 X로 태깅하는 '교정 스팟'.
#   규칙1(글자·숫자 판독 금지) 때문에 '오탈자'는 글자를 읽혀 잡게 하지 않고
#   텍스트 색면이 어긋나 찢긴 글리치(색블록 찢김)로 표현한다. '해상도' 오류는
#   주변 도트보다 거칠게 뭉개진(확대된 계단 블록) 이미지로 과장 표현한다.
#   결함은 전부 색·모양으로만 판단하게 한다.
#   id·sprite 는 위치·부위명으로 중립화 — 결함 여부를 문자로 유출하지 않는다(규칙 8).
#   아트 전까지 SpotGame 이 sprite 문자열을 화면에 그대로 노출하므로, 판정 근거는
#   label(발견 후에만 표시)과 주석에만 남긴다.
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: yg-01
engine: spot
title: 배너 시안 교정 스팟
intro: 배너 시안 3종을 브리프·검수표와 대조해 시각 결함을 찾아 X로 표시하세요. 정상인 곳을 표시하면 감점입니다.
time_limit: 60
pass_score: 70

data:
  scene: 배너시안_3종_검수대
  mark: x                      # X자 표시 + 표시할 때마다 셔터 이펙트

  # 견본(참조) — 표시 전용(신규). '견본 보기' 토글로 여닫는다. 브리프·검수표 기준에
  # 맞는 표준 배너 시안의 일반 예시일 뿐, 어느 시안이 결함인지는 지목하지 않는다(규칙 1·8).
  reference:
    sprite: 견본_표준_배너
    label: 브리프·검수표 기준에 맞는 표준 배너 시안 예시 (견본)

  # 찾아야 할 시각 결함 — 색·모양으로만 판단(원문 검수 기준: 오탈자·색상·해상도·규격)
  # 좌표는 960×440 캔버스 기준. 좌(시안A)·중(시안B)·우(시안C) 3분할 배치.
  # size 는 표시 전용(스프라이트 표시 폭, 960×440 논리 캔버스 단위) — 채점·좌표와 무관.
  # 짝(정상/결함) 오브젝트는 같은 size 로 맞춰 크기 차이가 힌트가 되지 않게 한다(_SCHEMA).
  targets:
    - id: A_상단색면
      sprite: 시안A_상단색면
      at: [138, 152]
      size: 100                # A_포인트색면(정상)과 짝 맞춤 — 같은 색면 실루엣
      label: 브랜드 색이 아닌 색상 오류            # 검수표 '색상 정확성'
    - id: A_본문이미지
      sprite: 시안A_본문이미지
      at: [250, 300]
      size: 90
      label: 저해상도로 뭉개진 이미지(해상도 미달)   # mission '해상도 오류' — 주변보다 거친 계단 블록
    - id: B_좌측버튼
      sprite: 시안B_좌측버튼
      at: [470, 322]
      size: 76                 # B_우측버튼(정상)과 짝 맞춤 — 같은 CTA 실루엣
      label: 색면이 어긋나 찢긴 버튼(오탈자 글리치)  # 보기 e '글자 오기' — 오탈자의 시각화
    - id: B_상단심볼
      sprite: 시안B_상단심볼
      at: [392, 130]
      size: 48                 # A_로고부(정상 로고)와 짝 맞춤 — 같은 배지 실루엣
      label: 브리프에 없는 잘못된 심볼             # 검수표 '목적·대상·매체 부합'
    - id: C_우상단요소
      sprite: 시안C_우상단요소
      at: [880, 112]
      size: 72                 # 배경 재단 점선(x=900 부근)을 걸치는 폭
      label: 요소가 재단선(세이프영역) 밖으로 넘침    # 검수표 '규격 준수'
    - id: C_중앙배경면
      sprite: 시안C_중앙배경면
      at: [700, 250]
      size: 110
      label: 배경 색면이 프레임과 어긋나 흰 틈       # 보기 e '색상 왜곡'

  # 정상인데 눌리기 쉬운 것 — 누르면 mistakes +1 (찍기 방지, _SCHEMA 규칙5)
  # 정상 여부도 id·sprite 에 쓰지 않는다 — decoys 소속으로만 구분(규칙 8).
  decoys:
    - { id: A_로고부,     sprite: 시안A_로고부,     at: [92, 92],   size: 48 }   # 정상 로고
    - { id: A_포인트색면, sprite: 시안A_포인트색면, at: [200, 220], size: 100 }  # 오류로 오해하기 쉬운 의도된 포인트 컬러
    - { id: B_우측버튼,   sprite: 시안B_우측버튼,   at: [560, 300], size: 76 }   # 정상 CTA
    - { id: C_하단여백,   sprite: 시안C_하단여백,   at: [762, 360], size: 120 }  # 일부러 넓게 준 여백 — 어긋난 게 아님

# 채점 — 6개 중 몇 개를 찾았나에서 오탐을 뺀다 (SpotGame이 scoring.decoy_penalty 사용)
# accuracy = (찾은 targets / 6) * 100 − (누른 decoys * 10), 하한 0
# decoy 4개 전부 눌러도 −40 — '전부 클릭' 전략이 합격선(70)을 못 넘는다(규칙 5)
scoring:
  target_count: 6
  decoy_penalty: 10
