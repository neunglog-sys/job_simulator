# 4단계 미니게임 — jm-01 육상 운전·배송 대응
# 근거: 2스텝 "상차 물량과 배송리스트 대조" — 이하늘: "오늘 3구역 물량 84개는 네
#       담당이다." answer_guide ⑤ "확정된 리스트에 따라 배송 순서를 정렬하고 파손주의
#       물품의 위치를 확인한다." (파손주의 스티커 물품 목록 — guide)
#       3스텝 guide "노선도(지름길이 어린이보호구역 경유로 표시)"
#       3스텝 warning/금지행동: "보호구역 지름길을 상위 배치", "과속·무정차 통과·
#       보호구역 지름길은 금지행동"
#       기상 정보(호우·시야 불량) — 3스텝 guide
#       출발 전 지도(노선도) 확인 → 1·3스텝 배차표·노선도 확인
# 팀 요청 "1945 도트게임처럼" = 종스크롤 픽셀 화면 느낌이며 슈팅 요소가 아니다.
#   사격·격추 없음. 아래 start(하단)→도착(상단)으로 경로선을 긋는 톱다운 배송이다.
# 연료 제약은 원문에 없으므로 budget에 넣지 않는다(시간 제약만).
# 배송지·회피구역은 아이콘·색·모양으로만 구분하고 숫자를 읽히지 않는다(규칙 1).
scenario_id: jm-01
engine: route
title: 3구역 배송 루트
intro: 출발 전 노선도를 확인하고, 배송지를 순서대로 이어 시간 안에 종점까지 경로를 그으세요. 어린이보호구역은 지나가면 안 됩니다.
time_limit: 90
pass_score: 70

data:
  map: 3구역_노선도                    # 출발 전 확인하는 지도(노선도) — 도트 배경 아트와 동명
  start: { id: 영업소_차고, at: [480, 400], label: 3구역 영업소 · 출차, sprite: 배송트럭_톱다운 }

  # 확정 배송리스트 순서대로 방문할 경유지 (아래 배열 순서가 정답 순서)
  # 종스크롤 느낌으로 하단 차고 → 상단 종점 방향으로 올라간다.
  # sprite = public/assets/minigames/<id>.svg 도트 아트 (없으면 라벨만 — 코드 수정 불요)
  waypoints:
    - { id: 배송지_1, at: [360, 330], label: 1번지 · 일반 배송, sprite: 배송지_건물 }
    - { id: 배송지_2, at: [620, 300], label: 2번지 · 일반 배송, sprite: 배송지_건물 }
    - { id: 배송지_파손주의, at: [300, 240], label: 3번지 · 파손주의 물품 — 상단 경량 적재 확인, fragile: true, sprite: 배송지_파손주의 }
    - { id: 배송지_4, at: [660, 200], label: 4번지 · 일반 배송, sprite: 배송지_건물 }
    - { id: 도착_종점, at: [480, 90], label: 종점 · 하차 완료, arrival: true, sprite: 종점_창고 }

  # 회피 구역 — 지나가면 감점 (함정). 지름길 유혹이 여기를 관통한다.
  avoid:
    # penalty 40 = 만점에서 밟으면 60점(불합격). 25로 두면 '지름길 밟고 75점 통과'가
    # 전략이 되어 원문 금지행동이 사실상 용인된다(검증 지적 반영) — 반드시 합격선(70)
    # 아래로 떨어지는 크기여야 한다.
    - zone: 어린이보호구역
      at: [480, 250]
      radius: 90
      penalty: 40
      reason: 보호구역 지름길·통과는 금지행동 — 민원 압박에도 상위 배치 금지
      # 표지 도트 아트 — 침범해 구역이 드러난 뒤에만 그린다(사전 유출 금지)
      sprite: 어린이보호구역_표지
    - zone: 호우_시야불량구간
      at: [700, 260]
      radius: 60
      penalty: 10
      reason: 호우로 시야 불량 — 서행·우회, 과속 만회 금지

  # 유혹용 지름길: 어린이보호구역을 관통하는 최단 경로. 밟으면 avoid 페널티가 걸린다.
  shortcut_trap:
    { id: 보호구역_지름길, through: 어린이보호구역, note: 시간은 벌지만 규정 위반·감점 }

  # 시간 제약만. 연료 등 다른 제약은 원문에 없어 넣지 않는다.
  budget: { time: 90 }

# 채점 — 순서대로 경유지를 다 잇고 종점 도착했나에서 회피구역 침범을 뺀다
# accuracy = (방문한 waypoints / 5) * 100 − (avoid 침범 zone별 penalty), 하한 0
# 순서를 어기거나 보호구역을 지나면 감점. 시간 초과는 mistakes로 기록.
scoring:
  waypoint_count: 5
  order_matters: true
  # penalty 는 avoid 각 zone의 값을 사용
