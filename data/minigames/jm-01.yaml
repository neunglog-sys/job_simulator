# 4단계 미니게임 — jm-01 육상 운전·배송 대응
# 근거: 2스텝 "상차 물량과 배송리스트 대조" — 이하늘: "오늘 3구역 물량 84개는 네
#       담당이다." answer_guide ⑤ "확정된 리스트에 따라 배송 순서를 정렬하고 파손주의
#       물품의 위치를 확인한다." (파손주의 스티커 물품 목록 — guide)
#       3스텝 guide "노선도(지름길이 어린이보호구역 경유로 표시)"
#       3스텝 warning/금지행동: "보호구역 지름길을 상위 배치", "과속·무정차 통과·
#       보호구역 지름길은 금지행동"
#       기상 정보(호우·시야 불량) — 3스텝 guide
#       출발 전 지도(노선도) 확인 → 1·3스텝 배차표·노선도 확인
# 팀 요청 "1945 도트게임처럼" = 종스크롤 픽셀 화면. 사격·격추 없음.
#   2단계 개편(디자이너 확정): ① 계획 — 노선도에 경로선을 긋는다(보호구역 사전 표시)
#   ② 주행(data.driving) — 계획 제출 후 방향키/WASD 종스크롤 주행으로 장애물을 피한다.
#   최종 accuracy = 계획 점수 − 주행 감점 (기존 채점 계약 위에 감점만 얹음).
# 연료 제약은 원문에 없으므로 budget에 넣지 않는다(시간 제약만).
# 배송지·회피구역은 아이콘·색·모양으로만 구분하고 숫자를 읽히지 않는다(규칙 1).
scenario_id: jm-01
engine: route
title: 3구역 배송 루트
intro: 출발 전 노선도와 기상 안내를 확인하고, 배송지를 순서대로 이어 경로를 계획하세요. 제출하면 실제 주행이 시작됩니다 — 방향키로 장애물을 피하고 서행 구간을 지키세요.
time_limit: 90
pass_score: 70

data:
  map: 3구역_노선도                    # 출발 전 확인하는 지도(노선도) — 도트 배경 아트와 동명
  start: { id: 영업소_차고, at: [480, 400], label: 3구역 영업소 · 출차, sprite: 배송트럭_톱다운 }

  # 확정 배송리스트 순서대로 방문할 경유지 (아래 배열 순서가 정답 순서)
  # 종스크롤 느낌으로 하단 차고 → 상단 종점 방향으로 올라간다.
  # sprite = public/assets/minigames/<id>.svg 도트 아트 (없으면 라벨만 — 코드 수정 불요)
  waypoints:
    - { id: 배송지_1, at: [360, 330], label: 1번지 · 일반 배송, sprite: 배송지_건물 }
    - { id: 배송지_2, at: [620, 300], label: 2번지 · 일반 배송, sprite: 배송지_건물 }
    - { id: 배송지_파손주의, at: [300, 240], label: 3번지 · 파손주의 물품 — 상단 경량 적재 확인, fragile: true, sprite: 배송지_파손주의 }
    - { id: 배송지_4, at: [660, 200], label: 4번지 · 일반 배송, sprite: 배송지_건물 }
    - { id: 도착_종점, at: [480, 90], label: 종점 · 하차 완료, arrival: true, sprite: 종점_창고 }

  # 회피 구역 — 지나가면 감점 (함정). 지름길 유혹이 여기를 관통한다.
  avoid:
    # penalty 40 = 만점에서 밟으면 60점(불합격). 25로 두면 '지름길 밟고 75점 통과'가
    # 전략이 되어 원문 금지행동이 사실상 용인된다(검증 지적 반영) — 반드시 합격선(70)
    # 아래로 떨어지는 크기여야 한다.
    - zone: 어린이보호구역
      at: [480, 250]
      radius: 90
      penalty: 40
      reason: 보호구역 지름길·통과는 금지행동 — 민원 압박에도 상위 배치 금지
      # 계획 화면에 처음부터 반투명 존+표지를 그린다 — 원문 "노선도(지름길이
      # 어린이보호구역 경유로 표시)": 지도가 이미 표기하는 정보라 사전 표시가 원문 부합.
      # visible 이 없는 게임(stn-02 등)은 기존 '침범 후 공개' 유지.
      visible: true
      sprite: 어린이보호구역_표지
    - zone: 호우_시야불량구간
      at: [700, 260]
      radius: 60
      penalty: 10
      reason: 호우로 시야 불량 — 서행·우회, 과속 만회 금지

  # 유혹용 지름길: 어린이보호구역을 관통하는 최단 경로. 밟으면 avoid 페널티가 걸린다.
  shortcut_trap:
    { id: 보호구역_지름길, through: 어린이보호구역, note: 시간은 벌지만 규정 위반·감점 }

  # 시간 제약만. 연료 등 다른 제약은 원문에 없어 넣지 않는다.
  budget: { time: 90 }

  # 기상 안내 — 게임 시작 시 1개가 랜덤으로 걸려 상단 배너로 표시된다.
  # 원문 근거: 3스텝 guide "기상 정보(호우·시야 불량)".
  # effect: 서행 → 주행 기본 속도 감소 + when_effect: 서행 구간 활성(규칙에 반영).
  weather_pool:
    - { id: 맑음, notice: 기상 특이사항 없음 }
    - { id: 호우, effect: 서행, notice: 호우로 시야 불량 — 전 구간 서행 }
    - { id: 안개, effect: 서행, notice: 짙은 안개 — 시야 확보 어려움, 서행 }

  # 주행 파트 — 계획 제출 후 1945식 종스크롤 주행(방향키/WASD). driving 이 있을 때만
  # 붙는다(다른 route 3게임 불변). 장애물·진행률은 시계 역산, rAF 는 렌더만(엔진 규약).
  driving:
    duration: 24                  # 주행 시간(초) — 20~30 권장
    obstacle_density: 0.5         # 장애물 스폰 밀도 0~1
    obstacles: [장애물_차량, 물웅덩이, 장애물_라바콘]
    # 서행 의무 구간 — from/to 는 진행률(0~1). 서행선 위(과속 위치)를 약 1초 유지하면
    # 구역당 1회 감점(사건당 하나 — 중첩 금지).
    slow_zones:
      # 보호구역 과속은 원문 금지행동("과속·무정차 통과 금지") — 합격선(70)을 뚫는 40 (규칙 7)
      - { id: 어린이보호구역, from: 0.30, to: 0.52, penalty: 40, sprite: 어린이보호구역_표지, reason: 보호구역 과속·무정차 통과는 금지행동 }
      # 호우·안개(effect 서행)일 때만 활성 — 맑음이면 일반 구간. 금지행동이 아닌 서행 의무라 10.
      - { id: 시야불량구간, from: 0.64, to: 0.84, penalty: 10, when_effect: 서행, reason: 시야 불량 — 서행 의무, 과속 만회 금지 }

# 채점 — 계획: 순서대로 경유지를 다 잇고 종점 도착했나에서 회피구역 침범을 뺀다
# accuracy = (방문한 waypoints / 5) * 100 − (avoid 침범 zone별 penalty) − 주행 감점, 0~100 클램프
# 주행 감점 = 충돌 건수 × collision_penalty + 서행 위반 zone별 penalty(구역당 1회)
# 순서를 어기거나 보호구역을 지나면 감점. 시간 초과는 mistakes로 기록.
scoring:
  waypoint_count: 5
  order_matters: true
  # penalty 는 avoid 각 zone의 값을 사용
  # 주행 충돌 1건당(사건당 하나 — 장애물 하나에 감점 하나, 중첩 금지). 금지행동이 아닌
  # 사고라 40 미만 — 계획 만점 기준 3회까지는 합격선 위(76), 4회부터 불합격(68).
  collision_penalty: 8
