# 4단계 미니게임 — kts-03 영업·판매·매장응대(와인 매장)
# 근거: 2스텝 "와인 선물 고객 니즈 파악" — 유선우: "선물할 와인 하나 골라줘요. 좋은 걸로."
#       미션 "니즈(받는 분·상황·예산·취향)를 파악해 니즈 메모를 완성"
#       제공 자료 "상품 정보 카드(와인 12종), 재고 현황, 가격대별 추천 매트릭스"
#       흔한 실수 "비싼 상품부터 제시" → 예산 초과 상품을 이으면 감점(금기 조합).
#       "재고 현황"이 있으니 품절 상품은 짝을 못 짓는다(unmatched — 대체 안내가 정답).
# 돌발 근거: "오건우 ... 영수증? 그런 거 없어도 여기서 산 거 맞다니까! 당장 환불해요!
#       (개봉 상품·고성)" 모범답안 ① 경청·사실 확인 ② 규정 근거 안내 ③ 가능한 대안 제시
#       ④ "고성 지속 시 매니저 인계" — 경비원이 아니라 매니저다.
#       원문 오답 "언쟁으로 맞대응 / 조용히 시키려 규정 밖 환불 승인"
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: kts-03
engine: match
title: 니즈-상품 추천 매칭
intro: 손님의 선물 니즈(상황 아이콘 · 예산 가격표)에 맞는 와인을 이어 주세요. 가격표 개수가 손님 예산을 넘는 와인과 재고 빗금이 붙은 와인은 잇지 말고 남겨 두세요.
time_limit: 75
pass_score: 70

data:
  # 표시 전용 — 컬럼 헤더(엔진 left_label/right_label 규약, 채점 무관. 도트 아트 2026-07-20).
  # 가격표 개수는 visual_cues 텍스트에 의존하지 않도록 스프라이트 하단에 같은 개수의
  # 가격표(2×2 도트, 색=가격대)로 직접 그려 넣었다 — 니즈 카드와 와인 병이 같은 글리프.
  left_label: 손님 니즈
  right_label: 와인 진열

  # 왼쪽 = 손님 니즈. 상황은 아이콘, 예산대는 색 + 같은 개수의 가격표 아이콘(visual_cues)으로만.
  left:
    - { id: 니즈_승진축하, sprite: 니즈_승진_레드선호,   budget: yellow, occasion: 승진, label: 승진 축하 · 중간 예산 · 레드 선호 }
    - { id: 니즈_집들이,   sprite: 니즈_집들이_화이트,   budget: green,  occasion: 집들이, label: 집들이 · 낮은 예산 · 화이트 }
    - { id: 니즈_부모님,   sprite: 니즈_부모님_레드,     budget: red,    occasion: 부모님, label: 부모님 선물 · 높은 예산 · 레드 }
    - { id: 니즈_와인초보, sprite: 니즈_초보_스위트,     budget: green,  occasion: 입문, label: 와인 초보 · 낮은 예산 · 달달한 맛 }
    - { id: 니즈_기념일,   sprite: 니즈_기념일_스파클링, budget: yellow, occasion: 기념일, label: 기념일 · 중간 예산 · 스파클링 }

  # 오른쪽 = 와인 상품. 종류는 아이콘, 가격대는 색 + 가격표 개수. (12종 중 화면용 7종 발췌)
  right:
    - { id: 상품_레드_중가,   sprite: 와인_레드_중가,   price: yellow, kind: red,       stock: ok,       label: 레드 · 중간 가격 }
    - { id: 상품_화이트_저가, sprite: 와인_화이트_저가, price: green,  kind: white,     stock: ok,       label: 화이트 · 저가 }
    - { id: 상품_레드_고가,   sprite: 와인_레드_고가,   price: red,    kind: red,       stock: ok,       label: 레드 · 고가 }
    - { id: 상품_스위트_저가, sprite: 와인_스위트_저가, price: green,  kind: sweet,     stock: ok,       label: 스위트 · 저가 }
    - { id: 상품_스파클링_중가, sprite: 와인_스파클링_중가, price: yellow, kind: sparkling, stock: ok,    label: 스파클링 · 중간 가격 }
    # 예산 초과 유도 — 짝 없음. 이으면 '비싼 상품부터 제시' 실수.
    # 판별은 가격표 4장+금박 리본(visual_cues)으로 — '(최고가)' 같은 판정 접미를
    # 라벨에 쓰지 않는다(규칙 8, 검증 지적 반영).
    - { id: 상품_레드_프리미엄, sprite: 와인_레드_프리미엄, price: red, kind: red,     stock: ok,       label: 레드 · 프리미엄 }
    # 품절 — 재고 현황상 없음. 이으면 없는 상품 추천. 대체 안내가 정답.
    # 판별은 병의 재고없음 빗금(visual_cues)으로 — '(품절)' 접미 금지(규칙 8, 검증 지적 반영).
    - { id: 상품_레드_품절,   sprite: 와인_레드_품절,   price: yellow, kind: red,      stock: soldout,  label: 레드 · 중간 가격 }

  # 가격대·재고를 글자 없이 알아볼 시각 단서(ms-03 규약) — 가격표 아이콘 개수가 가격대다.
  # 니즈 카드의 예산도 같은 가격표 개수로 뜬다(저가 1장 · 중가 2장 · 고가 3장).
  # 프리미엄은 가격표 4장 + 금박 리본 — 니즈 예산의 최대치(3장)보다 항상 많아
  # '최고가' 텍스트 없이 예산 초과가 모양으로 판별된다(검증 지적 반영).
  # 품절은 같은 2장 가격표에 병 위 재고없음 빗금 표식으로 정답 중가와 구별된다.
  visual_cues:
    니즈_집들이: 가격표_1장
    니즈_와인초보: 가격표_1장
    니즈_승진축하: 가격표_2장
    니즈_기념일: 가격표_2장
    니즈_부모님: 가격표_3장
    상품_화이트_저가: 가격표_1장
    상품_스위트_저가: 가격표_1장
    상품_레드_중가: 가격표_2장
    상품_스파클링_중가: 가격표_2장
    상품_레드_품절: 가격표_2장_재고없음_빗금
    상품_레드_고가: 가격표_3장
    상품_레드_프리미엄: 가격표_4장_금박리본

  # 정답 짝 — 가격표 개수(예산대)와 취향(종류 아이콘)이 맞고 재고 빗금이 없는 상품끼리.
  # 프리미엄(4장)은 어떤 니즈의 예산(최대 3장)과도 맞지 않아 유효한 짝이 없다 —
  # '부모님(red)→프리미엄도 규칙상 성립'하던 모순 제거(검증 지적 반영).
  pairs:
    - [니즈_승진축하, 상품_레드_중가]
    - [니즈_집들이,   상품_화이트_저가]
    - [니즈_부모님,   상품_레드_고가]
    - [니즈_와인초보, 상품_스위트_저가]
    - [니즈_기념일,   상품_스파클링_중가]

  # 짝 없음 — 프리미엄(예산 초과)과 품절은 남겨야 정답.
  unmatched: [상품_레드_프리미엄, 상품_레드_품절]

  # 금기 조합 — 이으면 즉시 감점.
  forbidden_pairs:
    - { left: 니즈_집들이,   right: 상품_레드_프리미엄, reason: 저예산 손님에게 최고가 제시(예산 초과) }
    - { left: 니즈_와인초보, right: 상품_레드_프리미엄, reason: 저예산 손님에게 최고가 제시(예산 초과) }
    - { left: 니즈_부모님,   right: 상품_레드_프리미엄, reason: 예산 초과 제시 — 가격표 4장 > 예산 3장(비싼 상품부터 제시) }
    - { left: 니즈_승진축하, right: 상품_레드_품절,     reason: 품절 상품 추천 — 재고 현황 미확인 }

  # 돌발 — 오건우가 영수증 없는 개봉 상품 환불을 요구하며 고성. 매칭 판 위로 난입한다.
  # 매뉴얼 순서를 밟은 뒤에만 '매니저 호출'이 정답이 된다(성급히 부르면 감점).
  sudden:
    id: 손님_오건우_환불
    sprite: 손님_개봉상품_고성
    appears_at: 30
    label: 영수증 없는 개봉 상품 환불 요구 · 고성
    stages:
      - { id: 경청_사실확인, sprite: 구매이력_조회,   label: 경청하고 구매 이력 조회로 사실 확인 }
      - { id: 규정안내,     sprite: 환불규정_안내,   label: 개봉·무영수증 환불 규정 근거 안내 }
      - { id: 대안제시,     sprite: 교환_적립_안내,  label: 가능한 대안(교환·적립) 확인·제시 }
    persists_after_stages: true   # 대안을 안내해도 고성이 계속되는 상황
    # 금지행동(원문 오답) — 하면 감점.
    forbidden_actions:
      - { id: 맞대응_언쟁,   reason: 언쟁으로 맞대응 }
      - { id: 규정밖_환불,   reason: 조용히 시키려 규정 밖 환불 승인 }

  # 금지행동 대응 버튼 — 직접 처리 대신 호출(_SCHEMA.md 규칙 2). 경비원 아님 → 매니저.
  # 성급 호출 감점은 scoring.early_escalate_penalty 로만 정의(표준 채점 키 — 중복 정의 금지).
  escalate:
    label: 매니저 호출
    when: 고성_지속
    requires: [경청_사실확인, 규정안내, 대안제시]

# 채점 — 5짝을 맞게 잇고 프리미엄·품절 2장을 남겼나 + 돌발을 순서대로 처리했나
# accuracy = (맞은 pairs / 5) * 100 − 감점, 하한 0
# 감점 중첩 금지 — 한 선(사건)에 wrong_pair·forbidden_pair·matched_unmatched 가 겹치면
# 가장 무거운 감점 하나만 적용한다(_SCHEMA 표준 채점 키 — 전 엔진 공통, 검증 지적 반영).
scoring:
  pair_count: 5
  wrong_pair_penalty: 14
  forbidden_penalty: 40        # 표준 키 — 금기 페어·행동 공통(변형 금지)     # 예산 초과·품절 상품을 이은 선 — 합격선을 뚫는다(규칙 7)
  matched_unmatched_penalty: 15  # 남겨야 할 프리미엄·품절을 억지로 이은 경우(금기 조합이면 40 쪽 하나만)
  early_escalate_penalty: 25    # 단계 없이 매니저부터 부른 경우(표준 권장값)
  # (금지행동 감점은 위 forbidden_penalty 하나로 통합 — 중복 키 제거)   # 맞대응·규정 밖 환불 — 원문 오답, 위반하고 합격 불가(규칙 7)
  stage_skip_penalty: 15         # 돌발 단계(경청→규정→대안) 생략·순서 위반 — 건당
  ignore_sudden_penalty: 40      # 돌발(오건우)을 아예 응대하지 않고 종료 — 방치가 최적 전략이 되지 않게
  missed_escalate_penalty: 40    # 고성 지속(persists_after_stages)인데 매니저 미호출 — 원문 정답 ④
