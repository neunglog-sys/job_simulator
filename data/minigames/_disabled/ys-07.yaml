# 4단계 미니게임 — ys-07 차량·기계 정비 보조
# 근거: 1스텝 "엔진오일 교환 전 안전 점검" — 제공 자료 "차종 정비지침서 발췌(오일 규격 0W-20·
#       용량 3.6L·드레인플러그 규정토크 35N·m)" + 모범답안 ④ "정비 지침서에서 오일 규격, 용량,
#       규정 토크(조이는 힘의 기준)를 찾아 올바른 값을 선택한다."
#       → '규정 토크'가 이 게임의 초록 구간이다. 드레인 플러그를 규정 토크에 맞춰 조이고 멈추는 게 목표.
#       함정: 규정 토크를 지나 더 조이면 드레인 플러그 나사산이 상해 오일팬이 손상된다(과조임=불량).
#       헐겁게 멈추면 누유(1스텝 "누유(기름이 새는 것) 여부" 점검 근거) — 둘 다 재조임 대상.
#       숫자 눈금은 화면에 띄우지 않고 초록 띠로만 읽힌다(_SCHEMA.md 규칙 1).
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: ys-07
engine: gauge
title: 규정 토크로 조이기
intro: 드레인 플러그 체결 시도마다 토크렌치 바늘이 멈춰 있습니다. 초록 띠(규정 토크) 안이면 합격, 지나치면 나사산 손상·모자라면 누유 — 재조임 판정하세요.
time_limit: 70
pass_score: 70

data:
  # 바늘 0~100. 왼쪽 끝은 헐거움, 오른쪽 끝은 과조임(나사산 손상). 규정 토크는 가운데 초록 띠.
  # 화면엔 숫자 눈금이 없고 초록 띠와 양쪽 빨강만 보인다 — _SCHEMA.md 규칙 1.
  # 대상은 원문에 규정토크가 명시된 드레인 플러그 하나뿐이다 — 오일팬 볼트 등
  # 원문에 없는 체결부를 지어내지 않는다(검증 지적 반영). 게이지 6개 = 같은 플러그의
  # 체결 시도 6회를 판정하는 구성.
  ok_zone: [45, 60]

  # sprite = 다이얼 옆 장비 도트 아트(ys-04 공기호흡기_본체 규약 — 표시 전용, 판정 단서 아님).
  # 같은 드레인 플러그의 시도 6회이므로 전 게이지 동일 외관 — 정답은 바늘 위치로만 갈린다.
  # 판정 버튼 아이콘은 엔진이 action 명으로 자동 탐색(YAML 필드 아님) —
  # pass 버튼 '합격' → 합격_아이콘.svg, fail 버튼 → 재조임_아이콘.svg (도트 아트 있음).
  gauges:
    # 규정 토크 초록 띠 안에서 멈춘 시도 — 합격 도장
    - id: 체결시도_1
      label: 드레인 플러그 · 시도 1
      sprite: 토크렌치_드레인플러그
      value: 52
      verdict: pass
    - id: 체결시도_2
      label: 드레인 플러그 · 시도 2
      sprite: 토크렌치_드레인플러그
      value: 48
      verdict: pass
    - id: 체결시도_3
      label: 드레인 플러그 · 시도 3
      sprite: 토크렌치_드레인플러그
      value: 56
      verdict: pass
    # 함정 ① 과조임 — "더 세게 조여야 안 샌다"는 오해를 부르지만 초록 띠를 넘겼다.
    #          나사산이 상해 오일팬까지 손상된다 → 불량, 재조임(풀고 규정 토크로).
    - id: 체결시도_4_과조임
      label: 드레인 플러그 · 시도 4
      sprite: 토크렌치_드레인플러그
      value: 84
      verdict: fail
      action: 재조임
    # 함정 ② 헐거움 — 초록 띠 바로 왼쪽. 얼핏 다 조인 듯 보여도 누유가 난다.
    - id: 체결시도_5_헐거움
      label: 드레인 플러그 · 시도 5
      sprite: 토크렌치_드레인플러그
      value: 38
      verdict: fail
      action: 재조임
    # 함정 ③ 과조임(끝판) — 렌치를 끝까지 당긴 상태. 명백히 빨강.
    - id: 체결시도_6_과조임
      label: 드레인 플러그 · 시도 6
      sprite: 토크렌치_드레인플러그
      value: 93
      verdict: fail
      action: 재조임

# 채점 — 6회 시도를 규정 토크 초록 띠 기준으로 합격/재조임 판정했는가
# accuracy = (올바른 판정 / 6) * 100
scoring:
  gauge_count: 6
