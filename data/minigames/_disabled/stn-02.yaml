# 4단계 미니게임 — stn-02 행사·전시·콘텐츠 기획
# 근거: 1스텝 "전시 기본 구성안 작성" — 손하은: "신진작가 전시의 기본 구성안을 만들어
#       주세요. 관람객 흐름과 작품 배치를 함께 고려해야 합니다."
#       모범답안 ④ "관람객의 이동 동선을 설계한다" — 이 게임은 ④ 동선 설계만 다룬다.
#       작품 배치·분류(②·③)는 1스텝 퀴즈 보기(b·f)로 이미 출제되므로 게임에서 뺀다
#       (규칙 3 — 2단계 퀴즈와 겹치지 않는다). 전제: 작품은 이미 배치된 전시장.
#       흔한 실수 "작품 목록 순서대로 배치하고 관람객 체류·출입구를 고려하지 않음"
#       → '벽의 작품 번호 순서대로 도는 동선'을 decoy 경로로 보존한다(규칙 4).
# 근거(회피·보고): 돌발 — 장하준: "동선·안전·저작권 문제를 찾아 운영 가능 여부를 판단"
#       모범답안 "① 비상동선 대조 ② 병목·낙상요인 확인 ⑤ 조치 확인"
#       흔한 실수 "철거가 번거롭다는 이유로 비상구 적치물을 방치" → 방치 = 감점 40.
# 혼잡도는 숫자가 아니라 바닥 색으로만 읽힌다 — 선을 그으면 관람객이 흐르고, 몰리는
# 구간의 바닥이 붉게 달아오른다. 위험구역을 미리 붉게 칠해 두지 않는다(회피가
# 자명해지는 것 방지 — 검증 지적 반영). 구역 구분은 색·아이콘으로만(규칙 1).
scenario_id: stn-02
engine: route
title: 전시 관람 동선 설계
intro: 작품 배치가 끝난 전시장입니다. 주출입구에서 구역을 관람 순서대로 이어 퇴장구까지 동선을 그으세요. 관람객이 몰리면 바닥이 붉게 달아오르고, 점검 중 발견한 위험물은 보고해야 합니다.
time_limit: 90
pass_score: 70

data:
  map: 전시장_도면                    # guide "전시장 도면" — 도트 배경(48x22, route map 규약)
  # sprite 는 엔진(route)이 읽는 표시 전용 도트 마커 필드(jm-01 규약 — 파일 없으면 라벨
  # 폴백). icon 과 동명의 도트 SVG 를 제작해 채웠다. 채점·좌표·순서 계약 불변.
  start: { id: 주출입구, at: [80, 220], icon: 입구_표지, sprite: 입구_표지, color: 흰색, label: 주출입구 }

  # 관람 동선의 정답 순서(모범답안 ④) — 걸음이 느려지는 소품 도입부에서 시작해,
  # 체류가 긴 대형설치를 중반에, 한꺼번에 빠져나오는 암전실을 퇴장구 옆에 둔다.
  waypoints:
    - { id: 구역_소품_도입, at: [240, 120], icon: 소품_진열대, sprite: 소품_진열대, color: 노랑, label: 도입부 · 소품 — 걸음이 느려지는 구간 }
    - { id: 구역_회화_벽면, at: [480, 80], icon: 회화_액자, sprite: 회화_액자, color: 파랑, label: 벽면 · 회화 }
    - { id: 구역_대형설치, at: [700, 160], icon: 설치_구조물, sprite: 설치_구조물, color: 주황, label: 대형 설치 — 관람객이 멈춰 서서 오래 머문다 }
    - { id: 구역_영상_암전, at: [700, 330], icon: 영상_스크린, sprite: 영상_스크린, color: 보라, label: 영상 · 암전실 — 상영 주기마다 한꺼번에 빠져나온다 }
    - { id: 퇴장구, at: [880, 330], icon: 출구_표지, sprite: 출구_표지, color: 초록, label: 퇴장구, arrival: true }

  # 유혹용 decoy — 벽에 붙은 '작품 번호' 순서대로 도는 선의 꺾임점(원문 흔한 실수).
  # 짧고 그리기 쉬워 보이지만 이어 보면 병목·단차·역주행 구역을 관통한다
  # (jm-04 decoy_waypoints 와 같은 변별 장치 — 규칙 5).
  decoy_waypoints:
    - { id: 목록순_꺾임_A, at: [560, 250], note: 번호 순서를 따라 회화에서 암전실로 곧장 내려가는 점 — 낙상_단차구간 관통 }
    - { id: 목록순_꺾임_B, at: [410, 190], note: 번호를 따라 홀 가운데를 되짚는 점 — 들어가는 선과 엇갈려 역주행_교차 발생 }
    - { id: 목록순_꺾임_C, at: [210, 265], note: 번호를 따라 입구 쪽으로 되돌아오는 점 — 주출입구 앞 병목 관통 }

  # 지나면 감점되는 구간 — 전부 원문에 나온 위험만 사용. 붉은 바닥은 선을 그은 뒤
  # 관람객 흐름으로 나타난다(미리 표시하지 않음).
  avoid:
    - { zone: 병목_주출입구앞, at: [200, 260], radius: 70, penalty: 20, reason: 입장 대기와 되돌아온 관람객이 겹치는 목 }
    - { zone: 낙상_단차구간, at: [560, 230], radius: 60, penalty: 20, reason: 암전실 앞 단차 — 어두운 데서 걸려 넘어진다 }
    - { zone: 역주행_교차, at: [420, 180], radius: 50, penalty: 15, reason: 되돌아 나오는 선과 들어가는 선이 엇갈리는 지점 }
    # 비상동선 위로 관람 동선을 겹치면 대피로가 막힌다 — 돌발 모범답안 ① '비상동선 대조'.
    # 금지행동급이므로 40 (100−40=60 불합격 — 규칙 7, jm-01 보호구역·jm-04 침선과 같은 원칙)
    - { zone: 비상동선_침범, at: [480, 400], radius: 60, penalty: 40, reason: 비상동선 — 관람 동선을 겹쳐 그리면 운영 불가 }

  # 경로상 발견·보고물 — 돌발 원문 '비상구 적치물'. 통과·회피의 문제가 아니라
  # '발견하면 보고'가 정답(모범답안 ⑤ 조치 확인). 보고하지 않고 제출하면(=방치,
  # 원문 흔한 실수) 감점 40 → 60점 불합격. _SCHEMA.md route 확장 blockers 참조.
  blockers:
    - { id: 비상구_적치물, at: [470, 415], sprite: 적치물_상자더미, action: 운영팀_보고, missed_penalty: 40, label: 비상구 앞 상자 더미 }

  # 운영시간 안에 한 바퀴가 돌아야 한다(guide "운영시간")
  budget: { time: 90 }

# 채점 — accuracy = (순서대로 이은 경유지 / 5) * 100 − avoid 침범 penalty − 방치 40, 하한 0
# 감점 중첩 금지 — 한 사건에는 가장 무거운 감점 하나만: 비상동선_침범 구역 위의
# 적치물을 방치해도 40 한 번만 깎는다. avoid 감점은 각 zone 의 penalty 값을 사용.
scoring:
  waypoint_count: 5
  order_matters: true
