# 4단계 미니게임 — ys-04 소방·구조·방재 대응
# 근거: 1스텝 "안전장비 및 공기호흡기 점검" — 손시윤: "교대 시작 전에 공기호흡기하고
#       개인안전장비 점검표부터 채워서 나한테 가져와 봐."
#       제공 자료: "공기호흡기 압력게이지 판독값 5개 … 점검기준표(충전압 300bar·90% 미만 재충전)"
#       모범답안 ②"공기호흡기의 잔압 게이지(남은 압력 표시기)를 읽고 기준 압력과 비교한다"
#                ⑤"기준 미달 항목에 사용 불가 표시를 하고 반장에게 교체를 보고한다"
#       흔한 실수: "게이지 숫자만 옮겨 적고 기준압과 비교하지 않아 미달 장비를 '이상무'로 통과시킴"
#       돌발퀘스트 모범답안 ③"잔압 경보 발생 대원의 개인 철수 기준 적용" ← 적색 경보 구간 근거
#
# 게이지 5개는 원문의 "판독값 5개"를 그대로 옮긴 것. ok_zone 90~100은 원문 기준표
# "90% 미만 재충전"에서 왔다.
# 화면엔 숫자가 뜨지 않는다(_SCHEMA.md 규칙 1) — 눈금판의 녹색 구간과 바늘 위치로만 읽는다.
# 아래 value 값은 바늘 각도를 정하는 내부 수치일 뿐 플레이어에게 노출되지 않는다.
scenario_id: ys-04
engine: gauge
title: 출동 전 공기호흡기 점검
intro: 공기호흡기 눈금판의 바늘이 녹색 구간에 있으면 적재칸으로, 녹색을 벗어났으면 재충전대로 보내세요. 숫자는 없습니다. 색으로 판단하세요.
time_limit: 60
pass_score: 70

data:
  ok_zone: [90, 100]     # 녹색 구간 — 원문 기준표 "90% 미만 재충전". 눈금판에 색 띠로만 표시

  # sprite = 다이얼 옆 장비 도트 아트(public/assets/minigames/) — 전 게이지 동일 외관.
  # 판정 단서가 아니라 카드 장식이다(정답은 바늘 위치로만 갈린다).
  gauges:
    - id: 공기호흡기_1
      sprite: 공기호흡기_본체
      value: 96
      verdict: pass
      action: 적재칸
    - id: 공기호흡기_2
      sprite: 공기호흡기_본체
      value: 91          # 함정 — 녹색 경계 바로 위. 색으로 보면 아슬아슬하게 합격
      verdict: pass
      action: 적재칸
    - id: 공기호흡기_3
      sprite: 공기호흡기_본체
      value: 88          # 함정 — 녹색 경계 바로 아래. 대충 보면 '이상무'로 통과시키게 된다
      verdict: fail       # (원문 흔한 실수가 정확히 이 지점이다)
      action: 재충전대
    - id: 공기호흡기_4
      sprite: 공기호흡기_본체
      value: 72
      verdict: fail
      action: 재충전대
    - id: 공기호흡기_5
      sprite: 공기호흡기_본체
      value: 34          # 적색 잔압 경보 구간 — 한눈에 보이는 미달
      verdict: fail
      action: 재충전대

  # 금지행동 대응 — 미달 장비는 내가 처리하고 끝낼 수 없다.
  # 원문 ⑤ "사용 불가 표시를 하고 반장에게 교체를 보고한다"(_SCHEMA.md 규칙 2).
  escalate:
    label: 사용 불가 표시 + 반장에게 교체 보고
    sprite: 무전기_보고   # 보고 버튼 장식 아이콘
    when: 미달_장비_발생

  # 눌러선 안 되는 것
  forbidden:
    - id: 미달장비_적재
      reason: 녹색 미달 장비를 적재칸에 실으면 안 됨 — 현장에서 잔압이 먼저 떨어진다
    - id: 보고_생략
      reason: 미달 장비를 재충전대에만 두고 반장 보고를 빼면 교체가 안 됨

# 채점 — 게이지 5개 판정 + 교체 보고 1건 = 판정 6건
# accuracy = (맞힌 판정 / 6) * 100 − (오판정 * 15) − (보고 생략 시 15), 하한 0
# 규칙을 하나로 확정한다(검증 지적 반영 — 이중 해석 제거):
#   보고 생략 = 판정 1건 누락(5/6 ≈ 83) + escalate_missed_penalty 15 = 68 → 불합격.
#   원문 ⑤(사용불가 표시·반장 보고)가 절차의 일부이므로 생략하면 합격선 아래여야 한다.
scoring:
  decision_count: 6
  misjudge_penalty: 15
  escalate_required: true         # 미달이 1개라도 있으면 보고 버튼까지 눌러야 함
  escalate_missed_penalty: 15    # 보고 생략 = 누락 1건에 더해 이 값 추가 감점
