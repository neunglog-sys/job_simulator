# 4단계 미니게임 — jm-03 항공 운항(부기장)
# 근거: m1 정상업무 "운항 브리핑과 외부 점검" answer_guide ④ "외부점검 체크리스트에
#       맞춰 피토관(속도 측정 센서) 커버, 타이어, 엔진 흡입구, 조종면(날개 조절판)을
#       점검한다." / m1 warning "피토관 커버 제거를 확인하지 않은 채 '이상 없음'을 보고".
# 플레이어는 조종사(부기장·PM)다 — 주기된 기체를 시계방향으로 돌며 외부점검(워크어라운드)만
#       한다. 관제·이착륙 지시는 이 게임의 소재가 아니다(부기장 업무 아님).
# 형식 정의는 _SCHEMA.md 참조. 숫자·글자 판독 없이 모양·상태로만 색출한다(규칙 1).
scenario_id: jm-03
engine: spot
title: 출발 전 외부점검(워크어라운드)
intro: 주기된 기체를 시계방향으로 돌며 외부점검 이상을 찾아 표시하세요. 정상인 곳을 표시하면 감점입니다.
time_limit: 70
pass_score: 70

data:
  scene: 여객기_주기_외부점검
  mark: tag                    # 점검표에 태그를 붙이는 표시 (복명복창 보고 대상)

  # 찾아야 할 외부점검 이상 — 전부 원문 answer_guide ④에 등장하는 4개 점검 대상
  targets:
    - id: 피토관_커버미제거
      sprite: 피토관_커버부착
      at: [150, 200]
      label: 피토관 커버 미제거 상태          # 원문 warning의 핵심 트랩
    - id: 흡입구_이물질
      sprite: 엔진흡입구_이물질
      at: [430, 300]
      label: 엔진 흡입구 이물질(FOD)
    - id: 타이어_마모
      sprite: 타이어_마모
      at: [590, 360]
      label: 타이어 마모 한계 초과
    - id: 조종면_결빙
      sprite: 조종면_결빙
      at: [820, 160]
      label: 조종면(날개 조절판) 결빙

  # 정상인데 눌리기 쉬운 것 — 같은 종류가 여럿 달려 있어 찍기 유발 (누르면 mistakes +1)
  decoys:
    - { id: 피토관_정상, sprite: 피토관_커버제거됨, at: [250, 150] }
    - { id: 흡입구_정상, sprite: 엔진흡입구_청결,   at: [540, 300] }
    - { id: 타이어_정상, sprite: 타이어_정상,       at: [680, 360] }
    - { id: 조종면_정상, sprite: 조종면_결빙없음,   at: [760, 220] }

# 채점 — 4개 중 몇 개를 찾았나에서 오탐을 뺀다
# accuracy = (찾은 targets / 4) * 100 − (누른 decoys * 10), 하한 0
scoring:
  target_count: 4
  decoy_penalty: 10
