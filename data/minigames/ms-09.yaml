# 4단계 미니게임 — ms-09 기계가공·금속가공 작업 (정밀 절삭)
# 근거:
#   1스텝 mission "재질·치수·공차·이음형상·작업조건과 보호구·장비상태를 확인한다."
#      → 공차(tolerance)가 이 게임의 뼈대. 절삭 경로 양옆 색 밴드 = 공차 범위.
#   4스텝 mission "합격·보수·재검 항목을 기준과 대조하고 제품별 상태를 표시한다."
#      hints.warning(4스텝) "대표 샘플만 보고 전체 상태를 동일 처리"
#      → 경로 전체를 끝까지 따라가야 한다(중간만 맞추고 끝내면 이탈).
#   2스텝 hints.warning "이전 기준을 그대로 적용" — 구버전 검사기준서 임의 사용 금지
#      → 옛 절삭선(구버전 경로)은 따라가면 안 되는 no_go.
#   sudden_quest intro "용접 중 가스냄새와 균열 의심" / answer_guide ② "점화원 제거·대피"
#      → 경로 위 스파크 지점은 이탈하면 불꽃이 튀는 위험 구간(균열·불량 유발).
#   1스텝 hints.warning "작업 경험만 믿고 절차서·재질을 확인하지 않음" → 색 밴드로만 판단.
# ※ 숫자 치수를 화면에 띄우지 않는다. 공차는 경로 양옆 색 밴드 폭으로만 읽힌다(규칙 1).
scenario_id: ms-09
engine: trace
title: 기준 확인 후 정밀 시험절삭
intro: 도면·최신 검사기준서·보호구·장비 상태 확인을 모두 마친 뒤 수행하는 시험절삭입니다. 절삭 경로를 따라가며 양옆 색 밴드인 공차 안에 머무르세요. 밴드를 벗어나면 즉시 작업을 멈추고 보고해야 합니다.
time_limit: 75
pass_score: 70

data:
  guide: 절삭_경로_최신본        # 도면 최신 개정본 기준 절삭선
  # 기본 공차(트레이스 엔진 공통 필드) — 구간별 bands 가 없거나 엔진이 bands 를
  # 지원하지 않을 때의 폴백. bands 는 아래에 확장 필드로 정의(_SCHEMA.md trace 참조).
  tolerance: 9
  # 공차 = 경로 양옆 색 밴드. 초록 = 합격 폭, 노랑 = 경계(보수 대상).
  # 구간마다 밴드 폭이 다르다 — 정밀 구간은 좁다.
  bands:
    - { from: 0.0,  to: 0.30, tolerance: 9,  color: 초록, note: 직선 구간 · 여유 폭 }
    - { from: 0.30, to: 0.55, tolerance: 5,  color: 초록, note: 곡선 진입 · 폭 좁아짐 }
    - { from: 0.55, to: 0.78, tolerance: 3,  color: 노랑, note: 정밀 구간 · 공차 최소 }
    - { from: 0.78, to: 1.0,  tolerance: 6,  color: 초록, note: 마무리 직선 }
  # 경로 위 위험 지점 — 이탈하면 스파크(감점 가중).
  sparks:
    - { at: 0.42, reason: 이음부 근처 — 이탈 시 스파크 }
  # 돌발 안전신호 — sudden_quest(가스냄새·균열 의심)의 게임화. 0.66에서 자재 표면에
  # 균열 라인·연기 아이콘이 나타난다. 정답은 '즉시 멈추고 보고 버튼'(원문 answer ①
  # 작업중지). 신호를 무시하고 계속 그으면 원문 금지행동("냄새를 무시하고 작업 지속")
  # 이라 즉시 실패다. 보고 후엔 재개 지시가 내려와 끝까지 잇는다 — '중단이 감점되고
  # 강행이 이득'이던 역전을 바로잡는 장치(검증 지적 반영).
  emergency:
    at: 0.66
    signal: 균열라인_연기_아이콘
    action: 작업중지_보고_버튼
    resume_after_report: true
  # 따라가면 안 되는 옛 절삭선(구버전 검사기준) — 2스텝 warning "이전 기준 그대로 적용"
  no_go:
    - { from: 0.55, to: 0.78, reason: 구버전 경로가 겹쳐 보임 — 최신본만 따라갈 것, offset: 12 }
  # ── 표시 전용(presentation) — 채점·판정 계약에 영향 없음 ──
  # head 가 있으면 trace 엔진이 아트 모드로 렌더한다: guide(절삭_경로_최신본)와 같은
  # 이름의 스프라이트가 배경 판재로 깔리고, emergency.signal(균열라인_연기_아이콘)도
  # 같은 이름의 파일이 있으면 도트 아이콘으로 그려진다. 파일이 없으면 전부 기존
  # 렌더(그라데이션 배경·라벨 칩)로 폴백한다 — ms-08 은 이 필드가 없어 영향 없음.
  head: 절삭헤드_커터            # 드래그 지점을 따라다니는 절삭 헤드 도트 스프라이트
  spark_sprite: 스파크_이펙트    # 스파크 이탈 플래시에 겹쳐 그리는 도트 스프라이트

scoring:
  off_track_penalty: 10      # 색 밴드를 벗어나 그은 구간당 (공차 이탈 = 불량)
  spark_penalty: 15          # 스파크 지점에서 밴드를 벗어남 (균열·안전위험)
  no_go_penalty: 20          # 구버전 옛 경로를 따라감
  # '이유 없는' 중도 포기만 감점한다 — emergency 에서의 정지·보고는 정답이며
  # 감점 대상이 아니다(검증 지적 반영).
  incomplete_penalty: 12     # 돌발 신호 없이 경로를 끝까지 잇지 않고 종료 (대표 샘플만 보고 종료)
  fail:
    - when: 정밀구간_전면이탈
      reason: 노랑 정밀 구간(0.55~0.78)을 밴드 밖으로 완전히 이탈 — 절삭 불량, 재검 대상이라 즉시 실패
    - when: 돌발신호_무시_지속
      reason: 균열·연기 신호(0.66)를 무시하고 계속 절삭 — 원문 금지행동 '냄새를 무시하고 작업 지속', 즉시 실패
