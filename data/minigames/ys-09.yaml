# 4단계 미니게임 — ys-09 설비·장비 설치·정비 (드론)
# 근거: m1b "정비 후 자세 안정화(수평 트림) 확인" (2026-07-20 추가된 스텝) —
#       박하은: "점검 끝난 기체, 수평 지그에 올려서 자세 한 번 잡아 놔. 기울어진 채로 넘기면
#       현장에서 편류 나." + mission "수평 지그에 올려 축별 기울기를 확인하고, 기준 범위 안으로
#       트림을 조정해 안정화 여부를 판정한다."
#       제공 자료 "수평 지그, 축별 기울기 표시계, 제조사 트림 허용범위(±2°), 정비이력카드."
#       → 허용범위 ±2°가 그대로 balance 판정 폭이 된다. 두 축(피치·롤)을 잡는 건 "축별 기울기".
#       함정(금지행동): m1b answer_guide ① "프로펠러를 분리한 상태에서" + 흔한 실수
#       "프로펠러를 장착한 채 트림 조정" → 프로펠러가 붙어 있으면 조정을 시작할 수 없게 막았다.
#       숫자 눈금 없이 축별 기울기 표시계(수평계)의 기울기로만 읽힌다(_SCHEMA.md 규칙 1).
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: ys-09
engine: physics
title: 수평 트림 안정화
intro: 기체가 기울면 방향키로 수평을 잡으세요. 축별 기울기 표시계가 허용범위(±2°) 안에 머물러야 안정화 판정입니다. 지그에 올리기 전 프로펠러부터 분리하세요.
time_limit: 60
pass_score: 70

data:
  mode: balance
  target: 0.0          # 수평(0°) 유지가 목표
  tolerance: 2.0       # 허용범위 ±2° (제조사 트림 허용범위)
  drift: 0.35          # 지그 위에서 자세가 흘러내리는 세기 — 손을 놓으면 기운다
  hold_seconds: 4      # 이 시간만큼 연속으로 허용범위 안에 들어야 '안정화' 인정
  # 축별 기울기 — 두 축을 각각 방향키로 잡아야 한다("축별 기울기 표시계").
  axes:
    - { id: 피치, label: 앞뒤 기울기(피치), start: 3.4 }   # 시작부터 허용범위 밖 → 잡아야 함
    - { id: 롤,   label: 좌우 기울기(롤),   start: -2.7 }  # 반대로 기울어 있음
  # 정비 중 흔들림 — 잡은 뒤에도 방심하면 안 되게 중간에 한 번씩 밀어준다(과보정 유도).
  disturbances:
    - { at: 0.35, axis: 피치, push: 2.2, reason: 지그 재조정으로 기체가 흔들림 }
    - { at: 0.7,  axis: 롤,   push: -2.0, reason: 케이블 정리 중 기체가 밀림 }

  # 금지행동 — 프로펠러가 장착된 상태에서는 트림 조정을 시작할 수 없다.
  # 흔한 실수 "프로펠러를 장착한 채 트림 조정"을 게임에서도 막는다.
  forbidden:
    - id: 프로펠러_장착상태_조정
      reason: 프로펠러를 분리하지 않고 조정하면 시험 중 사고 위험 — 먼저 분리해야 시작 가능
    - id: 수평확인_생략_비행투입
      reason: 수평 확인을 건너뛰고 비행 투입을 요청하면 현장에서 편류가 난다

# 채점 — 두 축을 허용범위(±2°) 안으로 잡아 hold_seconds 동안 유지했는가.
#   초과 이탈이 길수록 감점. 프로펠러 미분리 상태로 시작하면 즉시 페널티.
scoring:
  axis_count: 2
  out_of_range_penalty: 15   # 허용범위를 벗어난 시간 비례 감점
  forbidden_penalty: 40      # 프로펠러 장착 상태 조정 등 금지행동
