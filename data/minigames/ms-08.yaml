# 4단계 미니게임 — ms-08 생활서비스 현장 (사람 미용 · 헤어)
# ⚠ 2026-07-20 시나리오 전환: 반려동물 미용 → 사람 미용(헤어). 강아지·펫 표현 금지.
#    (scenarios/ms-08.yaml 머리 주석: "동물 고유 개념은 사람 미용의 대응 개념(알레르기·
#     패치테스트·두피 상태)으로 치환")
# 근거:
#   3스텝 mission "안전하게 중단 가능한 지점… 을 확인해 일정과 안내를 조정한다."
#      → 가위로 가이드라인(점선)을 긋다가 안전하게 멈출 수 있는 지점에서 멈추는 것이 게임 핵심.
#   2스텝 "알레르기 및 두피 상태 확인" mission "현재 두피·모발 상태를 관찰해 서비스 가능
#      여부를 판단한다." / 모범답안 ② "두피의 상처·염증·모발 손상도를 직접 관찰한다."
#      → 가이드라인 위의 상처·염증 지점은 커트를 멈춰야 하는 interrupt.
#   sudden_quest intro "시술 중인 고객이 두피 따가움을 호소하고 발적이 올라왔습니다."
#      + hints.warning "결과 완성을 위해 계속 진행" → 고객이 꿈틀하면 즉시 멈춰야 함(interrupt).
#   2스텝 hints.warning "'전에도 했는데 괜찮았다'는 말만 믿고 확인 없이 시작"
#      → 패치테스트 미확인 구간은 아직 그으면 안 되는 no_go.
scenario_id: ms-08
engine: trace
title: 커트 가이드라인 선긋기
intro: 상담·패치테스트·두피 확인을 마쳐 시술 가능 판정을 받은 고객입니다. 가위로 점선 커트 가이드라인을 따라가되, 고객이 움직이면 잠시 멈추고 두피 발적이 나타나면 즉시 시술을 종료하세요.
time_limit: 70
pass_score: 70

data:
  guide: 사람_커트_가이드라인      # 목덜미에서 옆선으로 이어지는 점선 경로
  tolerance: 12                   # 점선에서 벗어나도 되는 폭(px). 넘으면 잘못 잘림.
                                  # 난이도 하향(7→12, 플레이 피드백 '어려워'): 점선에서 더
                                  # 벗어나도 clean 으로 인정 → 초록 밴드 폭도 함께 넓어진다.
                                  # 채점 계약(off_track_penalty 등)·규칙(terminal_stop 정답)은
                                  # 불변 — 체감 공차만 넓힌다.
  # 시작 게이트 — 첫 획을 긋기 전에 반드시 눌러야 하는 확인 카드. 원래 no_go(0.0~0.05)로
  # 표현했지만 그 구간이 가이드라인 시작점과 겹쳐 '안내대로 긋는' 플레이어가 무조건
  # 감점되는 모순이 있었다(검증 지적 반영) — 구간 대신 사전 행동으로 바꾼다.
  start_gate:
    action: 패치테스트_확인카드_탭
    reason: 염모제 패치테스트 미확인 — 확인 전엔 시작 금지 (2스텝 warning)
    skip_penalty: 25
    sprite: 패치테스트_확인카드   # 표시 전용 — 확인 카드 위 도트 카드(부재 시 기존 텍스트 카드)

  # 진행값 0~1 위의 지점들. at 에서 손(가위)을 멈춰야 하고, 안 멈추면 감점.
  # sprite 는 표시 전용 마커 도트(뒤통수 장면용 소형 아이콘) — 채점·판정 불변.
  # 난이도 하향(플레이 피드백 '어려워'): 멈춤 유지시간(hold)을 완화(0.6→0.4, 0.8→0.5,
  # 0.6→0.4)해 '움찔하면 멈추기'는 그대로 요구하되 정지 유지 부담만 낮춘다.
  # interrupt_miss_penalty(멈춤 누락 감점) 계약은 불변.
  interrupts:
    - { at: 0.22, reason: 고객이 움찔함 — 잠깐 멈추기, hold: 0.4, sprite: 움찔_모션_아이콘 }
    - { at: 0.48, reason: 두피에 작은 상처·염증 관찰됨 — 피해서 멈추기, hold: 0.5, sprite: 두피_상처_아이콘 }
    - { at: 0.71, reason: 고객이 자세를 고쳐 앉음 — 멈추기, hold: 0.4, sprite: 자세고침_아이콘 }

  # 종결 지점 — 발적 호소(sudden_quest). 여기서 '멈추고 끝내는 것'이 정답이다.
  # 잠깐 멈췄다 재개해 완성하면 원문 금지행동("결과 완성을 위해 계속 진행")이
  # 만점 경로가 되는 역전이 있었다(검증 지적 반영) — 재개 자체를 실패로 정의.
  terminal_stop:
    at: 0.88
    reason: 두피 발적 호소 — 즉시 중단하고 종료하는 것이 정답 (재개 금지)
    sprite: 두피_발적_아이콘      # 표시 전용 — 발적 마커 도트(부재 시 기존 라벨 칩)

  # ── 표시 전용(presentation) — 채점·판정 계약에 영향 없음 (_SCHEMA.md trace 절) ──
  # guide(사람_커트_가이드라인)와 같은 이름의 스프라이트가 배경 스킨으로 깔린다:
  # 뒤통수·목덜미 클로즈업(사람 뒷모습, 얼굴 특정 없음) + 목덜미→옆선 파팅 점선 장면.
  # head 가 있으면 trace 엔진이 아트 모드(data-art)로 렌더한다 — ms-09 규약 그대로.
  # 파일이 없으면 전부 기존 렌더(그라데이션 배경·기본 커서)로 폴백한다.
  # start_gate.sprite(확인 카드 도트)와 interrupts[].sprite·terminal_stop.sprite
  # (지점 마커 도트)도 같은 규약의 표시 전용 필드 — 필드나 파일이 없으면 기존
  # 텍스트 카드·라벨 칩 렌더로 폴백한다. ms-09 는 이 필드가 없어 영향 없음.
  head: 커트가위_커서              # 드래그 지점을 따라다니는 커트 가위 도트 스프라이트

scoring:
  # 진행 정확도 = 가이드라인을 tolerance 안에서 따라간 비율.
  # terminal_stop(0.88)에서 멈추면 '완주'로 간주해 만점 기준을 0.88로 잡는다 —
  # 원문 정답 절차(즉시중단→보고)에는 '완성'이 없다.
  complete_at: 0.88
  off_track_penalty: 10      # tolerance 밖으로 벗어나 그은 구간당 (잘못 커트)
  interrupt_miss_penalty: 15 # 멈춰야 할 지점에서 안 멈추고 계속 그음
  fail:
    - when: 발적지점_강행
      reason: 발적 지점(0.88)에서 멈추지 않고 지나감 — sudden_quest 위반, 즉시 실패
    - when: 발적지점_재개
      reason: 발적 지점에서 멈췄다가 다시 그어 완성 — '결과 완성을 위해 계속 진행'(금지행동), 즉시 실패
