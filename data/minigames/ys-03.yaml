# 4단계 미니게임 — ys-03 경호·신변보호·보안
# 근거: 1스텝 "정문 검색대 출입통제" — 정건우: "오늘 강연회 정문 검색대 보조로 들어가라.
#       출입증 대조 철저히 하고, 탐지기 울리면 절대 직접 뒤지지 말고 2차 검색 요청해."
#       업무 내용: "입장객 5명을 검색·대조하고 탐지기 반응자 1명을 절차대로 선임에게 인계"
#       제공 자료: "출입자 명단, 출입증 견본(위조 식별 포인트)"
#       모범답안 ②"입장객의 출입증을 명단 및 사진과 대조하여 신원을 확인한다"
#                ④"탐지기 반응자 발생 시 직접 수색하지 않고 선임에게 2차 검색을 요청한다"
#       흔한 실수: "명단 대조 생략, 탐지기 반응자 그냥 통과, 직접 신체수색 시도"
#
# 얼굴 초상끼리만 대조한다 — 이름·번호 글자는 화면에 뜨지 않는다(_SCHEMA.md 규칙 1).
# 원문 트릭 보존: 입장객 5명 중 그냥 통과시켜도 되는 사람은 3명뿐이다. 짝이 안 맞는
# 위조 1건과 탐지기 반응자 1명이 섞여 있어, 5명을 전부 이으면 만점이 나오지 않는다.
scenario_id: ys-03
engine: match
title: 정문 검색대 출입통제
intro: 입장객 얼굴과 출입증 초상을 선으로 이으세요. 짝이 없는 쪽은 '불일치' 도장, 탐지기가 울린 사람은 직접 손대지 말고 2차 검색 벨을 누르세요.
time_limit: 75
pass_score: 70

data:
  # 왼쪽 — 검색대에 선 입장객 5명(얼굴 초상)
  left:
    - { id: 입장객_A, sprite: 입장객_얼굴_A }
    - { id: 입장객_B, sprite: 입장객_얼굴_B }
    - { id: 입장객_C, sprite: 입장객_얼굴_C }
    - { id: 입장객_D, sprite: 입장객_얼굴_D }   # 제시한 출입증 초상이 본인이 아님 → 짝 없음
    # 초상은 일치하지만 금속탐지기가 울린 사람 — detector 플래그로 게이트 위 빨간 램프를
    # 그린다(시각 단서). 이 사람의 정답은 선긋기가 아니라 아래 escalate(2차 검색 벨)다.
    - { id: 입장객_E, sprite: 입장객_얼굴_E, detector: true }

  # 오른쪽 — 제시된 출입증에 인쇄된 초상
  right:
    - { id: 출입증_A, sprite: 출입증_초상_A }
    - { id: 출입증_B, sprite: 출입증_초상_B }
    - { id: 출입증_C, sprite: 출입증_초상_C }
    - { id: 출입증_D, sprite: 출입증_초상_미상 }  # 명단 어디에도 없는 인물 — 위조
    - { id: 출입증_E, sprite: 출입증_초상_E }

  # 초상이 일치해 선으로 이어 통과시키는 3쌍. E는 초상이 맞아도 탐지기가 울렸으니
  # 선을 긋는 게 아니라 2차 검색 벨(아래 escalate)이 정답이다 — 그냥 이어 통과시키면
  # 원문 흔한 실수("탐지기 반응자 그냥 통과")에 걸린다.
  pairs:
    - [입장객_A, 출입증_A]
    - [입장객_B, 출입증_B]
    - [입장객_C, 출입증_C]

  # 짝 없음 → '불일치' 도장이 정답. 억지로 이으면 오답.
  # 출입증_D는 서식·소속 띠가 정상 견본과 똑같이 생겨서 잇고 싶어지는 게 함정이다.
  unmatched:
    - 입장객_D
    - 출입증_D

  # 금지행동 대응 — 원문 "절대 직접 뒤지지 말고 2차 검색 요청해"
  # 직접 조치가 아니라 선임 호출이 정답이므로 escalate로 표현한다(_SCHEMA.md 규칙 2).
  # when은 실재하는 left 항목 id를 가리킨다 — E는 의도적으로 pairs/unmatched 어디에도
  # 없다: 이 항목의 정답 판정이 곧 벨 호출이기 때문. 짝인 출입증_E는 E가 인계되면
  # 자연히 미사용으로 남는다(오답 아님).
  escalate:
    label: 2차 검색 벨 (선임 호출)
    when: 입장객_E

  # 눌러선 안 되는 버튼 — 있어도 정답이 되지 않는다
  forbidden:
    - id: 직접_신체수색
      reason: 신입의 직접 신체수색은 금지 — 선임에게 2차 검색 요청
    - id: 그냥_통과
      reason: 탐지기 반응자를 조치 없이 통과시키면 안 됨

# 채점 — 정상 3쌍 + 불일치 도장 1건 + 2차 검색 호출 1건 = 판정 6건
# accuracy = (맞힌 판정 / 6) * 100 − (오답 * 15), 하한 0
scoring:
  decision_count: 6
  wrong_pair_penalty: 15
  forbidden_penalty: 40          # 직접 수색·무단 통과 = 원문 금지행동 (규칙 7 — 합격선 관통)
  # E(탐지기 반응자)를 벨도 선긋기도 없이 방치하면 5/6=83 합격이 되는 구멍 봉쇄 —
  # 2차 검색 요청이 원문 정답 행동(모범답안 ④)이므로 40 (표준 키)
  missed_escalate_penalty: 40
