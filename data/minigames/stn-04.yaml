# 4단계 미니게임 — stn-04 과학·기술 조사분석
# 근거: 1스텝 "배터리 소재 선행연구 분석" — 유은채: "신규 배터리 소재의 선행연구와
#       시험결과를 정리해 다음 실험 가설을 제안해 주세요."
#       guide "제공 자료: 논문 8편, 특허 3건, 기존 시험결과, 성능평가기준"
#       answer_guide ③ "실험 조건과 도출된 결과를 대조하여 비교한다"
#       answer_guide ⑤ "분석 결과를 바탕으로 다음 실험 가설을 제안한다"
# 소재 수준: 원문에는 구체 실험 소재(재료명·물성·수치)가 등장하지 않는다 — 자료의 '이름'만
#       제공된다. 그래서 카드도 원문과 같은 추상 수준으로 둔다: 조건 카드 A~D(성능평가기준의
#       조건 항목), 결과 카드(기존 시험결과의 경향 — 상승/하락/평탄). 재료·물성은 창작하지 않는다.
# 판별: 각 조건 카드 모서리의 색·모양 마커(파랑 세모 등)가 짝인 결과 카드에 그대로 재등장한다.
#       모티프·색 대응만으로 풀리고 글자·도메인 지식이 필요 없다(_SCHEMA.md 규칙 1,
#       match 기본 예시 '카드전표_원형파랑 ↔ 영수증_원형파랑'과 같은 방식).
# 근거(짝 없는 카드): 돌발 — 유은채: "예상과 반대인 결과가 나왔습니다. 결과를 제외할지,
#       재검증할지 판단 근거를 정리해 주세요." warning "결과를 조용히 제외하거나 단일 반복으로
#       오류를 확정" → 결과_5(빨간 별 마커·뒤집힌 경향)는 마커가 어느 조건 카드에도 없어 짝이
#       없다. 억지로 잇는 것(오류 확정)도, 표시 없이 방치(조용히 제외)도 감점 — '재검증 표시'를
#       붙이는 능동적 판단이 정답. 판정 근거를 라벨에 쓰지 않는다(규칙 8 — 주석에만).
scenario_id: stn-04
engine: match
title: 실험 조건·결과 대조
intro: 실험 조건 카드와 결과 카드에서 같은 마커(색·모양)를 찾아 짝지으세요. 어느 조건과도 마커가 맞지 않는 결과 카드는 억지로 잇지 말고 '재검증 표시'를 붙여 남깁니다.
time_limit: 80
pass_score: 70

data:
  # 컬럼 헤더(표시 전용 — MatchGame left_label/right_label 규약, 없으면 '왼쪽'/'오른쪽')
  left_label: 실험 조건
  right_label: 시험 결과
  # 왼쪽 — 실험 조건 카드(성능평가기준의 조건 항목). 카드 모서리에 색·모양 마커가 하나씩.
  left:
    - id: 조건_A
      sprite: 조건카드_세모_파랑      # 파란 세모 마커
      label: 조건 A
    - id: 조건_B
      sprite: 조건카드_네모_주황      # 주황 네모 마커
      label: 조건 B
    - id: 조건_C
      sprite: 조건카드_동그라미_초록  # 초록 동그라미 마커
      label: 조건 C
    - id: 조건_D
      sprite: 조건카드_마름모_보라    # 보라 마름모 마커
      label: 조건 D

  # 오른쪽 — 결과 카드(기존 시험결과). 경향 그래프 위에 조건에서 온 마커가 재등장한다.
  right:
    - id: 결과_1
      sprite: 결과카드_세모_파랑_상승
      label: 결과 1
    - id: 결과_2
      sprite: 결과카드_네모_주황_하락
      label: 결과 2
    - id: 결과_3
      sprite: 결과카드_동그라미_초록_상승
      label: 결과 3
    - id: 결과_4
      sprite: 결과카드_마름모_보라_평탄
      label: 결과 4
    - id: 결과_5
      sprite: 결과카드_별_빨강_역상승   # 빨간 별 마커 + 뒤집힌 경향 화살표 — 별 마커는 어느 조건에도 없다
      label: 결과 5
      # 돌발의 '예상과 반대인 결과'. 짝없음 판정 근거는 이 주석에만 둔다 — 라벨로 유출 금지(규칙 8).

  # 선행연구에서 재현된 조건→결과 대응 = 마커가 같은 쌍만 정답
  pairs:
    - [조건_A, 결과_1]
    - [조건_B, 결과_2]
    - [조건_C, 결과_3]
    - [조건_D, 결과_4]

  # 짝 없음 — 그냥 남기면(미판정) 감점. '재검증 표시'를 붙여야 판정으로 인정된다.
  unmatched: [결과_5]
  unmatched_action: 재검증_표시

# 채점 — 맞혀야 할 판정 5건: 정답 4쌍 + 짝없음 카드의 재검증 표시 1건
# accuracy = (맞은 짝 + 재검증 표시 정답) / 5 * 100 − 감점, 하한 0
# 4쌍만 맞히고 결과_5를 방치하면 80 − 15 = 65 < 70 — 능동 판단 없이는 합격 불가(돌발 트릭 보존)
# 감점 중첩 금지 — 한 사건(같은 카드)에는 가장 무거운 감점 하나만 적용(_SCHEMA.md 공통).
#   예: 결과_5를 억지로 이으면 wrong_pair_penalty 만 적용하고 missed_unmatched 와 중첩하지 않는다.
scoring:
  pair_count: 4
  unmatched_count: 1
  wrong_pair_penalty: 15        # 틀린 선 1건당(억지 매칭 포함 = '오류 확정') — 표준 키(_SCHEMA.md)
  missed_unmatched_penalty: 40   # 방치 = 원문 금지행동(조용히 제외) — 규칙 7  # 짝없음 카드를 재검증 표시 없이 방치(= '조용히 제외')
