# 4단계 미니게임 — kts-04 상담·안내·중개 응대(은행 창구)
# 근거: 3스텝 "마감 전 업무 순서 조정" — 유하은: "마감 30분 전인데 대기 5팀에 전화 예약,
#       급한 송금 요청까지 겹쳤다. 순서 정리해서 보고해."
#       모범답안 ② "송금 제한 시간이 임박한 업무를 최우선으로 배치" ③ "빠르게 처리할 수
#       있는 단순 업무를 그 다음에" ④ "시간이 오래 걸리는 상담은 예약으로 전환하도록 안내"
#       흔한 실수 "접수순만 고집해 송금 컷오프 초과" → 조용해도 컷오프 임박이 최우선.
# 돌발 근거: "조선우가 대기 줄을 가로질러 창구 앞에 끼어들었다. '번호표? 나 5분이면 끝나는
#       건데 왜 기다려요! 지금 당장 처리해요, 빨리!'" 모범답안 ① 대기 순서 원칙 안내·번호표
#       절차 재설명 ② 용건·예상 소요시간 확인 후 배정 검토 ④ "폭언·업무방해가 계속되면
#       선임 상담원·지점장에게 인계" 원문 오답 b "소란을 멈추려고 대기 중인 고객보다 먼저
#       처리해준다" → 소란을 멈추려 순서를 바꿔 먼저 처리하면 금지행동.
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: kts-04
engine: sort
title: 창구 대기열 배정
intro: 마감 30분 전, 대기 손님을 처리 방식에 맞게 배정하세요. 시간 배지를 기준표와 대조해 판단합니다. 목소리 큰 순서도, 먼저 온 순서도 답이 아닐 수 있습니다.
time_limit: 75
pass_score: 70

data:
  # 통 = 처리 방식. 통의 색·아이콘은 통의 정체성 표시일 뿐이고, 아이템 쪽에는 통과 대응하는
  # 색·아이콘을 주지 않는다(색 맞추기 금지 — _SCHEMA.md 아이템 시각 단서 규약).
  bins:
    - { id: 지금처리,   label: 지금 처리,          color: red,    icon: 번개 }
    - { id: 다음처리,   label: 다음 순서(단순),     color: green,  icon: 번호표 }
    - { id: 예약전환,   label: 예약 전환(장시간),    color: blue,   icon: 달력 }
    - { id: 순서안내석, label: 순서 안내 후 대기,     color: gray,   icon: 안내판 }

  # 기준표(범례) — 원문 제공 자료 "송금 마감 시각 규정·우선순위 원칙"이 이것이다.
  # 아이템에는 용건 아이콘과 시간 배지만 있고, 어느 통인지는 이 기준표를 보고 판단한다.
  legend:
    - { symptom: 모래시계, goes_to: 지금처리 }   # 마감 컷오프 임박
    - { symptom: 짧음,     goes_to: 다음처리 }   # 단순·빠른 업무
    - { symptom: 김,       goes_to: 예약전환 }   # 마감 안에 처리 불가

  # 대기 5팀 — 원문 "대기 5팀". 나열 순서 = 접수순(화면 대기열 순서로 그대로 노출).
  # 접수순만 고집하면 맨 뒤의 컷오프 손님을 놓친다 — 원문 흔한 실수가 그대로 함정이 된다.
  # 라벨에는 판정·근거를 쓰지 않는다(_SCHEMA.md 규칙 8) — 근거는 주석에만 남긴다.
  items:
    # 접수 1번 — 단순·빠름(짧음 배지) → 다음처리.
    - id: 손님_증명서발급
      sprite: 손님_서류_한장
      icon: 증명서
      time_badge: 짧음
      bin: 다음처리
      priority: 2
      label: 증명서 발급 요청
    # 접수 2번 — 장시간(김 배지), 마감 내 불가 → 예약전환.
    - id: 손님_대출상담
      sprite: 손님_서류뭉치
      icon: 대출
      time_badge: 김
      bin: 예약전환
      priority: 3
      label: 대출 상담 요청
    # 함정 B(과대분류 미끼) — 큰 소리로 재촉해 급해 보이지만 실은 단순 업무(짧음 배지).
    # "목소리 큰 순서가 먼저는 아니다" — 겉보기가 아니라 배지를 봐야 한다.
    - id: 손님_통장재발급
      sprite: 손님_통장_재촉_큰소리
      icon: 통장
      time_badge: 짧음
      bin: 다음처리
      priority: 2
      label: 통장 재발급 요청
    # 접수 4번 — 장시간(김 배지) → 예약전환.
    - id: 손님_종합상담
      sprite: 손님_상담희망
      icon: 상담
      time_badge: 김
      bin: 예약전환
      priority: 3
      label: 종합 자산 상담 요청
    # 함정 A(과소분류) — 접수순 맨 뒤인 데다 조용히 앉아 있지만 송금 컷오프 임박(모래시계 배지).
    # 배지를 놓치면 접수순에 묻힌다 — 진짜 최우선.
    - id: 손님_송금컷오프
      sprite: 손님_조용_봉투
      icon: 송금
      time_badge: 모래시계
      bin: 지금처리
      priority: 1
      label: 송금 요청

  # 돌발 — 조선우가 대기 줄을 가로질러 새치기·폭언. 뜨는 순간 대기열이 흐트러진다.
  sudden:
    id: 손님_조선우_새치기
    sprite: 손님_새치기_고성
    # 게임 시작 후 5초(벽시계 경과) 시점 발동 — 초반에 돌발을 마주하게 한다(요구 반영).
    # appears_after_seconds 는 엔진이 '초'로 확정 해석한다(appears_at 의 크기 휴리스틱과 달리
    # 아이템 수 이하인 5도 처리 수가 아니라 초로 발동).
    appears_after_seconds: 5
    label: 순서 무시 새치기 · 폭언
    freeze_queue: true
    must_resolve_sudden: true   # 5초 전에 5팀 배정을 끝내도 조선우 처리 전에는 게임 종료 불가
    bin: 순서안내석            # 정답 — 대기 순서 원칙 안내 후 용건·소요시간 확인
    # 여기에 넣으면 금지행동(forbidden_penalty 40) — 소란을 멈추려 순서를 바꿔 먼저 처리.
    forbidden_bins:
      - { bin: 지금처리, reason: 소란을 멈추려 순서를 바꿔 먼저 처리(원문 오답 b) }
      - { bin: 다음처리, reason: 대기 고객 양해 없이 순서를 앞당김 }
    # 순서안내석에 배정해야 stages 가 열리고, 이 순서대로 밟아야 escalate 가 열린다.
    stages:
      - { id: 원칙안내,  sprite: 번호표_절차안내, label: 대기 순서 원칙·번호표 절차를 다시 안내 }
      - { id: 용건확인,  sprite: 용건_소요시간,   label: 용건·예상 소요시간 확인(짧으면 양해 구해 배정 검토) }
    persists_after_stages: true   # 안내해도 폭언·업무방해가 계속되는 상황

  # 금지행동 대응 버튼 — 직접 처리 대신 인계(_SCHEMA.md 규칙 2).
  # requires 에는 단계 id만 쓴다(규칙 6 — 순서안내석 배정은 stages 진입 전제조건이라 중복 명시 불필요).
  # 단계를 밟기 전에 누르면 성급한 에스컬레이션이라 감점(early_escalate_penalty).
  escalate:
    label: 선임·지점장 인계
    when: 업무방해_지속
    requires: [원칙안내, 용건확인]

# 채점 — 5팀을 맞는 처리 방식에 넣었나 + 돌발을 순서 원칙대로 처리했나
# accuracy = (맞게 분류한 items / 5) * 100 − 감점, 하한 0
# 감점 중첩 금지(_SCHEMA.md 표준 채점 키) — 한 사건에는 가장 무거운 감점 하나만 적용한다.
#   예) 송금 손님을 다음처리에 → missed_cutoff 25 만(wrong_bin 14 미중첩)
#       조선우를 지금처리에 → forbidden 40 만
#       인계 없이 종료 → missed_escalate 40 이 단계 생략분(stage_skip)을 흡수한다.
scoring:
  item_count: 5
  wrong_bin_penalty: 14
  missed_cutoff_penalty: 25      # 송금 컷오프 손님을 지금처리 밖으로 보냈을 때
  forbidden_penalty: 40          # 조선우를 지금처리·다음처리에(원문 오답 b) — 금지행동(규칙 7, 합격선 관통)
  sudden_wrong_bin_penalty: 20   # 조선우를 forbidden 이 아닌 오답 통(예약전환)에 — forbidden 과 중첩 금지
  early_escalate_penalty: 25     # 안내·용건확인 없이 인계부터 — 성급한 호출(원문 오답 아님 — 표준 권장 25)
  missed_escalate_penalty: 40    # 방해 지속인데 인계 없이 종료 — 인계가 원문 모범답안 ④의 정답 행동
  stage_skip_penalty: 15         # 원칙안내·용건확인 생략·순서 위반 — 건당(미인계 40 적용 시 미중첩)
  ignore_sudden_penalty: 40      # 조선우를 응대하지 않고 방치한 채 종료
