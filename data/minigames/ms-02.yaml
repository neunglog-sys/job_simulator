# 4단계 미니게임 — ms-02 회계·경리·정산 사무
# 근거: 1스텝 "법인카드 비용 정산표 작성" — 문지안: "6월 법인카드 사용내역과 영수증을
#       맞춰 비용정산표를 만들어 주세요." / 제공 자료 "카드내역 15건, 영수증 14장"
#       → 15 − 14 = 1. 짝 없는 전표 1건이 원문에 내장된 트릭이라 그대로 옮긴다.
#       모범답안 ③ "증빙이 없는 내역에 누락 표시를 한다" → 짝이 없으면 억지로 잇지 말고
#       '누락' 도장을 찍는 것이 정답.
#       흔한 실수 "금액만 맞추고 날짜·사용처를 확인하지 않음" → 도장을 모양·색 2속성으로
#       만들어 한 속성만 보고 이으면 틀리게 했다.
#       2스텝 흔한 실수 "전월 증빙을 복사하거나 거래처 확인 없이 정상 처리" → 짝을 못 찾은
#       전표를 아무 영수증에나 붙이는 행동이 곧 이 실수다.
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: ms-02
engine: match
title: 장부 대사
intro: 왼쪽 카드전표와 오른쪽 영수증을 도장이 같은 것끼리 이으세요. 도장은 모양과 색이 모두 같아야 한 짝입니다. 짝이 없는 전표에는 누락 도장을 찍으세요.
time_limit: 120
pass_score: 70

data:
  # 표시 전용 컬럼 헤더(엔진 MatchData.left_label/right_label 규약 — 채점 무관,
  # 없으면 중립 라벨 '왼쪽'/'오른쪽' 폴백). 도트 아트 적용과 함께 추가(2026-07-20).
  left_label: 카드전표
  right_label: 영수증

  # 도장 = 모양 4종(원형·사각·삼각·육각) × 색 4종(파랑·초록·주황·보라).
  # 숫자·상호명은 화면에 띄우지 않는다(_SCHEMA.md 규칙 1) — 판단 단서는 도장뿐이다.
  # 한 속성만 같은 이웃이 항상 존재하도록 격자를 꽉 채워, 모양만/색만 보고 이으면
  # 반드시 어긋나게 만들었다.

  # 카드내역 15건
  left:
    - { id: 전표_원형파랑, sprite: 카드전표_원형_파랑 }
    - { id: 전표_원형초록, sprite: 카드전표_원형_초록 }
    - { id: 전표_원형주황, sprite: 카드전표_원형_주황 }
    - { id: 전표_원형보라, sprite: 카드전표_원형_보라 }
    - { id: 전표_사각파랑, sprite: 카드전표_사각_파랑 }
    - { id: 전표_사각초록, sprite: 카드전표_사각_초록 }   # ← 짝 없는 1건
    - { id: 전표_사각주황, sprite: 카드전표_사각_주황 }
    - { id: 전표_사각보라, sprite: 카드전표_사각_보라 }
    - { id: 전표_삼각파랑, sprite: 카드전표_삼각_파랑 }
    - { id: 전표_삼각초록, sprite: 카드전표_삼각_초록 }
    - { id: 전표_삼각주황, sprite: 카드전표_삼각_주황 }
    - { id: 전표_삼각보라, sprite: 카드전표_삼각_보라 }
    - { id: 전표_육각파랑, sprite: 카드전표_육각_파랑 }
    - { id: 전표_육각초록, sprite: 카드전표_육각_초록 }
    - { id: 전표_육각주황, sprite: 카드전표_육각_주황 }

  # 영수증 14장 — 사각초록만 없다
  right:
    - { id: 영수증_원형파랑, sprite: 영수증_원형_파랑 }
    - { id: 영수증_원형초록, sprite: 영수증_원형_초록 }
    - { id: 영수증_원형주황, sprite: 영수증_원형_주황 }
    - { id: 영수증_원형보라, sprite: 영수증_원형_보라 }
    - { id: 영수증_사각파랑, sprite: 영수증_사각_파랑 }
    - { id: 영수증_사각주황, sprite: 영수증_사각_주황 }
    - { id: 영수증_사각보라, sprite: 영수증_사각_보라 }
    - { id: 영수증_삼각파랑, sprite: 영수증_삼각_파랑 }
    - { id: 영수증_삼각초록, sprite: 영수증_삼각_초록 }
    - { id: 영수증_삼각주황, sprite: 영수증_삼각_주황 }
    - { id: 영수증_삼각보라, sprite: 영수증_삼각_보라 }
    - { id: 영수증_육각파랑, sprite: 영수증_육각_파랑 }
    - { id: 영수증_육각초록, sprite: 영수증_육각_초록 }
    - { id: 영수증_육각주황, sprite: 영수증_육각_주황 }

  pairs:
    - [전표_원형파랑, 영수증_원형파랑]
    - [전표_원형초록, 영수증_원형초록]
    - [전표_원형주황, 영수증_원형주황]
    - [전표_원형보라, 영수증_원형보라]
    - [전표_사각파랑, 영수증_사각파랑]
    - [전표_사각주황, 영수증_사각주황]
    - [전표_사각보라, 영수증_사각보라]
    - [전표_삼각파랑, 영수증_삼각파랑]
    - [전표_삼각초록, 영수증_삼각초록]
    - [전표_삼각주황, 영수증_삼각주황]
    - [전표_삼각보라, 영수증_삼각보라]
    - [전표_육각파랑, 영수증_육각파랑]
    - [전표_육각초록, 영수증_육각초록]
    - [전표_육각주황, 영수증_육각주황]

  # 짝 없음 → 억지로 잇지 말고 '누락' 도장. 원문 "증빙이 없는 내역에 누락 표시를 한다".
  # 이 1건을 어떤 영수증에든 이어붙이면 그 영수증의 진짜 짝까지 함께 틀린다.
  unmatched: [전표_사각초록]

# 채점 — 14짝 + 누락 1건 = 맞혀야 할 것 15
# accuracy = (맞은 짝 + 누락 정답) / 15 * 100 − (잘못 이은 선 * 7), 하한 0
scoring:
  pair_count: 14
  unmatched_count: 1
  wrong_pair_penalty: 7
