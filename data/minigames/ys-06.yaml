# 4단계 미니게임 — ys-06 전기·배전·계측 점검
# 근거: 3스텝 "이상 회로 판정과 보고" — 송다은: "측정하다 이상하면 절대 네가 손대지 말고,
#       어디서 멈추고 뭘 보고할지부터 판단해라."
#       제공 자료 "회로 7개 측정값 시트(일부 기준 미달)" → 게이지도 7개를 그대로 가져왔다.
#       모범답안 ④ "해당 회로의 차단 상태를 유지하고 표찰(표시판)을 부착한 후 작업을 중단한다"
#       → 빨강의 정답은 수리가 아니라 '차단 표찰 부착'.
#       흔한 실수 "경계값을 임의로 합격 처리, 과열 단자를 직접 조이려 함(금지행동)"
#       → 초록 띠 경계에 걸친 눈금 2개를 함정으로, 과열 단자 직접 조임을 forbidden으로 넣었다.
#       돌발퀘스트 모범답안 ④ "회로별 절연저항(시험전압 500V) 측정하고 기록표에 기입" — 측정 자체의 근거.
#       그 밖의 회로명은 1스텝(도면에 없는 에어컨 전용선 증설 회로), 2스텝(502호 누전차단기 민원),
#       돌발퀘스트(지하 1층 분전반)에 실제로 나온 것만 썼다.
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: ys-06
engine: gauge
title: 회로별 절연저항 측정
intro: 집게를 단자에 물리면 바늘이 출렁입니다. 멈춘 자리가 초록 띠 안이면 합격 도장, 빨강이면 손대지 말고 차단 표찰을 붙이세요.
time_limit: 75
pass_score: 70

data:
  # 바늘 위치 0~100 (오른쪽일수록 절연이 좋다). 화면에는 숫자 눈금이 없고
  # 초록 띠와 빨강 띠만 보인다 — _SCHEMA.md 규칙 1(숫자 판독 금지).
  ok_zone: [60, 100]

  gauges:
    - id: 전등분전반_L1
      label: 전등 분전반 L1
      value: 88
      verdict: pass
    - id: 콘센트회로_L2
      label: 콘센트 회로 L2
      value: 76
      verdict: pass
    # 함정 ① — 도면에 없던 증설 회로라 의심스러워 보이지만, 바늘은 초록 띠 안쪽이다.
    #           표찰을 붙이면 오판(1스텝 "도면에 반영되지 않은 에어컨 전용선 등의 증설 회로").
    #           '의심스러움'은 라벨 글자가 아니라 스프라이트(새 임시배선 외관)로 표현한다 —
    #           글자로 주면 텍스트 판독 게임이 된다(규칙 1).
    - id: 에어컨전용선_증설회로
      label: 에어컨 전용선 증설 회로
      sprite: 임시배선_새회로_외관
      value: 62
      verdict: pass
    # 함정 ② — 초록 띠 바로 아래. 흔한 실수 "경계값을 임의로 합격 처리"가 여기서 걸린다.
    - id: 배전반_3층_R상
      label: 3층 배전반 R상
      value: 57
      verdict: fail
      action: 차단표찰_부착
    - id: 누전차단기_502호      # 근거: 502호 반복 트립 민원 — 라벨엔 회로명만(정답 유출 방지)
      label: 502호 누전차단기 회로
      value: 41
      verdict: fail
      action: 차단표찰_부착
    - id: 분전반_지하1층_동력
      label: 지하 1층 분전반 동력회로
      value: 33
      verdict: fail
      action: 차단표찰_부착
    # 근거: 4스텝·돌발 "접속부 78℃ 과열" — 판별은 바늘(46 < 60, 빨강)로 충분하므로
    # 라벨에 과열·℃ 를 쓰지 않는다(정답 유출 방지, 검증 지적과 같은 유형).
    - id: 접속부_과열회로
      label: 접속부 회로
      value: 46
      verdict: fail
      action: 차단표찰_부착

  # 금지행동 — 누르면 즉시 감점. 3스텝 흔한 실수와 모범답안 ④에 근거한다.
  forbidden:
    - id: 과열단자_직접조임
      reason: 과열 접속부를 공구로 직접 조이는 것은 신입 금지행동
    - id: 차단상태_임의복전
      reason: 미달 회로는 차단 상태를 유지해야 하며 복전은 선임 입회하에만 한다

# 채점 — 7개 회로의 합격/차단표찰 판정이 맞았는가
# accuracy = (올바른 판정 / 7) * 100 − (금지행동 * 40), 하한 0
scoring:
  gauge_count: 7
  forbidden_penalty: 40
