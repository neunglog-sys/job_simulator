# 4단계 미니게임 — jm-05 중장비(크레인 조종·신입)
# 근거: m1 정상업무 "크레인 작업 전 일상점검" mission "오늘 양중 들어가기 전에" +
#       m1 guide "풍속계 판독값(현재 순간풍속 8m/s)" — 8m/s는 작업 허용 범위라 실제 양중은
#       이 조건에서 이뤄진다. 흔들리는 화물을 목표점에 살짝 내려놓는 것이 이 게임.
# 금지행동 존중: m3 우선순위 충돌에서 순간풍속 15m/s 초과(16m/s 관측)면 '작업 중지'가 정답이라
#       그 조건의 양중 자체가 금지 → 게임은 8m/s(허용) 기준으로 흔들림을 잡는다.
# 형식 정의는 _SCHEMA.md 참조. physics balance 모드 + settle 확장(내려놓기형 — 크레인류).
# intro 가 '실패'로 고지한 조작(세게 떨어뜨리기·옆으로 치기)은 감점이 아니라 실패로 채점한다
# (_SCHEMA '엔진 확장 필드 추가분' — intro 고지와 채점 일치).
scenario_id: jm-05
engine: physics
title: 안전조건 확인 후 크레인 양중 실습
intro: 앞에서 점검한 크레인과 작업계획을 바탕으로, 허용 풍속의 모의 작업장에서 양중을 연습합니다. 흔들리는 화물을 수직으로 안정시킨 뒤 목표점에 천천히 내려놓으세요. 과속 착지나 측면 충돌은 실패입니다.
time_limit: 60
pass_score: 70

data:
  mode: balance
  target: 0.0     # 화물이 수직으로 정지(흔들림 0)한 상태가 목표
  drift: 0.3      # 흔들리는 세기 — 순간풍속 8m/s(원문 m1 판독값, 허용 범위) 기준의 중간 흔들림
  scene: 크레인_작업장_씬   # 표시 전용 배경(도트) — 모의 작업장(intro 소재). 파일 부재 시 기존 그라데이션 폴백

  # 내려놓기형 확장(_SCHEMA physics balance `settle`) — 실패 조건이 함정 역할(규칙 5·7)
  settle:
    target_zone: 착지_목표점   # 바닥의 착지 원 — 이 안에 내려놓아야 안착
    tolerance: 0.1            # 목표점 반경 — 이 안에서 놓아야 '살짝' 안착(만점)
    sway_fail: 0.6            # 흔들림 폭이 이 값을 넘으면 인접 철골 충돌 → 실패(0점)
    drop_fail: 0.5            # 하강 속도가 이 값을 넘는 착지 = '세게 떨어뜨림' → 실패(0점, intro 고지와 일치)
    load_sprite: 양중_화물_철골  # 표시 전용 — 화물 도트(줄걸이 묶은 철골 다발, sway_fail 의 '인접 철골' 소재). 부재 시 기존 박스
    zone_sprite: 착지_목표패드   # 표시 전용 — 착지_목표점 지면 표시물. 판정 밴드·잠금 색 피드백은 기존 그대로
  # 목표점 밖(tolerance 초과) 안착은 실패가 아니라 어긋난 거리에 비례해 정확도가 깎인다.
