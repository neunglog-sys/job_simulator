# 4단계 미니게임 — stn-01 마케팅·광고·홍보 운영
# 근거: 1스텝 "신제품 캠페인 초안(첫 번째 기획안) 작성" — 윤지호: "다음 달 신제품 캠페인
#       브리프를 보고 타깃과 핵심 메시지 초안을 정리해 주세요."
#       guide "제공 자료: 캠페인 브리프, 고객 세그먼트 자료, 브랜드 가이드, 이전 캠페인 결과"
#       모범답안 ② "설정 가능한 타깃(핵심 대상) 후보군을 비교 분석한다"
#       보기 b "소비자에게 전달할 메인 카피를 두 가지 이상의 시안으로 준비한다"
#       흔한 실수 "유행어만 사용하거나 브랜드 금지표현을 확인하지 않음" → 브랜드 금지색 시안
# 근거(휴지통 2종): 돌발 — 윤지호: "광고 게시 직전입니다. 카피와 이미지가 브랜드·권리·표현
#       기준에 맞는지 최종 검수해 주세요." 모범답안 "② 이미지 권리 확인"
#       흔한 실수 "일정 때문에 이미지 권리 확인 없이 게시하거나 일부 위험만 수정"
# 이 직무는 전단 배포·판촉이 아니라 '타깃 파악과 시안 검수'다. 손님은 말풍선 아이콘의
# 색·모티프로만 취향을 드러내고 글자·숫자는 띄우지 않는다(_SCHEMA.md 규칙 1).
# 라벨 규약(검증 지적 반영): 함정·트릭 항목에 판정 해설 라벨을 달지 않는다(규칙 8).
# 판별은 스프라이트의 시각 단서(금지마크 표식 · 워터마크)로만 — 근거는 주석과 reason 에만.
scenario_id: stn-01
engine: match
title: 타깃 취향과 시안 맞추기
intro: 손님 말풍선의 색·모티프에 맞는 광고 시안을 이으세요. 브랜드 가이드에 어긋나거나 권리가 확인되지 않은 시안은 잇지 말고 휴지통으로 버립니다.
time_limit: 75
pass_score: 70

data:
  # 왼쪽 — 손님(고객 세그먼트 자료). 머리 위 말풍선에 취향이 색+모티프로 뜬다.
  left:
    - id: 손님_민트새싹
      sprite: 손님_말풍선_민트_새싹
    - id: 손님_코랄물결
      sprite: 손님_말풍선_코랄_물결
    - id: 손님_네이비별
      sprite: 손님_말풍선_네이비_별
    - id: 손님_옐로해
      sprite: 손님_말풍선_옐로_해
    # 이번 브리프에 없는 취향(보라·달 시안이 보드에 없음) — 짝 없음이 정답.
    # 라벨로 알려주지 않는다(규칙 8) — 오른쪽 보드에 보라·달이 없는 것으로 판별.
    - id: 손님_보라달
      sprite: 손님_말풍선_보라_달
  # 오른쪽 — 광고 시안 보드(이전 캠페인 결과에서 추린 것 + 신규 시안)
  # 함정 2종은 label 없이 스프라이트 표식으로만 판별한다(규칙 8, 검증 지적 반영):
  # 시안_형광레드별 = 브랜드 가이드 금지색(형광 레드) — 스프라이트의 금지마크 표식.
  #   모티프(별)가 맞아 손님_네이비별에 붙이고 싶어지는 함정.
  # 시안_코랄물결_워터마크 = 이미지 권리 미확인 — 스프라이트의 워터마크.
  #   색·모티프가 손님_코랄물결과 완전히 일치해 가장 유혹적인 함정.
  right:
    - id: 시안_민트새싹
      sprite: 시안_민트_새싹
    - id: 시안_코랄물결
      sprite: 시안_코랄_물결
    - id: 시안_네이비별
      sprite: 시안_네이비_별
    - id: 시안_옐로해
      sprite: 시안_옐로_해
    - id: 시안_형광레드별
      sprite: 시안_형광레드_별_금지마크
    - id: 시안_코랄물결_워터마크
      sprite: 시안_코랄_물결_워터마크

  # 색과 모티프가 둘 다 맞는 짝만 정답
  pairs:
    - [손님_민트새싹, 시안_민트새싹]
    - [손님_코랄물결, 시안_코랄물결]
    - [손님_네이비별, 시안_네이비별]
    - [손님_옐로해, 시안_옐로해]

  # 짝 없음 → 억지로 잇지 말고 '해당 시안 없음' 도장이 정답
  unmatched: [손님_보라달]

  # 휴지통 — 잇는 순간 오답. 버려야 점수를 받는다.
  discard:
    bin: 휴지통
    items:
      - id: 시안_형광레드별
        reason: 브랜드 가이드 금지색 — 모티프가 맞아 손님_네이비별에 붙이고 싶어진다
      - id: 시안_코랄물결_워터마크
        reason: 이미지 권리 미확인 — 색·모티프가 완전히 일치해 가장 유혹적인 함정

# 채점 — 정답 4쌍 + 짝없음 1건 + 휴지통 2건 = 7건 판정
# accuracy = (맞은 판정 / 7) * 100 − 감점, 하한 0
# 감점 중첩 금지 — 버려야 할 시안을 손님에게 이은 선은 wrong_link 이기도 하지만
# 가장 무거운 forbidden_penalty 40 하나만 적용한다(_SCHEMA 표준 채점 키, 검증 지적 반영).
scoring:
  judgement_count: 7
  wrong_pair_penalty: 12   # 표준 채점 키(_SCHEMA.md) — wrong_link 변형 금지
  forbidden_penalty: 40        # 표준 키 — 버릴 시안 게시·연결(금지행동)   # 버려야 할 시안을 손님에게 이었을 때 — 금지색 사용·권리 미확인
                             # 게시는 금지행동이라 위반하고 합격이 불가해야 한다(규칙 7)
