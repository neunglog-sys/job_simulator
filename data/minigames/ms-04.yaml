# 4단계 미니게임 — ms-04 무역·물류·운송 사무
# 근거: 1스텝 "출고지시서 및 배차확인표 작성" — 윤예준: "오늘 출고 8건의 출고지시서와
#       운송장을 확인해 배차확인표를 완성하세요." / 모범답안 "품목·수량·주소·차량을
#       대조" → 목적지 아이콘이 같은 트럭 짐칸에 화물을 싣는 배차 퍼즐.
#       2스텝 "수입 서류 불일치 검토" — 임다은: "인보이스와 패킹리스트의 불일치를 찾아
#       보완 요청" / 흔한 실수 "임의로 문서 값을 고치거나 한 문서만 기준으로 삼음"
#       → 서류 도장과 목적지가 어긋난 상자는 임의로 싣지 말고 보류 팔레트로.
#       흔한 실수 "재고만 보고 차량·주소·납기를 확인하지 않음"도 같은 함정(짐칸 초과).
#       돌발 "세관에서 품목분류 확인 요청 ... 화물을 임의 출고하지 말고" — 흔한 실수
#       "사용자가 임의로 품목코드를 확정" → 직접 싣지 말고 출고보류·전문담당자 호출.
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: ms-04
engine: sort
title: 출고 배차 퍼즐
intro: 목적지 아이콘이 같은 트럭 짐칸에 화물을 실으세요. 서류 도장과 아이콘이 어긋나거나 짐칸을 넘치는 상자는 보류 팔레트로 보내세요.
time_limit: 90
pass_score: 70

data:
  # 트럭은 목적지 아이콘(별·달·해·산)으로만 구분한다(주소 글자 판독 금지, 규칙 1).
  # bin.sprite 는 표시 전용 도트 아트(gm-01 팔레트와 같은 규약) — 채점·데이터 계약 불변.
  # 보류팔레트는 기존 자산 팔레트_빨강_보류(gm-01 격리존과 같은 의미)를 재사용한다.
  bins:
    - { id: 트럭_별,   label: 별 목적지, sprite: 배차트럭_별 }
    - { id: 트럭_달,   label: 달 목적지, sprite: 배차트럭_달 }
    - { id: 트럭_해,   label: 해 목적지, sprite: 배차트럭_해 }
    - { id: 트럭_산,   label: 산 목적지, sprite: 배차트럭_산 }
    - { id: 보류팔레트, label: 보류,     sprite: 팔레트_빨강_보류 }

  items:
    # --- 아이콘이 서류 도장과 일치하는 정상 출고 (아이콘만 보고 실으면 된다) ---
    - { id: 화물_별1, sprite: 상자_별아이콘_도장별,   bin: 트럭_별 }
    - { id: 화물_별2, sprite: 상자_별아이콘_도장별,   bin: 트럭_별 }
    - { id: 화물_달1, sprite: 상자_달아이콘_도장달,   bin: 트럭_달 }
    - { id: 화물_달2, sprite: 상자_달아이콘_도장달,   bin: 트럭_달 }
    - { id: 화물_해1, sprite: 상자_해아이콘_도장해,   bin: 트럭_해 }
    - { id: 화물_산1, sprite: 상자_산아이콘_도장산,   bin: 트럭_산 }

    # --- 함정 1. 서류 도장과 목적지 아이콘이 어긋남 (2스텝 인보이스↔패킹리스트 불일치) ---
    # 상자에는 별 아이콘, 붙은 서류 도장은 달 → 어느 트럭에 실어도 오출고. 보류가 정답.
    - { id: 화물_불일치1, sprite: 상자_별아이콘_도장달, bin: 보류팔레트 }
    - { id: 화물_불일치2, sprite: 상자_해아이콘_도장산, bin: 보류팔레트 }

    # --- 함정 2. 짐칸을 넘치는 초대형 상자 (재고만 보고 차량 용량을 확인 안 한 경우) ---
    # scale 은 표시 전용 배율(엔진 item.scale, 기본 1 — gm-01 박스_규격이상과 같은 규약).
    # 아이콘·도장은 별로 일치해 크기만이 유일한 이상 신호다(원문 '차량 용량 미확인' 함정).
    - { id: 화물_초과, sprite: 상자_별아이콘_초대형, bin: 보류팔레트, scale: 1.35 }

    # --- 함정 3. 세관 품목분류 확인 요청 화물 (돌발) — 직접 싣지 말고 호출 ---
    # bin 없음 = 어느 트럭에도 실으면 오답. escalate 버튼(전문담당자 호출)이 정답.
    - { id: 화물_세관보류, sprite: 상자_세관도장_확인요청, escalate: true }

  # 금지행동 대응 — 신입이 임의로 품목코드를 확정해 출고하지 않는다
  escalate:
    { label: 출고보류·전문담당자 호출, when: 화물_세관보류 }

# 채점 — 10건 중 제자리(정상 6 + 보류 3 + 세관 호출 1)에 처리한 수. 오출고는 감점.
# accuracy = (정확히 처리한 items / 10) * 100 − (오분류 * 9), 하한 0
# 세관 화물의 처리 경로별 판정(검증 지적 반영 — 보류팔레트 투입 시 감점 미정의 해소):
#   전문담당자 호출(escalate) = 정답 / 트럭 적재 = 오분류(−9, 임의 출고)
#   보류팔레트 = 절반 감점(−5) — 출고는 막았지만 원문 정답(전문담당자 확인)이 아님
scoring:
  item_count: 10
  wrong_bin_penalty: 9
  # 세관 보류 화물을 트럭에 실어버린 경우 — 금지행동이라 가중 감점
  missed_escalate_penalty: 15
  # 세관 보류 화물을 보류팔레트에 둔 경우 — 절반 감점(위 주석의 경로별 판정)
  customs_to_hold_penalty: 5
