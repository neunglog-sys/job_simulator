# 4단계 미니게임 — ms-06 농축산 현장 (기본 테스트 시나리오)
# 근거: 1스텝 "급이 전 개체 및 환경 점검" — 조채원: "오전 급이 전에 개체 상태와
#       사육환경을 점검해 주세요." / 모범답안 ④ "각 개체별로 알맞은 적정 급이량을 확인한다"
# 개체군마다 적정량이 다르다는 점이 이 게임의 핵심. 숫자는 띄우지 않고 구유의
# 표시선으로만 읽힌다(_SCHEMA.md 규칙 1 — 숫자 판독 금지).
scenario_id: ms-06
engine: pour
title: 개체별 정량 급이
intro: 구유마다 표시선 높이가 다릅니다. 눌러서 붓고, 선에 맞춰 손을 떼세요. 넘치면 사료가 흩어집니다.
time_limit: 75
pass_score: 70

data:
  # target·tolerance 는 0~1 비율. 화면엔 숫자가 아니라 표시선으로만 보인다.
  vessels:
    - id: 1번축사_성체
      label: 1번 축사 · 성체 6두
      target: 0.78
      tolerance: 0.06
    # '자돈'은 특정 축종(돼지)을 함의 — 원문은 축종을 특정하지 않으므로 중립 표현 사용
    - id: 2번축사_어린개체
      label: 2번 축사 · 어린 개체 12두
      target: 0.40
      tolerance: 0.05
    - id: 3번축사_임신개체
      label: 3번 축사 · 임신 개체 2두
      target: 0.62
      tolerance: 0.05
    - id: 4번축사_회복개체
      label: 4번 축사 · 회복 중 1두
      target: 0.25
      tolerance: 0.04    # 회복 개체 — 소량·정밀. 제일 어려운 칸

scoring:
  # 표시선에서 벗어난 정도로 감점. tolerance 안이면 만점.
  over_penalty: 12       # 넘친 경우 (사료 흩어짐 — 원문의 낭비·오염)
  under_penalty: 8       # 모자란 경우
