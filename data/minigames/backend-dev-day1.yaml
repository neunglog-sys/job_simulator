# 4단계 미니게임 — backend-dev-day1 백엔드 개발자
# 근거: coding 스텝 "알림 발송 예외 처리 구현" — 박준혁: "알림 발송 로직에서 예외 케이스
#       세 개만 먼저 막아줘 — 같은 사용자에게 중복 발송, 수신거부한 사용자, 야간 시간대.
#       조건문 빠뜨리면 그대로 고객한테 나가니까 정확하게."
#
# ⚠ 「글자 판독 금지」 원칙의 공인 예외 2건 중 하나 (팀 확정 2026-07-20).
#   코드 입력 자체가 업무라 글자가 불가피하다. 다만 전제가 붙는다:
#   - 타자 '속도'는 점수화하지 않는다. accuracy = 정확히 입력한 줄 / 입력해야 할 줄.
#   - 걸린 시간은 time_seconds 로 따로 보내 리포트 서술용으로만 쓴다.
#   - 그래서 fall_seconds 는 넉넉하게 둔다 — 압박이 아니라 정확도를 보는 게임이다.
scenario_id: backend-dev-day1
engine: typing
title: 알림 발송 예외 처리
intro: 막아야 할 예외 조건이 위에서 내려옵니다. 정확히 입력해 걸러내세요. 스펙에 없는 줄은 입력하면 안 됩니다.
time_limit: 90
pass_score: 70

data:
  fall_seconds: 9          # 정확도를 보는 게임 — 조급하게 만들지 않는다
  # 입력해야 할 줄 — 원문이 지목한 예외 세 가지 + 기록
  lines:
    - id: dup
      text: "if already_sent(user, notice): skip()"
      label: 같은 사용자에게 중복 발송 차단
    - id: optout
      text: "if user.opted_out: skip()"
      label: 수신거부 사용자 제외
    - id: night
      text: "if is_night(now): hold_until_morning()"
      label: 야간 시간대 발송 보류
    - id: log
      text: "log_skipped(user, reason)"
      label: 걸러진 건을 사유와 함께 기록

  # 입력하면 안 되는 줄 — 원문 금지행동(조건 확인 없이 전체 발송)
  distractors:
    - id: force
      text: "send_all(users)"
      reason: 조건 확인 없이 전체 발송부터 시도
    - id: retry
      text: "cancel_after_send()"
      reason: 일단 보내고 문제 생기면 취소하는 방식

scoring:
  # accuracy = 정확히 입력한 lines / 전체 lines * 100 − 아래 감점들. 속도 미반영
  # (time_seconds 는 서술용). 감점 확정(검증 지적 반영):
  #   distractor 입력 = 원문 금지행동('조건 확인 없이 전체 발송') → 40 (합격선 관통)
  #   핵심 예외 3줄(dup·optout·night) 중 1줄이라도 누락 = 원문 warning
  #   '세 조건 중 하나라도 빠뜨린 채 발송' → 누락당 40. log 는 보조라 비율 감점만.
  line_count: 4
  critical_lines: [dup, optout, night]
  missed_critical_penalty: 40
  distractor_penalty: 40
  count_speed: false
