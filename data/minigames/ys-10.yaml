# 4단계 미니게임 — ys-10 시설·설비·전기관리 (LOTO 확인 입회)
# 근거: 3스텝 "배전반(전기 분배 상자) 작업 안전 점검" — 배지아: "협력업체가 3번 배전반 작업
#       준비 중이니까 현장 가서 허가서랑 차단상태 확인하고, 이상 있으면 바로 무전 쳐."
#       mission "작업허가서 미게시와 차단기 미차단(검전 결과 활선) 상태를 확인하고, 작업 중지를
#       요청한 뒤 안전관리자에게 무전 보고."
#       answer_guide ①허가서 게시·유효기간 확인 ②차단기 개방·잠금표지(LOTO) 상태 확인
#       ③검전기로 무전압 확인, 활선 감지 시 접근 중지 ④작업 중지 요청 후 안전관리자에게 무전 보고.
#       → 이 순서(허가서→차단기→자물쇠→검전기→중지→무전)가 정답 절차. 검전 결과가 '활선'이라
#       직접 조치가 아니라 '만지지 말고 무전 보고'로 끝난다.
#       함정(forbidden): 제공 자료 "금지행동 카드(활선작업·차단기 임의 조작 금지)" + 흔한 실수
#       "'빨리 끝내자'는 작업자 말에 밀려 작업 허용, 신입이 직접 차단기 조작(금지행동)".
#       → 이 세 개는 순서에 없고, 누르면 즉시 실패.
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: ys-10
engine: sequence
title: LOTO 확인 입회
# intro가 정답 순서를 나열하면 순서 판단(채점의 전부)이 '안내문 따라하기'가 된다 —
# 과업만 알려주고 순서는 플레이어가 판단하게 한다(검증 지적 반영).
intro: 협력업체 작업 전 확인 입회입니다. 카드를 안전 절차에 맞는 순서로 누르세요. 확인 결과 이상이 있으면 어떻게 끝내야 하는지도 판단입니다.
time_limit: 70
pass_score: 70

data:
  # 이 순서가 정답. 틀린 순서를 누르면 즉시 실패(안전 절차) — _SCHEMA.md 규칙 6.
  steps:
    - id: 작업허가서_확인
      sprite: PTW_대장
      label: 작업허가서(PTW) 게시·유효기간 확인
    # 정답 스텝(눈으로 확인)과 금지행동(레버에 손)을 같은 설비의 비슷한 그림으로 두면
    # 도트에서 구분이 안 돼 억울한 즉시실패가 난다 — '눈 vs 손' 아이콘으로 구분한다
    # (검증 지적 반영).
    - id: 차단기_개방상태_확인
      sprite: 차단기_상태창_눈아이콘
      label: 차단기 개방 상태 확인
    - id: 자물쇠표지_확인
      sprite: LOTO_자물쇠표지
      label: 잠금장치·표지(LOTO) 부착 상태 확인
    - id: 검전기_무전압확인
      sprite: 검전기
      label: 검전기로 무전압 확인 — (결과) 활선 감지
    - id: 작업중지_요청
      sprite: 작업중지_손신호
      label: 작업 중지 요청
    - id: 무전보고
      sprite: 무전기_보고    # 기존 도트 자산 재사용(무전 보고 — 의미 동일, 중복 제작 방지)
      label: 안전관리자에게 무전 보고

  # 눌러선 안 되는 것 — 금지행동 카드. 하나라도 누르면 즉시 실패.
  forbidden:
    - id: 차단기_직접조작
      sprite: 차단기_레버_손아이콘
      reason: 신입이 직접 차단기를 조작하는 것은 금지행동(활선작업·차단기 임의 조작 금지 카드)
    - id: 활선단자_접촉
      sprite: 배전반_단자
      reason: 검전에서 활선이 잡히면 만지지 말 것 — 접촉 금지
    - id: 재촉수용_작업허용
      sprite: 작업자_재촉
      reason: "'빨리 끝내자'는 작업자 말에 밀려 확인 없이 작업을 허용하면 안 된다"

# 채점 — 6단계를 정확한 순서로 밟고 금지행동을 누르지 않았는가.
#   순서 오류나 금지행동은 즉시 실패(안전 절차라 부분점수 없음).
scoring:
  step_count: 6
  wrong_order_fail: true      # 틀린 순서 = 즉시 실패
  forbidden_fail: true        # 금지행동 = 즉시 실패
