# 4단계 미니게임 — hr-01 인사·채용 운영
# 근거: 1스텝 "경력직 기술 면접 준비" — 김지아: "오늘 오후에 진행될 '개발본부 경력직
#       기술 면접' 준비를 시작해 주세요. 면접실 세팅부터 면접관 안내, 지원자 응대까지
#       매뉴얼대로 빈틈없이 준비해야 합니다."
#       보기 a "노트북, 빔프로젝터 등 기기 작동 상태를 확인한다"
#       보기 b "출력된 채용 평가 서류와 이력서를 면접관 자리에 정돈하여 올려둔다"
#       보기 c "대기 장소를 정돈하고 안내판을 설치하여 면접장까지의 이동 경로를 표시한다"
#       함정 보기 e "지원자의 포트폴리오와 이력서 파일을 암호 없이 공용 메신저 방에 공유"
#       함정 보기 f "지원자에게 면접관들의 성향과 자주 나오는 기출 질문 목록을 말해준다"
#       warning: "개인정보가 담긴 서류를 암호화 없이 공용 메신저나 오픈된 공간에 공유
#       하는 것은 심각한 보안 규정 위반입니다."
# 주의(팀 지침): 신입은 면접 운영·응대만 하고 평가·선별에 개입하지 않는다. 그래서
#   평가표는 '빈 양식을 자리에 비치'하는 배치일 뿐, 채점하지 않는다(서류 심사 요소 없음).
# 슬롯 소재는 전부 원문 m1 보기 a·b·c에 실재하는 것만 쓴다 — 원문에 없던 명패·생수
#   슬롯은 제거했다(검증 지적 반영). 배치는 배치도 실루엣과 색·모양으로만 맞추고
#   이름 글자는 읽히지 않는다(_SCHEMA.md 규칙 1 — 숫자·글자 판독 금지).
scenario_id: hr-01
engine: place
title: 기술 면접실 셋업 러시
intro: 배치도 실루엣대로 면접관 좌석에 평가표·이력서를 세팅하고, 기기를 놓고, 대기실과 복도에 안내 표지판을 세우세요. 카트엔 자리에 두면 안 되는 물건이 섞여 있습니다 — 자리가 없는 물건은 보안 담당 보고 버튼으로.
time_limit: 80
pass_score: 70

data:
  scene: 면접실_배치도_대기실_복도

  slots:
    # 면접관 좌석 3석 — 각 자리에 평가표(빈 양식)·이력서 묶음 (원문 m1 보기 b)
    - { id: 면접관석A_평가표, accepts: 평가표,     at: [200, 150], label: 면접관 A석 · 평가표 }
    - { id: 면접관석A_이력서, accepts: 이력서묶음, at: [250, 150], label: 면접관 A석 · 이력서 }
    - { id: 면접관석B_평가표, accepts: 평가표,     at: [200, 250], label: 면접관 B석 · 평가표 }
    - { id: 면접관석B_이력서, accepts: 이력서묶음, at: [250, 250], label: 면접관 B석 · 이력서 }
    - { id: 면접관석C_평가표, accepts: 평가표,     at: [200, 350], label: 면접관 C석 · 평가표 }
    - { id: 면접관석C_이력서, accepts: 이력서묶음, at: [250, 350], label: 면접관 C석 · 이력서 }
    # 기기 — 노트북·빔프로젝터 작동 위치 (원문 m1 보기 a)
    - { id: 기기_노트북,      accepts: 노트북,       at: [520, 180], label: 발표대 · 노트북 }
    - { id: 기기_빔프로젝터,  accepts: 빔프로젝터,   at: [520, 260], label: 천장 · 빔프로젝터 }
    # 동선 안내 — 대기실과 복도에 표지판 (원문 m1 보기 c)
    - { id: 대기실_안내,      accepts: 안내표지판,   at: [760, 160], label: 대기실 · 안내 표지판 }
    - { id: 복도_안내,        accepts: 안내표지판,   at: [760, 320], label: 복도 · 면접장 방향 표지판 }

  # 같은 id가 여러 번이면 조각이 그만큼 있다는 뜻(슬롯 수와 짝이 맞는다).
  pieces:
    - 평가표
    - 평가표
    - 평가표
    - 이력서묶음
    - 이력서묶음
    - 이력서묶음
    - 노트북
    - 빔프로젝터
    - 안내표지판
    - 안내표지판
    - 기출질문_목록
    - 지원자파일_공용사본

  # 종이류 4종의 시각 변별 단서 — 이름 글자가 아니라 형태·색·아이콘으로 구분한다
  # (규칙 1 — 글자 판독 금지, 검증 지적 반영). 단서는 증상·상태만 보여주고
  # 슬롯 대응은 배치도 실루엣으로 판단하게 한다(_SCHEMA.md 시각 단서 규약).
  visual_cues:
    평가표: 클립보드_빈_체크칸_격자양식
    이력서묶음: 밀봉_서류봉투_잠금띠지_증명사진칸
    기출질문_목록: 구겨진_손글씨쪽지_물음표낙서
    지원자파일_공용사본: 낱장_복사지_이중사본표시_흐트러진묶음

  # 함정 — 카트에 섞여 있지만 어느 자리에도 두면 안 되는 것.
  # 배치하면 extra_penalty가 아니라 forbidden_penalty 40 (원문 금지 보기 e·f).
  extras:
    - { id: 기출질문_목록,      reason: 면접관 성향·기출 질문 유출 금지 — 지원자 대기실에도 두지 않는다 }
    - { id: 지원자파일_공용사본, reason: 암호화 없이 오픈 공간에 두는 개인정보 서류는 보안 규정 위반 }

  # 금지행동 배치 — 오배치(wrong_slot)가 아니라 금지행동(forbidden_penalty)으로 채점.
  # 근거: m1 warning "개인정보가 담긴 서류를 … 오픈된 공간에 공유하는 것은 심각한
  # 보안 규정 위반" — 이력서를 대기실·복도 공용 슬롯에 두면 40 감점(검증 지적 반영).
  forbidden:
    - { id: 이력서묶음, slots: [대기실_안내, 복도_안내], reason: 개인정보 서류를 오픈 공간(대기실·복도)에 배치 — 보안 규정 위반 }

  # 보안 위반 소지 물건은 배치가 아니라 담당자 보고가 정답 (_SCHEMA.md 규칙 2).
  escalate:
    label: 보안 담당 보고
    when: [기출질문_목록, 지원자파일_공용사본]

# 채점 — 맞게 채운 자리에서 잘못 놓은 것을 뺀다
# accuracy = (맞게 채운 slot / 10) * 100 − (금지행동 * 40)
#            − (보고 대상 방치 * 40) − (엉뚱한 자리 * 5), 하한 0
# ─ 기출질문_목록·지원자파일_공용사본을 어느 자리에든 배치 = 원문 금지 보기 e·f → 40
# ─ 위 2종을 카트에 방치하고 보고(escalate)를 안 누름 = 40 — '배치가 아니라 보고가
#   정답'을 채점으로 실현한다. accepts가 함정 배치를 막는 구현이더라도 방치 40이
#   있어 '전부 배치·무보고' 전략은 어느 해석에서도 합격할 수 없다(검증 지적 반영).
# ─ 이력서묶음을 대기실·복도 공용 슬롯에 배치 = 40 (data.forbidden — m1 warning)
# 감점 중첩 금지: 한 조각(사건)에는 가장 무거운 감점 하나만 적용한다.
#   예) 기출질문_목록을 배치했으면 forbidden 40 하나만(방치 40 중복 부과 금지).
scoring:
  slot_count: 10
  forbidden_penalty: 40        # 함정 2종 배치·이력서 공용 구역 배치(원문 금지행동)
  missed_escalate_penalty: 40  # 보고 대상 2종 방치 — 보고가 원문이 요구하는 정답 처리
  escalate_mode: 대체          # 보고가 배치를 대체 — 두 조각은 어느 자리에도 놓지 않는다
  wrong_slot_penalty: 10   # 표준 권장값(10~15)
