# 4단계 미니게임 — ys-08 기계·전자·산업장비 점검
# 근거: 1스텝 "일일 순찰점검 수행" — 손예준: "비상발전기랑 공기압축기, 일일점검표 순서대로
#       체크하고..." + 모범답안 ④ "계기판의 압력과 온도 값을 판독하여..." (계기 순찰의 근거).
#       제공 자료 "일일점검표(항목 12개)", "기준 압력·온도표".
#       빨강(이상)은 원문에 실제로 나온 이상 개소만 사용:
#         - 배전반 단자 고온 78℃ — 4스텝 이상보고서 & 돌발퀘스트 "단자 이상 고온(78℃)".
#         - 3번 냉각수 펌프 이상 — 2스텝 "3번 냉각수 펌프에서 소리가 이상하다."
#         - 하역장비 PLC 경보 — 3스텝 "하역장비 PLC 경보까지 떴고."
#       함정: 적색존 경계 바로 안쪽의 정상 계기 2개(누르면 오탐). 속도보다 '놓치지 않기'가 보상.
#       숫자 눈금은 화면에 없고 초록/빨강 띠로만 읽힌다(_SCHEMA.md 규칙 1).
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: ys-08
engine: gauge
title: 계기판 순찰
intro: 기관실 계기판을 훑어 바늘이 빨강(적색존)에 든 이상 계기만 탭하세요. 하나라도 놓치면 큰 감점입니다. 정상 계기는 건드리지 마세요.
time_limit: 80
pass_score: 70

data:
  # 초록 띠(정상 범위). 이 밖으로 나가면 빨강(이상) — 탭 대상.
  # 화면엔 숫자 없이 초록/빨강 띠와 바늘만 보인다 — _SCHEMA.md 규칙 1.
  ok_zone: [25, 72]

  gauges:
    # --- 정상(초록) : 건드리면 오탐 ---
    - id: 비상발전기_냉각수온도
      label: 비상발전기 냉각수 온도
      value: 48
      verdict: pass
    - id: 비상발전기_유압
      label: 비상발전기 윤활유압
      value: 55
      verdict: pass
    - id: 공기압축기_토출압력
      label: 공기압축기 토출압력
      value: 61
      verdict: pass
    # 함정 ① — 적색 경계 바로 안쪽. 높아 보여도 아직 초록. 누르면 오탐.
    - id: 공기압축기_탱크압력
      label: 공기압축기 탱크압력
      value: 70
      verdict: pass
    # 함정 ② — 낮은 쪽 경계 바로 안쪽. 떨어져 보여도 정상. 누르면 오탐.
    - id: 냉각수펌프_1_흡입압력
      label: 1번 냉각수 펌프 흡입압력
      value: 27
      verdict: pass
    - id: 배전반_주회로_전류
      label: 배전반 주회로 부하전류
      value: 44
      verdict: pass

    # --- 이상(빨강) : 반드시 탭. 놓치면 miss ---
    # 라벨은 정상 계기와 똑같이 장비명만 쓴다 — 이상 여부는 오직 바늘 위치(빨강)로만
    # 판별해야 한다. 라벨에 '과열·경보' 접미나 숫자(78℃)를 달면 텍스트가 정답을
    # 유출해 경계 함정 2개가 무력화된다(검증 지적 반영, 규칙 1).
    - id: 배전반_단자_온도       # 근거: 4스텝·돌발 "단자 이상 고온(78℃)"
      label: 배전반 단자 온도
      value: 91
      verdict: fail
      action: 접촉금지_보고
    - id: 냉각수펌프_3_토출압력   # 근거: 2스텝 "3번 냉각수 펌프 소리가 이상하다"
      label: 3번 냉각수 펌프 토출압력
      value: 84
      verdict: fail
      action: 이상표시_보고
    - id: 하역장비_PLC_압력      # 근거: 3스텝 "하역장비 PLC 경보까지 떴고"
      label: 하역장비 유압
      value: 14
      verdict: fail
      action: 이상표시_보고

# 채점 — 이상(빨강) 3개를 놓치지 않고 탭했는가. '놓치지 않기'를 무겁게 본다.
# accuracy = (맞게 처리한 계기 / 9) * 100.
#   miss_penalty: 이상 계기를 놓친 경우(가장 무겁게 — 순찰의 핵심은 누락 0)
#   false_tap_penalty: 정상 계기를 탭한 경우(오탐)
scoring:
  gauge_count: 9
  abnormal_count: 3
  miss_penalty: 30
  false_tap_penalty: 12
