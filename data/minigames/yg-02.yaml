# 4단계 미니게임 — yg-02 콘텐츠·예술·공예 제작
# 근거: 1스텝 "완성 세공품 품질 검수" — 최민아: "이번에 나온 세공품 세 점, 도안이랑
#       검수표 기준에 맞는지 하나씩 대조해서 합격·보류 표시해 와요. 애매하면 임의로
#       넘기지 말고 나한테 물어보고." / task: "완성품 3점을 도안과 판단품질기준
#       (표현의 일관성·균형·내구성)에 대조" / guide: 완성품 3점(반지·목걸이·브로치),
#       원안 도안, 검수표(표면 마감·용접부·보석 세팅·치수·내구성).
# 설계 메모: 신입 업무는 '제작'이 아니라 '검수·판정'이다 — 직접 세공하는 조작은
#   넣지 않고, 도안과 대조해 합격 트레이/보류함으로 '분류'만 한다.
#   보석·용접 결함은 스프라이트로는 너무 작으므로 '확대 인스펙션 뷰 + 결함 과장'을
#   전제로 설계한다(비뚤어진 보석·끊긴 용접선을 확대뷰에서 눈에 띄게 표현).
#   결함은 모양·색으로만 판단하게 한다(규칙1: 글자·숫자 판독 금지).
#   함정: (1) 보석이 살짝 기운 듯하나 도안 허용오차 안인 '경계 정상'(합격인데 보류로
#   오판하기 쉬움), (2) 도안이 흐려 판정 불가한 개체는 임의로 넘기지 말고 실장 호출
#   (최민아의 "애매하면 나한테 물어보고" — escalate. _SCHEMA 규칙2: 직접 판정 대신 호출).
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: yg-02
engine: sort
title: 세공품 검수대
intro: 확대 인스펙션 뷰로 세공품을 도안과 대조하세요. 결함이 보이면 보류함, 도안과 일치하면 합격 트레이로. 판정이 애매하면 실장을 호출하세요. 검수대는 쉬지 않고 돌아갑니다 — 시간 안에 처리하세요.
# 타임어택 — 제한시간을 75→45로 촉박하게(디자이너 요구 "타임어택 느낌"). 7건(합격/보류 6 +
# 호출 1)을 확대뷰로 대조·판정하기엔 빠듯해 상단 타이머 압박이 살아난다. pass_score 불변.
time_limit: 45
pass_score: 70

data:
  # 확대 인스펙션 연출(표시 전용 — _SCHEMA.md sort presentation, gm-01 규약): 세공품이
  # 한 점씩 검수대 중앙에 크게 도착해 자동 선택된다 — 설계 메모의 '확대 인스펙션 뷰' 구현.
  # 처리 순서만 강제될 뿐 채점·데이터 계약은 대기열 UI와 동일하다.
  presentation: conveyor

  # 표시 순서 셔플(엔진 sort 의 shuffle 필드) — 세공품 '등장 순서'를 마운트 시 1회 랜덤화한다
  # (디자이너 요구 "랜덤성 부여"). 정상/결함/경계/호출이 매번 다른 순서로 와 예측을 막는다.
  # 셔플은 표시 순서만 바꾸고 판정(bin·forbidden_bin·호출 대상 id)은 불변 — 정답성 불변.
  shuffle: true

  # 검수표(기준표 — kts-01 legend 규약, 표시 전용): 원문 "검수표 기준" 상시 노출.
  # 상태→행선 '규칙'만 알려주며 개별 정답은 각 스프라이트의 도안 카드·세공품을 눈으로
  # 대조해야 한다. '허용오차 내 = 합격' 규칙이 화면에 있어야 경계 함정이 판단 문제가 된다.
  legend:
    - { symptom: 도안 일치, goes_to: 합격 }
    - { symptom: 미세 기움 · 허용오차 내, goes_to: 합격 }
    - { symptom: 보석 크게 기욺, goes_to: 보류 }
    - { symptom: 용접부 끊김, goes_to: 보류 }
    - { symptom: 도안 흐려 대조 불가, goes_to: 실장 호출 }

  # 통 색(표시 전용 bin.color — 엔진 BIN_COLORS 점): 합격 초록 / 보류 빨강.
  # 세공품 스프라이트의 보석색(청록·보라)과 겹치지 않아 색 맞추기 힌트가 되지 않는다.
  bins:
    - { id: 합격, label: 합격 트레이, color: 초록 }
    - { id: 보류, label: 보류함, color: 빨강 }

  # 도트 아트 규약(2026-07-20): 각 sprite 는 '도안 카드(좌, 남색 청사진) + 세공품(우)'
  # 한 장 구성(26×18 캔버스 공통) — 원문 "도안이랑 대조" 를 스프라이트 안에서 수행한다.
  # 같은 품목은 같은 실루엣이고 상태(보석 기움 각도·용접선 끊김·도안 얼룩)만 다르다.
  # 크기 차이 힌트 없음(scale 미사용·전 항목 동일 캔버스). 판독불가 개체만 도안 카드가
  # 얼룩으로 번져 있고 세공품 자체는 정상 — '대조 불가'의 화면 근거(임의 판정 함정 유지).
  # 각 항목 = 확대 인스펙션 뷰의 세공품 1점. bin = 정답 분류.
  # bin: 호출 = 도안 판독 불가 개체 → 합격/보류로 강제하지 않고 escalate로 처리.
  items:
    - { id: 반지_보석기움,   forbidden_bin: 합격, sprite: 반지_보석세팅_기욺,   bin: 보류, note: 보석 세팅이 도안보다 확연히 기욺(확대뷰 과장) }
    - { id: 목걸이_용접끊김, forbidden_bin: 합격, sprite: 목걸이_연결부_용접끊김, bin: 보류, note: 체인 연결 용접선이 끊겨 벌어짐 }
    - { id: 브로치_핀끊김,   forbidden_bin: 합격, sprite: 브로치_고정핀_용접끊김, bin: 보류, note: 뒷면 고정핀 용접부 끊김 }
    - { id: 반지_정상,       sprite: 반지_도안일치,        bin: 합격, note: 보석 정렬·표면 마감 도안과 일치 }
    - { id: 브로치_정상,     sprite: 브로치_도안일치,      bin: 합격, note: 도안과 일치 }
    # ── 경계 사례(함정): 보석이 살짝 기운 듯하나 도안 허용오차 안 → 합격.
    #    보류로 오판하기 쉬운 '헷갈리는 정상'. 다 보류로 몰면 여기서 감점된다.
    - { id: 목걸이_미세기움, sprite: 목걸이_보석_허용오차내, bin: 합격, note: 미세하게 기운 듯하나 도안 허용오차 내 — 정상 }
    # ── 판정 불가(escalate): 원안 도안이 사진상 흐려 대조 불가.
    #    임의로 합격/보류 찍지 말고 실장 호출이 정답.
    # bin 없이 escalate: true — '호출'은 통이 아니라 행동이다(ms-04 패턴, 유령 bin 제거)
    - { id: 목걸이_도안흐림, sprite: 목걸이_도안_판독불가,  escalate: true, note: 도안이 흐려 판정 불가 — 임의 판정 금지 }

  # 최민아 "애매하면 임의로 넘기지 말고 나한테 물어보고" → 직접 판정 대신 호출
  escalate:
    { label: 실장 호출, when: 목걸이_도안흐림 }

# 채점 — 정상/결함/호출을 맞게 처리했는지. 호출도 판정 1건으로 세어 분모는 7이다(ms-04 패턴).
# accuracy = (정확히 처리한 items / 7) * 100 − 감점, 하한 0
# 호출 대상(목걸이_도안흐림) 경로별 판정 — 감점 중첩 금지, 한 사건에는 하나만 적용:
#   실장 호출(escalate) = 정답(1/7 인정)
#   합격/보류로 임의 판정 = 금지행동(forbidden_penalty 40) — 원문 "애매하면 임의로 넘기지
#     말고 나한테 물어보고" + warning "사유 없이 판정만 표시함" (규칙 7: 40 이상)
#   건드리지 않고 타임아웃까지 방치 = missed_escalate_penalty 40 — 호출이 원문 정답 행동
scoring:
  item_count: 7                # 합격/보류 6건 + 실장 호출 1건(호출도 분모 포함 — 방치가 무감점이 되지 않게)
  wrong_bin_penalty: 15        # 일반 오분류 1건당 감점(결함품 통과가 가장 위험) — 표준 채점 키
  escalate_required: [목걸이_도안흐림]   # 이 개체는 분류가 아니라 호출이 정답
  forbidden_penalty: 40        # ① 호출 대상 임의 판정 ② 결함품(forbidden_bin 마커)을 합격 트레이로 — 둘 다 금지행동(규칙 7)
  missed_escalate_penalty: 40  # 호출 대상을 방치(호출도 분류도 안 함)한 경우
