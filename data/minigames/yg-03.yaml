# 4단계 미니게임 — yg-03 웹·앱·소프트웨어 개발
# 근거: 1스텝 "PR 1차 검토" — 김세라: "이준호 대리가 올린 회원가입 화면 연동 PR이야."
#       / task: "동료의 프론트엔드 PR을 체크리스트·API 명세와 대조해 규칙 위반과
#       명세 불일치(잘못된 응답 필드 참조)를 골라내고" / guide: PR 코드 변경분
#       (회원가입 화면·API 연동, 프론트엔드), 회원가입 API 명세.
# 설계 메모: '컴포넌트 블록을 폰 화면 와이어프레임 슬롯에 드래그 조립'하는 place 게임.
#   콘셉트 표의 예시 소재(별점·가격)는 회원가입 화면과 무관해 지어내지 않는다.
#   원문이 명시하는 소재는 '회원가입 화면 연동 PR'과 '회원가입 API 명세'까지이고,
#   로고·이메일/비밀번호 입력·약관동의·가입 버튼 등 세부 구성요소는 회원가입 화면의
#   통상적 분해로 보충한 소재다(원문 외 — 화면 자체는 원문 근거).
#   스펙(디자인 시안·API 명세) 실루엣대로 채우고 빈
#   슬롯을 메운다. 판단은 조각의 모양·자리로만 하게 한다(규칙1: 글자·숫자 판독 금지).
#   함정(extras — 스펙에 없어 넣으면 안 되는 조각):
#     (1) 이벤트_배너: 명세에 없는 가짜 프로모 배너 → 빼야 한다.
#     (2) 잘못된필드_가입버튼: 겉모습은 가입 버튼이지만 API 명세에 없는 '잘못된 응답
#         필드'에 바인딩된 중복 조각(m1의 '잘못된 응답 필드 참조' 트릭). 버튼 슬롯은
#         하나뿐이고 시안 실루엣과 맞는 건 정상 가입 버튼이므로 이 중복은 빼야 한다.
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: yg-03
engine: place
title: 회원가입 화면 UI 빌드
intro: 디자인 시안·API 명세 실루엣대로 컴포넌트 블록을 폰 화면 슬롯에 조립하세요. 스펙에 없는 가짜 조각은 빼고, 빈 슬롯은 채웁니다.
time_limit: 70
pass_score: 70

data:
  # 폰 화면 와이어프레임 슬롯(위→아래). accepts = 이 자리에 맞는 조각 id.
  slots:
    - { id: 상단_로고,   accepts: 로고_이미지,       label: 상단 로고 자리 }
    - { id: 입력_이메일, accepts: 이메일_입력필드,   label: 이메일 입력 필드 }
    - { id: 입력_비번,   accepts: 비밀번호_입력필드, label: 비밀번호 입력 필드 }
    - { id: 약관_동의,   accepts: 약관동의_체크박스, label: 약관 동의 체크박스 }
    - { id: 하단_버튼,   accepts: 가입_버튼,         label: 가입 버튼 }

  # 트레이의 조각들 — 정상 5종 + 가짜 2종(extras). 정상 실루엣과 자리로 구분한다.
  pieces:
    - 로고_이미지
    - 이메일_입력필드
    - 비밀번호_입력필드
    - 약관동의_체크박스
    - 가입_버튼
    - 이벤트_배너          # 가짜 — 명세에 없는 프로모 배너
    - 잘못된필드_가입버튼   # 가짜 — 잘못된 응답 필드에 바인딩된 중복 버튼

  # 가짜 조각을 글자 없이 알아볼 시각 단서(ms-03 패턴, 규칙 1) — 정상 가입 버튼은
  # 시안 실루엣과 모서리 라운드가 일치하고 하단의 API 바인딩 단자 색이 명세 실루엣과
  # 맞물린다. 가짜 버튼은 라운드가 어긋나고 테두리가 경고 점선이며 바인딩 단자 색이
  # 명세 실루엣과 어긋난다('잘못된 응답 필드' 트릭의 시각화 — 텍스트 판독 불요).
  visual_cues:
    가입_버튼: 시안실루엣일치_라운드정합_단자색일치
    잘못된필드_가입버튼: 라운드어긋남_경고점선테두리_단자색불일치
    이벤트_배너: 시안실루엣에_대응자리없음_과장광고틀

  # 넣으면 안 되는 것(_SCHEMA 규칙5: extras 필수 — 다 채워 만점 방지)
  extras:
    - 이벤트_배너
    - 잘못된필드_가입버튼

# 채점 — 5개 슬롯을 맞는 조각으로 채웠는지에서 가짜 조각 배치를 뺀다.
# accuracy = (맞게 채운 슬롯 / 5) * 100 − (가짜 조각을 슬롯에 넣은 수 * 12), 하한 0
scoring:
  slot_count: 5
  extra_penalty: 12
