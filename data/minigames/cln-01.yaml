# 4단계 미니게임 — cln-01 청소·객실관리
# 근거: 2스텝 "객실 정비 상태 점검" — 박미란: "제가 방금 805호 객실 정비를 마쳤는데
#       깜빡하고 체크리스트 검수를 못 했어요. 혹시 누락되거나 잘못 정비된 부분이
#       있는지 한 번만 꼼꼼하게 점검해 줄래요?"
#       guide: "805호 객실 정비 체크리스트: 베드 메이킹(시트 팽팽함 유지), 욕실 비품
#       (타월 대/중/소 각 2개, 컵 2개), 미니바(생수 2병), 메모지와 펜 배치 여부."
#       보기 b "침대 시트의 구김을 곧게 펴서 정리하고 이물질이 묻어있지 않은지 재차 점검"
#       정답 a "이전 투숙객이 사용한 메모지를 수거하고 새 메모지로 교체해 둔다"
#       warning: "이전 투숙객의 흔적을 방치하면 고객 불만의 직접적인 원인이 됩니다."
#       금지행동: "고객 개인정보나 소지품을 임의로 만지거나 폐기하는 행동 금지"
#       1스텝 answer_guide ③ "객실 어메니티를 세제류와 구분하여 적재한다"
#       4스텝 criteria "객실 점검 중 발견된 특이사항(예: 805호 컵 미세 균열 등)이
#       누락 없이 기재되었는가?" + 금지행동 "특이사항 묵인 금지" → 균열 컵·투숙객
#       소지품은 배치가 아니라 보고 대상이고, 보고 생략(묵인)도 감점이다(검증 지적 반영).
#       돌발: "객실 내 시트 오염으로 급박한 교체를 요청" → 안 지워지는 얼룩은 시트 교체
# 수량(타월 각 2개·컵 2개·생수 2병)은 숫자로 띄우지 않고 슬롯 실루엣 개수로만 보인다
# (_SCHEMA.md 규칙 1 — 숫자 판독 금지).
scenario_id: cln-01
engine: place
title: 805호 정비 상태 검수·보완
intro: 정비가 끝난 805호를 체크리스트와 대조하세요. 승인된 비품 누락과 가벼운 얼룩만 바로 보완하고, 고객 소지품처럼 임의로 만지면 안 되는 항목과 직접 처리할 수 없는 특이사항은 보고하세요.
# 난이도 하향(피드백 "걍 어려움"): 조각마다 상태·외형 시각 단서를 붙여 변별을 쉽게 하고
# (아래 visual_cues), 동작 수가 많은 게임이라 제한시간을 90→110초로 늘렸다. 채점 계약
# (slot_count 12·stain_count 2·감점 키/값·forbidden·escalate)은 그대로 두고 난이도만 낮춘다.
time_limit: 110
pass_score: 70

data:
  scene: 객실_805호_침실_욕실

  # 1) 얼룩 문지르기 — 배치 전에 먼저 지워야 하는 자리 (_SCHEMA.md place stains 확장)
  # 시트_음료얼룩은 문질러도 안 지워진다 → 카트의 '새_시트'를 그 자리에 깔아야 한다
  # (돌발 근거). 어느 얼룩이 교체 대상인지는 라벨이 아니라 '문지르기 피드백'과
  # 스프라이트로만 발견하게 한다 — 정답 유출 라벨 삭제(규칙 8, 검증 지적 반영).
  stains:
    - id: 시트_음료얼룩
      sprite: 침대시트_갈색얼룩
      at: [268, 214]
      resolve: 교체
    - id: 시트_이물질
      sprite: 침대시트_이물질
      at: [206, 236]
      resolve: 문지르기

  # 얼룩 2종의 시각 변별 단서 — 증상·상태만 보여준다(교체 여부는 문질러 봐야 안다).
  # 조각 단서(난이도 하향, 검증 지적/피드백 반영) — ms-03·hr-01·yg-03 과 같은 규약:
  # 상태·외형만 보여주고 처리(비치/보고/교체)는 체크리스트로 판단하게 한다(규칙 1·시각 단서
  # 규약). 정답을 직접 지시하지 않으며, 헷갈리던 짝(정상/파손 컵, 새/낙서 메모지)을 눈으로
  # 가려낼 수 있게만 한다.
  visual_cues:
    시트_음료얼룩: 넓게_배어든_갈색얼룩
    시트_이물질: 표면에_얹힌_부스러기
    컵_정상: 테두리_매끈
    컵_미세균열: 테두리_실금
    새_메모지: 깨끗한_새_메모지
    낙서된_메모지: 펜자국_남은_메모지
    세제통: 화학세제_통
    투숙객_소지품: 고객_개인_소지품
    새_시트: 교체용_새_시트

  # 2) 실루엣 자리에 조각 넣기 — 805호 체크리스트 그대로
  # 베드 메이킹(새_시트)은 슬롯이 아니라 시트_음료얼룩 stain의 '시트교체' 행동으로만
  # 채점한다 — 교체용 새 부품은 슬롯 채우기와 별개 채점 단위로 세지 않는다
  # (_SCHEMA.md place stains 확장, 이중 계산 금지 — 검증 지적 반영으로 침대_시트 슬롯 제거).
  slots:
    # 욕실 비품 — 타월 대/중/소 각 2개
    - { id: 욕실_타월대_1,  accepts: 타월_대,   at: [640, 120], label: 욕실 선반 · 큰 타월 }
    - { id: 욕실_타월대_2,  accepts: 타월_대,   at: [700, 120], label: 욕실 선반 · 큰 타월 }
    - { id: 욕실_타월중_1,  accepts: 타월_중,   at: [640, 180], label: 욕실 선반 · 중간 타월 }
    - { id: 욕실_타월중_2,  accepts: 타월_중,   at: [700, 180], label: 욕실 선반 · 중간 타월 }
    - { id: 욕실_타월소_1,  accepts: 타월_소,   at: [640, 240], label: 욕실 선반 · 작은 타월 }
    - { id: 욕실_타월소_2,  accepts: 타월_소,   at: [700, 240], label: 욕실 선반 · 작은 타월 }
    # 욕실 비품 — 컵 2개
    - { id: 욕실_컵_1,      accepts: 컵_정상,   at: [800, 150], label: 세면대 · 컵 }
    - { id: 욕실_컵_2,      accepts: 컵_정상,   at: [852, 150], label: 세면대 · 컵 }
    # 미니바 — 생수 2병
    - { id: 미니바_생수_1,  accepts: 생수,      at: [800, 330], label: 미니바 · 생수 }
    - { id: 미니바_생수_2,  accepts: 생수,      at: [852, 330], label: 미니바 · 생수 }
    # 메모지와 펜 배치
    - { id: 데스크_메모지,  accepts: 새_메모지, at: [420, 350], label: 데스크 · 새 메모지 }
    - { id: 데스크_펜,      accepts: 펜,        at: [470, 350], label: 데스크 · 펜 }

  # 같은 id가 두 번 있으면 조각이 2개라는 뜻(실루엣 자리 수와 짝이 맞는다).
  # 새_시트는 슬롯용이 아니라 시트_음료얼룩 교체용이다(위 stains 주석 참조).
  pieces:
    - 새_시트
    - 타월_대
    - 타월_대
    - 타월_중
    - 타월_중
    - 타월_소
    - 타월_소
    - 컵_정상
    - 컵_정상
    - 생수
    - 생수
    - 새_메모지
    - 펜
    - 낙서된_메모지
    - 컵_미세균열
    - 세제통
    - 투숙객_소지품

  # 함정 — 카트에 섞여 있지만 객실 자리에 놓으면 안 되는 것 (배치 시 extra_penalty)
  extras:
    - { id: 낙서된_메모지,   reason: 이전 투숙객의 흔적 — 새 메모지로 완전히 교체해야 한다 }
    - { id: 세제통,          reason: 청소용 화학 세제는 객실 어메니티와 구분해 카트에 둔다 }

  # 금지행동 — 배치 자체가 원문 금지·보고 대상 (배치 시 forbidden_penalty 40)
  forbidden:
    - { id: 컵_미세균열,     reason: 파손품 비치 = 특이사항 묵인 — 비치가 아니라 보고 대상 }
    - { id: 투숙객_소지품,   reason: 고객 소지품 임의 취급 금지(원문 금지행동) — 보고 대상 }

  # 직접 처리 대신 보고가 정답인 것 (_SCHEMA.md 규칙 2)
  escalate:
    label: 특이사항 보고
    when: [컵_미세균열, 투숙객_소지품]

# 채점 — 채운 자리 + 지운 얼룩에서 잘못 놓은 것을 뺀다
# accuracy = ((맞게 채운 slot + 처리한 stain) / (12 + 2)) * 100
#            − (extras 배치 * 15) − (forbidden 배치 * 40)
#            − (보고 대상 방치 * 40) − (엉뚱한 자리 * 5), 하한 0
# ─ 컵_미세균열·투숙객_소지품 배치 = 원문 금지행동 → 40 (합격선 70 관통, 규칙 7)
# ─ 위 2종을 배치도 보고도 안 하고 방치 = 특이사항 묵인 → 40
#   (근거: m4 criteria "특이사항 … 누락 없이 기재" + 금지행동 "특이사항 묵인 금지"
#    — 보고가 원문 정답 행동이라 40, _SCHEMA.md 표준 키)
# 감점 중첩 금지: 한 조각(사건)에는 가장 무거운 감점 하나만 적용한다.
#   예) 컵_미세균열을 자리에 놓았으면 forbidden 40 하나만(방치 40 중복 부과 금지).
scoring:
  slot_count: 12
  stain_count: 2
  extra_penalty: 15            # 낙서된_메모지·세제통 배치
  forbidden_penalty: 40        # 컵_미세균열·투숙객_소지품 배치(원문 금지행동)
  missed_escalate_penalty: 40  # 보고 대상 2종 방치(특이사항 묵인) — 사건당
  escalate_mode: 대체          # 보고가 배치를 대체 — 두 조각은 어느 자리에도 놓지 않는다
  wrong_slot_penalty: 5
