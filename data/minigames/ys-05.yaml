# 4단계 미니게임 — ys-05 건설·시설안전
# 근거: 1스텝 "현장 안전 순회점검" — 박유진: "3층 슬래브 개구부하고 외부비계 쪽
#       오전 순회 다녀와서 체크리스트에 이상 있으면 사진 찍어 표시해 와라."
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: ys-05
engine: spot
title: 현장 안전 순회점검
intro: 3층 슬래브와 외부비계를 돌며 위험요소를 찾아 X로 표시하세요. 정상인 곳을 표시하면 감점입니다.
time_limit: 60
pass_score: 70

data:
  scene: 건설현장_3층슬래브_외부비계
  mark: x                      # X자 표시 + 표시할 때마다 셔터 이펙트("사진 찍어 표시")

  # 찾아야 할 위험요소 — 전부 원문에 등장하는 항목만 사용
  targets:
    - id: 개구부_덮개없음
      sprite: 슬래브_개구부_뚫림
      at: [286, 214]
      label: 덮개 없는 개구부
    - id: 개구부_덮개파손
      sprite: 슬래브_개구부_덮개깨짐
      at: [604, 236]
      # 4층 무전 건(m3)과 섞지 않는다 — 이 게임은 m1 오전 순회(3층·비계) 장면이다
      label: 개구부 덮개 파손
    - id: 난간_미설치
      sprite: 비계_난간없음
      at: [832, 178]
      label: 비계 단부 난간 미설치
    - id: 안전대_미착용
      sprite: 작업자_안전대없음
      at: [418, 330]
      label: 고소작업 중 안전대 미착용
    - id: 안전모_미착용
      sprite: 작업자_맨머리
      at: [712, 372]
      label: 안전모 미착용
    # 화기작업은 원문에서 m4의 '야간 예정 작업'(인계장 기재 대상)일 뿐 오전 순회에
    # 등장하지 않는다 — m1 체크리스트 실재 항목인 가설전기 위험으로 교체(검증 지적 반영)
    - id: 가설전선_피복손상
      sprite: 가설전선_피복벗겨짐_물웅덩이
      at: [166, 288]
      label: 가설전선 피복 손상 — 물웅덩이 위 배선

  # 정상인데 눌리기 쉬운 것 — 누르면 mistakes +1 (찍기 방지)
  decoys:
    - { id: 개구부_정상, sprite: 슬래브_개구부_덮개정상, at: [520, 196] }
    - { id: 난간_정상,   sprite: 비계_난간설치,         at: [900, 250] }
    - { id: 안전모_착용, sprite: 작업자_안전모착용,     at: [244, 356] }
    - { id: 소화기_비치, sprite: 소화기_정위치,         at: [120, 402] }

# 채점 — 6개 중 몇 개를 찾았나에서 오탐을 뺀다
# accuracy = (찾은 targets / 6) * 100 − (누른 decoys * 10), 하한 0
scoring:
  target_count: 6
  decoy_penalty: 10
