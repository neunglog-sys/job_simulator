# 4단계 미니게임 — gm-01 구매·자재 관리
# 근거: 2스텝 "입고 자재 불량 대응" — 박창민: "지금 대성패키징에서 트럭이 들어왔는데,
#       송장 수량이랑 실제 하역된 수량이 안 맞아요. 게다가 박스 모퉁이가 젖어서
#       찌그러진 것들이 꽤 보이는데 이거 어떡합니까?"
#       answer_guide ③ "정상 제품과 불량 제품을 즉시 격리하고 식별표를 부착한다"
#       ④ "실제 합격한 수량만 전산 시스템에 등록한다"
#       금지행동: "불량 자재를 정상 자재와 혼용 보관 금지"
#       warning: "불량 자재를 정상 자재로 전산 처리하면 추후 생산 과정에서 불량이
#       발생하고 재고 불일치의 원인이 됩니다."
#       불량 유형(수침 손상=젖어서 찌그러짐)은 1스텝 발주서·송장 대조(보기 a),
#       4스텝 "운송 중 우천으로 인한 수침"에 근거.
# 박스 겉모습(젖음·찌그러짐·정상)으로만 판정하고 수량/글자는 읽히지 않는다
# (_SCHEMA.md 규칙 1 — 숫자 판독 금지). 발주서 대조는 '색·모양이 발주서 실루엣과
# 다른 박스'를 격리하는 방식으로 표현한다.
scenario_id: gm-01
engine: sort
title: 대성패키징 입고 검수
intro: 컨베이어로 내려오는 박스를 발주서 실루엣과 대조하세요. 파손·수침·수량 이상 박스는 격리존으로, 정상 박스만 합격 팔레트로 보냅니다. 손상 박스는 격리 전에 사진 촬영으로 증빙을 남기세요.
time_limit: 75
pass_score: 70

data:
  # 컨베이어 연출 — 박스가 한 번에 하나씩 벨트 중앙에 도착해 자동 선택되고,
  # 통/사진 버튼으로 처리해야 다음 박스가 들어온다. 처리 순서만 강제될 뿐
  # 채점·데이터 계약은 대기열 UI와 동일하다(엔진 sort 의 presentation 필드).
  presentation: conveyor

  bins:
    - { id: 합격_팔레트, label: 합격 · 입고 등록, sprite: 팔레트_초록 }
    - { id: 격리존,      label: 격리 · 보류 식별표, sprite: 팔레트_빨강_보류 }

  # 발주서 실루엣 패널 — 정상 규격 박스 자리는 4칸뿐. 수량은 숫자가 아니라 실루엣
  # 개수로만 보인다(규칙 1). 정상 외형 박스는 5개가 내려오므로 대조하면 1개가
  # 서류(발주 수량) 초과 — 격리가 정답. 합격_팔레트에 넣을 때마다 실루엣 위에
  # 체크가 쌓여 "4칸이 다 찼는데 5번째 정상 박스가 옴"이 화면에서 보인다.
  order_sheet:
    label: 발주서
    bin: 합격_팔레트          # 이 통에 넣은 수량이 실루엣 체크로 쌓인다
    slots:
      - { sprite: 포장박스_정상, count: 4 }

  # 다섯 박스는 겉모습이 같아 어느 4개를 합격으로 보내든 무방하다
  # (동일 외형을 특정 정답에 고정 금지 — _SCHEMA.md 시각 단서 규약).
  equivalent: [박스_정상_1, 박스_정상_2, 박스_정상_3, 박스_정상_4, 박스_수량초과]

  # 컨베이어로 내려오는 박스들 — 겉모습 + 발주서 실루엣 대조로 구분
  items:
    # 정상 — 발주서 실루엣과 색·규격 일치
    - { id: 박스_정상_1, sprite: 포장박스_정상, bin: 합격_팔레트 }
    - { id: 박스_정상_2, sprite: 포장박스_정상, bin: 합격_팔레트 }
    - { id: 박스_정상_3, sprite: 포장박스_정상, bin: 합격_팔레트 }
    - { id: 박스_정상_4, sprite: 포장박스_정상, bin: 합격_팔레트 }
    # 수량 초과(겉이 멀쩡한 함정) — 외형은 정상과 동일하지만 발주서 실루엣 4칸을
    # 넘는 5번째 박스. 서류 대조 없이 겉만 보면 합격으로 보내기 쉽다(원문 "송장
    # 수량이랑 실제 하역된 수량이 안 맞아요").
    - { id: 박스_수량초과, forbidden_bin: 합격_팔레트, sprite: 포장박스_정상, bin: 격리존 }
    # 수침 손상 — 모퉁이가 젖어 색이 짙음
    - { id: 박스_수침_1, forbidden_bin: 합격_팔레트, sprite: 포장박스_모퉁이젖음, bin: 격리존 }
    - { id: 박스_수침_2, forbidden_bin: 합격_팔레트, sprite: 포장박스_모퉁이젖음, bin: 격리존 }
    # 파손 — 찌그러진 모양
    - { id: 박스_찌그러짐_1, forbidden_bin: 합격_팔레트, sprite: 포장박스_찌그러짐, bin: 격리존 }
    - { id: 박스_찌그러짐_2, forbidden_bin: 합격_팔레트, sprite: 포장박스_찌그러짐, bin: 격리존 }
    # 규격 이상(오배송) — 발주서에 없는 다른 규격/색의 박스. scale 1.3 으로
    # 정상 박스보다 크게 그려 규격 차이가 눈으로 보인다(엔진 item.scale — 기본 1).
    - { id: 박스_규격이상, forbidden_bin: 합격_팔레트, sprite: 포장박스_다른규격, bin: 격리존, scale: 1.3 }

  # 함정 — 겉이 멀쩡해 합격으로 보내기 쉽지만 격리가 정답인 것은 박스_수량초과
  # 1개다(발주서 실루엣 대조로만 잡힌다). 수침·찌그러짐·규격이상은 겉모습으로
  # 드러나는 격리 대상(이전 주석의 '수침=마른 척' 주장은 데이터와 불일치라 정정 —
  # 검증 지적 반영).

  # 직접 처리(정상 등록·폐기) 대신 증빙·격리가 정답인 금지행동 (_SCHEMA.md 규칙 2)
  # when은 실재하는 item id 목록이어야 엔진이 바인딩할 수 있다(유령 참조 금지)
  escalate:
    label: 사진 촬영 후 보류
    when: [박스_수침_1, 박스_수침_2, 박스_찌그러짐_1, 박스_찌그러짐_2]
    note: 손상 박스는 임의 폐기·정상 등록 없이 사진 증빙 후 식별표 부착·격리(원문 answer_guide ②③)

# 채점 — 각 박스를 맞는 통에 넣었는가. 표준 채점 키로 정규화(검증 지적 반영 —
# misclassify_penalty/false_pass_penalty 는 _SCHEMA.md 미등록 키라 제거).
# accuracy = (맞게 분류한 items / 10) * 100 − 감점, 하한 0
# ─ 불량(수침·찌그러짐)·규격이상·수량초과 박스를 합격 팔레트로 = 전산 정상 등록.
#   원문 금지행동("불량 자재를 정상 자재로 전산 처리", "실제 합격한 수량만 등록")
#   → forbidden_penalty 40 (합격선 70 관통, 규칙 7)
# ─ 정상 박스를 격리존으로 = 단순 오분류(재검수 비용) → wrong_bin_penalty 12
# ─ 사진 증빙(escalate)은 손상 박스 격리와 병행하는 1회 절차. 손상 박스가 있는데
#   게임 중 한 번도 안 누르면 missed_escalate_penalty 20 (원문 answer_guide ②
#   '사진 촬영 증빙'은 보조 절차라 15~25 구간 — 1회만 부과)
# 감점 중첩 금지: 한 박스(사건)에는 가장 무거운 감점 하나만 적용한다.
scoring:
  item_count: 10
  wrong_bin_penalty: 12
  forbidden_penalty: 40
  escalate_mode: 병행필수      # 사진 촬영 후 보류는 격리 드래그를 대체하지 않는다(병행)
  missed_escalate_penalty: 20  # 사진 증빙 절차 생략 시 1회만 부과
