# 4단계 미니게임 — ys-02 군사·국가안보 작전
# 근거: 돌발퀘스트 — 홍채원: "02시 방향 철책 쪽에서 미상 인원 하나 접근 중이다. 배운 대로
#       수하 절차 밟고, 절대 단독으로 판단하지 마라."
#       모범답안 ①"엄폐 유지하며 '정지' 3회 명령" ②"'손들어' 후 이동 정지 확인"
#                ③"문어 제시 후 답어 확인" ④"답어 불일치·불응 시 현 위치 고수하며
#                상황실에 무전보고(위치·인원·행동)" ⑤"분대장 지시 수신 시까지 관측 지속"
#       흔한 실수: "암구호 확인 전에 접근 허용, 단독 추격이나 초소 이탈 선택(금지행동),
#                 보고 없이 자체 종결"
#       1스텝 제공 자료 "금일 암구호(문어·답어)" ← 문어/답어 용어 근거
#
# 안전 절차라 순서를 틀리면 즉시 실패다(_SCHEMA.md 6번). 화면엔 철책 너머 실루엣이
# 단계마다 한 칸씩 가까워지고, 절차 버튼은 아이콘으로만 표시된다(규칙 1 — 글자 판독 금지).
scenario_id: ys-02
engine: sequence
title: 야간 초소 수하 절차
intro: 철책 너머로 미상 인원이 접근합니다. 엄폐한 채로 수하 절차를 배운 순서대로 밟으세요. 순서를 틀리면 절차가 무너집니다.
time_limit: 45
pass_score: 70

data:
  # 이 순서가 정답 — 원문 모범답안 ①~⑤ 그대로
  steps:
    - id: 엄폐_정지명령
      sprite: 초소_엄폐_정지수신호
      label: 엄폐 유지하며 "정지" 3회 명령
    - id: 손들어_명령
      sprite: 손들어_수신호
      label: "\"손들어\" 후 이동 정지 확인"
    - id: 문어_제시
      sprite: 암구호_문어패
      label: 문어 제시
    - id: 답어_확인
      sprite: 암구호_답어대조
      label: 답어 확인 — 이번 인원은 답어 불일치
    - id: 무전보고_상황실
      sprite: 무전기_보고    # 기존 도트 자산 재사용(무전 보고 — 의미 동일, 중복 제작 방지)
      label: 현 위치 고수하며 상황실에 무전보고 (위치·인원·행동)
    - id: 관측_지속
      sprite: 야간투시경_관측
      label: 분대장 지시 수신 시까지 관측 지속

  # 눌러선 안 되는 것 — 전부 원문 흔한 실수·금지행동에서 가져왔다.
  # 하나라도 누르면 절차 위반으로 즉시 종료된다.
  forbidden:
    - id: 접근_허용
      sprite: 차단봉_개방
      reason: 암구호 확인 전 접근 허용은 금지
    - id: 단독_추격
      sprite: 초소밖_추격
      reason: 단독 추격은 금지행동
    - id: 초소_이탈
      sprite: 초소_비움
      reason: 초소 이탈은 금지행동 — 경계공백이 생긴다
    - id: 자체_종결
      sprite: 상황일지_종결도장
      reason: 보고 없이 자체 종결은 금지 — 단독 판단 불가

# 채점 — 6단계를 순서대로 다 밟으면 만점. 순서 오류·금지행동은 즉시 실패 처리.
scoring:
  step_count: 6
  wrong_order: fail        # 안전 절차 — 틀린 순서를 누르는 순간 종료(_SCHEMA.md 6번)
  forbidden: fail          # 금지행동 버튼도 즉시 종료
  partial_credit: true     # 실패해도 그때까지 밟은 단계 수만큼은 accuracy에 반영
