# 4단계 미니게임 — kts-01 의료·복지·상담 응대
# 근거: 3스텝 "대기 환자 진료 순서 정리" — 정하윤: "지금 접수 밀렸는데 응급처럼 보이는
#       분도 있어. 순서 정리해서 나한테 보고해 줘." / 제공 자료 "대기 현황판(6명·사유별),
#       응급 징후 기준표, 우선순위 원칙(응급>예약>접수순)"
#       모범답안 ② "흉통을 호소하는 응급 의심 환자를 최우선으로 배정하고 간호사를 호출한다"
#       흔한 실수 "목소리 큰 항의자 먼저 처리, 응급 징후를 접수순에 묻어버림"
#       → 이 한 줄이 그대로 이 게임의 두 함정(조용한 응급 / 위중해 보이는 비응급)이 됐다.
# 돌발 근거: "임현서가 접수대 앞을 막고 서서 고성을 지른다 ... 대기 환자들이 술렁이고
#       접수 줄이 멈췄다." 모범답안 ① 별도 상담 공간으로 유도해 다른 환자와 분리
#       ② 경청·공감하며 접수 기록으로 사실 확인 ④ 권한 밖 감면 요구는 원무팀장 인계
#       ⑤ "분리 유도에 불응하고 업무방해가 계속되면 보안요원 호출"
#       원문 오답 보기 d "곧바로 보안요원을 불러 밖으로 내보낸다"
#       → 보안요원 버튼은 단계를 밟기 전에 누르면 금지행동(원문 오답 d), 밟은 뒤에만 정답이다.
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: kts-01
engine: sort
title: 대기 환자 트리아지
intro: 대기 환자를 위험도에 맞는 진료실로 보내세요. 증상·소지품 아이콘을 기준표와 대조해 판단합니다. 소리가 큰 쪽이 급한 쪽은 아닙니다.
time_limit: 75
pass_score: 70

data:
  # 진료실 = 통. 통의 색·아이콘은 통의 정체성 표시일 뿐이고, 아이템 쪽에는 통과 대응하는
  # 색·아이콘을 주지 않는다(색 맞추기 금지 — _SCHEMA.md 아이템 시각 단서 규약).
  bins:
    - { id: 응급처치실, label: 응급 처치, color: red,    icon: 심전도 }
    - { id: 예약진료실, label: 예약 진료, color: yellow, icon: 달력 }
    - { id: 접수대기석, label: 당일 접수, color: green,  icon: 번호표 }
    - { id: 별도상담실, label: 별도 상담, color: gray,   icon: 닫힌문 }

  # 기준표(범례) — 원문 제공 자료 "응급 징후 기준표·우선순위 원칙"이 이것이다.
  # 아이템에는 증상·상태 단서만 있고, 어느 진료실인지는 이 기준표를 보고 판단한다.
  legend:
    - { symptom: 가슴통증, goes_to: 응급처치실 }   # 응급 징후 기준표 해당 증상
    - { symptom: 진료카드, goes_to: 예약진료실 }   # 예약 방문 증빙
    - { symptom: 문진표,   goes_to: 접수대기석 }   # 당일 접수(예약 없음)
  # 부축·지팡이는 기준표(응급 징후)에 없다 — 겉보기 위중함이 아니라 소지 증빙을 따라야 한다.

  # 대기 6명 — 원문 "대기 현황판(6명·사유별)". 증상·상태 아이콘으로만 판단하게 한다.
  # 라벨에는 판정·근거를 쓰지 않는다(_SCHEMA.md 규칙 8) — 근거는 이 주석에만 남긴다.
  items:
    # 함정 A(과소분류) — 조용히 앉아 있어 접수순에 묻히기 쉬운 진짜 응급.
    # 흉통·식은땀은 스프라이트와 가슴통증 아이콘으로만 보인다 → 기준표 대조 시 응급처치실.
    - id: 환자_흉통
      sprite: 환자_가슴움켜쥠_식은땀
      icon: 가슴통증
      bin: 응급처치실
      priority: 1
      label: 조용히 앉아 있는 환자
    # 함정 B(과대분류) — 부축받아 들어와 위중해 보이지만 응급 징후 기준표에 해당 없음.
    # 진료카드(예약 증빙) 아이콘을 따라 예약진료실이 정답 — 겉보기에 속으면 over_triage.
    - id: 환자_부축_보행보조
      sprite: 환자_부축_지팡이
      icon: 진료카드
      bin: 예약진료실
      priority: 2
      label: 부축받아 들어온 환자
    - id: 환자_재진_1
      sprite: 환자_진료카드_보유
      icon: 진료카드
      bin: 예약진료실
      priority: 2
      label: 진료카드를 든 환자
    - id: 환자_재진_2
      sprite: 환자_진료카드_보유
      icon: 진료카드
      bin: 예약진료실
      priority: 2
      label: 진료카드를 든 환자
    # 초진(당일 접수) 2명 — 원문 m3 "대기 6명·사유별"은 구성이 미열거라 당일 접수로 설정.
    # (1스텝의 "초진 2·재진 3"은 예약자 명단 소속이라 별개 — 출처로 쓰지 않는다.)
    - id: 환자_초진_1
      sprite: 환자_문진표_작성중
      icon: 문진표
      bin: 접수대기석
      priority: 3
      label: 문진표 작성 중인 환자
    - id: 환자_초진_2
      sprite: 환자_문진표_공란
      icon: 문진표
      bin: 접수대기석
      priority: 3
      label: 문진표를 받아 든 환자

  # 돌발 — 접수대를 막고 고성. 뜨는 순간 대기줄이 멈춘다(줄이 얼어붙는 연출).
  # 다른 환자를 계속 분류하려면 먼저 이 사람을 처리해야 한다.
  sudden:
    id: 환자_임현서_항의
    sprite: 환자_접수대막음_고성
    # 게임 시작 후 5초(벽시계 경과) 시점 발동 — 초반에 돌발을 마주하게 한다(요구 반영).
    # appears_after_seconds 는 엔진이 '초'로 확정 해석한다(appears_at 의 크기 휴리스틱과 달리
    # 아이템 수 이하인 5도 처리 수가 아니라 초로 발동).
    appears_after_seconds: 5
    label: 비급여 고지 누락 항의 — 접수대를 막고 고성
    freeze_queue: true
    must_resolve_sudden: true   # 5초 전에 6명 분류를 끝내도 임현서 처리 전에는 게임 종료 불가
    bin: 별도상담실        # 정답 1순위 — 다른 환자와 분리(사생활 보호 + 대기열 회복)
    # 여기에 넣으면 금지행동(forbidden_penalty 40). 목소리가 크다고 응급이 아니고,
    # 세워둔 채 응대해도 안 된다.
    forbidden_bins:
      - { bin: 응급처치실, reason: 고성은 응급 징후가 아니다 — 응급 자원 낭비 }
      - { bin: 접수대기석, reason: 접수대에 세워둔 채 다른 환자 앞에서 수납내역 노출 }
      - { bin: 예약진료실, reason: 진료가 아니라 민원 — 진료 대기열을 다시 막는다 }
    # 별도상담실에 배정해야 stages 가 열리고, 이 순서대로 밟아야 escalate 버튼이 열린다.
    stages:
      - { id: 사실확인, sprite: 접수기록_대조,  label: 경청·공감하며 접수 기록으로 고지 여부 확인 }
      - { id: 방안안내, sprite: 사과_처리안내,  label: 누락이 확인되면 사과·처리 방안 안내 }
      - { id: 팀장인계, sprite: 원무팀장_호출,  label: 권한 밖 감면 요구는 원무팀장 인계 }
    # 팀장 인계 뒤에도 불응·업무방해가 계속된다 — 이때만 보안요원이 정답이 된다.
    persists_after_stages: true

  # 금지행동 대응 버튼 — '직접 처리 대신 호출'(_SCHEMA.md 규칙 2).
  # requires 에는 단계 id만 쓴다(규칙 6 — 별도상담실 배정은 stages 진입 전제조건이라 중복 명시 불필요).
  # 단계를 다 밟기 전에 누르면 원문 오답 보기 d 와 같은 금지행동(early_escalate_penalty 40).
  escalate:
    label: 보안요원 호출
    when: 업무방해_지속
    requires: [사실확인, 방안안내, 팀장인계]

# 채점 — 6명을 맞는 진료실에 넣었나 + 돌발을 매뉴얼 순서대로 처리했나
# accuracy = (맞게 분류한 items / 6) * 100 − 감점, 하한 0
# 감점 중첩 금지(_SCHEMA.md 표준 채점 키) — 한 사건에는 가장 무거운 감점 하나만 적용한다.
#   예) 흉통 환자를 예약진료실에 → missed_emergency 25 만(wrong_bin 12 미중첩)
#       임현서를 접수대기석에 → forbidden 40 만
#       인계 없이 종료 → missed_escalate 40 이 단계 생략분(stage_skip)을 흡수한다.
scoring:
  item_count: 6
  wrong_bin_penalty: 12
  missed_emergency_penalty: 25   # 흉통 환자를 응급처치실 밖으로 보냈을 때
  over_triage_penalty: 15        # 응급이 아닌 사람을 응급처치실에 넣었을 때
  forbidden_penalty: 40          # 임현서를 forbidden_bins 에 배정 — 금지행동(규칙 7, 합격선 관통)
  early_escalate_penalty: 40     # 단계 없이 보안요원부터 — 원문 오답 d 와 동일한 금지행동
  missed_escalate_penalty: 40    # 업무방해 지속인데 보안요원 호출 없이 종료 — 호출이 원문 정답 ⑤
  stage_skip_penalty: 15         # 사실확인·방안안내·팀장인계 생략·순서 위반 — 건당(미호출 40 적용 시 미중첩)
  ignore_sudden_penalty: 40      # 임현서를 어느 통에도 넣지 않고 방치한 채 종료
