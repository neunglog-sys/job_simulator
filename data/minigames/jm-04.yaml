# 4단계 미니게임 — jm-04 해상 운항(3항사)
# 근거: m2 자료·정보 누락 mission "누락·불일치 3건(침선 인접 항로, 등부표 구위치 기재,
#       공사구역 미반영)" / m2 answer_guide "신설 침선(가라앉은 배) 위치가 계획 항로 및
#       여유수심에 걸리는지 확인" / m2 warning "침선 위 항로를 그대로 통과시킴".
#       ETA 충돌은 m3 "'정시 도착(ETA)'과 '제한시계 안전조치'가 충돌" — 안전이 정시보다 우선.
# 형식 정의는 _SCHEMA.md 참조. 초안(직선) 항로가 침선 위를 지나가는 원문 트릭을 보존한다(규칙 4).
scenario_id: jm-04
engine: route
title: 항로 회피 재설정
# 게임의 결과물은 '항로 수정안'이다 — 원문 m2의 정답은 임의 변경이 아니라 불일치를
# 확인해 수정안을 만들어 보고하는 것. 완성한 선은 곧바로 적용되는 게 아니라
# 항해사·선장 보고용 수정안으로 제출된다(검증 지적 반영).
intro: 초안 항로가 침선 위를 지나갑니다. 위험구역을 피해 변침점을 이어 항로 수정안을 그리고, 완성되면 보고로 제출하세요.
time_limit: 90
pass_score: 70

data:
  start: 출항_변침점
  # 재설정 항로가 지나야 할 변침점 — 위험구역을 우회해 이어야 한다
  waypoints:
    - 우회_변침점_A       # 신설 침선 남측으로 우회
    - 우회_변침점_B       # 준설공사구역 밖으로 우회
    - 도착_정박지

  # 유혹용 가짜 변침점 — 초안 직선 항로 위의 점. 이어 보면 침선 구역을 관통한다.
  # '주어진 점 순서대로 잇기'만으로 만점이 나오지 않게 하는 변별 장치(검증 지적 반영).
  decoy_waypoints:
    - { id: 초안_직선_변침점, note: 잇기 쉬워 보이지만 신설_침선 구역을 관통 }

  # 완성한 경로의 제출 형태 — 보고. 원문 answer_guide(확인→수정 건의→보고)와 맞춘다.
  submit_as: 항로_수정안_보고

  # 회피구역 — 지나면 실수. 초안 직선 항로 위에 놓여 재설정을 강제한다(원문 3건)
  avoid:
    # 침선 관통은 원문 warning("침선 위 항로를 그대로 통과")의 금지행동 — 밟고도
    # 합격(70)하면 안 되므로 40 (100−40=60 불합격, jm-01 보호구역과 같은 원칙)
    - { zone: 신설_침선, penalty: 40 }            # m2: 계획 항로·여유수심에 걸리는 침선
    - { zone: 준설공사구역, penalty: 25 }          # m2: 공사구역 미반영 — 통과 금지
    # 위험 사유는 원문 그대로 '소개정(해도 수정) 누락으로 위치를 신뢰할 수 없는 구간'.
    # '천수(얕은 물)'는 원문에 없는 추가 설정이라 쓰지 않는다(검증 지적 반영).
    - { zone: 등부표_구위치_주의구역, penalty: 20 } # m2: 등부표 위치 변경 미반영 — 소개정 누락

  # 정시 도착(ETA) 제약 — 초과 감점을 명시적으로 avoid 최소값(20)보다 작게 고정한다.
  # 엔진이 시간 감점을 임의로 키우면 '위험구역 관통이 이득'으로 역전될 수 있어서다
  # (검증 지적 반영 — m3 '안전이 정시보다 우선'의 데이터 보장).
  budget: { time: 120, time_over_penalty: 10 }
