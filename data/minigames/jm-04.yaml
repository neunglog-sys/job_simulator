# 4단계 미니게임 — jm-04 해상 운항(3항사)
# 근거: m2 자료·정보 누락 mission "누락·불일치 3건(침선 인접 항로, 등부표 구위치 기재,
#       공사구역 미반영)" / m2 answer_guide "신설 침선(가라앉은 배) 위치가 계획 항로 및
#       여유수심에 걸리는지 확인" / m2 warning "침선 위 항로를 그대로 통과시킴".
#       ETA 충돌은 m3 "'정시 도착(ETA)'과 '제한시계 안전조치'가 충돌" — 안전이 정시보다 우선.
# 형식 정의는 _SCHEMA.md 참조. 초안(직선) 항로가 침선 위를 지나가는 원문 트릭을 보존한다(규칙 4).
#
# 난이도 상향(계획 강화 — 채점 계약·자동 배치 설계 불변):
#   ① 우회 변침점을 3건으로 늘려(A·B·C) 3건 불일치마다 회피 변침점을 하나씩 둔다 —
#      만점(=전 변침점 연결)의 문턱이 올라가고, 각 변침점이 25점이라 부분 연결은 더 쉽게 불합격.
#   ② 초안(직선) 유혹 변침점을 2건으로 늘려 정답 부표와 똑같은 실루엣의 함정을 강화(규칙 5).
#   ③ 회피구역 반경을 확대(신설_침선·준설공사구역·등부표) — 초안 직선 회랑의 안전 여백이
#      좁아져 대충 그은 선이 더 쉽게 구역을 스친다. penalty 는 그대로(규칙 7 합격선 뚫기 유지).
#   좌표(at)는 여전히 주지 않는다 — 자동 배치(정답 호 / 초안 직선 회랑)로 정답성 불변.
scenario_id: jm-04
engine: route
title: 항로 회피 재설정
# 게임의 결과물은 '항로 수정안'이다 — 원문 m2의 정답은 임의 변경이 아니라 불일치를
# 확인해 수정안을 만들어 보고하는 것. 완성한 선은 곧바로 적용되는 게 아니라
# 항해사·선장 보고용 수정안으로 제출된다(검증 지적 반영).
intro: 초안 항로가 침선 위를 지나갑니다. 위험구역을 피해 변침점을 이어 항로 수정안을 그리고, 완성되면 보고로 제출하세요.
time_limit: 90
pass_score: 70

data:
  # 도트 배경 해도 — 표시 전용(route `map` 규약, jm-01 3구역_노선도와 동일 48x22 캔버스).
  # 위험구역(침선·공사구역·주의구역)은 해도에 미리 그리지 않는다 — '침범 후 공개' 불변.
  map: 연안_해도
  # sprite 는 표시 전용 도트 마커(파일 없으면 라벨 폴백 — 엔진 규약). at(좌표)은 주지
  # 않는다 — 기존 자동 배치(정답 호 / 초안 직선 회랑) 설계를 그대로 유지(채점 계약 불변).
  start: { id: 출항_변침점, sprite: 운항선박_톱다운 }
  # 재설정 항로가 지나야 할 변침점 — 위험구역을 우회해 이어야 한다. 3건 불일치마다
  # 우회 변침점을 하나씩 둬 계획을 더 까다롭게 한다(난이도 상향 — 자동 배치는 위쪽 호).
  waypoints:
    - { id: 우회_변침점_A, sprite: 변침점_부표 }   # 신설 침선 남측으로 우회
    - { id: 우회_변침점_B, sprite: 변침점_부표 }   # 준설공사구역 밖으로 우회
    - { id: 우회_변침점_C, sprite: 변침점_부표 }   # 등부표 구위치 주의구역 밖으로 우회
    - { id: 도착_정박지, sprite: 정박지_부두 }

  # 유혹용 가짜 변침점 — 초안 직선 항로 위의 점. 이어 보면 침선·준설공사 구역을 관통한다.
  # '주어진 점 순서대로 잇기'만으로 만점이 나오지 않게 하는 변별 장치(검증 지적 반영).
  # 2건으로 늘려 함정을 강화한다(난이도 상향, 규칙 5). sprite 는 정답 변침점과 같은 부표
  # 파일(같은 실루엣·같은 표시 크기) — 아트로 정오답이 갈리지 않게 한다(크기 힌트 금지).
  decoy_waypoints:
    - { id: 초안_직선_변침점_1, sprite: 변침점_부표, note: 잇기 쉬워 보이지만 신설_침선 구역을 관통 }
    - { id: 초안_직선_변침점_2, sprite: 변침점_부표, note: 직선 회랑 위 — 준설공사구역을 관통 }

  # 완성한 경로의 제출 형태 — 보고. 원문 answer_guide(확인→수정 건의→보고)와 맞춘다.
  submit_as: 항로_수정안_보고

  # 회피구역 — 지나면 실수. 초안 직선 항로 위에 놓여 재설정을 강제한다(원문 3건).
  # radius 로 구역을 확대해 직선 회랑의 안전 여백을 좁힌다(난이도 상향 — 자동 배치 호
  # 경로는 여전히 안전하나, 대충 그은 선·초안 직선 점은 더 쉽게 스친다). penalty 불변.
  avoid:
    # 침선 관통은 원문 warning("침선 위 항로를 그대로 통과")의 금지행동 — 밟고도
    # 합격(70)하면 안 되므로 40 (100−40=60 불합격, jm-01 보호구역과 같은 원칙)
    - { zone: 신설_침선, penalty: 40, radius: 80 }            # m2: 계획 항로·여유수심에 걸리는 침선
    - { zone: 준설공사구역, penalty: 25, radius: 72 }          # m2: 공사구역 미반영 — 통과 금지
    # 위험 사유는 원문 그대로 '소개정(해도 수정) 누락으로 위치를 신뢰할 수 없는 구간'.
    # '천수(얕은 물)'는 원문에 없는 추가 설정이라 쓰지 않는다(검증 지적 반영).
    - { zone: 등부표_구위치_주의구역, penalty: 20, radius: 66 } # m2: 등부표 위치 변경 미반영 — 소개정 누락

  # 정시 도착(ETA) 제약 — 초과 감점을 명시적으로 avoid 최소값(20)보다 작게 고정한다.
  # 엔진이 시간 감점을 임의로 키우면 '위험구역 관통이 이득'으로 역전될 수 있어서다
  # (검증 지적 반영 — m3 '안전이 정시보다 우선'의 데이터 보장).
  budget: { time: 120, time_over_penalty: 10 }
