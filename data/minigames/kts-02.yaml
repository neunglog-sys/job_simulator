# 4단계 미니게임 — kts-02 교육·강의·코칭 응대(필라테스 센터)
# 근거: 1스텝 "수업 전 기구 및 회원 파악" — 모범답안 ③ "회원의 문진표를 읽고 과거 수술
#       이력을 확인한다" ④ "회원에게 질문하여 피해야 할 금기 동작을 파악한다"
#       제공 자료 "기구 점검표(리포머 등 5종) ... 대체 동작 목록"
#       3스텝 "레벨 혼합 수업 설계" — 제공 자료 "수업 명단(초급 3·중급 3), 동작 난이도표"
#       흔한 실수(1스텝) "문진표 안 읽고 수업 시작", (3스텝) "중급 기준으로만 진행해 초급 방치"
# 정답 규칙(제공 자료 "대체 동작 목록"·모범답안 ④에 근거):
#   ① 레벨(색)이 같은 카드끼리 잇는다.
#   ② 조심 부위 아이콘이 있는 회원은 그 부위를 보호하는 '대체' 카드로 잇는다
#      (무릎 이력 → 저강도무릎, 허리 이력 → 중급대체허리 — 각 부위 보호 카드는 하나뿐이라 유일 정답).
#   ③ 고강도(red) 카드는 어느 회원과도 잇지 않고 남긴다.
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: kts-02
engine: match
title: 레벨·금기 매칭
intro: 회원마다 레벨(색)과 조심할 부위(아이콘)가 다릅니다. 레벨이 맞는 카드를 이어 주세요. 조심 부위가 있는 회원은 그 부위를 보호하는 대체 카드로. 고강도 카드는 잇지 말고 남겨 두세요.
time_limit: 75
pass_score: 70

data:
  # 회원당 선은 1개 — 다중 연결로 '전부 잇기' 감점 회피가 불가능하게 한다.
  one_line_per_left: true

  # 표시 전용 — 컬럼 헤더(엔진 left_label/right_label 규약, 채점 무관. 도트 아트 2026-07-20).
  # 레벨은 스프라이트의 셔츠·카드 상단 띠 색(초급=초록, 중급=파랑, 고강도=빨강)으로,
  # 조심·부담 부위는 부위 위 호박색 표식으로만 읽힌다 — 글자·숫자 없음(규칙 1).
  left_label: 회원 명단
  right_label: 동작 카드

  # 왼쪽 = 회원. 레벨은 색으로(초급=green, 중급=blue), 금기 부위는 아이콘으로만 읽힌다.
  left:
    - { id: 회원_초급_A, sprite: 회원_초급_제약없음,   level: green, caution: none,  label: 초급 · 제약 없음 }
    - { id: 회원_초급_B, sprite: 회원_초급_제약없음,   level: green, caution: none,  label: 초급 · 제약 없음 }
    - { id: 회원_초급_E, sprite: 회원_초급_무릎보호,   level: green, caution: knee,  label: 초급 · 무릎 수술 이력 }
    - { id: 회원_중급_C, sprite: 회원_중급_제약없음,   level: blue,  caution: none,  label: 중급 · 제약 없음 }
    - { id: 회원_중급_D, sprite: 회원_중급_허리보호,   level: blue,  caution: back,  label: 중급 · 허리 통증 이력 }
    - { id: 회원_중급_F, sprite: 회원_중급_제약없음,   level: blue,  caution: none,  label: 중급 · 제약 없음 }

  # 오른쪽 = 운동·난이도 카드. 강도는 색, 부담 부위는 아이콘.
  right:
    - { id: 카드_초급매트,     sprite: 동작_매트_기초,       level: green, load: none,  label: 초급 매트 기초 }
    - { id: 카드_초급리포머,   sprite: 동작_리포머_기초,     level: green, load: none,  label: 초급 리포머 기초 }
    - { id: 카드_저강도무릎,   sprite: 동작_대체_무릎보호,   level: green, load: none,  label: 저강도 대체 · 무릎 부담 없음 }
    - { id: 카드_중급리포머,   sprite: 동작_리포머_중급,     level: blue,  load: none,  label: 중급 리포머 }
    - { id: 카드_중급대체허리, sprite: 동작_대체_허리보호,   level: blue,  load: none,  label: 중급 대체 · 허리 부담 없음 }
    - { id: 카드_중급점프,     sprite: 동작_점프보드_중급,   level: blue,  load: none,  label: 중급 점프보드 }
    # 금기 유도 카드 — 어느 회원과도 잇지 않는 게 정답(unmatched).
    - { id: 카드_고강도점프,   sprite: 동작_점프보드_고강도, level: red,   load: knee,  label: 고강도 점프보드 · 무릎 충격 }
    - { id: 카드_고강도후굴,   sprite: 동작_후굴_고강도,     level: red,   load: back,  label: 고강도 후굴 · 허리 부담 }

  # 정답 짝 — 위 정답 규칙 ①②③. E·D 는 조심 부위 때문에 대체 카드가 유일 정답이다.
  pairs:
    - [회원_초급_A, 카드_초급매트]
    - [회원_초급_B, 카드_초급리포머]
    - [회원_초급_E, 카드_저강도무릎]      # 무릎 이력 → 대체 동작으로 (유일 정답)
    - [회원_중급_C, 카드_중급리포머]
    - [회원_중급_D, 카드_중급대체허리]    # 허리 이력 → 허리 부담 없는 중급으로 (유일 정답)
    - [회원_중급_F, 카드_중급점프]

  # 동일하게 생긴 회원끼리는 서로 바꿔 이어도 정답 — 원문 명단(초급 3·중급 3)에 개인 식별
  # 특성이 없어 개인-카드 고정 짝의 근거가 없다(_SCHEMA.md 아이템 시각 단서 규약).
  equivalent:
    - [회원_초급_A, 회원_초급_B]   # A↔초급리포머 / B↔초급매트 교차 배정도 정답
    - [회원_중급_C, 회원_중급_F]   # C↔중급점프 / F↔중급리포머 교차 배정도 정답

  # 짝 없음 — 이 두 장은 남겨야 정답. 이으면 아래 forbidden_pairs 로 채점된다.
  unmatched: [카드_고강도점프, 카드_고강도후굴]

  # 금기 조합 — 이 선을 그으면 forbidden_penalty 40. 한 선에는 감점 하나만(중첩 금지).
  forbidden_pairs:
    # 부위 금기 — 조심 부위 아이콘과 부담 부위 아이콘이 겹치는 함정
    - { left: 회원_초급_E, right: 카드_고강도점프, reason: 무릎 수술 이력에 고강도 점프는 금기 }
    - { left: 회원_중급_D, right: 카드_고강도후굴, reason: 허리 통증 이력에 고강도 후굴은 금기 }
    # 레벨 초과 배정 — 감당 못 하는 난이도는 회원을 가리지 않고 전건 금지
    # (3스텝 흔한 실수 "중급 기준으로만 진행해 초급 방치" — 특정 회원이 아니라 초급 전원에 적용)
    - { left: 회원_초급_A, right: [카드_중급리포머, 카드_중급대체허리, 카드_중급점프, 카드_고강도점프, 카드_고강도후굴], reason: 초급에게 중급·고강도 배정 — 초급 방치·부상 위험 }
    - { left: 회원_초급_B, right: [카드_중급리포머, 카드_중급대체허리, 카드_중급점프, 카드_고강도점프, 카드_고강도후굴], reason: 초급에게 중급·고강도 배정 — 초급 방치·부상 위험 }
    - { left: 회원_초급_E, right: [카드_중급리포머, 카드_중급대체허리, 카드_중급점프, 카드_고강도후굴], reason: 초급에게 중급·고강도 배정 — 초급 방치·부상 위험 }
    - { left: 회원_중급_C, right: [카드_고강도점프, 카드_고강도후굴], reason: 수업 레벨을 넘는 고강도 배정 — 부상 위험 }
    - { left: 회원_중급_D, right: 카드_고강도점프, reason: 수업 레벨을 넘는 고강도 배정 — 부상 위험 }
    - { left: 회원_중급_F, right: [카드_고강도점프, 카드_고강도후굴], reason: 수업 레벨을 넘는 고강도 배정 — 부상 위험 }
  # 중급 회원 ↔ 초급 카드(하향 배정)는 부상 위험이 없는 단순 오배정 — wrong_pair 로만 채점.

# 채점 — 6짝을 맞게 잇고 고강도 2장을 남겼나
# accuracy = (맞은 pairs / 6) * 100 − 감점, 하한 0
# 감점 중첩 금지 — 한 선(사건)에는 가장 무거운 감점 하나만 적용한다.
scoring:
  pair_count: 6
  wrong_pair_penalty: 12       # 금기가 아닌 단순 오배정(예: 중급 회원에게 초급 카드, E에게 초급매트)
  forbidden_penalty: 40        # forbidden_pairs 의 선(부위 금기·레벨 초과) — 남겨야 할 고강도 카드를 이은 경우 포함(규칙 7)
