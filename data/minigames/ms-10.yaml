# 4단계 미니게임 — ms-10 건설·토목·조경 시공절차 (기초 시공)
# 근거:
#   3스텝 "공종 간 간섭 조정" answer_guide ① "매립공정(땅을 메우는 작업)을 우선하여
#      배치한다." → 매립되는 자재(배관·전선)를 마감보다 먼저 깐다 = 이 게임의 순서.
#   3스텝 hints.warning "각 팀 요청 순서대로 진행해 매립·마감 충돌"
#      → 마감 타일을 먼저 덮으면 재작업. forbidden 으로 넣음.
#   1스텝 mission "선행공정 완료 여부와 위험요인을 확인한다."
#      → 첫 단계는 선행공정(트렌치 굴착) 완료 확인.
#   sudden_quest intro "천공 예정 위치에서 미확인 배관이 발견됐습니다."
#      answer_guide ① 작업중지 ② 접근통제 → '미확인 배관 위 임의 천공'은 forbidden.
#   2스텝 hints.warning "기존도면대로 진행하거나 구두내용을 임의 반영"
#      → '구두지시대로 배치'도 forbidden.
# ※ 트렌치 자리(슬롯) 배치는 자재를 알아보고 순서를 아는지를 물을 뿐, 숫자를 읽혀 풀게
#    하지 않는다(규칙 1). 순서를 틀리면 즉시 실패가 원칙(안전 절차, _SCHEMA 규칙 6).
# ※ 현장 맵 모드(디자이너 확정 개편): steps에 at:[x,y](논리 캔버스 960×440)가 모두 있으면
#    프론트가 트렌치 단면 맵 위 드래그 배치로 그린다(ms-03 회의실 맵과 같은 규약).
#    - 자재는 하단 트레이에서 드래그해 자기 자리에만 물리적으로 들어간다(zone = 자리 이름 표시층).
#    - 순서 규칙·fit 게이트·채점 계약은 카드 UI와 동일 — at/zone 은 표시층일 뿐이다.
#    - 마지막 스텝(마감타일_덮기)은 드래그가 아니라 "마감하기" 버튼 — 덮기+제출을 한 번에.
#      일찍 누르면 wrong_order_fail 그대로(마감 먼저 = 재작업).
#    - forbidden 은 맵 위 함정 오브젝트(드래그 대상 아님) — 클릭하면 감점.
#    at 좌표가 없는 sequence 게임(ys-02·ys-10)은 기존 카드 UI 그대로다.
scenario_id: ms-10
engine: sequence
title: 트렌치 기초 시공
intro: 어질러진 자재를 트렌치의 맞는 자리에 순서대로 깐 뒤 마감 타일로 덮으세요. 매립할 것을 먼저, 마감은 맨 끝입니다. 순서를 틀리면 재작업입니다.
time_limit: 90
pass_score: 70

data:
  # 이 순서가 정답 — 매립되는 자재 먼저, 마감 타일이 맨 끝.
  # 배관→전선관의 상대 순서는 원문에 명시가 없으므로 글자가 아니라 '홈 모양'으로
  # 판별하게 한다(검증 지적 반영): 트렌치 단면에 큰 반원 홈(바닥)과 그 위 작은 클립
  # 받침이 보이고, 배관은 큰 홈에만·전선관은 클립에만 물리적으로 맞는다. 클립 받침은
  # 배관이 자리에 앉아야 드러난다 — 아래가 먼저임이 모양으로 읽힌다.
  # at:[x,y] = 트렌치 단면 맵(960×440) 위 자리 좌표, zone = 자리 이름(표시·접근성용).
  # 맵 지형 기준: 지표선 y=150, 개착부 x=300~660, 바닥 y=404, 바닥 홈 중심 x=480.
  steps:
    - id: 선행공정_확인
      sprite: 트렌치_굴착완료
      at: [150, 88]              # 트렌치 옆 확인 표지판
      zone: 확인_표지판
      label: 선행공정(트렌치 굴착) 완료 확인
    - id: 배관_안착
      sprite: 배관_자재
      fit: 트렌치_바닥_큰반원홈
      at: [480, 368]             # 바닥 큰 반원 홈 바로 위
      zone: 바닥_큰_홈
      label: 배관을 트렌치 바닥 홈에 안착
    - id: 전선관_배선
      sprite: 전선관_자재
      fit: 배관위_클립받침       # 배관 안착 후에만 노출되는 받침
      at: [480, 288]             # 배관 위 클립 받침 자리
      zone: 배관_위_받침
      label: 전선관을 위 받침대에 배선
    - id: 간섭점_표시
      sprite: 간섭점_마킹
      at: [620, 330]             # 배관·전선 교차 지점(우측)
      zone: 교차_지점
      label: 배관·전선 교차 간섭점 표시
    - id: 되메움_고정
      sprite: 되메움_모래
      at: [480, 208]             # 트렌치 속 되메움 구역
      zone: 되메움_구역
      label: 되메움으로 자재 고정
    - id: 마감타일_덮기
      sprite: 마감_타일
      at: [480, 140]             # 지표 개착부 마감 구역 — "마감하기" 버튼으로 덮는다
      zone: 표면_마감_구역
      label: 마감 타일로 덮기 (맨 끝)

  # 눌러선 안 되는 것 — 누르면 금지행동 (재작업·안전위험)
  # '마감 먼저 덮기'는 별도 forbidden으로 두지 않는다 — 정답 마지막 스텝과 같은
  # 스프라이트가 화면에 두 개 생겨 판별 불가였고, 이른 타일 클릭은 wrong_order_fail
  # 이 이미 잡는다(검증 지적 반영 — 중복 제거).
  # 맵 모드에선 드래그 대상이 아니라 현장에 놓인 함정 오브젝트 — 클릭하면 감점.
  forbidden:
    - id: 미확인배관_천공
      sprite: 미확인_배관
      at: [340, 248]             # 왼쪽 벽에서 튀어나온 정체불명 배관
      reason: 미확인 배관 위 임의 천공 — sudden_quest는 '작업중지·접근통제'가 정답
    - id: 구두지시_임의배치
      sprite: 구두지시_메모
      at: [835, 90]              # 우상단 현장 게시판에 붙은 구두지시 메모
      reason: 변경도면 없이 구두지시대로 배치 — 2스텝 warning (임의 반영 금지)

scoring:
  # 순서 절차라 오조작 즉시 실패가 원칙. 참고용 감점값도 함께 둔다.
  wrong_order_fail: true      # 정답 순서를 벗어나 누르면 즉시 실패
  forbidden_penalty: 40       # forbidden 자재를 집으면 큰 감점
  step_count: 6
