# 4단계 미니게임 — jm-02 철도 운행·기관 운전
# 근거: 1스텝 "출무 신고와 차량 인수 점검" — 김만철: "오늘 운전명령하고 차량 인수
#       점검부터 체크리스트 순서대로 해 봐라." guide "운전명령서(임시 서행구간 2건 포함)"
#       answer_guide ② "운전명령서와 운전다이아에서 임시 서행구간 및 특이명령을 확인"
#       warning: "서행구간 1건 누락", 2스텝 warning "서행구간 과속 진입 상황 발생"
#       → 서행구간 2건에서 정확한 타이밍 감속/가속이 이 게임의 핵심.
#       제동시험: 1스텝 answer_guide ④ "제동시험을 실시" + 3스텝 운전취급규정
#       "제동시험 미완료 시 출발 금지" → 출발 전 제동시험 beat(놓치면 실패).
#       돌발(건널목 지장물): 김만철 "전방 건널목에 지장 차량이다" → 원문 answer_guide
#       ② "초동 안전조치: 열차방호장치(방호무선) 발신 ... 최우선 실행" ③ "관제(사령)에
#       보고하고 지시 수령", warning "지장물 제거 후 관제 승인 없이 운행 재개"(금지행동)
#       → 서행 1회 통과가 아니라 정차 → 방호·보고 버튼 → 관제 승인 후 재개 시퀀스로 구현.
# 팀 지정 콘셉트 "신호 준수" — 표지·신호는 색(황/녹)과 아이콘으로만 구분하고
#   숫자·글자는 읽히지 않는다(규칙 1).
# 2단계 퀴즈의 '순서 맞추기'와 겹치지 않도록 여기선 물리 타이밍 조작만 다룬다(규칙 3).
scenario_id: jm-02
engine: physics
title: 운전명령 적용 주행 실습
intro: 앞에서 확인한 운전명령과 점검 결과를 모의 운행에 적용합니다. 출발 전 제동시험부터 서행구간·건널목까지 표지와 신호에 맞춰 제동·가속·보고 타이밍을 맞추세요. 관제 승인 전에는 운행을 재개하면 안 됩니다.
time_limit: 60
pass_score: 70

data:
  mode: rhythm
  fall_speed: 1.1                  # 노트 낙하 속도 10% 상향 — 시각 낙하만 빨라진다(판정은 beat.at·window 기준이라 정확도 계약 불변)
  track: 102노선_주행뷰            # 종스크롤 주행 화면(색 신호등·서행표지로만 안내)
                                   # 표시 전용 배경(도트) — 엔진이 프리로드 성공 시 스테이지에 깔고
                                   # 파일 부재 시 기존 그라데이션으로 폴백한다(노트·판정 로직 무관)
  judge_marker: 판정선_열차        # 판정선 왼쪽 기관차 도트 마커(ms-07 판정선_칼날 규약 — 장식, 판정 무관)

  # 타임라인(초). key: brake=제동(↓/S), accel=가속(↑/W), report=방호·보고(스페이스). window=허용 오차(초).
  # ※ report 는 방향키와 떨어진 R 대신 스페이스로 조작한다(엔진 spaceAsReport). beat.key 는 그대로
  #   'report' 로 두어 관제 승인 게이트·안전 필수 실패 판정(key==="report")과 채점 계약을 보존한다.
  # zone/signal 은 화면에 색·아이콘으로만 표시된다.
  # sprite/label 은 표시 전용(ms-07 규약) — sprite 는 cue 와 같은 표지 도트 id,
  # label 은 낙하 노트 alt·접근성 폴백 문구(기존 action 문구 유지). 채점·판정 계약 불변.
  beats:
    - { at: 1.5,  key: brake,  window: 0.5, zone: 출발전_제동시험,     cue: 제동시험_표지, action: 제동시험 체결, sprite: 제동시험_표지, label: 제동시험 체결 }   # m1 ④ 제동시험·m3 '미완료 시 출발 금지'
    - { at: 3.0,  key: accel,  window: 0.5, zone: 제동시험_완료_출발,  cue: 출발표지_녹,   action: 출발 가속,     sprite: 출발표지_녹,   label: 출발 가속 }
    - { at: 6.0,  key: brake,  window: 0.5, zone: 서행구간_A_진입,     cue: 서행표지_황,   action: 감속,          sprite: 서행표지_황,   label: 감속 }
    - { at: 8.0,  key: accel,  window: 0.5, zone: 서행구간_A_해제,     cue: 해제표지_녹,   action: 가속,          sprite: 해제표지_녹,   label: 가속 }
    - { at: 11.0, key: brake,  window: 0.5, zone: 서행구간_B_진입,     cue: 서행표지_황,   action: 감속,          sprite: 서행표지_황,   label: 감속 }
    - { at: 13.0, key: accel,  window: 0.5, zone: 서행구간_B_해제,     cue: 해제표지_녹,   action: 가속,          sprite: 해제표지_녹,   label: 가속 }
    # ── 돌발(건널목 지장물) — 원문 정답은 '서행 통과'가 아니라 정차→방호·보고→승인 후 재개
    - { at: 16.0, key: brake,  window: 0.4, signal: 건널목_지장물,     cue: 건널목_경보,   action: 비상정차,      sprite: 건널목_경보,   label: 비상정차 }
    - { at: 17.5, key: report, window: 0.8, signal: 방호_보고,         cue: 방호버튼_점멸, action: 열차방호 발신·관제 보고, sprite: 방호버튼_점멸, label: 열차방호 발신·관제 보고 }
    - { at: 20.0, key: accel,  window: 0.5, signal: 관제_승인,         cue: 승인신호_녹,   action: 운행 재개,     sprite: 승인신호_녹,   label: 운행 재개 }

  # 함정 — 눌리기 쉽지만 눌러선 안 되는 자리(불필요 급제동/오조작)
  # sprite: 서행표지_황과 동일 실루엣(마름모)·동일 크기의 녹색 정상표지 —
  # 색(황/녹)과 아이콘(꺾쇠/수평바)으로만 구분된다(규칙 1, 정답·오답 짝 규약)
  decoy_beats:
    - { at: 4.5,  cue: 출발직후_정상주행, note: 정상 주행 중 불필요한 급제동 금지, sprite: 정상주행표지_녹, label: 정상 주행 }
    - { at: 14.5, cue: 정상구간, note: 서행 해제 후 정상 구간 — 불필요한 제동 금지, sprite: 정상주행표지_녹, label: 정상 주행 }

  # 실패 조건 — 안전 필수(발생 즉시 실패, 규칙 2·7). 일반 beat(가속류) 누락은 비율 감점만.
  fails:
    - { when: 제동시험_누락,        reason: 제동시험 미완료 출발(출발 금지 규정 위반) }
    - { when: 서행구간_A_제동_놓침, reason: 서행구간 과속 진입 }
    - { when: 서행구간_B_제동_놓침, reason: 서행구간 과속 진입 }
    - { when: 건널목_정차_놓침,     reason: 건널목 지장물 앞 비상정차 미이행 }
    - { when: 방호보고_누락,        reason: 열차방호 발신·관제 보고 누락 }
    - { when: 관제승인전_가속,      reason: 관제 승인 없이 운행 재개(원문 금지행동) }

# 채점 — 정확한 타이밍에 맞춘 beat 비율에서 오조작을 뺀다
# accuracy = (window 안에 맞춘 beats / 9) * 100 − (decoy 오조작 * 20) − (창 밖 연타 * 10), 하한 0
# fails 발생 시 안전 위반으로 즉시 실패(불합격) — 일반 beat 누락의 비율 감점과 별개로,
# 감점 중첩 금지: 입력 1회는 decoy 또는 stray 중 하나로만 감점한다.
scoring:
  beat_count: 9
  decoy_penalty: 20        # 함정 2개 전부 눌러도 −40 — '전부 입력' 전략이 합격선(70)을 못 넘는다(규칙 5·7)
  stray_input_penalty: 10  # beat/decoy 창 밖의 연타·무작위 입력 1회당 감점 — '전 구간 연타' 차단
