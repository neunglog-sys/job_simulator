# 4단계 미니게임 — ys-01 치안·범죄현장 대응
# 근거: 3스텝 "신고 출동 순위 지정 및 순찰차 배정" — 김민석: "지금 신고 네 건이 한꺼번에
#       떴다. 112 코드 기준으로 출동 순서 정해서 순찰차 배정안이랑 같이 보고해."
#       제공 자료: "동시 접수 신고 4건 요약(코드0 흉기난동 현행, 코드1 주취폭행 진행 중,
#       코드2 주차시비 몸싸움 우려, 코드3 전날 자전거 절도) … 가용 순찰차 2대 현황"
#       모범답안 ② "코드0과 코드1 신고에 순찰차 2대를 최우선으로 배정한다"
#                ③ "코드2는 인접 지구대에 지원을 요청하고 코드3은 당일 방문 예약으로 전환"
#       흔한 실수: "접수 시간 순서대로 처리해 흉기난동 출동 지연, 코드3에 순찰차 배정"
#       2스텝 흔한 실수: "확인 없이 임의 출동지 지정" ← extras 근거
#
# 핵심 트릭 — 신고는 4건인데 순찰차는 2대뿐(원문의 "가용 순찰차 2대 현황"). 남는 2건은
# 지원요청함·예약함으로 흘려보내야 하고, 순찰차 슬롯에 저위험 신고를 올리면 오배치다.
# 숫자·코드 글자를 읽혀 풀지 않는다(_SCHEMA.md 규칙 1). 카드에는 사건 아이콘만 보이고
# 긴급코드는 카드 테두리 색 띠로만 구분된다.
scenario_id: ys-01
engine: place
title: 112 배차 관제
intro: 접수된 신고 카드를 배차판에 올리세요. 순찰차는 2대뿐입니다. 순찰차가 필요 없는 신고는 지원요청함·예약함으로 보내세요.
time_limit: 60          # 골든타임 — 시간이 끝나면 남은 카드는 미배차로 처리된다
pass_score: 70

data:
  # 슬롯 이름이 곧 출동 순서다 — 원문 "출동 우선순위를 배열하고 순찰차 2대 배정안"
  # marker = 배차판 칸의 도트 스프라이트(표시 전용 — ms-03 marker 규약, 채점 무관).
  # 순찰차 2칸은 같은 마커(우선순위는 label로만 구분)이고, 마커는 전부 무채색이다 —
  # 카드 테두리 색 띠와 1:1 색 대응이 생기면 '색 맞추기'가 되므로(_SCHEMA.md 시각
  # 단서 규약) 마커에는 판단 단서가 되는 색을 쓰지 않는다.
  slots:
    - id: 순찰차_1순위
      label: 순찰차 1호 · 최우선 출동
      marker: 배차마커_순찰차
      accepts: 신고_흉기난동          # 코드0 현행 — 생명 위험 최상
    - id: 순찰차_2순위
      label: 순찰차 2호 · 후속 출동
      marker: 배차마커_순찰차
      accepts: 신고_주취폭행          # 코드1 진행 중
    - id: 지원요청함
      label: 인접 지구대 지원요청
      marker: 배차마커_지원요청
      accepts: 신고_주차시비          # 코드2 — 순찰차 대신 공조 요청
    - id: 예약함
      label: 당일 방문 예약
      marker: 배차마커_예약
      accepts: 신고_자전거절도        # 코드3 전날 절도 — 방문 예약으로 전환

  # 카드 5장. 아이콘만 보이고 코드 숫자는 화면에 뜨지 않는다.
  pieces:
    - 신고_흉기난동        # 흉기 아이콘 · 적색 띠
    - 신고_주취폭행        # 주먹 아이콘 · 주황 띠
    - 신고_주차시비        # 주먹 아이콘 · 황색 띠 ← 몸싸움'우려'라 주취폭행과 같은 아이콘이 뜬다(함정)
    - 신고_자전거절도      # 자전거 아이콘 · 청색 띠
    - 신고_위치미특정      # 물음표 아이콘 · 회색 띠 ← 어디에도 올리면 안 되는 카드

  # 넣으면 안 되는 것 — 2스텝의 위치 불명 신고(재질문 대기 중). 출동지가 특정되지 않았으므로
  # 순찰차든 지원요청함이든 올리는 순간 "확인 없이 임의 출동지 지정"(원문 흔한 실수)이 된다.
  extras:
    - 신고_위치미특정

# 채점 — 슬롯 4칸을 맞게 채웠는지에서 오배치를 뺀다
# accuracy = (정배치 / 4) * 100 − (오배치 * 12) − (extras 배치 * 20), 하한 0
scoring:
  slot_count: 4
  wrong_slot_penalty: 12   # 표준 채점 키(_SCHEMA.md) — misplace 변형 금지
  extra_penalty: 20      # 위치 미특정 신고를 배차하면 가장 무겁게 — 임의 출동지 지정은 금지행동
