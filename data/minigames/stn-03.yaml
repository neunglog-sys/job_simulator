# 4단계 미니게임 — stn-03 데이터·CRM·매출 분석
# 근거: 2스텝 "매출 및 고객 데이터 검증" — 양서연: "매출과 CRM 데이터를 결합해야 하는데
#       고객ID와 날짜 형식이 맞지 않습니다. 어떤 데이터를 보완해야 하는지 정리해 주세요."
#       guide "제공 자료: 매출 CSV, CRM 추출본, 데이터 사전, 일부 중복 고객ID, 타임존 정보 누락"
#       모범답안 "② 고객 ID 등 기준 키(고유 식별 값)의 중복 여부와 형식을 검사한다"
#       흔한 실수 "이름이 비슷한 고객을 같은 사람으로 임의 결합" → 금지행동 페어(감점 40)
# 근거(이상치 구슬): 돌발 — 강소율: "매출이 40% 급증한 결과가 나왔습니다. 보고 전에 실제
#       변화인지 집계오류인지 검증해 주세요." 모범답안 "③ 중복·환불 반영 ④ 이벤트 영향 분리"
#       흔한 실수(2스텝) "구매건수와 고객수를 혼동" / 돌발 warning "원천 대조 없이 경영진 보고"
# 조인은 매출 탱크와 CRM 탱크의 소켓을 잇는 것. 고객ID는 숫자가 아니라 '열쇠 이빨 모양'으로,
# 이상치는 값이 아니라 '색이 튀는 것'으로만 판별한다(규칙 1 — stn-03은 숫자로 빠지기 쉬우니 주의).
# 오조인을 물리적으로 막지 않는다 — 어긋난 짝도 끼워지긴 하지만 이음새로 구슬이 새는
# 연출과 함께 감점된다. 물리 게이트가 있으면 '전부 끼워보기'로 함정(유사톱니A·타임존없음)이
# 무비용 해결되고 오조인 감점이 사문화되기 때문이다(검증 지적 반영).
scenario_id: stn-03
engine: match
title: 매출·CRM 데이터 파이프 조인
intro: 매출 탱크와 CRM 탱크의 소켓을 열쇠 이빨이 꼭 맞는 짝끼리 파이프로 이으세요. 모양이 어긋나도 끼워지긴 하지만 이음새로 구슬이 샙니다. 파이프에 흐르는 구슬 중 색이 튀는 이상치만 클릭해 걸러내세요.
time_limit: 80
pass_score: 70

data:
  # 컬럼 헤더(표시 전용 — MatchGame left_label/right_label 규약, 없으면 '왼쪽'/'오른쪽')
  left_label: 매출 탱크
  right_label: CRM 탱크
  # 왼쪽 — 매출 탱크 소켓. 소켓 입구가 고객ID 열쇠 이빨 모양(sprite)으로 새겨져 있다.
  left:
    - id: 매출소켓_톱니A
      sprite: 매출탱크_열쇠_톱니A
    - id: 매출소켓_둥근B
      sprite: 매출탱크_열쇠_둥근B
    - id: 매출소켓_각진C
      sprite: 매출탱크_열쇠_각진C
    - id: 매출소켓_이중D
      sprite: 매출탱크_열쇠_이중D
    - id: 매출소켓_타임존없음
      sprite: 매출탱크_열쇠_반투명   # 타임존 정보 누락 — 이빨이 흐려 짝을 확정할 수 없다

  # 오른쪽 — CRM 탱크 소켓
  right:
    - id: CRM소켓_톱니A
      sprite: CRM탱크_열쇠_톱니A
    - id: CRM소켓_둥근B
      sprite: CRM탱크_열쇠_둥근B
    - id: CRM소켓_각진C
      sprite: CRM탱크_열쇠_각진C
    - id: CRM소켓_이중D
      sprite: CRM탱크_열쇠_이중D
    - id: CRM소켓_유사톱니A
      sprite: CRM탱크_열쇠_톱니A_유사   # 이름은 비슷하지만 이빨이 미세하게 다른 동명이인

  # 열쇠 이빨이 정확히 맞물리는 짝만 정답
  pairs:
    - [매출소켓_톱니A, CRM소켓_톱니A]
    - [매출소켓_둥근B, CRM소켓_둥근B]
    - [매출소켓_각진C, CRM소켓_각진C]
    - [매출소켓_이중D, CRM소켓_이중D]

  # 짝 없음 → 억지로 잇지 말고 '보완 요청' 표시가 정답
  unmatched: [매출소켓_타임존없음, CRM소켓_유사톱니A]

  # 금지행동 페어 — 이름(이빨)이 비슷한 동명이인을 같은 사람으로 잇는 임의 결합
  # (2스텝 warning). 끼워지긴 하지만 forbidden_penalty 40 → 합격선(70) 붕괴(규칙 7)
  forbidden_pairs:
    - pair: [매출소켓_톱니A, CRM소켓_유사톱니A]
      reason: 이빨이 미세하게 다른 동명이인 — 임의 병합 금지

  # 파이프를 흐르는 구슬 — 정상은 파랑 계열, 이상치는 색이 튄다
  # (_SCHEMA.md match 확장 stream: { beads, outliers, decoy_beads } 형태)
  stream:
    beads:                       # 정상 구슬 — 클릭하면 실수(decoy 와 같은 감점 규칙)
      - { id: 구슬_파랑_1, sprite: 구슬_파랑 }
      - { id: 구슬_파랑_2, sprite: 구슬_파랑 }
      - { id: 구슬_파랑_3, sprite: 구슬_파랑 }
      - { id: 구슬_파랑_4, sprite: 구슬_파랑 }
    outliers:                    # 클릭해 걸러내야 정답
      - { id: 구슬_환불_붉은, sprite: 구슬_붉은, reason: 환불이 매출로 뒤집혀 섞인 이상치 — 반영하면 매출이 부풀려진다 }
      - { id: 구슬_중복_노란, sprite: 구슬_노란, reason: 중복 고객ID로 두 번 세어진 구슬 — 고객수·구매건수 혼동의 원인 }
    decoy_beads:                 # 색이 조금 다를 뿐 정상 — 누르면 개당 15 감점.
      # '파랑이 아닌 것 전부 클릭' 전략이면 3개 × 15 = 45 감점 → 55점 불합격(검증 지적 반영)
      - { id: 구슬_짙은파랑, sprite: 구슬_짙은파랑 }     # 대량 구매 정상 건 — 색만 짙다
      - { id: 구슬_옅은파랑, sprite: 구슬_옅은파랑 }     # 소액 구매 정상 건 — 색만 옅다
      - { id: 구슬_파랑_광택, sprite: 구슬_파랑_광택 }   # 이벤트 기간 정상 판매 — 반짝일 뿐 파랑(돌발 ④ 이벤트 영향 분리)

# 채점 — 정답 4쌍 + 짝없음 2건 + 이상치 구슬 2개 = 8건 판정
# accuracy = (맞은 판정 / 8) * 100 − 감점 합, 하한 0
# 감점 중첩 금지 — 한 사건에는 가장 무거운 감점 하나만: 금지행동 페어는 forbidden_penalty
# 40만 적용(wrong_pair 12를 겹쳐 부과하지 않음), 정상·decoy 구슬 클릭은 개당 decoy_penalty 15만.
scoring:
  judgement_count: 8
  wrong_pair_penalty: 12      # 오조인 — 이음새가 새는 연출과 함께 실제 감점 (표준 키)
  forbidden_penalty: 40       # 유사톱니A 임의 결합 (금지행동)
  decoy_penalty: 15           # 정상·decoy 구슬 클릭 개당 (표준 키)
