# 4단계 미니게임 — yg-04 IT·시스템 개발·운영
# 근거: m2b 스텝 "운영 경보 발생 — 장애 구간 추적" — 이준호: "추론 API에서 5xx 경보 떴어요.
#       어느 구간에서 끊기는지 호출 경로 따라가면서 짚어주세요. 손대지 말고 위치만 찾아서
#       알려주면 됩니다." / guide: 구간별 상태등(정상=녹/지연=황/차단=적)
#
# ⚠ 「글자 판독 금지」 원칙의 공인 예외 2건 중 하나 (팀 확정 2026-07-20).
#   다만 예외로 인정해도 도트 화면에서 글자가 뭉개지는 문제는 그대로 남는다. 그래서
#   길찾기 단서는 상태등(녹/황/적)과 아이콘을 주로 쓰고, 로그 텍스트는 보조로만 띄운다.
#   또 원문 금지행동(운영 경고 방치·임의 조치)에 따라 신입은 위치만 찾아 보고하고
#   직접 재시작·수정하지 않는다 — report_at 이 도착지이고 조치 버튼은 없다.
scenario_id: yg-04
engine: route
title: 장애 구간 추적
intro: 호출 경로를 따라가며 상태등이 처음 빨개지는 구간을 찾으세요. 직접 고치지 말고 위치만 보고하면 됩니다.
time_limit: 60
pass_score: 70

data:
  # 미로 = 호출 경로. 입구(게이트웨이)에서 출발해 경로를 따라 좁혀 간다.
  start: 게이트웨이
  # 정답 경로 — 이 순서로 지나야 원인 구간에 닿는다
  waypoints:
    - 추론서버
    - 모델저장소
  # 원인 구간. 여기 도착해 보고하면 성공 — 실재 노드 id를 가리켜야 한다
  # ('모델저장소_응답없음'은 유령 참조였음 — 검증 지적 반영)
  report_at: 모델저장소

  # 구간별 상태등 — 숫자 대신 이 색이 길잡이다
  signals:
    - { at: 게이트웨이,   light: yellow, hint: 지연 — 뒤쪽에 원인이 있다 }
    - { at: 추론서버,     light: yellow, hint: 지연 — 더 따라가야 한다 }
    - { at: 모델저장소,   light: red,    hint: 차단 — 여기서 끊긴다 }
    - { at: DB,           light: green,  hint: 정상 — 이 방향은 아니다 }

  # 잘못 들어가면 시간을 잃는 갈래 (상태등이 녹색이라 갈 이유가 없다).
  # '캐시서버'는 원문 m2b 호출 경로(게이트웨이→추론서버→모델저장소→DB)에 없는
  # 지어낸 노드라 제거(검증 지적 반영). 갈래는 금지행동이 아니라 탐색 비용이므로
  # 감점 15 유지(규칙 7 예외 — 위반이 아닌 비효율).
  avoid:
    - { zone: DB_정상구간, penalty: 15 }

  # 로그는 보조 단서로만. 읽지 않아도 상태등만으로 풀려야 한다.
  log_hints:
    - { at: 모델저장소, text: "504 upstream timeout", role: 보조 }

  budget: { time: 60 }

# 채점 — 갈래 진입 감점은 avoid 의 zone별 penalty 하나만 적용한다
# (wrong_turn_penalty 와 중첩 이중감점 금지 — 표준 채점 키 규약)
scoring: {}
