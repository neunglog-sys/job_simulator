# 4단계 미니게임 — wh-01 물류창고 분류(신입)
# 근거: 구역 A/B/C는 원문에 등장 — m2 "A구역 출고", m3 "B구역 급송 택배 차량 / C구역 정기
#       입고 화물차". m2 answer_guide ① "바코드 스캐너로 실물 박스의 바코드와 송장 일련번호를
#       대조" → 분류 기준은 바코드(색). / 금지행동: m2 warning "누락을 발견했을 때 보고나 공유
#       없이 혼자 선반으로 뛰어가는 행동" + sudden_quest 파손·누출 시 "현장 통제 → 관리자 보고".
# 형식 정의는 _SCHEMA.md 참조. 글자 대신 바코드 '색'으로만 슈트를 고른다(규칙 1).
scenario_id: wh-01
engine: sort
title: 바코드 색 분류 컨베이어
intro: 컨베이어의 택배를 바코드 색에 맞는 지역 슈트로 빠르게 넣으세요. 겉면 라벨이 아니라 바코드 색을 보세요. 슈트로 보낼 수 없는 상태의 택배는 반장 보고 버튼으로 처리하세요.
time_limit: 60
pass_score: 70

data:
  # 컨베이어 연출(표시 전용 — _SCHEMA.md sort presentation, gm-01 규약): 택배가 한 번에
  # 하나씩 벨트 중앙에 도착해 자동 선택되고, 슈트/보고 버튼으로 처리해야 다음이 들어온다.
  # 처리 순서만 강제될 뿐 채점·데이터 계약은 대기열 UI와 동일하다(intro 의 "컨베이어" 구현).
  presentation: conveyor

  # 도트 아트 규약(2026-07-20): 택배 스프라이트는 전부 같은 박스 실루엣(16×12 캔버스)이고
  # '주소 라벨의 색 띠'와 '바코드 막대 색'만 다르다 — 글자·숫자 없음(규칙 1), 크기 차이
  # 힌트 없음(scale 미사용). 바코드·라벨 색 hex 는 슈트 점 색(엔진 BIN_COLORS 파랑
  # #6ea8ff·초록 #5adcb4·주황 #ffb35c)과 동일해 색 대조가 화면에서 성립한다.
  # 라벨불일치 함정 = 라벨 띠 색과 바코드 막대 색이 어긋난 박스(바코드가 정답).
  # 파손_누출 박스만 수침 얼룩·바닥 누출 자국·얼룩에 번진 바코드(색 판독 불가)로 그린다.
  # 지역별 슈트 — 색으로 구분한다(글자 판독 아님)
  bins:
    - { id: 슈트_A구역, label: A구역, color: 파랑 }
    - { id: 슈트_B구역, label: B구역, color: 초록 }
    - { id: 슈트_C구역, label: C구역, color: 주황 }

  # 흘러오는 택배 — bin은 '바코드 색' 기준 정답 슈트
  # 모든 item에 id를 부여한다 — escalate.when/escalate_required 가 id 를 참조하므로
  # id 없는 항목은 바인딩이 깨진다(유령 참조 금지, 검증 지적 반영).
  items:
    - { id: 택배_정상_A1, sprite: 택배_파랑바코드,  bin: 슈트_A구역 }   # 정상
    - { id: 택배_정상_B1, sprite: 택배_초록바코드,  bin: 슈트_B구역 }   # 정상
    - { id: 택배_정상_C1, sprite: 택배_주황바코드,  bin: 슈트_C구역 }   # 정상
    - { id: 택배_정상_A2, sprite: 택배_파랑바코드_2, bin: 슈트_A구역 }  # 정상
    # 함정 — 겉면 라벨의 구역명과 바코드 색이 어긋난다(색을 봐야 정답)
    - { id: 택배_라벨불일치_1, sprite: 택배_A라벨_주황바코드, bin: 슈트_C구역 }
    - { id: 택배_라벨불일치_2, sprite: 택배_C라벨_파랑바코드, bin: 슈트_A구역 }
    # 파손·누출 — 어느 슈트에도 보내면 안 됨. bin 없이 escalate 가 정답(돌발 근거).
    - { id: 택배_파손_누출, sprite: 택배_젖은박스_누출자국, escalate: true }

  # 금지행동 대응 — 파손·누출 택배는 슈트로 보내면 오답. 통제하고 반장에게 보고가 정답.
  escalate:
    { label: 반장 보고, when: 택배_파손_누출 }

# 채점 — 7건(슈트 분류 6 + 반장 보고 1) 중 맞게 처리한 수에서 감점
# (규칙 5 — 다 넣어 만점 방지)
# accuracy = (맞게 처리한 items / 7) * 100 − 감점, 하한 0
# ─ 택배_파손_누출을 어느 슈트로든 강행 = 금지행동(원문 sudden_quest warning
#   "즉각적인 보고와 통제가 필수") → forbidden_penalty 40: 6/7≈85.7 − 40 ≈ 45.7 → 불합격
# ─ 택배_파손_누출을 슈트에도 안 넣고 보고 버튼도 안 누른 방치
#   → missed_escalate_penalty 40: 85.7 − 40 ≈ 45.7 → 불합격
#   (통제·보고가 원문 정답 행동이라 40 — _SCHEMA.md 표준 키. '오답' 표기가 감점 0인지
#    wrong_bin 15인지 갈리던 이중 해석을 전용 키로 확정 — 검증 지적 반영)
# ─ 정상·라벨불일치 택배를 틀린 색 슈트에 = 단순 오분류 → wrong_bin_penalty 15
# 감점 중첩 금지: 한 택배(사건)에는 가장 무거운 감점 하나만 적용한다.
scoring:
  item_count: 7                         # 슈트 분류 6 + escalate 처리 1
  wrong_bin_penalty: 15                 # 틀린 색 슈트에 넣으면 감점(재분류 비용)
  forbidden_penalty: 40                 # 파손·누출 택배를 슈트로 강행(금지행동)
  missed_escalate_penalty: 40           # 파손·누출 택배 방치(보고 생략)
  escalate_mode: 대체                   # 반장 보고가 슈트 배치를 대체 — 어느 슈트에도 넣지 않는다
  escalate_required: [택배_파손_누출]    # 슈트 투입 = forbidden 40 / 방치 = missed_escalate 40
