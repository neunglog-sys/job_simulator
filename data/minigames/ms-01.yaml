# 4단계 미니게임 — ms-01 문서·법무·기록관리
# 근거: 1스텝 "계약분쟁 증빙목록 작성" — 제공 자료 "의뢰인 접수메모, 계약서 원본·수정본,
#       이메일 5건" / 모범답안 ③ "확보한 증빙 자료를 성격과 유형에 따라 분류한다"
#       → 자료 유형별 캐비닛 분류가 이 게임의 뼈대.
#       2스텝 "이관 기록 메타데이터 검수" — 흔한 실수 "빈 값을 임의로 채우거나 중복 파일을
#       함께 등록" / 모범답안 ③④ "누락되거나 중복된 항목을 표시한다 / 보완 요청서를
#       작성한다" → 라벨이 찢겨 유형을 알 수 없는 문서는 임의 분류가 아니라 보완요청함.
#       돌발 "외부 발송 직전 문서의 개인정보와 수신권한을 최종 확인해 주세요." — 흔한 실수
#       "일부만 가리고 발송하거나 개인 메일로 전달" → 직접 처리 금지, 발송 보류·승인 요청.
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: ms-01
engine: sort
title: 증거 분류함
intro: 문서 아이콘을 보고 맞는 캐비닛에 넣으세요. 리본 표식이 있는 계약서 원본은 원본 보관함, 라벨이 찢겨 유형을 알 수 없는 것은 보완요청함입니다.
time_limit: 90
pass_score: 70

data:
  # 캐비닛 — 문서 유형 아이콘으로만 구분한다(글자 판독 금지, _SCHEMA.md 규칙 1)
  bins:
    - { id: 계약서함,   label: 계약서 }
    - { id: 이메일함,   label: 이메일 }
    - { id: 접수메모함, label: 접수메모 }
    - { id: 원본_보관함, label: 원본 보관(잠금) }
    - { id: 보완요청함, label: 보완 요청 }

  items:
    # --- 유형이 그대로 보이는 기본 자료 (1스텝 제공 자료) ---
    - { id: 계약서_원본,   sprite: 문서_계약서아이콘,       bin: 계약서함 }
    - { id: 계약서_수정본, sprite: 문서_계약서아이콘_수정본, bin: 계약서함 }
    - { id: 이메일_1,      sprite: 문서_봉투아이콘,         bin: 이메일함 }
    - { id: 이메일_2,      sprite: 문서_봉투아이콘,         bin: 이메일함 }
    - { id: 이메일_3,      sprite: 문서_봉투아이콘,         bin: 이메일함 }
    - { id: 접수메모,      sprite: 문서_메모지아이콘,       bin: 접수메모함 }

    # --- 함정 1. 원본과 수정본 — 증거는 원본이 생명이다 ---
    # 원문 m1 제공 자료의 "계약서 원본/수정본"을 그대로 사용(검증 지적 반영 —
    # 원문에 없던 '기밀 도장'을 실재 소재로 교체). 두 문서는 같은 계약서 아이콘이라
    # 헷갈린다. 원본(빨간 리본 표식)만 원본 보관함, 수정본은 일반 계약서함.
    - { id: 계약서_원본,   sprite: 문서_계약서아이콘_빨간리본, bin: 원본_보관함 }
    - { id: 계약서_수정본, sprite: 문서_계약서아이콘_리본없음, bin: 계약서함 }

    # --- 함정 2. 유형을 알 수 없거나 흠이 있는 것은 임의 분류 금지 ---
    # 2스텝 흔한 실수 "빈 값을 임의로 채우거나 중복 파일을 함께 등록"
    - { id: 기록물_라벨찢김,     sprite: 문서_라벨찢김,     bin: 보완요청함 }
    - { id: 이관기록물_빈칸,     sprite: 문서_라벨빈칸,     bin: 보완요청함 }
    - { id: 이관기록물_중복,     sprite: 문서_겹친아이콘,   bin: 보완요청함 }

    # --- 함정 3. 캐비닛이 아니라 호출이 정답 (돌발 퀘스트) ---
    # bin 없음 = 어느 캐비닛에 넣어도 오답. escalate 버튼을 눌러야 한다.
    - { id: 개인정보_포함_발송문서, sprite: 문서_발송대기_개인정보도장, escalate: true }

  # 금지행동 대응 — 신입이 직접 마스킹해서 발송하지 않는다
  escalate:
    { label: 발송 보류·승인 요청, when: 개인정보_포함_발송문서 }

# 채점 — 12건 중 제자리에 넣은 수. 엉뚱한 캐비닛에 넣으면 감점.
# accuracy = (정확히 분류한 items / 12) * 100 − (오분류 * 8), 하한 0
scoring:
  item_count: 12
  wrong_bin_penalty: 8
  # 개인정보 문서를 캐비닛에 넣어버린 경우 — 금지행동이라 가중 감점
  missed_escalate_penalty: 15
