# 4단계 미니게임 — ms-03 총무·행정·사무보조
# 근거: 1스텝 "부서 회의 준비 및 점검" — 양서현: "내일 부서회의를 준비하고 회의자료와
#       참석자 확인표를 만들어 주세요." / 제공 자료 "회의안건, 참석자 명단, 회의실 일정,
#       자료서식" / 모범답안 ③④ "필요한 관련 자료를 취합한다 / 참석 대상자들의 참석
#       여부를 확인한다" → 좌석 배치도에 참석자와 그 자료를 앉히는 게임.
#       상석은 별도 단서가 필요해 금색 의자로 표시(색 배지로만 대응, 글자 판독 금지).
#       2스텝 "공문 초안 필수 항목 검토" — 모범답안 ③ "문서가 최신 버전인지 확인한다" /
#       흔한 실수 "파일명만 보고 첨부 내용을 확인하지 않음" → 구버전 자료를 extras로.
#       흔한 실수 "안건만 전달하고 회의실·자료 버전을 확인하지 않음"도 같은 함정.
# 형식 정의는 _SCHEMA.md 참조. 이 폴더는 build_scenarios 가 건드리지 않는다.
scenario_id: ms-03
engine: place
title: 회의실 세팅
intro: 색 배지로 짝지어진 참석자와 그 자료를 좌석 배치도에 배치하세요. 금색 의자가 상석입니다. 시간 안에 끝내세요.
time_limit: 90
pass_score: 70

data:
  # 배지 = 색 4종(빨강·파랑·초록·노랑). 참석자와 그의 자료는 같은 색 배지를 단다.
  # 좌석은 배치도상의 위치로만 구분(글자 판독 금지, _SCHEMA.md 규칙 1).
  # at = 논리 캔버스 960×440 좌표(_SCHEMA.md 규칙 7). 좌표가 있으면 프론트 place
  # 엔진이 회의실 배치도(맵 모드)로 그린다 — 세로 테이블, 상석은 테이블 머리(위쪽),
  # 좌1·좌2는 왼쪽, 우1·우2는 오른쪽, 거치대는 각 좌석 앞 테이블 위.
  slots:
    # 상석 — 금색 의자 단서. 진행자(양서현) 자리.
    - { id: 상석_금색의자, marker: 금색_의자, accepts: 진행자_금배지, at: [480, 58] }
    # 참석자 좌석 — 책상 위에 좌석 색 명패(marker)가 미리 놓여 있어, 배지 색과
    # 명패 색을 맞추면 된다. marker 없이는 좌석 정답을 알 방법이 없어 1/24 찍기가
    # 된다(검증 지적 반영 — 시각 단서는 필수).
    - { id: 좌석_좌1, marker: 명패_빨강, accepts: 참석자_빨강, at: [268, 212] }
    - { id: 좌석_좌2, marker: 명패_파랑, accepts: 참석자_파랑, at: [268, 340] }
    - { id: 좌석_우1, marker: 명패_초록, accepts: 참석자_초록, at: [692, 212] }
    - { id: 좌석_우2, marker: 명패_노랑, accepts: 참석자_노랑, at: [692, 340] }
    # 자료 거치대 — 각 참석자 앞에 같은 색 자료를 놓는다
    - { id: 거치대_상석, accepts: 자료_금배지_최신, at: [480, 144] }
    - { id: 거치대_좌1, accepts: 자료_빨강_최신, at: [408, 212] }
    - { id: 거치대_좌2, accepts: 자료_파랑_최신, at: [408, 340] }
    - { id: 거치대_우1, accepts: 자료_초록_최신, at: [552, 212] }
    - { id: 거치대_우2, accepts: 자료_노랑_최신, at: [552, 340] }

  # 배치도에 놓을 조각 — 정답 조각 + 가짜(extras) 섞음
  pieces:
    - 진행자_금배지
    - 참석자_빨강
    - 참석자_파랑
    - 참석자_초록
    - 참석자_노랑
    - 자료_금배지_최신
    - 자료_빨강_최신
    - 자료_파랑_최신
    - 자료_초록_최신
    - 자료_노랑_최신
    # --- 아래는 넣으면 안 되는 것들 ---
    - 자료_파랑_구버전     # 같은 파랑 배지라 최신본과 헷갈린다 (2스텝 '최신 버전' 트릭)
    - 자료_초록_구버전     # 같은 초록 배지
    - 참석자_회색_불참     # 배지 회색 = 참석 취소. 좌석에 앉히면 안 된다
    - 배너_행사용          # 회의와 무관한 소품

  # 구버전을 글자 없이 알아볼 시각 단서 — 최신본은 흰 종이에 파란 클립, 구버전은
  # 빛바랜 종이 + 모서리 접힘 + 붉은 취소선 스탬프. 텍스트 판독 금지(규칙 1)와
  # 변별력(규칙 5)을 동시에 지키기 위한 필수 단서(검증 지적 반영).
  visual_cues:
    자료_파랑_구버전: 빛바랜_종이_모서리접힘_취소선스탬프
    자료_초록_구버전: 빛바랜_종이_모서리접힘_취소선스탬프
    자료_파랑_최신: 흰_종이_파란클립
    자료_초록_최신: 흰_종이_파란클립

  # 넣으면 감점 — 가짜 조각. 색만 보고 집으면 걸린다.
  extras:
    - 자료_파랑_구버전
    - 자료_초록_구버전
    - 참석자_회색_불참
    - 배너_행사용

# 채점 — 10개 슬롯을 제자리에 채운 수에서 가짜 조각 배치를 뺀다
# accuracy = (맞게 채운 slots / 10) * 100 − (extras 배치 * 10), 하한 0
scoring:
  slot_count: 10
  extra_penalty: 10
