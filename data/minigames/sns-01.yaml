# 4단계 미니게임 — sns-01 콘텐츠·SNS 운영(신입)
# 근거: m2 자료·정보 누락 "카드뉴스 시안 검수" — options key a "3페이지에 타사 로고가 노출"
#       (정답으로 잡아야 할 치명 위반), key b "1페이지 메인 타이틀에 발생한 오타",
#       key c "5페이지 유의사항의 폰트 크기가 브랜드 가이드라인 기준보다 작게",
#       key d "인스타그램 권장 사이즈인 1:1 비율" 규격.
#       + m1 key a "공식 브랜드 가이드라인을 확인해 권장 폰트와 금지 표현을 점검"(권장 서체 규정).
#       warning "타사 로고 노출을 묵인하면 법적 문제".
# 형식 정의는 _SCHEMA.md 참조. 글자를 읽어 오타를 찾는 게 아니라 로고·비율·크기·모양 등 '시각 결함'만
#       모양·색으로 색출한다(규칙 1 — 오타는 색면 찢김 글리치로, 서체 위반은 이질적 글자 모양으로 표현).
#       id·sprite 는 카드·부위명으로 중립화 — 결함 여부를 문자로 유출하지 않는다(규칙 8.
#       아트 전까지 sprite 문자열이 화면에 노출되므로 판정 근거는 label(발견 후 표시)과 주석에만).
scenario_id: sns-01
engine: spot
title: 카드뉴스 시각 결함 검수
intro: 업로드 전 카드뉴스 5장을 훑어 시각 결함을 찾아 표시하세요. 정상인 곳을 표시하면 감점입니다.
time_limit: 60
pass_score: 70

data:
  scene: 카드뉴스_5장_검수보드
  mark: tag                    # 수정 표시(피드백)를 붙이는 태그

  # 견본(참조) — 표시 전용(신규). '견본 보기' 토글로 여닫는다. 브랜드 기준에 맞는
  # 표준 카드뉴스 한 장의 일반 예시일 뿐, 어느 카드가 결함인지는 지목하지 않는다(규칙 1·8).
  reference:
    sprite: 견본_표준_카드뉴스
    label: 브랜드 기준에 맞는 표준 카드뉴스 예시 (견본)

  # 찾아야 할 시각 결함 — 전부 원문 근거가 있는 항목만
  # size 는 표시 전용(스프라이트 표시 폭, 960×440 논리 캔버스 단위) — 채점·좌표와 무관.
  # 짝(정상/결함) 오브젝트는 같은 size 로 맞춰 크기 차이가 힌트가 되지 않게 한다(_SCHEMA).
  targets:
    - id: 카드3_로고부
      sprite: 카드3_로고영역
      at: [470, 150]
      size: 60                 # 카드5_로고부(정상)와 짝 맞춤
      label: 타사 로고 노출(3페이지)               # m2 key a — 치명 위반
    - id: 카드1_타이틀부
      sprite: 카드1_타이틀블록
      at: [110, 150]
      size: 120                # 카드4_색면부(정상)와 짝 맞춤
      label: 메인 타이틀 색면이 어긋나 찢김(오타)    # m2 key b — 오타를 글리치로 시각화(규칙 1)
    - id: 카드2_본문서체부
      sprite: 카드2_본문글자블록
      at: [290, 230]
      size: 110
      label: 권장 서체와 다른 이질적 글자 모양       # m1 key a '권장 폰트' — 모양으로만 판단
    - id: 카드4_이미지부
      sprite: 카드4_이미지영역
      at: [650, 240]
      size: 96                 # 카드2_이미지부(정상)와 짝 맞춤
      label: 이미지 잘림(1:1 규격 벗어남)           # m2 key d
    - id: 카드5_하단문구부
      sprite: 카드5_하단문구블록
      at: [830, 310]
      size: 120
      label: 유의사항 문구 블록 과도하게 작음        # m2 key c — 크기로 판단

  # 정상인데 눌리기 쉬운 것 — 결함과 닮아 헷갈린다(누르면 mistakes +1)
  # 정상 여부도 id·sprite 에 쓰지 않는다 — decoys 소속으로만 구분(규칙 8).
  decoys:
    - { id: 카드5_로고부,   sprite: 카드5_로고영역,   at: [830, 150], size: 60 }   # 정상 자사 로고 — 카드3 타사 로고와 대비
    - { id: 카드2_이미지부, sprite: 카드2_이미지영역, at: [290, 340], size: 96 }   # 정상 제품 이미지
    - { id: 카드4_색면부,   sprite: 카드4_상단색면,   at: [650, 140], size: 120 }  # 정상 브랜드 색면

# 채점 — 5개 중 몇 개를 찾았나에서 오탐을 뺀다
# accuracy = (찾은 targets / 5) * 100 − (누른 decoys * 15), 하한 0
# decoy 3개 전부 눌러도 −45 — '전부 클릭' 전략이 합격선(70)을 못 넘는다(규칙 5·7)
scoring:
  target_count: 5
  decoy_penalty: 15
