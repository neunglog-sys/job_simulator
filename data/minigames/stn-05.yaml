# 4단계 미니게임 — stn-05 서비스·상품·사업기획 보조
# 근거: 1스텝 "신규 온보딩(적응 돕기 과정) 개선안 기획" — 서비스: "신규 사용자 온보딩
#       개선안을 만들어 주세요. 사용자가 어디서 이탈하는지부터 확인해야 합니다."
#       guide "제공 자료: 사용자 인터뷰, 퍼널 데이터, 고객문의, 현재 화면흐름, 사업목표"
#       answer_guide ② "수집한 데이터와 근거를 교차 검증한다"
#       answer_guide ③ "사용자의 핵심 이용 흐름을 시각적으로 표시한다"
#       보기 c "이용자의 주요 이동 경로와 이탈 지점을 시각적 맵으로 그리기"
# 소재 수준: 원문에는 구체 퍼널 단계명·이탈 원인·자료 인용이 없다(자료의 '이름'만 제공).
#       그래서 퍼널도 원문과 같은 추상 수준으로 둔다: 파이프 구간 1~4, 그중 3곳이 붉게 샌다.
#       가입·프로필·결제 같은 단계명은 창작하지 않는다(특히 '결제 구간 정상' 설정은 m3의
#       "결제오류 수정"과 충돌하므로 쓰지 않는다).
# 판별: 새는 구멍 옆에는 그 이탈을 드러낸 근거 카드(원문 제공 자료의 아이콘 — 노란 말풍선=
#       고객문의, 파란 마이크=사용자 인터뷰, 보라 화면화살표=현재 화면흐름)가 붙어 있고,
#       맞는 막개에는 같은 마커가 새겨져 있다. 모티프·색 대응으로만 풀린다(_SCHEMA.md 규칙 1 —
#       퍼널 수치는 숫자가 아니라 구슬이 새는 붉은 흐름으로만 보인다).
# 근거(extras): m1 warning "팀장이 말한 기능을 그대로 정답으로 삼고 사용자 근거를 확인하지
#       않음" · 보기 e "실제 유저 데이터 검증 없이 상급자의 지시 사항만 반영하기" → 근거
#       마커가 없거나(왕관) 이탈 증거와 대응하지 않는(과녁=사업목표 문서) 막개는 끼우면 감점.
scenario_id: stn-05
engine: place
title: 온보딩 퍼널 새는 구멍 막기
intro: 위에서 구슬을 흘리면 이탈 구간이 붉게 새어 나옵니다. 막개는 어느 구간에나 꽂을 수 있지만, 구멍 옆 근거 카드와 마커가 다르면 계속 샙니다. 같은 마커의 막개로 막고, 근거 없는 막개나 새지 않는 정상 구간은 건드리지 마세요.
time_limit: 80
pass_score: 70

data:
  # 카툰 퍼널 배경. 확장자를 명시한 scene 은 래스터 배경으로 부드럽게 렌더한다.
  # 슬롯 좌표는 공용 960×440 논리 캔버스 기준이며, 배경의 네 파이프 소켓 중심과 일치한다.
  scene: stn-05-onboarding-funnel-cartoon.png

  # 판별 메커니즘 — 모양은 게이트하지 않는다: 어떤 막개든 어느 구간에나 꽂힌다.
  # 틀리면 구멍이 계속 붉게 새고(시각 피드백), 꽂은 사건당 감점이 남는다(빼도 무효화되지 않음).
  # → '전부 대보기' 브루트포스는 wrong_slot_penalty 누적으로 손해가 되게 한다.
  fit: any

  # 슬롯 = 퍼널 파이프의 구간. 구간 1~3은 붉게 새고, 구간 4는 구슬이 그대로 통과한다.
  # marker = 구멍 옆 근거 카드의 도트 스프라이트(표시 전용 — ms-03 marker 규약, 채점 무관).
  # 파일 상단 '판별' 주석의 근거 카드를 화면에 실재화한다. 정상 구간 4에는 근거 카드가 없다.
  slots:
    - id: 구멍_구간1
      accepts: 막개_말풍선_노랑
      marker: 근거카드_말풍선_노랑
      label: 구간 1
      kind: dock
      at: [173, 174]
      # 붉게 샘. 옆에 노란 말풍선 카드(고객문의 묶음 — 원문 제공 자료)가 붙어 있다.
    - id: 구멍_구간2
      accepts: 막개_마이크_파랑
      marker: 근거카드_마이크_파랑
      label: 구간 2
      kind: dock
      at: [356, 174]
      # 붉게 샘. 옆에 파란 마이크 카드(사용자 인터뷰 — 원문 제공 자료).
    - id: 구멍_구간3
      accepts: 막개_화면화살표_보라
      marker: 근거카드_화면화살표_보라
      label: 구간 3
      kind: dock
      at: [575, 174]
      # 붉게 샘. 옆에 보라 화면·화살표 카드(현재 화면흐름 — 원문 제공 자료).
    - id: 구간_정상
      accepts: null
      label: 구간 4
      kind: dock
      at: [777, 174]
      # 새지 않는 정상 구간 — 근거 카드도 없다. 배치는 가능하지만 무엇을 끼워도 감점.
      # intro 의 '정상 구간은 건드리지 마세요'가 실제로 작동하는 슬롯(함정 실재화).

  # 막개 조각 — 맞는 것 3개 + 끼우면 안 되는 것 2개(_SCHEMA.md 규칙 5)
  pieces:
    - 막개_말풍선_노랑      # 노란 말풍선 마커 — 고객문의 근거
    - 막개_마이크_파랑      # 파란 마이크 마커 — 사용자 인터뷰 근거
    - 막개_화면화살표_보라  # 보라 화면·화살표 마커 — 현재 화면흐름 근거
    - 막개_왕관_금테        # 금테 왕관 마커, 근거 카드 대응 없음 — 상급자 지시만 반영(보기 e)
    - 막개_과녁_회색        # 회색 과녁 마커(사업목표 문서) — 어느 구멍의 근거 카드와도 대응 없음

  extras:
    - id: 막개_왕관_금테
      reason: 사용자 근거 없이 상급자 지시만 반영한 기능 — m1 warning·보기 e의 흔한 실수. 어느 구멍의 근거 카드와도 마커가 대응하지 않는다.
    - id: 막개_과녁_회색
      reason: 사업목표 문서만 근거로 단 기능 — 이탈 증거(문의·인터뷰·화면흐름)와 교차검증(answer_guide ②)이 되지 않는다. 새지 않는 구간 4에 끼우는 것도 같은 감점.

# 채점 — 새는 구멍 3개를 근거 마커가 같은 막개로 막고, extras 는 쓰지 않아야 한다
# accuracy = (제대로 막은 구멍 / 3) * 100 − (extras 사용 * 20 + 오배치 * 10), 하한 0
# extras 2개를 모두 쓰면 −40 → 60 < 70 불합격(_SCHEMA.md decoy '전부 클릭 합계 > 30' 충족)
# 감점 중첩 금지 — 한 사건(한 번의 배치)에는 가장 무거운 감점 하나만: extras 를 구간 4에
#   꽂으면 extra_penalty 20 만 적용하고 wrong_slot_penalty 와 중첩하지 않는다(_SCHEMA.md 공통).
scoring:
  slot_count: 3
  extra_penalty: 20        # 근거 없는 막개 사용 1개당 — ys-01·hr-01·cln-01 과 같은 키
  wrong_slot_penalty: 10   # 막개를 틀린 구간(정상 구간 포함)에 꽂은 사건당 — 표준 키(wrong_plug 등 변형 금지)
