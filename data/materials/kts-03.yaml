# 마감 정산 제공자료 — 시나리오 본문(data/scenarios)과 분리된 별도 원본이다.
# build_scenarios emit이 이 폴더를 건드리지 않으므로, 조사자료 재생성을 계속 받으면서
# 자료 본문을 유지할 수 있다(미니게임 데이터와 같은 방식).
#
# 한 스텝에 여러 세트를 두고 시뮬레이션마다 하나를 고정 선택해 보여준다(service._pick_material_set).
# 세트마다 '차액이 난 원인'이 다르므로, 자료를 실제로 대조해야 답을 찾을 수 있다.
scenario_id: kts-03
steps:
  m1:
    sets:
    - id: qty-mismatch
      cause: 출고 목록 수량과 진열 기준표 목표 수량이 달라, 임의로 더 싣지 말고 확인·보고해야 함
      documents:
      - title: 오픈 진열용 출고 목록
        body: |
          [11월 12일 오픈 · 출고 요청]
          레드 하우스와인   6병   창고 A-2
          화이트 저가라인   4병   창고 A-3
          스파클링 중가     3병   창고 B-1
          ─────────────────────────
          합계 13병 (카트 1대 적재 한도 18병)
      - title: 와인 창고 위치도
        body: |
          입구 ─ A열 ─ B열 ─ 냉장고
          A-2 레드(상단 2단)      A-3 화이트(하단)
          B-1 스파클링(냉장 구역, 입구에서 가장 안쪽)
          ※ A열과 B열은 반대편 — 한 번에 돌려면 A → B 순서
      - title: 카트 운반 안전수칙
        body: |
          1. 적재는 무거운 병을 아래, 가벼운 병을 위에
          2. 병끼리 닿지 않게 칸막이를 끼운다
          3. 통로에서는 걷는 속도, 코너에서는 멈춤 후 확인
          4. 시야가 가리면 밀지 말고 돌아서 끈다
          5. 파손·누락은 즉시 담당 매니저에게 보고(임의 처리 금지)
      - title: 매장 진열 기준표
        body: |
          레드 하우스와인   진열 목표 8병  (현재 진열 2병)
          화이트 저가라인   진열 목표 6병  (현재 진열 2병)
          스파클링 중가     진열 목표 4병  (현재 진열 1병)
          ※ 목표와 출고 수량이 다르면 임의 증량하지 말고 담당자에게 확인
    - id: fragile-lot
      cause: 해당 로트가 병목이 얇아 파손 이력이 있는 제품이라 적재·속도에 특히 주의해야 함
      documents:
      - title: 오픈 진열용 출고 목록
        body: |
          [11월 19일 오픈 · 출고 요청]
          스파클링 고가(로트 SP-241)  4병   창고 B-1
          레드 중가                   5병   창고 A-2
          화이트 중가                 3병   창고 A-3
          ─────────────────────────
          합계 12병
      - title: 와인 창고 위치도
        body: |
          입구 ─ A열 ─ B열 ─ 냉장고
          A-2 레드(상단 2단)      A-3 화이트(하단)
          B-1 스파클링(냉장 구역)
          ※ 냉장 구역은 바닥에 물기가 잦아 카트 정지거리가 길어진다
      - title: 카트 운반 안전수칙
        body: |
          1. 적재는 무거운 병을 아래, 가벼운 병을 위에
          2. 병끼리 닿지 않게 칸막이를 끼운다
          3. 통로에서는 걷는 속도, 코너에서는 멈춤 후 확인
          4. 파손 주의 표시 로트는 칸막이 2겹 + 최저 속도
          5. 파손·누락은 즉시 담당 매니저에게 보고(임의 처리 금지)
      - title: 매장 진열 기준표
        body: |
          스파클링 고가  진열 목표 4병  ⚠ 로트 SP-241 병목 얇음 · 최근 3개월 파손 2건
          레드 중가      진열 목표 5병
          화이트 중가    진열 목표 3병
    - id: blocked-aisle
      cause: A열 통로에 납품 적치물이 있어 표준 동선으로는 카트가 지나갈 수 없음
      documents:
      - title: 오픈 진열용 출고 목록
        body: |
          [11월 24일 오픈 · 출고 요청]
          레드 하우스와인   7병   창고 A-2
          화이트 저가라인   5병   창고 A-3
          ─────────────────────────
          합계 12병
      - title: 와인 창고 위치도
        body: |
          입구 ─ A열 ─ B열 ─ 냉장고
          A-2 레드(상단 2단)      A-3 화이트(하단)
          ⚠ 오늘 08:20 기준 A열 중간 통로에 납품 파렛트 적치(폭 60cm로 좁아짐)
             카트 폭 78cm — 통과 불가. B열로 우회하면 A-3까지 갈 수 있음
      - title: 카트 운반 안전수칙
        body: |
          1. 적재는 무거운 병을 아래, 가벼운 병을 위에
          2. 통로 폭이 카트보다 좁으면 밀어 넣지 말고 우회한다
          3. 통로에서는 걷는 속도, 코너에서는 멈춤 후 확인
          4. 적치물을 임의로 옮기지 않는다(납품 검수 전일 수 있음)
          5. 파손·누락은 즉시 담당 매니저에게 보고
      - title: 매장 진열 기준표
        body: |
          레드 하우스와인   진열 목표 7병
          화이트 저가라인   진열 목표 5병
          ※ 진열 순서는 매대 왼쪽부터 가격 낮은 순
    - id: split-location
      cause: 같은 품목이 두 구역에 나뉘어 보관돼 있어 위치를 먼저 확인해야 왕복을 피할 수 있음
      documents:
      - title: 오픈 진열용 출고 목록
        body: |
          [12월 3일 오픈 · 출고 요청]
          레드 하우스와인   9병   창고 A-2
          스파클링 중가     3병   창고 B-1
          ─────────────────────────
          합계 12병
      - title: 와인 창고 위치도
        body: |
          입구 ─ A열 ─ B열 ─ 냉장고
          A-2 레드(상단 2단) — 현재 재고 5병
          ⚠ 레드 하우스와인 나머지 4병은 B열 예비 선반(B-3)에 분산 보관 중
             (A-2 선반 보수로 11/30 임시 이동, 위치표 갱신 안 됨)
          B-1 스파클링(냉장 구역)
      - title: 카트 운반 안전수칙
        body: |
          1. 적재는 무거운 병을 아래, 가벼운 병을 위에
          2. 병끼리 닿지 않게 칸막이를 끼운다
          3. 통로에서는 걷는 속도, 코너에서는 멈춤 후 확인
          4. 같은 구역 물량을 한 번에 담아 왕복을 줄인다
          5. 파손·누락은 즉시 담당 매니저에게 보고
      - title: 매장 진열 기준표
        body: |
          레드 하우스와인   진열 목표 9병
          스파클링 중가     진열 목표 3병
          ※ 목록 수량이 한 선반에서 다 안 나오면 분산 보관 여부를 먼저 확인
    - id: damaged-on-arrival
      cause: 출고 대상 중 1병이 이미 파손된 상태라 숨기지 말고 보고해야 함
      documents:
      - title: 오픈 진열용 출고 목록
        body: |
          [12월 9일 오픈 · 출고 요청]
          화이트 중가       6병   창고 A-3
          레드 중가         4병   창고 A-2
          ─────────────────────────
          합계 10병
      - title: 와인 창고 위치도
        body: |
          입구 ─ A열 ─ B열 ─ 냉장고
          A-2 레드(상단 2단)      A-3 화이트(하단)
          ⚠ A-3 하단 바닥에 액체 자국 있음(12/9 08:05 청소 요청 접수)
      - title: 카트 운반 안전수칙
        body: |
          1. 적재는 무거운 병을 아래, 가벼운 병을 위에
          2. 병끼리 닿지 않게 칸막이를 끼운다
          3. 파손된 병은 만지지 말고 구역을 표시한 뒤 보고한다
          4. 누락·파손을 임의로 채워 넣거나 없던 일로 하지 않는다
          5. 파손·누락은 즉시 담당 매니저에게 보고
      - title: 매장 진열 기준표
        body: |
          화이트 중가   진열 목표 6병  (창고 실물 5병 + 파손 1병)
          레드 중가     진열 목표 4병
          ※ 실물이 목표에 못 미치면 임의 대체하지 말고 보고 후 지시를 받는다
  m2:
    sets:
    - id: budget-first
      cause: 추천 매트릭스가 예산 확인을 1단계로 규정하고 있어 예산 없이 가격대를 좁힐 수 없음
      documents:
      - title: 상품 정보 카드
        body: |
          레드   하우스 28,000 / 중가 47,000 / 프리미엄 128,000
          화이트 하우스 24,000 / 중가 42,000 / 프리미엄 110,000
          스파클링 중가 55,000 / 고가 165,000
          ※ 카드에는 가격·품종·당도만 있고 '누구에게 어울리는지'는 없다
      - title: 니즈 질문 가이드
        body: |
          1단계  받는 분과의 관계 (직장 동료 / 가족 / 친구)
          2단계  상황 (승진·집들이·감사·기념일)
          3단계  예산 범위 — "생각해두신 가격대가 있으실까요?"
          4단계  취향 (레드/화이트, 단맛 선호)
          ※ 1~4단계를 건너뛰고 상품부터 권하지 않는다
      - title: 재고 현황
        body: |
          레드 하우스 12 · 중가 8 · 프리미엄 3
          화이트 하우스 9 · 중가 6 · 프리미엄 2
          스파클링 중가 7 · 고가 1
      - title: 가격대별 추천 매트릭스
        body: |
          [1단계] 예산 확인이 선행되지 않으면 이 표를 쓸 수 없다
          3만원 이하   하우스 라인
          3~6만원     중가 라인 (선물 최다 구간)
          6~12만원    프리미엄 / 스파클링 고가
          ※ 예산을 안 여쭙고 상단부터 권하면 부담을 주고 재방문이 끊긴다
    - id: stock-out-premium
      cause: 프리미엄 라인 재고가 0이라 비싼 것부터 권하면 결품 안내를 반복하게 됨
      documents:
      - title: 상품 정보 카드
        body: |
          레드   하우스 28,000 / 중가 47,000 / 프리미엄 128,000
          화이트 하우스 24,000 / 중가 42,000 / 프리미엄 110,000
          스파클링 중가 55,000 / 고가 165,000
      - title: 니즈 질문 가이드
        body: |
          1단계  받는 분과의 관계    2단계  상황
          3단계  예산 범위          4단계  취향
          ※ 재고가 없는 라인은 처음부터 후보에서 뺀다(권한 뒤 취소는 신뢰를 깎는다)
      - title: 재고 현황
        body: |
          레드 하우스 12 · 중가 8 · 프리미엄 0  ← 결품
          화이트 하우스 9 · 중가 6 · 프리미엄 0  ← 결품
          스파클링 중가 7 · 고가 0              ← 결품
          ※ 프리미엄·고가 전 라인 입고 예정 12/15
      - title: 가격대별 추천 매트릭스
        body: |
          3만원 이하   하우스 라인      (재고 O)
          3~6만원     중가 라인        (재고 O)
          6만원 이상   프리미엄·고가    (재고 X — 오늘 추천 불가)
    - id: occasion-drives-style
      cause: 상황(집들이)이 스타일을 결정하는 변수라, 상황을 묻지 않으면 가격만으로는 못 고름
      documents:
      - title: 상품 정보 카드
        body: |
          레드 중가 47,000   묵직 · 육류와 어울림
          화이트 중가 42,000 산뜻 · 해산물·가벼운 안주와 어울림
          스파클링 중가 55,000 축하 자리 · 개봉 순간이 화제가 됨
      - title: 니즈 질문 가이드
        body: |
          1단계  받는 분과의 관계
          2단계  상황 — "어떤 자리에 가져가시나요?"
          3단계  예산 범위          4단계  취향
          ※ 같은 예산이라도 상황이 다르면 권하는 스타일이 달라진다
      - title: 재고 현황
        body: |
          레드 중가 8 · 화이트 중가 6 · 스파클링 중가 7 (전 라인 재고 충분)
      - title: 가격대별 추천 매트릭스
        body: |
          집들이·가벼운 모임   화이트 중가 / 스파클링 중가
          승진·감사           레드 중가 / 스파클링 중가
          기념일              스파클링
          ※ 예산이 같아도 상황을 모르면 이 표의 어느 행도 고를 수 없다
    - id: recipient-taste
      cause: 받는 분이 단맛을 못 마신다는 정보가 있어 취향 확인 없이는 드라이 라인을 권할 수 없음
      documents:
      - title: 상품 정보 카드
        body: |
          레드 중가 47,000    드라이 (당도 1/5)
          화이트 중가 42,000  세미스위트 (당도 3/5)
          스파클링 중가 55,000 드라이 (당도 1/5)
          모스카토 32,000     스위트 (당도 5/5)
      - title: 니즈 질문 가이드
        body: |
          1단계  받는 분과의 관계
          2단계  상황
          3단계  예산 범위
          4단계  취향 — "받으실 분이 단맛을 즐기시는 편일까요?"
          ※ 선물은 사는 사람이 아니라 받는 사람 취향이 기준이다
      - title: 재고 현황
        body: |
          레드 중가 8 · 화이트 중가 6 · 스파클링 중가 7 · 모스카토 11
      - title: 가격대별 추천 매트릭스
        body: |
          단맛 선호   모스카토 / 화이트 세미스위트
          드라이 선호 레드 중가 / 스파클링 중가
          ※ 취향을 안 여쭙고 고르면 절반은 반대편을 권하게 된다
    - id: open-question-guide
      cause: "\"좋은 걸로\"처럼 정보 없는 요청은 닫힌 질문으로는 좁혀지지 않아 개방형 질문이 필요함"
      documents:
      - title: 상품 정보 카드
        body: |
          레드 하우스 28,000 / 중가 47,000
          화이트 하우스 24,000 / 중가 42,000
          스파클링 중가 55,000
      - title: 니즈 질문 가이드
        body: |
          닫힌 질문 (예/아니오)  → 정보가 한 칸씩만 늘어난다
            "레드로 하시겠어요?"  "5만원대 괜찮으세요?"
          개방형 질문            → 한 번에 여러 칸이 채워진다
            "어떤 자리에 가져가시나요?"
            "받으실 분은 평소 어떤 술을 즐기시나요?"
          ※ 정보가 전혀 없을 때는 개방형으로 시작해 범위를 좁힌 뒤 닫힌 질문으로 확인한다
      - title: 재고 현황
        body: |
