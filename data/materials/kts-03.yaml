# 마감 정산 제공자료 — 시나리오 본문(data/scenarios)과 분리된 별도 원본이다.
# build_scenarios emit이 이 폴더를 건드리지 않으므로, 조사자료 재생성을 계속 받으면서
# 자료 본문을 유지할 수 있다(미니게임 데이터와 같은 방식).
#
# 한 스텝에 여러 세트를 두고 시뮬레이션마다 하나를 고정 선택해 보여준다(service._pick_material_set).
# 세트마다 '차액이 난 원인'이 다르므로, 자료를 실제로 대조해야 답을 찾을 수 있다.
scenario_id: kts-03
steps:
  m4:
    sets:
    - id: card-void
      cause: 카드 결제 취소 건이 현금 환불로 처리돼 시재에서 빠져나감
      documents:
      - title: POS 정산 내역
        body: |
          [11월 12일 마감 · 단말기 A-01]
          총 매출          1,482,000원
           - 카드          1,106,000원 (38건)
           - 현금            376,000원 (17건)
          취소·환불          -68,000원 (1건, 14:22 카드 취소)
          정산 기준 현금 시재  376,000원
      - title: 영수증 묶음
        body: |
          14:22  주문 #A-2291  샴페인 1병  68,000원  카드 결제
          14:26  주문 #A-2291  [취소 전표]  68,000원
                 └ 손글씨 메모: "카드 취소 안 돼서 현금으로 돌려드림"
          그 외 영수증 54매는 POS 내역과 건별 일치
      - title: 시재 기록표
        body: |
          시작 준비금        200,000원
          현금 매출 입금     376,000원
          중간 입금(-)             0원
          마감 실사 현금     508,000원
          장부상 있어야 할 금액 576,000원
          차액                -68,000원
      - title: 마감 체크리스트
        body: |
          □ 시재 2회 계수 후 금액 일치 확인
          □ POS 정산 내역과 영수증 건별 대조
          □ 취소·환불 건은 결제수단이 원결제와 같은지 확인
          □ 차액 발생 시 원인 특정 전까지 사비 충당 금지
          □ 미결 건(클레임·보류)은 인계장에 남기기
      - title: 인계장 양식
        body: |
          [마감 인계장]
          1. 마감 시재:            원 (차액:      원)
          2. 차액 원인:
          3. 조치 내역:
          4. 미결 건:
          5. 인계자 / 인수자:
