# SNS 일일 운영·이슈 대응 보고 제공자료 — 시나리오 본문(data/scenarios)과 분리된 별도 원본.
# 한 스텝에 여러 세트를 두고 시뮬레이션마다 하나를 고정 선택해 보여준다(service._pick_material_set).
# 세트마다 그날의 핵심 이슈가 달라, 자료를 실제로 읽어야 보고서를 쓸 수 있다.
#
# ⚠️ `criteria`는 세트마다 반드시 둔다. 시나리오 본문(sns-01.yaml)의 m4 기준은 링크 만료
# 사건에 맞춰져 있어서, 다른 세트가 배정되면 자료에 없는 것을 요구하게 된다(실제로 통과
# 불가였다 — 2026-07-28 E2E). 세트 기준이 있으면 그것이 시나리오 기준을 대체한다.
scenario_id: sns-01
steps:
  m4:
    sets:
    - id: coupon-not-sent
      cause: 이벤트 당첨자 12명에게 쿠폰이 발송되지 않아 DM 항의가 몰림(발송 스크립트 누락)
      criteria:
      - 발행 건수·도달·저장·부정 반응 등 운영 수치가 자료의 값 그대로 기록되었는가?
      - 쿠폰 미발송 인지 시각과 누락 규모(당첨 20명 중 12명)가 명시되었는가?
      - 누락분 수동 발송 완료까지의 조치 순서가 시각과 함께 정리되었는가?
      - 공식 사과 공지 게시 여부가 미결로 남아 있음을 밝혔는가?
      - 발송 스크립트 명단 누락을 막을 재발 방지책이 1문장 이상 포함되었는가?
      documents:
      - title: 채널 운영 지표
        body: |
          [11월 12일 · 공식 인스타그램]
          게시물 3건 발행 (신제품 카드뉴스 1 / 이벤트 리마인드 1 / 브랜드 스토리 1)
          도달        48,200  (전일 대비 +12%)
          저장          1,180
          신규 팔로워     +236
          부정 반응(숨김·신고)  17  ← 전일 2건
      - title: DM·댓글 접수 로그
        body: |
          14:05  DM  "당첨 발표 났는데 쿠폰이 안 왔어요"            (미응대)
          14:21  DM  "저도 못 받았습니다. 언제 오나요?"              (미응대)
          15:40  댓글 "당첨자만 조용히 바꾼 거 아닌가요?"            (미응대)
          16:02  DM  "이벤트 사기 아닌가요? 소비자원에 문의합니다"   (미응대)
          누적: 당첨 관련 문의 14건 (DM 11 / 댓글 3)
      - title: 이슈 처리 경과
        body: |
          16:10  운영팀에 발송 여부 확인 요청
          16:35  회신: 당첨자 20명 중 12명 발송 누락 확인(자동 발송 스크립트에서 명단 일부 누락)
          16:50  누락분 수동 발송 완료
          17:05  공지 초안 작성 → 팀장 검수 대기
          미결: 공식 사과 공지 게시 여부·시점 미정
      - title: 대응 템플릿
        body: |
          [지연·누락 사과]
          "안녕하세요, ○○입니다. 이벤트 경품 발송이 지연되어 불편을 드렸습니다.
           현재 확인 후 순차 발송 중이며, ○일까지 마무리하겠습니다."
          - 원인은 확인된 사실만 쓴다(추측 금지)
          - 개별 DM은 접수 순서대로, 공개 댓글은 공지 링크로 안내
      - title: 보고서 양식
        body: |
          [일일 SNS 운영·이슈 대응 보고]
          1. 운영 현황(발행·도달·반응):
          2. 발생한 이슈와 원인:
          3. 대응 내역(조치·발송·공지):
          4. 남은 문제(미결):
          5. 재발 방지 제안:
    - id: wrong-price
      cause: 카드뉴스에 가격을 잘못 표기해(29,000원 → 19,000원) 오인 구매 문의가 발생
      criteria:
      - 발행 건수·도달·저장·부정 반응 등 운영 수치가 자료의 값 그대로 기록되었는가?
      - 잘못 표기된 가격과 정가(19,000원 → 정가 29,000원)가 정확히 적혔는가?
      - 원본 대조·임시 비공개·수정본 재발행으로 이어진 조치가 시각과 함께 정리되었는가?
      - 오인 구매 8건의 보상 기준이 미정이라는 점을 미결로 밝혔는가?
      - 가격 표기 검수 절차 보완 계획이 1문장 이상 포함되었는가?
      documents:
      - title: 채널 운영 지표
        body: |
          [11월 19일 · 공식 인스타그램]
          게시물 2건 발행 (신제품 가격 안내 1 / 사용법 릴스 1)
          도달        61,400  (전일 대비 +34%)
          저장          2,050
          신규 팔로워     +410
          부정 반응(숨김·신고)  9
      - title: DM·댓글 접수 로그
        body: |
          11:12  댓글 "19,000원 맞죠? 스토어는 29,000원인데요"      (미응대)
          11:30  DM  "게시물 보고 샀는데 가격이 다릅니다"           (미응대)
          12:05  댓글 "허위광고 아닌가요"                          (미응대)
          누적: 가격 관련 문의 23건 (댓글 15 / DM 8)
      - title: 이슈 처리 경과
        body: |
          12:20  게시물 원본 대조 → 카드뉴스 3번 슬라이드 가격 오기 확인(정가 29,000원)
          12:35  게시물 임시 비공개 전환
          13:10  수정본 재발행, 정정 문구 삽입
          미결: 오인 구매 8건에 대한 보상(차액 환불·쿠폰) 기준 미정 — 영업팀 회신 대기
      - title: 대응 템플릿
        body: |
          [표기 오류 정정]
          "게시물에 가격이 잘못 표기되어 혼선을 드렸습니다. 정확한 가격은 ○○원이며,
           오인 구매 건은 개별 안내드리겠습니다."
          - 오류는 즉시 인정하고 정정본을 함께 안내
          - 보상 기준이 정해지기 전에는 금액·방식을 단정하지 않는다
      - title: 보고서 양식
        body: |
          [일일 SNS 운영·이슈 대응 보고]
          1. 운영 현황(발행·도달·반응):
          2. 발생한 이슈와 원인:
          3. 대응 내역(조치·발송·공지):
          4. 남은 문제(미결):
          5. 재발 방지 제안:
    - id: comment-flood
      cause: 경쟁사 비교 문구가 논란이 되어 부정 댓글이 급증(문구 자체가 원인)
      criteria:
      - 도달 급증과 팔로워 감소(-78)를 함께 제시해 지표를 왜곡 없이 보고했는가?
      - 논란이 된 표현("타사 대비 2배")이 근거 자료 없이 쓰였다는 원인을 짚었는가?
      - 게시물 내림(보관 처리)과 법무 확인 요청이 시각과 함께 정리되었는가?
      - 사과 공지 게시 여부와 기존 도달 유저 정정 방법이 미결임을 밝혔는가?
      - 근거 없는 비교·최상급 표현을 막을 재발 방지책이 1문장 이상 포함되었는가?
      documents:
      - title: 채널 운영 지표
        body: |
          [11월 24일 · 공식 인스타그램]
          게시물 2건 발행 (비교 콘텐츠 1 / 고객 후기 1)
          도달       112,800  (전일 대비 +146%)
          저장          890
          신규 팔로워     -78   ← 언팔로우 급증
          부정 반응(숨김·신고)  63
      - title: DM·댓글 접수 로그
        body: |
          10:40  댓글 "굳이 남의 제품 깎아내려야 하나요"           (미응대)
          10:55  댓글 "광고 기준 위반 아닌가요"                    (미응대)
          11:30  DM  "실망입니다. 팔로우 끊습니다"                  (미응대)
          누적: 비교 문구 관련 부정 반응 74건 (댓글 61 / DM 13)
      - title: 이슈 처리 경과
        body: |
          11:45  문구 검토 → "타사 대비 2배" 표현이 근거 자료 없이 사용된 것 확인
          12:10  게시물 내림(삭제 아님, 보관 처리)
          12:40  법무 확인 요청 — 표시광고 저촉 여부 회신 대기
          미결: 사과 공지 게시 여부, 기존 도달 유저 대상 정정 방식
      - title: 대응 템플릿
        body: |
          [표현 논란 대응]
          "불편을 느끼신 분들께 사과드립니다. 해당 표현은 내려두었고,
           근거를 다시 확인해 정정하겠습니다."
          - 논쟁에 맞대응하지 않는다
          - 근거 없는 비교·최상급 표현은 사용 금지(사내 가이드)
      - title: 보고서 양식
        body: |
          [일일 SNS 운영·이슈 대응 보고]
          1. 운영 현황(발행·도달·반응):
          2. 발생한 이슈와 원인:
          3. 대응 내역(조치·발송·공지):
          4. 남은 문제(미결):
          5. 재발 방지 제안:
    - id: link-broken
      cause: 프로필 링크가 만료돼 이벤트 참여 페이지 접속이 3시간 동안 차단됨
      criteria:
      - 링크 클릭 4,210건 대비 참여 완료 312건(전환율 7.4%)처럼 손실을 수치로 제시했는가?
      - 장애 구간(13:00경 발생 ~ 15:05 교체)이 발생·인지·조치 시각으로 기록되었는가?
      - 새 링크 발급·프로필 교체·참여 마감 연장까지의 조치가 정리되었는가?
      - 오류 시간대 이탈 유저 재안내 방법이 미결임을 밝혔는가?
      - 링크 유효기간 점검을 막을 재발 방지책이 1문장 이상 포함되었는가?
      documents:
      - title: 채널 운영 지표
        body: |
          [12월 3일 · 공식 인스타그램]
          게시물 3건 발행 (이벤트 오픈 1 / 참여 방법 1 / 리마인드 1)
          도달        73,500
          저장          1,640
          링크 클릭      4,210  → 실제 참여 완료 312건 (전환율 7.4%, 평소 31%)
          부정 반응(숨김·신고)  11
      - title: DM·댓글 접수 로그
        body: |
          13:02  DM  "링크 눌러도 페이지가 안 열려요"               (미응대)
          13:18  댓글 "저만 오류인가요? 참여가 안 됩니다"           (미응대)
          14:40  DM  "마감 전에 참여 못 하면 어떻게 되나요"         (미응대)
          누적: 접속 오류 문의 37건
      - title: 이슈 처리 경과
        body: |
          14:50  링크 점검 → 단축 URL 유효기간 만료 확인(13:00경부터 차단)
          15:05  새 링크 발급·프로필 교체
          15:20  참여 방법 게시물의 링크도 교체
          16:00  참여 마감 24시간 연장 결정
          미결: 오류 시간대에 이탈한 유저에게 재안내할지 여부
      - title: 대응 템플릿
        body: |
          [접속 장애 안내]
          "일시적인 링크 오류로 참여가 어려웠던 점 사과드립니다.
           현재 정상화되었으며, 참여 기간을 ○시간 연장했습니다."
          - 장애 구간(시각)을 밝히고 조치·보완책을 함께 안내
          - 링크는 교체 후 반드시 직접 눌러 확인
      - title: 보고서 양식
        body: |
          [일일 SNS 운영·이슈 대응 보고]
          1. 운영 현황(발행·도달·반응):
          2. 발생한 이슈와 원인:
          3. 대응 내역(조치·발송·공지):
          4. 남은 문제(미결):
          5. 재발 방지 제안:
    - id: wrong-account
      cause: 개인 계정에 올릴 글을 공식 계정에 잘못 게시(계정 전환 실수)
      criteria:
      - 오게시 직후 부정 반응이 28건으로 급증한 점 등 운영 수치가 기록되었는가?
      - 노출 시간(09:12 인지 ~ 09:18 삭제, 약 6분)이 시각과 함께 명시되었는가?
      - 삭제만으로 수습이 어렵다고 판단해 사과 스토리를 올린 경위가 정리되었는가?
      - 2인 확인 절차 도입이 미확정이라는 점을 미결로 밝혔는가?
      - 계정 전환 실수를 막을 재발 방지책이 1문장 이상 포함되었는가?
      documents:
      - title: 채널 운영 지표
        body: |
          [12월 9일 · 공식 인스타그램]
          게시물 2건 발행 (예정 콘텐츠 1 / 오게시 1)
          도달        22,400
          저장           310
          신규 팔로워     +41
          부정 반응(숨김·신고)  28  ← 오게시 직후 급증
      - title: DM·댓글 접수 로그
        body: |
          09:12  댓글 "이거 담당자분 개인 얘기 아닌가요?"          (미응대)
          09:20  DM  "공식 계정 관리 이렇게 해도 되나요"            (미응대)
          09:35  댓글 캡처가 커뮤니티에 공유됨(링크 첨부)          (모니터링)
          누적: 오게시 관련 언급 19건
      - title: 이슈 처리 경과
        body: |
          09:15  오게시 인지 → 09:18 게시물 삭제(노출 약 6분)
          09:40  캡처 확산 확인 — 삭제만으로는 수습 불가 판단
          10:05  짧은 사과 스토리 게시(24시간)
          미결: 계정 전환 실수 재발 방지책(2인 확인 절차 도입 여부) 미확정
      - title: 대응 템플릿
        body: |
          [오게시 대응]
          "담당자 실수로 관련 없는 게시물이 잠시 노출되었습니다.
           즉시 삭제했으며, 재발하지 않도록 절차를 보완하겠습니다."
          - 변명·장문 해명 대신 사실·조치·재발방지 세 줄
          - 삭제해도 캡처가 남는다는 전제로 대응
      - title: 보고서 양식
        body: |
          [일일 SNS 운영·이슈 대응 보고]
          1. 운영 현황(발행·도달·반응):
          2. 발생한 이슈와 원인:
          3. 대응 내역(조치·발송·공지):
          4. 남은 문제(미결):
          5. 재발 방지 제안:
