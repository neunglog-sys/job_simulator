# F 직무군 원장 — 추천·체험·리포트·RAG의 단일 기준 (2026-07-27 팀 확정)
#
# 이 파일이 F 체계의 유일한 정의처다. 여기서 파생되는 것:
#   - 추천 후보: data/jobs/f{번호}.yaml (F당 1개, 프로필은 각 파일에)
#   - 체험 연결: job_scenario_map.yaml (scenario 필드와 일치해야 함 — 테스트로 검증)
#   - 상담 RAG 스코프: members(KB v5 J코드)로 확장 — doc_chunks의 job_code가 J 체계라서다
#   - 세부직업: f_detail_jobs.yaml (조사 엑셀 04_근거_세부직업 변환본)
#
# 주의:
#   - f15는 결번(웹 운영·콘텐츠 관리 → f07에 흡수). f37은 시나리오 없음(체험 버튼 비활성).
#   - 번호를 당겨 재부여하지 말 것 — 기존 J yaml의 family_id·kb_map.py(KB v5 F01~F24)와
#     번호가 겹치지만 **의미가 다르다**. 여기 members가 새 체계의 소속 정의다.
#     (예: 새 f12엔 J055가 없다 — f34로 이동. kb_map의 F12(J54~57)와 다름)
#   - members가 빈 F(신설 계열)는 KB에 대응 J가 없다 — RAG는 시나리오 slug 전용 지식으로
#     보충하는 기존 갭 패턴을 그대로 쓴다.

