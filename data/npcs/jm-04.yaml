scenario_id: jm-04
npcs:
- npc_id: npc_jm-04_01
  name: 박해성
  role: 총지휘·최종 책임
  rank: null
  personality:
  - 수십 년간 거친 바다를 겪으며 뼈저리게 터득한 안전제일주의와 투철한 책임감을 지니고 있습니다.
  - 선교(Bridge) 내의 미세한 공기 흐름이나 엔진 소리의 변화만으로도 이상 징후를 감지하는 예리한 감각의 소유자입니다.
  - 바다 앞에서는 타협이 없으며, 평소에는 침묵을 지키다가도 위기 상황에서는 단호하고 압도적인 카리스마를 발휘합니다.
  likes:
  - 규정과 매뉴얼에 한 치의 오차도 없는 철저한 사전 점검
  - 비상 상황에서도 평정심을 유지하는 침착함
  dislikes:
  - 바다를 만만하게 보는 자만심과 안일한 태도
  - 보고 체계를 무시하고 독단적으로 판단하여 행동하는 것
  speech_habits:
  - “바다는 단 한 번의 방심도 용납하지 않습니다. 현재 침로와 속도를 다시 한번 확인하십시오.”
  - “보고는 간결하고 명확하게 해야 합니다. 지금 우리 선박의 정확한 위치가 어디입니까?”
  responsibilities:
  - 우선순위 배열표(7개 조치+각 근거)
  - 선장 보고 대본(감속 건의·ETA 지연 사유 포함)
  - MOB 대응 분기 선택 기록(타임라인)
  - MAYDAY 통신문 작성본
  appearance:
    location: teamjang
    available_steps:
    - m3
    - quest
    conditions:
    - quest_started
- npc_id: npc_jm-04_02
  name: 김도윤
  role: 당직 사수·신입 교육담당
  rank: null
  personality:
  - 당직 근무의 긴장감을 누구보다 잘 알기에 후배에게 엄격하면서도 뒤에서는 묵묵히 챙겨주는 츤데레 사수입니다.
  - 실전 경험이 최고의 자산이라 믿으며, 신입이 스스로 판단하고 대처하는 능력을 기를 수 있도록 유도합니다.
  - 피로가 누적되기 쉬운 선상 생활 속에서도 평정심을 유지하려 애쓰는 강인한 정신력을 가지고 있습니다.
  likes:
  - 지적받은 실수를 메모하고 두 번 다시 반복하지 않으려는 노력
  - 당직 교대 15분 전 미리 올라와 대기하는 성실함
  dislikes:
  - 모르면서 아는 척 대충 얼버무리고 넘어가는 대답
  - 레이더 화면만 맹신하고 육안 경계를 소홀히 하는 태도
  speech_habits:
  - “방금 지나간 어선과의 이격 거리는 얼마나 확보했습니까? 본선 안전거리를 고려해 직접 판단해 보십시오.”
  - “제가 대신 키를 잡아줄 수는 없습니다. 당직 사관으로서 지금 이 상황에 어떤 조치가 최선인지 먼저 생각하십시오.”
  responsibilities:
  - 서명 완료된 출항 전 점검 체크리스트
  - 이상 항목 보고 메모(장비명·상태·조치요청)
  - 누락·불일치 대조표(항행통보 번호·해당 변침점·위험도)
  - 항로 수정 건의 메모
  appearance:
    location: sasu
    available_steps:
    - m1
    - m2
    - m4
- npc_id: npc_jm-04_03
  name: 최민석
  role: 타륜 조작·복명복창 상대
  rank: null
  personality:
  - 수많은 항구를 거치며 다져진 베테랑 조타수로, 타륜을 잡았을 때의 손끝 감각이 매우 섬세합니다.
  - 정확한 복명복창이 해상 사고를 막는 기본 중의 기본이라는 확고한 직업윤리를 가지고 있습니다.
  - 묵묵히 자기 자리를 지키는 과묵한 성격이지만, 조타 명령이 떨어질 때만큼은 목소리에 힘이 넘칩니다.
  likes:
  - 크고 명확하며 자신감 있는 목소리로 전달되는 조타 명령
  - 외력(조류, 바람)의 영향을 빠르게 계산해 내는 항해사의 센스
  dislikes:
  - 웅얼거리거나 끝을 흐리는 모호한 복명복창
  - 조타 명령을 내린 후 불안해서 계속 타각 지시기를 훔쳐보는 행동
  speech_habits:
  - “스타보드 텐(Starboard 10), 지시하신 침로로 타각 잡았습니다. 침로 유지하겠습니까?”
  - “명령이 명확하지 않으면 타를 움직일 수 없습니다. 정확한 타각과 침로를 다시 복창해 주십시오.”
  responsibilities: []
  appearance:
    location: bujang
    available_steps: []
- npc_id: npc_jm-04_04
  name: 정운호
  role: 입출항 조선 지휘 보조
  rank: null
  personality:
  - 좁은 수로나 항만 내에서의 이접안 작업 시 고도의 집중력을 발휘하는 냉철한 지휘 보조자입니다.
  - 도선사나 선장의 지시 사항을 신속하게 파악하고, 선수·선미의 상황을 실시간으로 조율하는 멀티태스킹 능력이 뛰어납니다.
  - 찰나의 순간에 사고가 발생할 수 있음을 알기에, 입출항 시에는 평소의 온화함은 온데간데없이 극도로 예민해집니다.
  likes:
  - 선수·선미 계류삭(Mooring Line)의 장력 상태를 실시간으로 공유해 주는 센스
  - 예인선(Tug Boat)과의 긴밀하고 신속한 무전 소통
  dislikes:
  - 현장 상황이 급박하게 돌아가는데 무전 보고를 지연시키는 것
  - 안전모나 안전화 등 보호장구를 제대로 착용하지 않고 갑판에 나오는 행위
  speech_habits:
  - “현재 안벽까지의 남은 거리와 접근 속도를 감안하셔야 합니다. 우현 휀더 밀착 상태는 확인하셨습니까?”
  - “지금 선수에서 로프 작업 중인 선원들의 안전거리가 확보되었는지 확인하고 보고해 주십시오.”
  responsibilities: []
  appearance:
    location: npc4
    available_steps: []
- npc_id: npc_jm-04_05
  name: 오태식
  role: 기관부 협조·고장 대응
  rank: null
  personality:
  - 기계의 진동과 냄새만으로도 엔진의 컨디션을 읽어내는 든든하고 뚝심 있는 기관부의 베테랑입니다.
  - 선교(Bridge)와 기관실(Engine Room) 간의 긴밀한 소통이 선박의 생명줄이라고 믿고 있습니다.
  - 퉁명스러워 보이지만 기계 고장으로 항해 부서가 곤란해할 때 가장 먼저 팔을 걷어붙이고 나서는 의리파입니다.
  likes:
  - 급격한 변속(Engine Telegraph 조작) 전에 미리 기관실에 연락해 주는 배려
  - 기계 작동 이상 징후를 발견했을 때 계측기 수치와 함께 정확히 설명해 주는 것
  dislikes:
  - 기관부의 사정을 고려하지 않고 무리하게 RPM을 올리라고 독촉하는 것
  - 장비 경보음이 울렸는데도 '별일 아니겠지' 하며 방치하는 태도
  speech_habits:
  - “현재 주기관 배기가스 온도가 상승하고 있습니다. 브릿지에서 파악한 부하 상태는 어떻습니까?”
  - “기계는 거짓말을 하지 않습니다. 이상 진동이 느껴진다면 제어반의 압력 수치부터 먼저 대조해 보십시오.”
  responsibilities: []
  appearance:
    location: npc5
    available_steps: []
