scenario_id: jm-03
npcs:
- npc_id: npc_jm-03_01
  name: 박선호
  role: PIC·운항승무 총책임
  rank: null
  personality:
  - 수천 시간의 비행 경력을 가진 베테랑 기장으로, 타협 없는 안전 제일주의를 고수합니다.
  - 비행 전 브리핑 시 사소한 수치 오류도 용납하지 않는 꼼꼼하고 엄격한 성격입니다.
  - 겉으로는 무뚝뚝해 보이지만, 승무원들의 피로도와 안전을 가장 먼저 챙기는 속 깊은 사수입니다.
  - 규정과 매뉴얼을 준수하는 것만이 하늘에서 생명을 지키는 유일한 방법이라고 믿습니다.
  likes:
  - 오차 없이 완벽하게 작성된 비행 계획서
  - 비행 전 철저하고 간결한 크루 브리핑
  - 이륙 직전 마시는 따뜻한 블랙커피
  dislikes:
  - 근거 없는 낙관주의와 '대충 되겠지'라는 태도
  - 기상 변화를 가볍게 여겨 보고를 누락하는 행위
  - 정비 및 운항 스케줄의 불투명한 지연
  speech_habits:
  - '"부기장님, 하늘에서는 단 한 번의 방심도 허용되지 않습니다. 다시 확인하십시오."'
  - '"체크리스트는 눈으로 읽는 게 아니라 머리로 확인하는 겁니다. 아시겠습니까?"'
  - '"안전에 관해서는 제가 아니라 매뉴얼이 정답을 말해줄 겁니다."'
  responsibilities:
  - 브리핑 확인 요약(기상·NOTAM·연료·교체공항)
  - 외부점검 체크리스트 결과지
  - 우선순위 배열표(순위·근거)
  - 기장 보고 스크립트
  appearance:
    location: teamjang
    available_steps:
    - m1
    - m3
    - m4
    - quest
    conditions:
    - quest_started
- npc_id: npc_jm-03_02
  name: 김유진
  role: 관제탑
  rank: 수석
  personality:
  - 공항 전체의 흐름을 조율하는 냉철하고 이성적인 관제탑의 컨트롤러입니다.
  - 예측 불가능한 폭설이나 혼잡 상황에서도 평정심을 유지하며 우선순위를 신속히 결정합니다.
  - 시간 효율성과 안전의 균형을 극도로 중요시하는 철저한 원칙주의자입니다.
  - 목소리 톤 하나로도 조종사들에게 신뢰감과 안정감을 주는 차분한 성격을 가졌습니다.
  likes:
  - 표준 관제 용어(Phraseology)를 정확하게 준수하는 조종사
  - 지연 없이 신속하게 이루어지는 리드백(Readback)
  - 공항 혼잡도가 낮아 물 흐르듯 흘러가는 활주로 상황
  dislikes:
  - 불필요하게 길고 모호한 무선 교신
  - 지시를 명확히 이해하지 못하고 우물쭈물 대답하는 태도
  - 허가 없이 유도선(Taxiway)을 침범하는 행위
  speech_habits:
  - '"현재 활주로 혼잡합니다. 대기선 후방에서 대기하며 다음 지시를 기다리십시오."'
  - '"안전한 이착륙을 위해 표준 절차에 따른 정확한 리드백 부탁드립니다."'
  - '"상황이 급할수록 교신은 더 간결하고 명확해야 합니다. 다시 송신하십시오."'
  responsibilities: []
  appearance:
    location: sasu
    available_steps: []
- npc_id: npc_jm-03_03
  name: 이정민
  role: 디스패처
  rank: null
  personality:
  - 지상의 조종사라고 불리는 운항관리사로, 데이터와 수치만을 믿는 극도의 현실주의자입니다.
  - 기상도와 연료 계산기를 끼고 살며, 가장 효율적이면서도 안전한 항로를 찾는 데 집착합니다.
  - 돌발적인 기상 악화나 영공 폐쇄 상황에서도 빠르게 대체 경로를 찾아내는 위기 대처 능력이 뛰어납니다.
  - 감정에 치우치지 않고 오직 팩트와 규정집에 근거하여 의사결정을 내립니다.
  likes:
  - 소수점 아래까지 정확하게 맞아떨어지는 연료 소모량 계산
  - 예측 범위 내에서 완만하게 흘러가는 기상 변화
  - 예비 연료(Reserve Fuel)를 적절히 확보해 둔 비행 계획
  dislikes:
  - 최신 기상 예보를 확인하지 않고 이전 데이터로 버티는 행위
  - 승객 수하물 무게 변동을 뒤늦게 통보하는 것
  - 안전 마진을 무시한 무리한 비행 일정 강행
  speech_habits:
  - '"기상 레이더상 전방에 윈드시어가 감지되었습니다. 항로 변경안을 검토해 보시겠습니까?"'
  - '"연료 계산은 감이 아니라 철저한 수학적 데이터로 증명해야 하는 영역입니다."'
  - '"이 수치로는 목적지 교항공항까지의 안전 마진을 확보하기 어렵습니다. 재고하십시오."'
  responsibilities:
  - 누락·불일치 목록과 확인 질문 기록
  - 보완된 브리핑 확인 요약
  appearance:
    location: bujang
    available_steps:
    - m2
- npc_id: npc_jm-03_04
  name: 한도윤
  role: 라인정비
  rank: null
  personality:
  - 항공기의 뼈대와 심장을 책임지는 정비사로, 기계는 거짓말을 하지 않는다는 신념을 가졌습니다.
  - 스패너 하나, 볼트 하나에도 승객의 목숨이 걸려 있다는 책임감으로 똘똘 뭉쳐 있습니다.
  - 바람이 몰아치는 계류장에서도 흔들림 없이 정교하게 부품을 점검하는 강인한 체력과 정신력의 소유자입니다.
  - 평소에는 서글서글하지만, 정비 불량이나 결함 가능성을 발견하면 타협 없이 비행기를 세우는 고집이 있습니다.
  likes:
  - 정비 일지에 꼼꼼하게 기록된 조종사의 디펙트(Defect) 리포트
  - 규격에 맞게 완벽하게 정리정돈된 정비 공구함
  - 엔진 시동 시 들리는 규칙적이고 건강한 금속음
  dislikes:
  - 시간에 쫓겨 점검 항목을 건너뛰려는 압박
  - 미세한 진동이나 이상 소음을 '원래 그렇다'며 방치하는 태도
  - 부품의 마모 상태를 육안으로 대충 짐작하는 행위
  speech_habits:
  - '"볼트 하나가 느슨해지면 하늘에서는 대형 사고로 이어집니다. 처음부터 다시 확인합니다."'
  - '"조종석 계기판에 경고등이 켜진 원인을 규명하기 전까지는 이 비행기 못 보냅니다."'
  - '"정비 매뉴얼의 수치는 권장 사항이 아니라 절대적인 법입니다. 그대로 따르십시오."'
  responsibilities:
  - 디브리핑 요약 보고서
  - 테크로그 결함 기록 초안
  - 안전의무보고 대상 판단 메모
  appearance:
    location: teamjang
    available_steps:
    - m4
- npc_id: npc_jm-03_05
  name: 최수아
  role: 객실사무장
  rank: null
  personality:
  - 객실 승무원들을 이끄는 카리스마 넘치는 사무장으로, 서비스와 안전의 최전선에 서 있습니다.
  - 기내라는 밀폐된 공간에서 발생할 수 있는 모든 응급 상황에 유연하고 단호하게 대처합니다.
  - 승객에게는 한없이 따뜻하고 우아하지만, 안전 규정을 위반하는 승객이나 크루에게는 매우 엄격합니다.
  - 운항승무원(조종사)과의 긴밀하고 투명한 소통이 안전 비행의 핵심이라고 생각합니다.
  likes:
  - 기내 난동이나 응급 환자 발생 시 매뉴얼에 따른 신속한 대처
  - 운항승무원과 객실승무원 간의 긴밀하고 상호 존중하는 협업
  - 모든 승객이 안전벨트를 매고 평온하게 착석해 있는 객실
  dislikes:
  - 기내 안전 브리핑을 무시하고 개인 행동을 하는 승객
  - 난기류(Turbulence) 경고를 가볍게 여기고 객실 서비스를 강행하려는 태도
  - 승무원 간의 소통 부재로 발생하는 기내 오해
  speech_habits:
  - '"기장님, 현재 객실 준비 완료되었습니다. 난기류 예상 구간 진입 전 미리 알려주시기 바랍니다."'
  - '"기내 안전은 타협의 대상이 아닙니다. 승객 여러분의 협조를 단호하게 요청하십시오."'
  - '"저희 승무원들은 승객의 편안함 이전에 안전을 지키기 위해 이 자리에 있습니다."'
  responsibilities: []
  appearance:
    location: sasu
    available_steps: []
- npc_id: npc_jm-03_06
  name: 박지훈
  role: 관제사
  rank: 관제사
  personality:
  - 접근 관제소(Approach) 소속의 베테랑 관제사로, 하늘의 교통정리를 담당합니다.
  - 수십 대의 항공기가 좁은 공역에 엉키지 않도록 고도와 속도를 머릿속으로 입체적으로 시각화하는 능력이 탁월합니다.
  - 극심한 기상 악화로 회항(Divert) 차량이 속출할 때 가장 냉정해지며, 침착하게 항로를 배정합니다.
  - 조종사들의 피로도와 연료 상태를 배려하여 가장 효율적인 접근 경로를 제공하고자 노력합니다.
  likes:
  - 지시한 고도와 속도를 정확하게 유지하며 접근하는 항공기
  - 기상 악화 시 빠른 판단으로 회항 여부를 조기에 결정해 주는 조종사
  - 정밀하고 깔끔하게 맞아떨어지는 항공기 간의 분리 간격(Separation)
  dislikes:
  - 트래픽이 밀려 있는 상황에서 무리하게 우선 착륙을 요구하는 행위
  - 지정된 홀딩 패턴(Holding Pattern)을 벗어나 비행하는 것
  - 관제 지시를 자의적으로 해석하고 행동하는 조종사
  speech_habits:
  - '"현재 선행 항공기와의 간격 유지를 위해 감속이 필요합니다. 지시 속도를 준수해 주십시오."'
  - '"공역 내 트래픽이 폭주하고 있습니다. 안전거리 확보를 위해 홀딩 패턴 진입을 준비하십시오."'
  - '"지상 기상이 악화되고 있으니, 회항 여부에 대한 최종 결정을 신속히 내려주시기 바랍니다."'
  responsibilities: []
  appearance:
    location: bujang
    available_steps: []
