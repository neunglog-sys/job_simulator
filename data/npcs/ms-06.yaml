scenario_id: ms-06
npcs:
- npc_id: npc_ms-06_01
  name: 손지안
  role: 현장관리자
  rank: null
  personality:
  - 기상 이변과 시장 가격 변동에 늘 대비하는 철저한 계획주의자입니다.
  - 농가 일손 부족 문제를 뼈저리게 겪어와서, 신입의 작은 실수보다 도망치지 않는 끈기를 더 가치 있게 여깁니다.
  - 겉으로는 무뚝뚝해 보이지만 작업자의 안전사고 예방을 최우선으로 생각하는 츤데레형 관리자입니다.
  likes:
  - 일기예보를 미리 확인하고 작업 도구를 제자리에 정리해 두는 습관
  - 작업 시작 전 안전모와 안전화 끈을 단단히 조여 매는 모습
  dislikes:
  - 대충 감으로 때려 맞추는 농약 희석 비율
  - 비 오기 직전에 배수로 점검을 미루는 안일함
  speech_habits:
  - 하늘 일은 사람이 다 알 수 없으니, 우리가 할 수 있는 준비는 다 해둬야 합니다.
  - 장비 사용법을 머리로만 외우지 말고, 몸이 먼저 반응할 때까지 반복해서 익히세요.
  responsibilities:
  - 폭염대응 작업표
  appearance:
    location: teamjang
    available_steps:
    - m3
- npc_id: npc_ms-06_02
  name: 조채원
  role: 선임 사육사
  rank: 선임
  personality:
  - 가축들의 미세한 울음소리나 걸음걸이 변화만으로도 건강 상태를 알아채는 예리한 관찰력을 가졌습니다.
  - 생명을 다루는 일인 만큼 위생과 방역 수칙에 있어서는 타협이 없는 엄격한 원칙주의자입니다.
  - 동물들이 스트레스를 받지 않는 환경을 만드는 것을 축산인의 가장 큰 보람으로 여깁니다.
  likes:
  - 축사 들어오기 전 소독 발판을 꼼꼼하게 밟고 들어오는 신입
  - 사료 급여 후 사료조에 남은 양을 꼼꼼히 기록하는 습관
  dislikes:
  - 축사 안에서 큰 소리를 내거나 갑자기 뛰어다녀 가축들을 놀라게 하는 행동
  - 분뇨 수거를 미뤄서 축사 바닥을 축축하게 방치하는 것
  speech_habits:
  - 말 못 하는 짐승들이라 우리가 먼저 들여다보고 알아채지 못하면 병을 키우게 됩니다.
  - 방역복 지퍼 제대로 올리세요. 축사 안으로 들어가는 순간부터 우리는 방역 전선의 최전선에 서는 겁니다.
  responsibilities:
  - 환경·개체 점검표
  appearance:
    location: sasu
    available_steps:
    - m1
- npc_id: npc_ms-06_03
  name: 정하윤
  role: 수의·재배 담당
  rank: null
  personality:
  - 이론적 데이터와 현장의 실제 생육 상태를 비교 분석하는 것을 즐기는 학구파 스타일입니다.
  - 기후 변화에 대응하기 위해 끊임없이 새로운 품종과 친환경 방제법을 연구하는 혁신 지향적 성향입니다.
  - 문제가 발생했을 때 임시방편보다는 근본적인 원인을 찾아내어 해결하려는 집요함이 있습니다.
  likes:
  - 병해충이 발생한 잎의 뒷면까지 사진으로 찍어 정밀하게 관찰하는 태도
  - 토양 산도(pH) 측정기를 주기적으로 세척하고 보정하는 꼼꼼함
  dislikes:
  - 원인 모를 시듦 현상에 일단 영양제부터 들이붓고 보는 무작정식 대처
  - 검증되지 않은 민간요법을 농장에 함부로 적용하는 것
  speech_habits:
  - 작물이 시드는 데는 수십 가지 이유가 있습니다. 흙의 수분부터 잎의 맥상까지 하나씩 짚어가며 원인을 좁혀보세요.
  - 방제 약제를 선택할 때는 작물의 생육 단계와 안전 사용 기준일수를 반드시 먼저 확인해야 합니다.
  responsibilities: []
  appearance:
    location: bujang
    available_steps: []
- npc_id: npc_ms-06_04
  name: 권예준
  role: 스마트팜 관리자
  rank: null
  personality:
  - 센서 데이터와 제어 시스템의 수치적 정확성을 신뢰하는 이성적이고 차가운 성격입니다.
  - 기계의 오작동 하나가 온실 전체의 한 해 농사를 망칠 수 있다는 책임감에 늘 긴장 상태를 유지합니다.
  - 전통 농업의 노하우를 디지털 데이터로 표준화하는 작업에 큰 가치를 둡니다.
  likes:
  - 스마트폰 제어 앱의 경고 알림을 놓치지 않고 즉각 확인하는 순발력
  - 양액 공급 장치의 필터 청소 주기를 칼같이 지키는 행동
  dislikes:
  - 센서 수치 오류를 단순 기계 오작동이라 치부하고 수동 점검을 게을리하는 것
  - 제어반 문을 열어두어 먼지나 습기가 유입되게 방치하는 행동
  speech_habits:
  - 데이터는 거짓말을 하지 않습니다. 수치가 평소와 다르게 튀기 시작했다면 반드시 그 배후에 물리적인 원인이 있는 겁니다.
  - 자동화 시스템은 인간을 편하게 만드는 도구일 뿐, 최종 판단과 관리는 결국 사람의 몫입니다.
  responsibilities:
  - 관수확인표
  - 조치보고
  appearance:
    location: teamjang
    available_steps:
    - m2
- npc_id: npc_ms-06_05
  name: 유예린
  role: 스마트팜 사수
  rank: null
  personality:
  - 스마트팜의 첨단 기기 조작과 수작업의 조화를 중요시하는 베테랑 사수입니다.
  - 신입이 스스로 기기를 조작해보고 시행착오를 겪으며 성장할 수 있도록 묵묵히 지켜봐 주는 인내심이 강합니다.
  - 기술의 편리함에 매몰되어 작물 자체를 직접 만지고 느끼는 감각을 잃지 않으려 노력합니다.
  likes:
  - 모니터 화면만 보는 게 아니라 직접 온실 안을 걸으며 작물의 생기를 확인하는 태도
  - 작업 중 이상 징후를 발견했을 때 주저 없이 질문하는 적극성
  dislikes:
  - 수동 제어 모드로 전환해 두고 작업이 끝난 뒤 자동 모드로 돌려놓는 것을 까먹는 실수
  - 기계 조작이 서투르다고 아예 시도조차 하지 않으려는 소극적인 태도
  speech_habits:
  - 화면의 그래프가 정상이라도, 직접 온실에 들어와서 느껴지는 공기의 습도는 다를 수 있습니다. 오감을 다 열어두세요.
  - 직접 제어 밸브를 돌려보고 압력계의 변화를 눈으로 확인해보는 것만큼 좋은 공부는 없습니다.
  responsibilities:
  - 비상조치 기록
  - 설비장애 보고
  appearance:
    location: sasu
    available_steps:
    - quest
    conditions:
    - quest_started
- npc_id: npc_ms-06_06
  name: 손다은
  role: 교대관리자
  rank: null
  personality:
  - 24시간 교대 근무 속에서 철저한 인수인계와 기록의 중요성을 뼈저리게 아는 꼼꼼한 관리자입니다.
  - 이전 근무자의 사소한 특이사항 기록이 야간 돌발 상황을 막는 열쇠라고 믿는 세심함을 가졌습니다.
  - 피로도가 높은 교대 근무 환경에서도 평정심을 유지하며 동료들의 컨디션을 살피는 배려심이 있습니다.
  likes:
  - 교대 시 인수인계 대장에 작업 진행 상황과 장비 특이사항을 상세히 적어두는 습관
  - 야간 순찰 시 랜턴과 비상 연락망을 확실하게 챙기는 철저함
  dislikes:
