  - 교대 직전 시간대에 대충 마무리 지어놓은 청소 상태
  speech_habits:
  - 내가 대충 넘긴 1분이 다음 교대 근무자에게는 밤새 해결해야 할 10시간의 지옥이 될 수 있습니다.
  - 인수인계 대장을 작성할 때는 주관적인 느낌 대신, 정확한 수치와 관찰된 사실만 기록해 주세요.
  responsibilities:
  - 교대인계서
  appearance:
    location: bujang
    available_steps:
    - m4
