scenario_id: ms-10
npcs:
- npc_id: npc_ms-10_01
  name: 서서연
  role: 현장소장
  rank: 소장
  personality:
  - 30년 경력의 베테랑으로 공기(공사기간) 준수와 품질 확보를 목숨처럼 여깁니다.
  - 겉으로는 깐깐하고 엄격해 보이지만 내심 현장 작업자들의 안전을 가장 걱정합니다.
  - 말보다는 숫자가 증명하는 데이터와 도면의 정확성을 신뢰하는 완벽주의자입니다.
  likes:
  - 오차 없는 일일 공정 보고서
  - 비 오기 전에 끝낸 콘크리트 타설
  dislikes:
  - 대책 없는 '어떻게든 되겠지'식 보고
  - 정리정돈이 안 되어 지저분한 현장 통로
  speech_habits:
  - 서 기사, 오늘 타설 물량하고 레미콘 차량 배차 간격 다시 확인했습니까?
  - 현장에서는 감이 아니라 도면과 시방서가 기준이 되어야 합니다.
  responsibilities:
  - 공종조정표
  - 간섭도
  appearance:
    location: teamjang
    available_steps:
    - m3
- npc_id: npc_ms-10_02
  name: 백정우
  role: 반장
  rank: 반장
  personality:
  - 현장 바닥에서 잔뼈가 굵은 베테랑으로, 실무 감각과 손재주가 타의 추종을 불허합니다.
  - 이론만 앞세우는 먹물(기술직)들에 대한 약간의 경계심이 있지만, 실력을 보여주면 인정합니다.
  - 내 사람이라고 생각하면 츤데레처럼 뒤에서 묵묵히 챙겨주는 의리파입니다.
  likes:
  - 작업 전 시원하게 마시는 캔커피
  - 도면대로 딱딱 맞아떨어지는 거푸집 조립
  dislikes:
  - 현장 상황도 모르고 서류만 들이미는 지시
  - 자재 아낀다고 규격 미달 제품 가져오는 것
  speech_habits:
  - 이건 책에 나오는 대로만 해서는 각 안 나옵니다. 직접 대보고 판단하셔야 해요.
  - 서 기사님, 오늘 들어온 철근 규격이 도면이랑 좀 다른 것 같은데 확인해보셨습니까?
  responsibilities: []
  appearance:
    location: sasu
    available_steps: []
- npc_id: npc_ms-10_03
  name: 홍하준
  role: 안전담당
  rank: null
  personality:
  - 타협 없는 원칙주의자로, 안전에 있어서는 소장님과도 얼굴을 붉히는 고집쟁이입니다.
  - 사고 사례를 줄줄 꿰고 있어 늘 최악의 상황을 가정하고 대비하는 습관이 있습니다.
  - 잔소리가 심하다는 평을 듣지만, 모두가 무사히 퇴근하는 것이 유일한 목표입니다.
  likes:
  - 작업자 전원이 완벽하게 착용한 개인보호구
  - TBM(작업 전 안전점검회의) 시간의 높은 집중도
  dislikes:
  - '''귀찮아서'', ''더워서''라는 핑계로 안전모 벗는 행동'
  - 안전 통로에 방치된 자재와 폐기물
  speech_habits:
  - 안전에는 '설마'가 없습니다. 방호망 상태 다시 확인하고 작업 진행하세요.
  - 서 기사님, 저 구간 신호수 배치 안 되면 오늘 작업 승인 못 해 드립니다.
  responsibilities:
  - 위험발견 보고서
  - 작업재개 승인요청
  appearance:
    location: bujang
    available_steps:
    - quest
    conditions:
    - quest_started
- npc_id: npc_ms-10_04
  name: 홍지안
  role: 타 공종 담당
  rank: null
  personality:
  - 설비/전기 공종을 담당하며, 토목·건축 팀과의 간섭(Overlap) 문제 해결에 민감합니다.
  - 서로 자기 공정만 먼저 하겠다고 싸우는 현장에서 조율과 협상을 주도하는 전략가입니다.
  - 상대방의 입장을 경청하면서도 자기 팀의 공기 손해는 철저히 방어합니다.
  likes:
  - 공종 간 간섭을 미리 잡아낸 3D BIM 도면
  - 약속된 일정을 정확히 지켜주는 선행 공정
  dislikes:
  - 사전 협의 없이 슬라브 타설해 버려서 배관 구멍 막히는 상황
  - 남 탓만 하며 일정 미루기
  speech_habits:
  - 저희 배관 지나갈 자리에 벌써 비계 설치하시면 저희는 어떻게 들어갑니까?
  - 서 기사님, 이번 주말 타설 전에 저희 입선 작업 끝낼 수 있게 일정 조율 부탁드립니다.
  responsibilities: []
  appearance:
    location: teamjang
    available_steps: []
- npc_id: npc_ms-10_05
  name: 안지아
  role: 현장반장
  rank: 반장
  personality:
  - 여성 조경 시공 전문가로, 거친 현장 분위기를 부드러우면서도 카리스마 있게 이끕니다.
  - 단순히 나무를 심는 것을 넘어 공간의 생명력과 미적 가치를 창조한다는 자부심이 큽니다.
  - 식재의 생존율을 높이기 위해 토양 상태와 배수 계획을 철저하게 검증합니다.
  likes:
  - A급 수형(나무 모양)을 가진 수목 반입
  - 배수판과 부직포가 완벽하게 깔린 인공지반
  dislikes:
  - 뿌리분이 깨진 채로 대충 흙만 덮어둔 조경수
  - 건축 폐기물이 섞인 불량 토사로 메우는 것
  speech_habits:
  - 나무는 정직해서 흙이랑 배수 상태가 나쁘면 바로 말라 죽습니다. 기초부터 다시 보시죠.
  - 이 수목들은 규격이 미달이라 검수 통과 못 해 드립니다. 반품 처리해 주세요.
  responsibilities:
  - 시공준비 체크표
  appearance:
    location: sasu
    available_steps:
    - m1
- npc_id: npc_ms-10_06
  name: 오현서
  role: 공사담당
  rank: null
  personality:
  - 신입의 직속 사수로, 매일 쏟아지는 서류 작업과 현장 수량 검측으로 늘 피곤에 쩔어 있습니다.
  - 일 처리가 빠르고 실무 요령이 좋아서 소장님의 신임을 한 몸에 받고 있습니다.
  - 신입이 스스로 생각하고 판단할 수 있도록 낚싯대 던지는 법만 알려주려 합니다.
  likes:
  - 한 번에 통과되는 기성 청구 서류
  - 말귀 알아듣고 현장 도면 미리 뽑아두는 부사수
  dislikes:
  - 현장 확인도 안 해보고 협력업체 말만 믿고 올리는 보고서
  - 퇴근 직전에 터지는 돌발 설계 변경
  speech_habits:
  - 서 기사, 협력업체에서 자재 송장 들고 오면 수량 직접 세어보고 사인해야 합니다.
  - 도면이랑 실제 현장 치수랑 다른 부분 찾아냈습니까? 그것부터 해결해야 다음 단계로 갑니다.
  responsibilities:
  - 작업보류표
  - 변경도면 요청
  appearance:
    location: bujang
    available_steps:
    - m2
- npc_id: npc_ms-10_07
  name: 손지안
  role: 감리·운영 담당
  rank: null
  personality:
  - 발주처를 대변하는 감리원으로, 시방서 규정과 법적 기준을 칼같이 적용하는 원칙가입니다.
  - 현장의 편법이나 눈가림식 시공을 귀신같이 잡아내는 날카로운 눈을 가졌습니다.
  - 깐깐하지만 합리적인 근거와 시험 성적서를 제시하면 깔끔하게 승인해 줍니다.
  likes:
  - 공인기관의 품질시험 성적서와 완벽한 검측 요청서
  - 구조물 균열 관리 대장이 철저히 기록된 현장
  dislikes:
  - 검측 승인도 안 났는데 무단으로 진행하는 후속 공정
  - 하자 발생 시 '원래 다 이렇다'며 변명하는 태도
  speech_habits:
  - 철근 배근 간격이 시방서 기준보다 넓습니다. 재시공하고 다시 검측 요청하세요.
  - 서류상 데이터와 실제 현장 시험 결과가 일치하는지 제 눈으로 직접 확인하겠습니다.
  responsibilities:
  - 준공검사표
  - 변경·운영 인계서
  appearance:
    location: teamjang
    available_steps:
    - m4
