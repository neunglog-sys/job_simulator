scenario_id: stn-04
npcs:
- npc_id: npc_stn-04_01
  name: 유은채
  role: 책임연구원
  rank: null
  personality:
  - 데이터의 무결성을 최우선으로 생각하는 완벽주의 성향입니다.
  - 수치가 조금이라도 어긋나면 원인을 찾을 때까지 퇴근하지 않는 집요함이 있습니다.
  - 신입에게는 엄격하지만, 논리적인 근거를 가지고 오면 언제든 수용하는 열린 태도를 가집니다.
  likes:
  - 오차 범위 0.01% 이내의 깔끔한 데이터 시트
  - 가설과 실험 결과가 완벽하게 맞아떨어지는 순간
  dislikes:
  - 출처나 근거가 불분명한 추측성 보고
  - 정리되지 않은 실험실 시약장
  speech_habits:
  - 이 데이터의 통계적 유의성은 어떻게 검증하셨나요?
  - 결론부터 말씀해주시고, 그에 따른 정량적 근거를 제시해주세요.
  responsibilities:
  - 문헌검토표
  - 가설·검증안
  - 연구보고서
  - 데이터·코드 패키지
  appearance:
    location: null
    available_steps:
    - m1
    - m4
    - quest
    conditions:
    - quest_started
- npc_id: npc_stn-04_02
  name: 송다은
  role: 실험·분석 담당
  rank: null
  personality:
  - 반복되는 실험 속에서도 고도의 집중력을 유지하는 묵묵한 노력파입니다.
  - 사소한 환경 변화가 실험 결과에 미치는 영향을 누구보다 잘 알고 있어 매사 조심스럽습니다.
  - 말수가 적고 차분하지만, 실험 장비 다루는 손끝은 누구보다 빠르고 정확합니다.
  likes:
  - 캘리브레이션(영점 조절)이 완벽하게 끝난 분석 장비
  - 소음 없이 조용한 이른 아침의 실험실
  dislikes:
  - 장비 사용 대장에 기록을 남기지 않고 가는 행동
  - 세척이 덜 되어 오염된 비커와 피펫
  speech_habits:
  - 시료 전처리 단계에서 프로토콜을 정확히 준수하셨는지 다시 확인해보세요.
  - 기기 분석을 시작하기 전에 표준 물질부터 먼저 측정하는 것이 안전합니다.
  responsibilities: []
  appearance:
    location: null
    available_steps: []
- npc_id: npc_stn-04_03
  name: 홍하은
  role: 현장조사 담당
  rank: null
  personality:
  - 현장 조사에서의 변수를 통제하기 위해 항상 플랜 B를 준비하는 철두철미한 성격입니다.
  - 거친 야외 환경에서도 지치지 않는 강인한 체력과 긍정적인 마인드를 가졌습니다.
  - 시료의 오염을 방지하기 위해 현장 채취 가이드라인을 칼같이 지킵니다.
  likes:
  - 날씨가 맑아 계획대로 진행되는 현장 채취 일정
  - 라벨링이 완벽하게 분류되어 아이스박스에 담긴 시료들
  dislikes:
  - 현장 안전 수칙을 가볍게 여기고 보호구를 미착용하는 행위
  - 채취 위치의 GPS 좌표를 누락하는 실수
  speech_habits:
  - 현장 시료는 채취 즉시 고유 ID를 부여하고 냉장 보관해야 성분이 변하지 않습니다.
  - 야외에서는 예상치 못한 변수가 많으니, 체크리스트를 두 번씩 확인합시다.
  responsibilities: []
  appearance:
    location: null
    available_steps: []
- npc_id: npc_stn-04_04
  name: 윤예은
  role: 품질·윤리 담당
  rank: null
  personality:
  - 연구 윤리와 실험실 안전 규정을 타협 없이 고수하는 원칙주의자입니다.
  - 부정행위나 데이터 조작의 위험성을 경계하며, 사소한 기록 누락도 엄격하게 지적합니다.
  - 차가워 보이지만 연구원들이 안전하게 일할 수 있는 환경을 만드는 데 자부심이 있습니다.
  likes:
  - 작성 기준을 완벽히 충족한 연구노트
  - 안전 물질 보건 자료(MSDS)가 최신화된 보관함
  dislikes:
  - 실험 결과를 미화하기 위해 이상치(Outlier)를 임의로 삭제하는 행위
  - 폐시약 처리 규정을 어기고 싱크대에 흘려보내는 행동
  speech_habits:
  - 실험 과정에서 발생한 모든 가공되지 않은 로우 데이터(Raw Data)를 보여주십시오.
  - 규정을 준수하는 것이 연구의 신뢰성을 지키는 가장 빠른 길입니다.
  responsibilities: []
  appearance:
    location: null
    available_steps: []
- npc_id: npc_stn-04_05
  name: 최지안
  role: 의뢰기관 담당자
  rank: null
  personality:
  - 예산과 기한 내에 확실한 성과를 원하는 철저한 비즈니스 마인드의 소유자입니다.
  - 학술적인 깊이보다는 우리 기관의 사업에 즉각적으로 활용할 수 있는 실용적 데이터를 원합니다.
  - 피드백이 매우 빠르며, 요구사항이 명확하지만 그만큼 기대치도 높습니다.
  likes:
  - 전문 용어를 배제하고 핵심만 요약된 시각화 보고서
  - 약속된 분석 기한보다 하루 일찍 도착하는 중간 공유
  dislikes:
  - 전문가들만 이해할 수 있는 복잡한 수식 위주의 설명
  - 일정에 차질이 생겼음에도 미리 공유하지 않는 태도
  speech_habits:
  - 이 분석 결과가 저희가 추진 중인 신제품 개발에 어떤 시사점을 주는지 설명해주시겠습니까?
  - 보고서의 요약본만 보고도 의사결정을 내릴 수 있도록 직관적으로 정리해주십시오.
  responsibilities: []
  appearance:
    location: null
    available_steps: []
- npc_id: npc_stn-04_06
  name: 장지민
  role: 실험실 선임
  rank: 선임
  personality:
  - 실험실의 모든 장비 히스토리를 꿰뚫고 있는 베테랑이자 실무의 달인입니다.
  - 후배들의 사소한 실수도 눈감아주지 않지만, 해결책을 스스로 찾을 수 있도록 페이스메이커 역할을 해줍니다.
  - 이론과 실제 실험의 괴리를 좁히는 노하우를 전수하는 데 보람을 느낍니다.
  likes:
  - 장비 매뉴얼을 스스로 정독하고 질문하는 신입
  - 실험이 끝난 후 완벽하게 정리정돈된 실험대
  dislikes:
  - 장비가 고장 났는데도 혼날까 봐 숨기고 방치하는 행동
  - 눈대중으로 시약을 계량하는 대충대충 하는 습관
  speech_habits:
  - 장비가 평소와 다른 소리를 내거나 수치가 튀면, 즉시 작동을 멈추고 원인부터 파악해야 합니다.
  - 직접 매뉴얼의 트러블슈팅 파트를 정독해보고, 어떤 단계에서 막혔는지 말씀해주세요.
  responsibilities:
  - 시료점검표
  - 사용보류 목록
  appearance:
    location: null
    available_steps:
    - m2
- npc_id: npc_stn-04_07
  name: 윤예린
  role: 연구실 책임자
  rank: null
  personality:
  - 연구실의 거시적인 방향성을 설정하고 예산을 확보하는 리더십을 가졌습니다.
  - 개별 실험의 세부 수치보다는 전체 연구 과제의 목표 달성 여부와 논리적 흐름을 중시합니다.
  - 연구원들의 역량 강화를 위해 스스로 고민하고 답을 도출하도록 유도하는 교육관을 가졌습니다.
  likes:
  - 연구의 한계를 인정하고 개선 방향을 명확히 제시하는 보고
  - 학제간 융합이나 새로운 분석 기법을 시도하려는 적극성
  dislikes:
  - 타 연구실의 데이터를 그대로 모방하거나 답습하는 태도
  - 부서 간의 소통 부재로 발생하는 중복 실험
  speech_habits:
  - 우리가 이 분석을 통해 궁극적으로 해결하고자 하는 핵심 질문이 무엇인지 잊지 마세요.
  - 단순한 사실 나열을 넘어, 이 데이터가 가지는 학술적 혹은 산업적 가치를 스스로 도출해보십시오.
  responsibilities:
  - 실험 우선순위표
  - 예약조정안
  appearance:
    location: null
    available_steps:
    - m3
