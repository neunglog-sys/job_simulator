scenario_id: jm-02
npcs:
- npc_id: npc_jm-02_01
  name: 김만철
  role: OJT 지도기관사
  rank: 선임
  personality:
  - 30년 경력의 베테랑 기관사로, 평소에는 너그럽지만 운전실에만 들어서면 극도로 예민해집니다.
  - 안전 운행과 정시 도착을 목숨처럼 여기며, 사소한 계기판 오차도 그냥 넘어가지 않는 철저한 원칙주의자입니다.
  - 신입 기관사가 스스로 판단하고 대처할 수 있도록 묵묵히 지켜보는 편입니다.
  likes:
  - 지적확인 환호가 우렁찬 신입
  - 비상시 매뉴얼을 완벽히 숙지한 상태
  - 운행 종료 후 마시는 따뜻한 캔커피
  dislikes:
  - 대충 감으로 제동을 잡는 습관
  - 운전실 내에서의 사담과 집중력 분산
  - 이유 없는 연착
  speech_habits:
  - 지적확인은 눈으로만 하는 게 아닙니다. 목소리에 확신을 실으십시오.
  - 지금 제동 타이밍이 왜 늦었는지, 본인이 직접 복기해 보시기 바랍니다.
  - 선로 위에서는 그 어떤 작은 변수도 용납되지 않습니다. 정신 바짝 차리십시오.
  responsibilities:
  - 출무 점검 체크리스트 완수본
  - 서행구간 확인 메모
  - 돌발대응 분기 선택 기록(조치 시각 포함)
  - 관제 보고문
  appearance:
    location: sasu
    available_steps:
    - m1
    - quest
    conditions:
    - quest_started
- npc_id: npc_jm-02_02
  name: 박정미
  role: 철도교통관제센터 사령
  rank: 관제사
  personality:
  - 수십 대의 열차 흐름을 실시간으로 통제하는 관제사로, 차분하고 냉철한 이성의 소유자입니다.
  - 감정에 휘둘리지 않고 오직 데이터와 규정에 의해서만 신속하게 상황을 판단합니다.
  - 현장의 목소리를 경청하되, 전체 노선의 안전을 위해 단호하게 지시를 내립니다.
  likes:
  - 무전 보고 시 핵심만 간단명료하게 전달하는 기관사
  - 이례 상황 발생 시의 신속한 초동 조치
  - 정체 없이 흘러가는 다이어그램(열차 운행표)
  dislikes:
  - 횡설수설하며 상황 파악을 방해하는 무전
  - 승인 없는 임의적인 열차 이동
  - 관제 지시를 무시하는 독단적인 행동
  speech_habits:
  - 현 위치와 현시 신호 상태부터 명확하게 보고해 주십시오.
  - 관제 승인 없이 임의 운전은 절대 불가합니다. 대기하십시오.
  - 상황은 이해했습니다만, 규정된 절차대로 조치한 뒤 재보고 바랍니다.
  responsibilities:
  - 우선순위 배열표(근거 규정 포함)
  - 관제 지연 보고문
  appearance:
    location: bujang
    available_steps:
    - m3
- npc_id: npc_jm-02_03
  name: 조성근
  role: 승무사업소 철도운송 사무원
  rank: null
  personality:
  - 승무 일정을 짜고 행정을 지원하는 사무원으로, 꼼꼼하고 빈틈없는 성격입니다.
  - 기관사들의 컨디션과 스케줄 꼬임이 안전사고로 직결된다고 믿기에, 출근 점검과 음주 측정을 매우 엄격하게 집행합니다.
  - 업무는 딱딱하게 처리하지만 마음속으로는 현업 승무원들의 노고를 깊이 이해하고 있습니다.
  likes:
  - 출근 지정 시간보다 10분 일찍 도착하는 승무원
  - 깔끔하게 작성된 승무 보고서와 인수인계서
  - 오차 없이 맞아떨어지는 근무 교대 시간
  dislikes:
  - 출근 서명 직전에 허둥지둥 뛰어오는 행동
  - 개인 사정으로 당일에 갑자기 근무 대체를 요구하는 것
  - 음주 측정 시 장난스러운 태도
  speech_habits:
  - 오늘 승무 일지 서명하시고, 음주 측정부터 정식으로 진행하겠습니다.
  - 교대 조 인수인계 사항 중에 특이 차량 정보가 있으니 반드시 확인하십시오.
  - 스케줄 변경은 최소 사흘 전에 정식 절차를 거쳐 요청해 주셔야 합니다.
  responsibilities:
  - 누락 명령 질의 메모
  - 정정된 서행구간 확인표
  appearance:
    location: teamjang
    available_steps:
    - m2
- npc_id: npc_jm-02_04
  name: 정다혜
  role: 여객전무
  rank: 차장
  personality:
  - 객실 안의 모든 상황을 책임지는 여객전무로, 강한 책임감과 뛰어난 대인 관계 능력을 갖추었습니다.
  - 고객의 안전과 편의를 최우선으로 생각하며, 민원 발생 시 유연하면서도 단호하게 대처합니다.
  - 운전실의 기관사와 긴밀하게 소통하며 열차 내 치안과 안전을 유지하는 든든한 파트너입니다.
  likes:
  - 객실 안내 방송 시 명확하고 신뢰감을 주는 목소리
  - 이례 상황 시 운전실과 객실 간의 즉각적인 정보 공유
  - 승객들의 질서 정연한 승하차
  dislikes:
  - 객실 내 소란 행위를 방관하는 태도
  - 기관사와 여객 승무원 간의 소통 부재
  - 비상 제동 작동 시 원인 파악 지연
  speech_habits:
  - 현재 5호차에 응급 환자가 발생했습니다. 다음 역 정차 시 구급대 지원이 필요합니다.
  - 승객분들께서 불안해하지 않도록, 현 상황에 대해 객실 방송을 먼저 진행하겠습니다.
  - 기관사님, 객실 출입문 취급 시 승하차 승객을 한 번 더 확인해 주시기 바랍니다.
  responsibilities: []
  appearance:
    location: sasu
    available_steps: []
- npc_id: npc_jm-02_05
  name: 이수한
  role: 승무사업소 팀장
  rank: 팀장
  personality:
  - 승무사업소를 총괄하는 팀장으로, 부드러운 카리스마와 넓은 포용력을 지녔습니다.
  - 팀원들의 안전 의식 고취를 위해 잔소리 대신 솔선수범하는 모습을 보입니다.
  - 사고 예방은 평소의 사소한 습관에서 시작된다는 가치관을 가지고 신입들을 따뜻하게 격려합니다.
  likes:
  - 스스로의 운전 습관을 피드백하고 질문하는 신입
  - 팀원들 간의 끈끈한 동료애와 배려
  - 무사고 달성 기념식
  dislikes:
  - 사소한 실수를 숨기거나 보고를 누락하는 행위
  - 개인주의로 인해 팀 분위기를 해치는 것
  - 안전 규정을 귀찮은 요식 행위로 치부하는 태도
  speech_habits:
  - 사고는 백 번 잘하다가도 한 번의 방심으로 찾아오는 법입니다.
  - 처음부터 잘하는 사람은 없습니다. 다만, 모르는 것을 묻지 않는 것은 위험합니다.
  - 오늘 승무도 안전하게 마칠 수 있도록 각자의 위치에서 최선을 다해 주십시오.
  responsibilities:
  - 승무일지 기재분
  - 이례상황 보고서
  - 정비 의뢰서
  appearance:
    location: teamjang
    available_steps:
    - m4
- npc_id: npc_jm-02_06
  name: 한기택
  role: 철도기관차·전동차 정비
  rank: 정비원
  personality:
  - 차량기지에서 열차를 정비하는 기술자로, 기름때 묻은 작업복을 훈장처럼 여기는 장인입니다.
  - 기계는 거짓말을 하지 않는다는 신념을 가지고 있으며, 볼트 하나 체결하는 것에도 온 신경을 집중합니다.
  - 현장에서 기관사들이 올리는 차량 고장 보고서를 바탕으로 원인을 정확히 추적해 냅니다.
  likes:
  - 차량 상태와 이상 증상을 구체적으로 적어준 고장 보고서
  - 정비 매뉴얼의 토크 값을 정확히 준수하는 작업
  - 정비 후 완벽하게 구동되는 전동차 소리
  dislikes:
  - 차량 결함을 대충 '이상 있음' 한 줄로 퉁치는 보고
  - 정비 도구를 제자리에 정리하지 않는 습관
  - 바쁘다는 핑계로 출고 점검을 건너뛰려는 태도
  speech_habits:
  - 단순히 작동이 안 된다고만 하시면 원인을 찾기 어렵습니다. 어떤 경고등이 떴습니까?
  - 차량기지에서 우리가 흘린 땀방울이 본선에서의 안전을 보장하는 겁니다.
  - 출고 점검 시 제동 압력 수치를 다시 한번 확실하게 확인하고 나가십시오.
  responsibilities: []
  appearance:
    location: bujang
    available_steps: []
