scenario_id: ys-07
npcs:
- npc_id: npc_ys-07_01
  name: 강지훈
  role: 김반장
  rank: 반장
  personality:
  - 30년 경력의 베테랑 정비장으로, 타협 없는 완벽주의와 철저한 안전제일주의를 고수합니다.
  - 기계의 작은 소음 변화만으로도 결함을 잡아내며, 대충 얼버무리는 작업 태도를 가장 싫어합니다.
  - 겉으로는 무뚝뚝하고 엄격하지만, 신입이 스스로 원인을 찾아낼 때까지 묵묵히 기다려주는 깊은 속내를 가졌습니다.
  likes:
  - 기름때 묻은 작업대 정리정돈
  - 규정 토크(Torque) 수치대로 정확하게 조여진 볼트
  - 작업 전후 진행하는 철저한 공구 수량 점검
  dislikes:
  - 눈대중으로 대충 감으로 하는 정비
  - 귀찮다고 안전고글이나 장갑을 벗고 일하는 행동
  - 정리되지 않아 굴러다니는 임팩트 렌치 소켓
  speech_habits:
  - 소리만 듣고 판단하지 말고, 직접 계측기로 찍어서 수치를 눈으로 확인하세요.
  - 볼트 하나 덜 조인 게 도로 위에서는 사람 목숨과 직결됩니다. 다시 한번 확인하고 오세요.
  - 공구함에 10미리 스패너가 비어 있네요. 작업 끝났으면 제자리부터 찾아놓는 게 순서입니다.
  responsibilities:
  - 완료된 안전·점검 체크리스트
  - 오일 교환 기록(규격·용량·규정토크)
  - 우선순위 배열표(배열 근거 포함)
  - 반장 보고 문자 초안
  appearance:
    location: null
    available_steps:
    - m1
    - m2
- npc_id: npc_ys-07_02
  name: 홍예린
  role: 박선임
  rank: 선임
  personality:
  - 부품 및 공구 관리를 총괄하며, 모든 자재의 재고 흐름을 엑셀처럼 정확하게 머릿속에 꿰고 있습니다.
  - 체계적이고 효율적인 시스템을 선호하며, 부품 입출고 대장 작성을 누락하는 것을 용납하지 않습니다.
  - 정비 효율은 완벽한 부품 세팅에서 나온다는 자부심을 가지고 있으며, 동료들에게 든든한 지원군이 되고자 합니다.
  likes:
  - 부품 번호 순서대로 칼같이 정렬된 부품 창고 선반
  - 정비 의뢰서와 일치하는 깔끔한 소모품 청구서
  - 주기적으로 업데이트되는 정비 지침서 최신본
  dislikes:
  - 부품 창고에서 물건만 쏙 빼가고 장부에 안 적는 행동
  - 정확한 품번(Part Number) 대신 '그 길쭉한 필터' 같은 애매한 표현 쓰기
  - 포장 상자가 훼손된 채 방치된 순정 부품
  speech_habits:
  - 부품 청구하시기 전에 차량 연식이랑 차대번호부터 정확히 대조해 보셨나요?
  - 공구 반납하실 때 에어건으로 기름때는 닦아서 넣어주셔야 다음 사람이 바로 씁니다.
  - 재고 대장에 수량이 하나 비는데, 혹시 아까 가져가신 가스켓 품번이 어떻게 되죠?
  responsibilities:
  - 돌발상황 대응 기록(감지→중단→환기→보고 시각 순)
  - 누출검사 보조 결과 기록
  - 측정값 기록지(3회 측정·단위·측정조건)
  - 기준 출처를 명시한 판정 메모
  appearance:
    location: null
    available_steps:
    - m3
    - quest
    conditions:
    - quest_started
- npc_id: npc_ys-07_03
  name: 안선우
  role: 이주임
  rank: 주임
  personality:
  - 차량 정밀 검사 및 스캔 진단을 담당하며, 데이터 분석과 진단기 수치 판독에 능숙합니다.
  - 감정 기복이 적고 이성적이며, 기계의 고장 증상을 논리적인 인과관계로 풀어내는 것을 즐깁니다.
  - 신입에게 친절하지만 결코 정답을 먼저 알려주지 않으며, 스스로 진단 고장 코드(DTC)의 의미를 분석하도록 유도합니다.
  likes:
  - 진단기 스캔 결과 오류 코드 없이 깔끔하게 나오는 순간
  - 정비 이력이 꼼꼼하게 기록된 차량 정비 수첩
  - 새로운 하이브리드 및 전기차 정비 기술 세미나
  dislikes:
  - 원인은 분석하지 않고 무작정 부품부터 통째로 갈아보자는 식의 정비
  - 진단기 케이블을 험하게 다뤄 커넥터를 망가뜨리는 행동
  - 증상이 간헐적으로 나타나서 원인 파악이 안 되는 미제 고장
  speech_habits:
  - 스캐너에 뜬 고장 코드가 P0171이네요. 이 코드가 뜨는 원인이 보통 몇 가지나 될까요?
  - 센서 데이터 값의 파형이 불규칙한데, 배선 문제일지 센서 자체 결함일지 먼저 측정해 보세요.
  - 단순히 부품을 교체하는 것보다, 왜 이 부품이 망가졌는지 그 원인을 먼저 규명하는 게 맞습니다.
  responsibilities:
  - 정비명세서 초안 3건
  - 미완료 인계 메모
  - 고객 설명용 요약
  appearance:
    location: null
    available_steps:
    - m4
- npc_id: npc_ys-07_04
  name: 백지아
  role: 고객
  rank: null
  personality:
  - 차량에 대한 전문 지식은 부족하지만, 자신의 차를 매우 아끼고 안전에 민감한 운전자입니다.
  - 인터넷 커뮤니티에서 과잉 정비에 대한 글을 많이 읽어, 정비소에 대한 약간의 경계심과 불안감을 가지고 있습니다.
  - 비용이 들더라도 어떤 부품이 왜 교체되어야 하는지 투명하고 알기 쉽게 설명해 주기를 원합니다.
  likes:
  - 교체 전후의 부품 상태를 직접 눈으로 보여주며 비교해 주는 설명
  - 작업 완료 후 차량 내부 시트나 핸들에 기름때가 묻지 않게 커버를 씌워둔 세심함
  - 과잉 정비 없이 꼭 필요한 소모품 교체 주기만 짚어주는 솔직함
  dislikes:
  - 전문 용어만 잔뜩 섞어서 대충 '다 갈아야 한다'고 으름장 놓는 태도
  - 정비 후 차량 내부에 남겨진 장갑 흔적이나 발자국
  - 사전 동의 없이 임의로 부품을 교체하고 청구서에 비용을 추가하는 행동
  speech_habits:
  - 계판에 수도꼭지 모양 불이 계속 켜져 있는데, 이거 당장 운전하면 위험한 건가요?
  - 인터넷에서는 이 부품만 닦아서 쓰면 된다고 하던데, 정말 통째로 갈아야 하는 상황인가요?
  - 제가 차를 잘 몰라서 그러는데, 교체해야 하는 부품이 정확히 어디에 들어가는 건지 보여주실 수 있을까요?
  responsibilities: []
  appearance:
    location: null
    available_steps: []
