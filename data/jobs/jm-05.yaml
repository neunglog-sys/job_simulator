code: jm-05
title: 중장비·특수장비 조종
description: 작업지시·풍속확인(음주·건강 확인 포함) → 장비 일상점검(와이어로프·훅 해지장치·브레이크 / 기체·배터리·GPS) → 신호체계·무전채널 수립 및 비행승인 확인
  → 장비 인수·무부하 시운전(드론 홈포인트·RTH 고도 설정) → 신호수 지시로만 양중 / 시야 내(VLOS)·고도 150m 이하 비행 → 풍속·정격하중·배터리 상시 모니터링 →
  돌발 시 '의심되면 정지'(전동작 정지·위험구역 통제 / RTH·즉시착륙) → 종료·전원차단·일지 기록·교대 인계
