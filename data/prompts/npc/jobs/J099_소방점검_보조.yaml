content_variants:
- category: 소방·구조·방재 대응
  module: 안전·위험판단형
  rag_status: 부분
  workflow: 출동지령 접수·복명복창 → 개인안전장비·공기호흡기 점검 → 출동·소방용수 위치 확인 → 현장도착·선착대 무전보고 → 통제선 설치·위험요인 식별 → 진압·구조활동 보조 → 잔화확인·안전조치 → 귀소·소방활동일지
    작성
