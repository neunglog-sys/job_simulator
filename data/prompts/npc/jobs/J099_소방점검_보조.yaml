  job_name: 소방점검 보조
  family_id: F23
  family_name: 경비·소방·현장안전
  module: 안전·위험판단형
review:
  status: integrated_research
  generated: true
  human_review_required: false
prompt_contract:
  npc_visible:
    work_targets:
    - 출입자
    - 순찰구역
    - 화재
    - 위험요소
    - 안전규정
    npc_roles:
    - 보안팀장
    - 방문객
    - 시설담당
    outputs:
    - 순찰일지
    - 위험신고서
    - 출입기록
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J099-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[소방점검 보조/경비·소방·현장안전/안전·위험판단형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 출입자, 순찰구역, 화재/위험요소, 안전규정. 주요상대/NPC는
    보안팀장, 방문객, 시설담당. 핵심산출물은 순찰일지, 위험신고서, 출입기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 경비·소방·현장안전의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
