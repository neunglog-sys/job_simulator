      - 도착·상황·철수 무전보고
      - 소방활동일지
      - 구조활동보고서
      - 위험징후 체크리스트
      mission_candidate: 신고요지에서 화재유형(일반·위험물·구조)과 대응단계를 분류하고 필수정보 3요소(위치·규모·요구조자)를 확인한다
    coach_private:
      success_criteria:
      - 주소·대상물·요구조자 유무를 누락 없이 파악하고 불명확 정보는 상황실에 재확인
      failure_patterns:
      - 지령 내용을 임의로 추측하거나 복명복창 없이 출동 준비
