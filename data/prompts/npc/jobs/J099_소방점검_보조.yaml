- chunk_id: J099-S4
  stage_id: S4
  name: 검수·판단
  goal: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다.
  rag_chunk_text: '[소방점검 보조/경비·소방·현장안전/안전·위험판단형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 출입자, 순찰구역, 화재/위험요소, 안전규정. 주요상대/NPC는
