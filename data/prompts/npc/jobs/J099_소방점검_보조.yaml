      - 대상물 소방계획서·건물도면
      - 장비점검표
      - 표준작전절차(SOP) 요약 매뉴얼
      npc_roles:
      - 현장지휘관(안전센터 팀장)
      - 선임 반장(진압대)
      - 119종합상황실 요원
      outputs:
