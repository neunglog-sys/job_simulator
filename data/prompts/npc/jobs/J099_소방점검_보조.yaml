  goal: 결과, 근거, 남은 이슈, 다음 액션을 공유한다.
  rag_chunk_text: '[소방점검 보조/경비·소방·현장안전/안전·위험판단형] 보고·인계: 결과, 근거, 남은 이슈, 다음 액션을 공유한다. 업무대상은 출입자, 순찰구역, 화재/위험요소, 안전규정. 주요상대/NPC는
