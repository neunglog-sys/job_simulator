  stage_id: S2
  name: 자료·현황 확인
  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[소방점검 보조/경비·소방·현장안전/안전·위험판단형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 출입자, 순찰구역, 화재/위험요소, 안전규정.
    주요상대/NPC는 보안팀장, 방문객, 시설담당. 핵심산출물은 순찰일지, 위험신고서, 출입기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 경비·소방·현장안전의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
