    - 출동지령서(신고요지)
    - 관내 소방용수시설 지도
    - 대상물 소방계획서·건물도면
    - 장비점검표
    - 표준작전절차(SOP) 요약 매뉴얼
    outputs:
    - 차량·장비점검일지
    - 도착·상황·철수 무전보고
    - 소방활동일지
    - 구조활동보고서
    - 위험징후 체크리스트
    sudden_events:
    - 공기호흡기 잔압 경보
    - 소화전 동결·수압 저하
    - 요구조자 추가 제보
    - 통제선 안으로 진입하려는 민원인
    - 무전 혼선·불통
  stages:
  - stage_id: S1
    name: 지령접수·상황 파악
    goal: 출동지령서의 화재종별·주소·요구조자 유무를 정확히 파악하고 복명복창한다
