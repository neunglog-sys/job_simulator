  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[블로그·뉴스레터 운영자/콘텐츠·SNS운영/제작·상태판단형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 게시물, 썸네일, 업로드 일정, 댓글/반응.
    주요상대/NPC는 콘텐츠팀장, 디자이너, 고객/팔로워. 핵심산출물은 콘텐츠 캘린더, 게시문안, 댓글 대응안. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 콘텐츠·SNS운영의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
