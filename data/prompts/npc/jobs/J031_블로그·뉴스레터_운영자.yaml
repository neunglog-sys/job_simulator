  family_name: 콘텐츠·SNS운영
  module: 제작·상태판단형
review:
  status: researched_needs_human_review
  generated: true
  human_review_required: true
prompt_contract:
  npc_visible:
    work_targets:
    - 게시물
    - 썸네일
    - 업로드 일정
    - 댓글
    - 반응
    npc_roles:
    - 콘텐츠팀장
    - 디자이너
    - 고객
    - 팔로워
    outputs:
    - 콘텐츠 캘린더
    - 게시문안
    - 댓글 대응안
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
