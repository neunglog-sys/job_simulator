  family_id: F21
  family_name: 청소·객실관리
  module: 작업순서·절차형
review:
  status: researched_needs_human_review
  generated: true
  human_review_required: true
prompt_contract:
  npc_visible:
    work_targets:
    - 객실
    - 구역
    - 비품
    - 청소순서
    - 점검표
    npc_roles:
    - 하우스키핑 리더
    - 고객
    - 프론트
    outputs:
    - 청소완료표
    - 비품보충표
    - 이상보고
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J093-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[비품보충 담당/청소·객실관리/작업순서·절차형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 객실/구역, 비품, 청소순서, 점검표. 주요상대/NPC는
    하우스키핑 리더, 고객, 프론트. 핵심산출물은 청소완료표, 비품보충표, 이상보고. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 청소·객실관리의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
