    하우스키핑 리더, 고객, 프론트. 핵심산출물은 청소완료표, 비품보충표, 이상보고. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 청소·객실관리의 업무대상과 산출물을
