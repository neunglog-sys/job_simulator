  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[면접일정 조율 담당/인사·채용·교육운영/대인응대형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 지원자 정보, 면접 일정, 교육 일정, 근태자료.
    주요상대/NPC는 지원자, 면접관, 교육생, 강사. 핵심산출물은 면접일정표, 안내메일, 교육운영 체크리스트. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 인사·채용·교육운영의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
