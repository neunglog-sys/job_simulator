  stage_id: S4
  name: 검수·판단
  goal: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다.
  rag_chunk_text: '[배송운전 보조/배송·운반·하역/돌발상황 대처형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 배송지, 운송장, 적재품, 시간표, 도로/현장상황. 주요상대/NPC는
