  stage_id: S2
  name: 자료·현황 확인
  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[배송운전 보조/배송·운반·하역/돌발상황 대처형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 배송지, 운송장, 적재품, 시간표, 도로/현장상황.
    주요상대/NPC는 배차담당, 고객, 창고담당. 핵심산출물은 배송현황표, 지연보고, 인수증. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 배송·운반·하역의 업무대상과
    산출물을 벗어난 미션 생성 금지.'
