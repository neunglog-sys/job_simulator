      - 서행구간 확인표
      - 우선순위 배열표·관제 보고문
      - 돌발대응 분기 기록(조치 시각 포함)
      - 승무일지 기재분
      - 이례상황 보고서
      - 교대 인계 메모
      - 정비 의뢰서
      mission_candidate: 오늘 발생한 이례사항을 시각·위치(km 지점)·조치·미결사항 순으로 요약해 승무일지를 작성하고 교대자 인계까지 완료하기
    coach_private:
      success_criteria:
      - 사실과 추측을 구분해 기록하고
      - 정비 의뢰·미결사항을 누락 없이 다음 승무원에게 전달
      failure_patterns:
      - 이상 사항을 빠뜨린 채 인계해 다음 승무에 위험을 전가하거나
      - 시각·위치 기록 누락
  missions:
  - mission_id: JM-02-01
    situation_type: 정상업무
    difficulty: 보통
    npc_visible:
      npc: 김만철 선임기관사(OJT 지도기관사)
      request_line: 신입, 출무 전에 오늘 운전명령하고 차량 인수 점검부터 체크리스트 순서대로 해 봐라, 하나라도 빼먹으면 출고 못 한다.
      materials:
      - 운전명령서(임시 서행구간 2건 포함)
      - 차량 인수 점검 체크리스트
      - 제동시험 기준표(제동관 압력 범위)
      - 운전취급규정 발췌
      user_mission: 출무 신고부터 차량 인수까지 점검 항목을 올바른 순서로 완수하고, 임시 서행구간 2건을 찾아 복명복창으로 보고한다
      outputs:
      - 출무 점검 체크리스트 완수본
      - 서행구간 확인 메모
      sudden_event: '점검 중 출입문 표시등 1개가 점멸 → 정비원 호출 후 확인 vs 사소하니 그냥 진행 중 선택(정답: 호출·확인)'
    coach_private:
      required_actions:
      - 승무적합성검사(음주측정·건강상태) 결과를 먼저 확인
      - 운전명령서·다이아에서 임시 서행구간과 특이명령을 표시
      - 인수 체크리스트로 제동장치·출입문·열차방호장치(방호무선) 순서대로 점검
      - 제동시험 수치가 기준표 범위 내인지 대조 확인
      - 점검 결과와 서행구간을 선임기관사에게 복명복창으로 보고
      success_criteria:
      - 점검 순서 준수 + 서행구간 2건 모두 식별 + 수치 대조 후 복명복창 보고 완료
      failure_patterns:
      - 음주측정을 건너뛰고 차량으로 직행
      - 서행구간 1건 누락
      - 수치 확인 없이 '이상무' 보고
    scorer_private:
      rag_link: F24 부분(J101)
  - mission_id: JM-02-02
    situation_type: 자료·정보 누락
    difficulty: 보통
    npc_visible:
      npc: 조성근 배차 담당(승무사업소 철도운송 사무원)
      request_line: 이 운전명령서 그대로 들고 나가면 되니까 빨리 확인 서명하고 출무 준비해, 뒤에 사람 밀렸어.
      materials:
      - 운전명령서(선로 보수구간 서행 1건 누락)
      - 전일 승무일지(보수구간 서행 기록 있음)
      - 관제 통보 메모
      user_mission: 운전명령서를 전일 승무일지·관제 통보와 대조해 누락된 임시 서행 명령을 찾아내고, 서명 전에 배차 담당·관제에 확인을 요청한다
      outputs:
      - 누락 명령 질의 메모
      - 정정된 서행구간 확인표
      sudden_event: 배차 담당이 '그 서행 어제 해제됐다'고 구두로만 답변 → 관제 공식 통보(문서) 재확인 요구 여부가 추가 평가
    coach_private:
      required_actions:
      - 운전명령서의 서행구간 목록을 항목별로 확인
      - 전일 승무일지의 선로 보수구간 기록과 대조
      - 불일치 지점(OO역~OO역 45km/h 서행 누락)을 식별
      - '''의심되면 정지'' 원칙대로 서명을 보류하고 배차·관제에 표준 용어로 확인 질의'
      - 정정된 명령을 수령해 복명복창 후 서명
      success_criteria:
      - 누락 서행구간을 스스로 발견 + 서명 보류 후 문서로 확인 요청 + 정정본 수령까지 완료
      failure_patterns:
      - 재촉에 밀려 그대로 서명·출무해 서행구간 과속 진입 상황 발생
      - 구두 답변만 믿고 문서 확인 생략
    scorer_private:
      rag_link: F24 부분(J101)
  - mission_id: JM-02-03
    situation_type: 우선순위 충돌
    difficulty: 어려움
    npc_visible:
      npc: 박정미 관제사(철도교통관제센터 사령)
      request_line: 지금 후속 열차가 줄줄이 밀리고 있으니 점검은 간단히 끝내고 일단 빨리 출발부터 시키게.
      materials:
      - 지연 현황판(출발 15분 지연)
      - 미완료 점검 항목 3건(제동 재시험·출입문 재확인·ATS 점검)
      - 운전취급규정 발췌('제동시험 미완료 시 출발 금지')
      - 관제 보고 표준문안
      user_mission: 정시성 압박 속에서 미완료 항목의 처리 우선순위를 배열하고, '제동시험 미완료 시 출발 금지' 규정을 근거로 관제와 선임에게 보고한다
      outputs:
      - 우선순위 배열표(근거 규정 포함)
      - 관제 지연 보고문
      sudden_event: 대기 승객 민원 방송 요청이 추가로 접수 → 차장(여객전무)에게 위임하고 점검에 집중하는 판단이 정답
    coach_private:
      required_actions:
      - 미완료 3건을 안전필수/지연허용으로 분류
      - 운전취급규정에서 출발 금지 조건(제동시험) 확인
      - 제동 재시험을 1순위로 배열하고 소요시간 산정
      - 관제(사령)에 예상 지연 시간과 사유를 표준문안으로 보고
      - 선임기관사에게 배열 근거를 복명복창으로 확인받기
      success_criteria:
      - 제동 재시험 1순위 유지 + '정시보다 안전 우선' 근거를 규정 조항으로 명시 + 지연 사유·예상시간 정확 보고
      failure_patterns:
      - 관제 압박에 제동 재시험을 생략·후순위로 배열하고 출발을 선택
      - 지연 보고 없이 무단 출발 준비
    scorer_private:
      rag_link: F24 부분(J101)
  - mission_id: JM-02-04
    situation_type: 오류·안전위험
    difficulty: 어려움
    npc_visible:
      npc: 김만철 선임기관사(OJT 지도기관사)
      request_line: 전방 건널목에 지장 차량이다, 비상! 너는 매뉴얼대로 열차방호부터 걸고 사령 호출 준비해!
      materials:
      - 이례상황 대응 매뉴얼(열차방호 절차)
      - 방호무선(열차방호장치) 조작 카드
      - 관제 보고 표준문안(열차번호·위치km·상황·요청)
      - 정지수신호(신호염관) 휴대품
      user_mission: 비상정차 직후 돌발 4단계(인지·판단 → 초동 안전조치 → 보고·협조 → 복구·기록)에 따라 열차방호와 관제 보고를 분기 선택으로 완수한다. 단독 판단에 의한 운행 재개는 금지행동이다
      outputs:
      - 돌발대응 분기 선택 기록(조치 시각 포함)
      - 관제 보고문
      sudden_event: 방호무선이 응답 없음 → 정지수신호(신호염관)를 휴대하고 후방으로 이동해 수동 방호하는 예비 분기로 전환
    coach_private:
      required_actions:
      - 상황 인지·유형 판단(선로 지장물, 위치 km 지점 확인)
      - '초동 안전조치: 열차방호장치(방호무선) 발신으로 후속열차 차단을 최우선 실행'
      - 관제(사령)에 열차번호·위치·상황·요청사항을 표준문안으로 보고하고 지시 수령
      - 차장과 협조해 승객 안내(임의 하차 금지), 대피 필요 시 전차선 단전 요청 후 유도
      - 관제 지시가 있을 때까지 대기하며 조치 시각을 기록 — 무단 운행 재개 절대 금지
      success_criteria:
      - 열차방호를 현장 확인·보고보다 먼저 실행 + 표준 보고 4요소 충족 + 승객 임의 하차 통제 + 관제 승인 전 운행 재개 안 함
      failure_patterns:
      - 방호 생략하고 하차해 현장 확인부터 시도
      - 보고를 방호보다 먼저 선택
      - 지장물 제거 후 관제 승인 없이 운행 재개
    scorer_private:
      rag_link: F24 부분(J101)
  - mission_id: JM-02-05
    situation_type: 보고·인계
    difficulty: 보통
    npc_visible:
      npc: 이수한 승무사업소 팀장
      request_line: 오늘 건널목 건은 사고보고 들어가야 하니까 승무일지랑 이례상황 보고서 6하원칙으로 정리해서 교대자한테 인계까지 마쳐라.
      materials:
      - 오늘 운행 기록(시각·위치km 로그)
      - 이례상황 단편 메모(순서 뒤섞임)
      - 이례상황 보고서 양식
      - 승무일지 양식
      - 정비 의뢰서 양식
      user_mission: 흩어진 기록을 6하원칙으로 재구성해 승무일지·이례상황 보고서를 작성하고, 교대 기관사(AI)의 질문에 답하며 미결사항까지 인계한다
      outputs:
      - 승무일지 기재분
      - 이례상황 보고서
      - 정비 의뢰서
      - 교대 인계 메모
      sudden_event: 작성 중 언론사 문의 전화가 연결됨 → 개인 답변 금지, 소속장·홍보부서 이관을 선택해야 정답
    coach_private:
      required_actions:
      - 로그와 메모를 시각·위치(km)·상황·조치 순으로 사실 정리
      - 확인된 사실과 추측을 구분 표기
      - 미결사항(제동장치 점검 필요 등)을 정비원 앞 정비 의뢰서로 별도 작성
      - 교대 기관사 AI와 인계 대화로 질문(방호 시각·관제 지시 내용 등)에 정확히 응답
      - 팀장 결재용 요약본 제출
      success_criteria:
      - 6하원칙 요소 충족 + 사실
      - 추측 구분 + 방호·보고 시각 정확 기재 + 정비 의뢰·미결사항 인계 누락 없음
      failure_patterns:
      - 시각·위치 누락
      - 책임 회피성 서술('아마 문제없었음')
      - 정비 의뢰를 빠뜨려 다음 승무에 위험 전가
    scorer_private:
      rag_link: F24 부분(J101)
