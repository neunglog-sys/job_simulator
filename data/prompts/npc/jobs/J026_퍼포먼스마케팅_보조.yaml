    마케팅팀장, 디자이너, 대행사, 고객. 핵심산출물은 캠페인 기획안, 문구안, 성과요약. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 마케팅·홍보의 업무대상과
