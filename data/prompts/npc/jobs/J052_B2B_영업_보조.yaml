      - 상품 제안 비교표
      - 판매·정산 기록
      - 불만 처리 보고
      - 재고·마감 인계장
      mission_candidate: 오픈 체크리스트 10항목을 수행하고 전산재고와 실물 차이 2건을 발견해 보고한다
