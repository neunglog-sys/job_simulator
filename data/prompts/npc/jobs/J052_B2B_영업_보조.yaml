      user_mission: 정보가 없는 선물 요청에서 질문으로 니즈(받는 분·상황·예산·취향)를 파악해 니즈 메모를 완성한다
      outputs:
      - 니즈 파악 메모
      - 후보 상품 목록
      sudden_event: 고객이 '받는 분이 와인을 잘 아는 분'이라 추가 — 후보군 상향 재조정
    coach_private:
      required_actions:
      - 개방형 질문 4개 설계
      - 대화로 자연스럽게 확인
      - 답변 재확인('레드 선호가 맞으실까요')
      - 니즈 메모 작성
      - 후보군 2~3종 선별
      success_criteria:
      - 예산 단정 금지
      - 질문이 심문처럼 되지 않기
      - 니즈-후보 논리 연결
      failure_patterns:
      - 비싼 상품부터 제시
      - 고객 말 끊고 추천 강행
    scorer_private:
      rag_link: F11 직접(J049~J053)
  - mission_id: KTS-03-03
    situation_type: 우선순위 충돌
    difficulty: 어려움
    npc_visible:
