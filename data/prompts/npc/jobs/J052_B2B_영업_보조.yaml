  module: 대인응대형
  rag_status: 직접
  workflow: 오픈 준비·상품/재고 확인 → 고객 니즈 파악(질문·경청) → 상품 제안·비교 설명(페어링 추천) → 교환·환불·불만 대응 → POS 정산·마감·인계
  npc_visible:
    npc_roles:
    - 매장 점장
    - 선임 판매원(사수)
    - 까다로운 단골 고객
    - 블랙컨슈머(환불 억지)
    input_materials:
    - 상품 정보·재고 목록
    - 프로모션 안내
    - POS 매뉴얼
    - 교환·환불 규정
    - 고객 응대 스크립트
    - 시음·시향 준비물
    outputs:
    - 니즈 파악 메모
    - 상품 제안 비교표
    - 판매·정산 기록
    - 불만 처리 보고
    - 재고·마감 인계장
    sudden_events:
    - 재고 전산 불일치
    - 프로모션 조건 오해 항의
    - 시음 중 알레르기 문의
    - 블랙컨슈머 고성
    - POS 오류로 결제 지연
  stages:
