schema_version: npc.job-override.v1
job:
  job_id: J052
  job_name: B2B 영업 보조
  family_id: F11
  family_name: 영업·판매·매장응대
  module: 대인응대형
review:
  status: integrated_research
  generated: true
  human_review_required: false
prompt_contract:
  npc_visible:
    work_targets:
    - 고객니즈
    - 상품정보
    - 견적
    - 재고
    - 프로모션
    npc_roles:
    - 고객
    - 매장관리자
    - 영업팀장
    outputs:
    - 상품추천안
    - 견적초안
    - 상담기록
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J052-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[B2B 영업 보조/영업·판매·매장응대/대인응대형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 고객니즈, 상품정보, 견적/재고, 프로모션. 주요상대/NPC는
    고객, 매장관리자, 영업팀장. 핵심산출물은 상품추천안, 견적초안, 상담기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 영업·판매·매장응대의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
- chunk_id: J052-S2
  stage_id: S2
  name: 자료·현황 확인
  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[B2B 영업 보조/영업·판매·매장응대/대인응대형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 고객니즈, 상품정보, 견적/재고, 프로모션. 주요상대/NPC는
    고객, 매장관리자, 영업팀장. 핵심산출물은 상품추천안, 견적초안, 상담기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 영업·판매·매장응대의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
- chunk_id: J052-S3
  stage_id: S3
  name: 처리·제작·응대
  goal: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다.
  rag_chunk_text: '[B2B 영업 보조/영업·판매·매장응대/대인응대형] 처리·제작·응대: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다. 업무대상은 고객니즈, 상품정보, 견적/재고, 프로모션. 주요상대/NPC는
    고객, 매장관리자, 영업팀장. 핵심산출물은 상품추천안, 견적초안, 상담기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 영업·판매·매장응대의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
- chunk_id: J052-S4
  stage_id: S4
  name: 검수·판단
  goal: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다.
  rag_chunk_text: '[B2B 영업 보조/영업·판매·매장응대/대인응대형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 고객니즈, 상품정보, 견적/재고, 프로모션. 주요상대/NPC는
    고객, 매장관리자, 영업팀장. 핵심산출물은 상품추천안, 견적초안, 상담기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 영업·판매·매장응대의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
- chunk_id: J052-S5
  stage_id: S5
  name: 보고·인계
  goal: 결과, 근거, 남은 이슈, 다음 액션을 공유한다.
  rag_chunk_text: '[B2B 영업 보조/영업·판매·매장응대/대인응대형] 보고·인계: 결과, 근거, 남은 이슈, 다음 액션을 공유한다. 업무대상은 고객니즈, 상품정보, 견적/재고, 프로모션. 주요상대/NPC는
    고객, 매장관리자, 영업팀장. 핵심산출물은 상품추천안, 견적초안, 상담기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 영업·판매·매장응대의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
content_variants:
