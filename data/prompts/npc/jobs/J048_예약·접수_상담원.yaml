schema_version: npc.job-override.v1
job:
  job_id: J048
  job_name: 예약·접수 상담원
  family_id: F10
  family_name: 고객상담·CS
  module: 대인응대형
review:
  status: integrated_research
  generated: true
  human_review_required: false
prompt_contract:
  npc_visible:
    work_targets:
    - 문의내용
    - 주문정보
    - 환불
    - 교환 기준
    - 상담이력
    npc_roles:
    - 고객
    - CS팀장
    - 물류
    - 영업 담당
    outputs:
    - 상담요약
    - 처리안내문
    - 이관메모
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J048-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[예약·접수 상담원/고객상담·CS/대인응대형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 문의내용, 주문정보, 환불/교환 기준, 상담이력. 주요상대/NPC는
    고객, CS팀장, 물류/영업 담당. 핵심산출물은 상담요약, 처리안내문, 이관메모. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 고객상담·CS의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
