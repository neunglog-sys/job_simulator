  rag_chunk_text: '[예약·접수 상담원/고객상담·CS/대인응대형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 문의내용, 주문정보, 환불/교환 기준, 상담이력. 주요상대/NPC는
