schema_version: npc.job-override.v1
job:
  job_id: J100
  job_name: 환경안전 보조
  family_id: F23
  family_name: 경비·소방·현장안전
  module: 안전·위험판단형
review:
  status: integrated_research
  generated: true
  human_review_required: false
prompt_contract:
  npc_visible:
    work_targets:
    - 출입자
    - 순찰구역
    - 화재
    - 위험요소
    - 안전규정
    npc_roles:
    - 보안팀장
    - 방문객
    - 시설담당
    outputs:
    - 순찰일지
    - 위험신고서
    - 출입기록
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J100-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[환경안전 보조/경비·소방·현장안전/안전·위험판단형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 출입자, 순찰구역, 화재/위험요소, 안전규정. 주요상대/NPC는
    보안팀장, 방문객, 시설담당. 핵심산출물은 순찰일지, 위험신고서, 출입기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 경비·소방·현장안전의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
- chunk_id: J100-S2
  stage_id: S2
  name: 자료·현황 확인
  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[환경안전 보조/경비·소방·현장안전/안전·위험판단형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 출입자, 순찰구역, 화재/위험요소, 안전규정.
    주요상대/NPC는 보안팀장, 방문객, 시설담당. 핵심산출물은 순찰일지, 위험신고서, 출입기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 경비·소방·현장안전의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
- chunk_id: J100-S3
  stage_id: S3
  name: 처리·제작·응대
  goal: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다.
  rag_chunk_text: '[환경안전 보조/경비·소방·현장안전/안전·위험판단형] 처리·제작·응대: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다. 업무대상은 출입자, 순찰구역, 화재/위험요소, 안전규정. 주요상대/NPC는
    보안팀장, 방문객, 시설담당. 핵심산출물은 순찰일지, 위험신고서, 출입기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 경비·소방·현장안전의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
- chunk_id: J100-S4
  stage_id: S4
  name: 검수·판단
  goal: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다.
  rag_chunk_text: '[환경안전 보조/경비·소방·현장안전/안전·위험판단형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 출입자, 순찰구역, 화재/위험요소, 안전규정. 주요상대/NPC는
    보안팀장, 방문객, 시설담당. 핵심산출물은 순찰일지, 위험신고서, 출입기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 경비·소방·현장안전의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
- chunk_id: J100-S5
  stage_id: S5
  name: 보고·인계
  goal: 결과, 근거, 남은 이슈, 다음 액션을 공유한다.
  rag_chunk_text: '[환경안전 보조/경비·소방·현장안전/안전·위험판단형] 보고·인계: 결과, 근거, 남은 이슈, 다음 액션을 공유한다. 업무대상은 출입자, 순찰구역, 화재/위험요소, 안전규정. 주요상대/NPC는
    보안팀장, 방문객, 시설담당. 핵심산출물은 순찰일지, 위험신고서, 출입기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 경비·소방·현장안전의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
content_variants:
- category: 건설·시설 안전관리
  module: 안전·위험판단형
  rag_status: 부분
  workflow: 작업계획·위험성평가 확인 → TBM(작업 전 안전회의) 지원 → 작업허가서 검토 → 현장 순회점검 → 측정·위험요인 기록 → 시정조치 요구·작업중지 판단 → 안전점검일지 작성 → 보고·인계
  npc_visible:
    npc_roles:
    - 박 과장(안전관리자·직속상사)
    - 김 소장(협력업체 현장소장)
    - 크레인 운전원·신호수
    - 공사부장(공정 압박 역할)
    input_materials:
    - 일일 작업계획서
    - 위험성평가표
    - 작업허가서(화기·밀폐공간·고소)
    - 순회점검 체크리스트
    - 풍속·산소농도 측정값
    - 전일 점검일지·지적사항
    outputs:
    - 일일 안전점검일지
    - 작업허가서 검토의견
    - 지적사항·시정조치 기록(사진대장)
    - 작업중지 보고
    - TBM 교육일지
    - 야간 인계장
    sudden_events:
    - 개구부 덮개 파손 무전 접수
    - 고소작업자 안전대 미착용 발견
    - 협력업체의 서류 미비 작업 강행 요구
    - 순간풍속 초과 경보
    - 공정 지연 이유 작업 계속 압박
  stages:
  - stage_id: S1
    name: 작업지시·위험작업 파악
    goal: 당일 작업계획서와 위험성평가표에서 고소·밀폐공간·중장비 양중 등 허가대상 위험작업을 식별한다
    npc_visible:
      materials:
      - 일일 작업계획서
      - 위험성평가표
      - 작업허가서(화기·밀폐공간·고소)
      - 순회점검 체크리스트
      - 풍속·산소농도 측정값
      - 전일 점검일지·지적사항
      npc_roles:
      - 박 과장(안전관리자·직속상사)
      - 김 소장(협력업체 현장소장)
      - 크레인 운전원·신호수
      - 공사부장(공정 압박 역할)
      outputs:
      - 일일 안전점검일지
      - 작업허가서 검토의견
      - 지적사항·시정조치 기록(사진대장)
      - 작업중지 보고
      - TBM 교육일지
      - 야간 인계장
      mission_candidate: 작업계획서 8건 중 작업허가서가 필요한 위험작업 3건(외부비계 고소작업, 정화조 밀폐공간, 타워크레인 양중)을 골라 위험등급을 표시
    coach_private:
      success_criteria:
      - 허가대상 3건 전부 식별하고 일반작업과 구분
      failure_patterns:
      - 허가 불필요한 일반작업을 위험작업으로 혼동하거나 밀폐공간 작업을 누락
  - stage_id: S2
    name: 허가서·전일 점검기록 확인
    goal: 작업허가서 필수기재 항목(측정값·감시인·소화기 배치)과 전일 지적사항 시정 여부를 확인한다
    npc_visible:
      materials:
      - 일일 작업계획서
      - 위험성평가표
      - 작업허가서(화기·밀폐공간·고소)
      - 순회점검 체크리스트
      - 풍속·산소농도 측정값
      - 전일 점검일지·지적사항
      npc_roles:
      - 박 과장(안전관리자·직속상사)
      - 김 소장(협력업체 현장소장)
      - 크레인 운전원·신호수
      - 공사부장(공정 압박 역할)
      outputs:
      - 일일 안전점검일지
      - 작업허가서 검토의견
      - 지적사항·시정조치 기록(사진대장)
      - 작업중지 보고
      - TBM 교육일지
      - 야간 인계장
      mission_candidate: 화기·밀폐공간 허가서 2건을 절차서와 대조해 빈칸·미비 항목을 표시하고, 전일 지적 2건의 조치 완료 여부 확인
    coach_private:
      success_criteria:
      - 누락 항목을 모두 찾아 보완 요청 목록 작성
      failure_patterns:
      - 서명란만 보고 형식적으로 통과시키거나 전일 미결사항을 확인하지 않음
  - stage_id: S3
    name: 순회점검·측정 수행
    goal: 체크리스트에 따라 추락방지시설·보호구·가설전기를 점검하고 산소농도·풍속 측정값을 기록한다
    npc_visible:
      materials:
      - 일일 작업계획서
      - 위험성평가표
      - 작업허가서(화기·밀폐공간·고소)
      - 순회점검 체크리스트
      - 풍속·산소농도 측정값
      - 전일 점검일지·지적사항
      npc_roles:
      - 박 과장(안전관리자·직속상사)
      - 김 소장(협력업체 현장소장)
      - 크레인 운전원·신호수
      - 공사부장(공정 압박 역할)
      outputs:
      - 일일 안전점검일지
      - 작업허가서 검토의견
      - 지적사항·시정조치 기록(사진대장)
      - 작업중지 보고
      - TBM 교육일지
      - 야간 인계장
      mission_candidate: 12항목 체크리스트로 개구부 덮개·안전난간·비계 발판·안전대 부착설비를 점검하고 불량 개소를 사진과 함께 기록
    coach_private:
      success_criteria:
      - 점검 경로 전 구간 완료 + 불량 개소 식별·기록(본인 보호구 착용 상태 유지)
      failure_patterns:
      - 측정 없이 눈대중으로 '양호' 처리
      - 본인 안전모·안전대 미착용 점검
  - stage_id: S4
    name: 위험징후 판단·작업중지 결정
    goal: 측정값을 법정 기준과 대조해 작업 계속·보완 후 재개·즉시 중지 중 하나를 판단하고 보고한다
    npc_visible:
      materials:
      - 일일 작업계획서
