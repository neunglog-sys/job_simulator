      - 작업허가서(화기·밀폐공간·고소)
      - 순회점검 체크리스트
      - 풍속·산소농도 측정값
      - 전일 점검일지·지적사항
      npc_roles:
      - 박 과장(안전관리자·직속상사)
      - 김 소장(협력업체 현장소장)
      - 크레인 운전원·신호수
      - 공사부장(공정 압박 역할)
      outputs:
      - 일일 안전점검일지
      - 작업허가서 검토의견
      - 지적사항·시정조치 기록(사진대장)
      - 작업중지 보고
      - TBM 교육일지
      - 야간 인계장
      mission_candidate: 순간풍속·산소농도 측정값을 산업안전보건기준 발췌와 대조해 3분기 판단 후 안전관리자에게 무전 보고
    coach_private:
      success_criteria:
      - 기준 초과 시 즉시 중지 판단 + 근거 조항을 붙여 보고(공정 압박 거절)
