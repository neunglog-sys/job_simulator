      - 지적사항마다 조치 결과 또는 미결 사유·예정일이 빠짐없이 연결됨
      failure_patterns:
      - 미결사항을 인계에서 누락하거나 사진대장 번호가 일지와 불일치
  missions:
  - mission_id: YS-05-01
    situation_type: 정상업무
    difficulty: 보통
    npc_visible:
      npc: 박 과장(안전관리자)
      request_line: 오늘 3층 슬래브 개구부하고 외부비계 쪽 오전 순회 다녀와서 체크리스트에 이상 있으면 사진 찍어 표시해 와라.
      materials:
      - 순회점검 체크리스트(추락방지·보호구·가설전기 12항목)
      - 현장 배치도
      - 전일 지적사항 2건
      - 현장 사진 세트
      user_mission: 오전 순회점검을 수행해 12항목을 판정하고 불량 개소 2곳(개구부 덮개 미고정, 안전난간 탈락)을 찾아 기록한다
      outputs:
      - 판정 완료된 순회점검 체크리스트 + 불량 개소 사진 기록 2건
      sudden_event: 점검 중 고소작업자 1명이 안전대 미착용 상태로 작업 중 — 즉시 지적하고 체크리스트에 추가 기록해야 함
    coach_private:
      required_actions:
      - 전일 지적사항 2건의 시정 여부 먼저 확인
      - 본인 안전모·안전대 착용 확인 후 출발
      - 개구부 덮개 고정상태·표지 부착 점검
      - 비계 발판·벽이음·안전난간 상태 확인
      - 불량 항목 사진 촬영 후 체크리스트에 기록
      success_criteria:
      - 12항목 전부 판정하고 불량 2곳을 정확히 '불량' 처리
      - 본인 보호구 착용 유지
      failure_patterns:
      - 불량 개소를 '양호'로 표기하거나 보호구 미착용 상태로 점검 시작
    scorer_private:
      rag_link: F23 부분(J100)
  - mission_id: YS-05-02
    situation_type: 자료·정보 누락
    difficulty: 어려움
    npc_visible:
      npc: 김 소장(협력업체 현장소장)
      request_line: 정화조 배관작업 허가서 여기 있으니까 우리 애들 대기 중이니 빨리 사인받게 접수 좀 해줘.
      materials:
      - 밀폐공간 작업허가서(산소농도 측정값·감시인 지정란 빈칸)
      - '밀폐공간 작업 절차서(적정공기: 산소 18~23.5%'
      - 황화수소 10ppm 미만)
      - 측정기 대여 대장
      user_mission: 허가서를 절차서와 대조해 누락 항목을 찾아내고, 측정·감시인 지정 완료 전에는 접수할 수 없음을 통보한다
      outputs:
      - 누락 항목 표시된 허가서 검토의견 + 보완 요청 목록
      sudden_event: 소장이 '작년에도 그냥 들어갔다'며 재촉 — 관행이 아닌 절차서 기준으로 답해야 함
    coach_private:
      required_actions:
      - 허가서 필수기재 항목을 절차서와 하나씩 대조
      - 산소·유해가스 측정값 누락 확인
      - 감시인 지정 여부 확인
      - 소장에게 누락 2건을 질문하고 보완 요청
      - 측정 완료 전 작업 불가 통보 후 박 과장에게 보고
      success_criteria:
      - 누락 2건(측정값·감시인)을 모두 찾아 보완 전 접수를 거절하고 상사에게 보고
      failure_patterns:
      - 대기 인원 압박에 밀려 빈칸인 채로 접수·서명을 진행함
    scorer_private:
      rag_link: F23 부분(J100)
  - mission_id: YS-05-03
    situation_type: 우선순위 충돌
    difficulty: 어려움
    npc_visible:
      npc: 박 과장(안전관리자)
      request_line: 4층 개구부 덮개 깨졌다는 무전 왔고, 10시 크레인 양중 입회도 있고, 신규자 교육 서류도 오늘까지인데 뭐부터 할지 정리해서 보고해라.
      materials:
      - 무전 메모(개구부 파손 위치)
      - 크레인 양중작업 일정표
      - 신규채용자 기초안전보건교육 확인 서류
      - 현장 배치도
      user_mission: 세 가지 업무를 '즉시 위험 → 예정된 위험작업 → 서류' 순으로 배열하고 각 처리방안을 붙여 보고한다
      outputs:
      - 우선순위 배열표(순위·근거·처리방안) + 무전 보고 문안
      sudden_event: 이동 중 협력업체가 '우리 양중 먼저 봐달라'고 요청 — 순위 변경 없이 사유를 설명해야 함
    coach_private:
      required_actions:
      - 세 업무의 위험도·마감시각 파악
      - 개구부 파손을 최우선으로 접근통제(주변 출입금지·임시표지) 조치 요청
      - 양중 입회는 시간 전 도착 계획 수립
      - 교육 서류는 오후 처리로 배치
      - 우선순위와 근거를 한 줄씩 붙여 무전 보고
      success_criteria:
      - 즉시 위험(개구부)을 1순위로 놓고 접근통제 조치를 먼저 요청함
      failure_patterns:
      - 마감이 급하다는 이유로 서류를 먼저 처리하거나 개구부를 방치한 채 양중 입회로 이동
    scorer_private:
      rag_link: F23 부분(J100)
  - mission_id: YS-05-04
    situation_type: 오류·안전위험
    difficulty: 어려움
    npc_visible:
      npc: 공사부장(공정 압박) / 박 과장(보고 대상)
      request_line: 바람 좀 부는 걸로 크레인을 세우면 공정 다 밀린다, 오늘 양중은 그냥 진행하자.
      materials:
      - 풍속계 측정값(순간풍속 16m
      - s)
      - 산업안전보건기준에 관한 규칙 제37조 발췌(순간풍속 15m
      - s 초과 시 타워크레인 운전 중지)
      - 크레인 작업계획서
      user_mission: 측정값을 법정 기준과 대조해 작업중지 상황임을 판단하고, 공정 압박에도 임의 진행을 허용하지 않고 안전관리자에게 보고한다 (신입이 직접 크레인 조작·지휘하는 것은 금지행동)
      outputs:
      - 작업중지 판단 보고(측정값 + 근거 조항 + 재개 조건)
      sudden_event: 보고 직후 풍속이 14m/s로 잠시 떨어짐 — 순간풍속 기준이므로 단발 측정으로 재개하지 말고 지속 관찰 후 상사 판단을 받아야 함
    coach_private:
      required_actions:
      - 풍속계 측정값을 재확인
      - 규칙 기준(15m/s 초과 시 운전 중지)과 대조
      - 운전원·신호수에게 중지 기준 안내
      - 부장에게 '기준 초과로 임의 진행 불가' 원칙 답변
      - 박 과장에게 측정값·조항을 붙여 무전 보고 후 중지 조치 확인
      success_criteria:
