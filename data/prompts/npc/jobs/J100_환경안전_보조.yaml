      failure_patterns:
      - '''1m'
      - s 차이니 괜찮다'며 진행을 허용하거나 측정값 재확인 없이 자의적으로 판단
    scorer_private:
      rag_link: F23 부분(J100)
  - mission_id: YS-05-05
    situation_type: 보고·인계
    difficulty: 보통
    npc_visible:
      npc: 박 과장(안전관리자)
      request_line: 오늘 점검 결과랑 시정 안 끝난 거 정리해서 점검일지 올리고, 야간 당직자한테 인계사항 남겨놔라.
      materials:
      - 오전·오후 점검 메모
      - 시정조치 사진 4장
      - 미결 1건(안전대 부착설비 보강 자재 입고 대기)
      - 야간 용접작업 일정
      user_mission: 일일 안전점검일지를 지적-조치-미결 구조로 작성하고 야간 화기작업 주의사항을 포함한 인계장을 만든다
      outputs:
      - 일일 안전점검일지 + 야간당직 인계장(미결·화기작업 주의 포함)
      sudden_event: 작성 중 야간 용접 위치가 가연물 적치 구역 옆으로 변경됐다는 연락 — 인계장에 이격·방화포 조치 요청을 추가해야 함
    coach_private:
      required_actions:
      - 점검 항목·지적·조치 결과를 시간순으로 정리
      - 미결 1건에 사유와 조치 예정일 명시
      - 사진대장 번호를 일지 항목과 매칭
      - 야간 용접 화기감시자 배치·소화기 확인을 인계 문구로 작성
      - 박 과장에게 검토 요청
      success_criteria:
      - 지적사항마다 조치 결과 또는 미결 사유·예정일이 연결되고 인계장에 화기감시 항목 포함
      failure_patterns:
      - 미결사항을 '완료'로 잘못 기재하거나 야간 화기작업 위험을 인계에서 누락
    scorer_private:
      rag_link: F23 부분(J100)
