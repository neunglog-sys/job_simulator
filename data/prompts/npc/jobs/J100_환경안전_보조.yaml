      materials:
      - 일일 작업계획서
      - 위험성평가표
      - 작업허가서(화기·밀폐공간·고소)
      - 순회점검 체크리스트
      - 풍속·산소농도 측정값
      - 전일 점검일지·지적사항
      npc_roles:
      - 박 과장(안전관리자·직속상사)
      - 김 소장(협력업체 현장소장)
      - 크레인 운전원·신호수
      - 공사부장(공정 압박 역할)
      outputs:
