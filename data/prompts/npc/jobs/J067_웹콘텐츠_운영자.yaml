      user_mission: 당일 정정·운영 이슈를 수정 사유·범위·버전·재발 방지 기준으로 요약한 인계서를 작성하고 AI 당직 도우미와의 문답으로 누락 항목을 점검한다
      outputs:
      - 인계서(변경 이력 요약)
      - 이슈·개선 목록
      - 프로젝트 결과보고서형 요약 메모
      sudden_event: 퇴근 직전 성과 대시보드에서 정정 기사 조회수 급증 감지 — 인계서에 야간 모니터링 최우선 항목으로 추가해야 함
    coach_private:
      required_actions:
      - 운영 로그에서 당일 이슈·정정 건을 추출
      - 건별로 수정 사유·범위·버전을 정리
      - 미완료 항목과 야간 모니터링 포인트를 표시
      - 재발 방지 메모와 라벨링·운영 가이드 개선 제안을 한 줄 추가
      - AI 당직 도우미의 질문에 답하며 누락을 보완한 뒤 팀장 확인을 받음
      success_criteria:
      - 최신성과 추적성이 유지되는가 기준으로 수정 사유·범위·버전·재발 방지 조치가 빠짐없이 기록되고 당직자가 후속 조치를 바로 시작할 수 있음(시드 9단계 판단기준)
      failure_patterns:
      - 버전·사유 없이 '수정 완료'로만 기록해 야간에 같은 이슈가 재발했을 때 추적이 불가능해짐
