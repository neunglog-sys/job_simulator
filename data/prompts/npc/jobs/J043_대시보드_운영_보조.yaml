schema_version: npc.job-override.v1
job:
  job_id: J043
  job_name: 대시보드 운영 보조
  family_id: F09
  family_name: 데이터·CRM·매출분석
  module: 정보·판단형
review:
  status: researched_needs_human_review
  generated: true
  human_review_required: true
prompt_contract:
  npc_visible:
    work_targets:
    - 매출표
    - 고객데이터
    - 캠페인 결과
    - 대시보드
    npc_roles:
    - 마케팅팀장
    - 영업팀
    - 데이터담당
    outputs:
    - 분석요약표
    - 인사이트 메모
    - 리포트
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J043-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[대시보드 운영 보조/데이터·CRM·매출분석/정보·판단형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 매출표, 고객데이터, 캠페인 결과, 대시보드.
    주요상대/NPC는 마케팅팀장, 영업팀, 데이터담당. 핵심산출물은 분석요약표, 인사이트 메모, 리포트. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 데이터·CRM·매출분석의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
