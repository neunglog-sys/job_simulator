  family_id: F05
  family_name: 인사·채용·교육운영
  module: 대인응대형
review:
  status: researched_needs_human_review
  generated: true
  human_review_required: true
prompt_contract:
  npc_visible:
    work_targets:
    - 지원자 정보
    - 면접 일정
    - 교육 일정
    - 근태자료
    npc_roles:
    - 지원자
    - 면접관
    - 교육생
    - 강사
    outputs:
    - 면접일정표
    - 안내메일
    - 교육운영 체크리스트
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
