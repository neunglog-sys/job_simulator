  human_review_required: true
prompt_contract:
  npc_visible:
    work_targets:
    - 입고품
    - 출고지시서
    - 로케이션
    - 바코드
    npc_roles:
    - 창고관리자
    - 택배기사
    - 검수자
    outputs:
    - 입출고체크표
    - 재고차이보고
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
