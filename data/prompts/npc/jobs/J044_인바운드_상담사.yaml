  stage_id: S4
  name: 검수·판단
  goal: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다.
  rag_chunk_text: '[인바운드 상담사/고객상담·CS/대인응대형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 문의내용, 주문정보, 환불/교환 기준, 상담이력. 주요상대/NPC는
