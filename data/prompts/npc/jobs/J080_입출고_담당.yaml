    - 택배기사
    - 검수자
    outputs:
    - 입출고체크표
    - 재고차이보고
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J080-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[입출고 담당/물류창고·분류/작업순서·절차형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 입고품, 출고지시서, 로케이션, 바코드. 주요상대/NPC는
    창고관리자, 택배기사, 검수자. 핵심산출물은 입출고체크표, 재고차이보고. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 물류창고·분류의 업무대상과 산출물을 벗어난
    미션 생성 금지.'
