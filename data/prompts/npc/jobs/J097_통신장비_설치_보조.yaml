      user_mission: 구동시험 중 ESC 과열·이상소음 발생 시 절차대로 시험중단을 판단하고 조치 후 즉시 보고한다
      outputs:
      - 이상발생 보고(시각·증상·측정값·조치 순)
      - 시험중단 기록
      sudden_event: 차단 후에도 배터리 온도가 계속 상승 — 소화사(소화용 모래) 확보와 주변 대피 요청 여부 분기 판단
    coach_private:
