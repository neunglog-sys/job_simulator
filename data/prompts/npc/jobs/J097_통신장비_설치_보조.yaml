  missions:
  - mission_id: YS-10-01
    situation_type: 정상업무
    difficulty: 보통
    npc_visible:
      npc: 김반장(전기설비 반장)
      request_line: 오전 순찰은 자네가 돈다. 체크리스트 순서 그대로 돌면서 지시치 적고, 정상범위 벗어난 건 표시해서 갖고 와.
      materials:
      - 순찰점검 체크리스트(6개 설비)
      - 계기 정상범위 기준표
      - 전일 지시치 기록
      - 단선결선도
      user_mission: 수배전반·냉각펌프·비상발전기 등 6개 설비를 점검순서대로 돌며 전압·전류·압력·온도 지시치를 기록하고 정상범위 이탈 항목 2건을 찾아 표시한다
      outputs:
      - 순찰점검 기록지(지시치 기입+이탈 항목 표시)
      sudden_event: 배전반 앞에서 타는 냄새와 미세한 방전음 감지 → 접촉 금지하고 즉시 무전 보고 선택지
    coach_private:
      required_actions:
      - 인수인계 일지·정상범위 기준표 확인
      - 안전모·검전기·절연장갑 등 안전장구 확인
      - 체크리스트 순서대로 지시치 기록(임의 순서 변경 금지)
      - 기준표와 대조해 이탈 항목 표시
      - 결과를 반장에게 보고
      success_criteria:
      - 이탈 2건 모두 식별
      - 점검순서 준수
      - 판독 불가 항목은 추정 없이 '재확인' 표기
      failure_patterns:
      - 점검순서 건너뛰기
      - 이탈값을 정상으로 기록
      - 지시치 추정 기입
    scorer_private:
      rag_link: F22 직접(J094, J095, J096, J097)
  - mission_id: YS-10-02
    situation_type: 자료·정보 누락
    difficulty: 어려움
    npc_visible:
      npc: 김반장(전기설비 반장)
      request_line: 어젯밤 냉각수 순환펌프 경보 떴다는데, 야간조 일지 보고 정비요청서 초안 잡아 와.
      materials:
      - 야간조 인수인계 일지(경보시각·조치내용 누락)
      - 경보이력 출력물
      - 정비요청서 양식
      - 경보대응 절차서 발췌
      user_mission: 일지와 경보이력을 대조해 누락·불일치 항목을 찾아내고, 임의로 채우지 말고 확인 질문 목록을 만든 뒤 확인된 사실만으로 정비요청서 초안을 작성한다
      outputs:
      - 누락·불일치 항목 목록+질문 목록
      - 정비요청서 초안
      sudden_event: 초안 작성 중 동일 펌프 경보 재점등 → 작성 중단하고 즉시 보고할지 판단
    coach_private:
      required_actions:
      - 인수인계 일지와 경보이력 대조
      - 누락 항목(발생시각·현장조치·복구여부·재발 여부) 식별
      - 추정 기입 금지, 야간조 확인용 질문 목록 작성
      - 반장·야간조에 확인 요청
      - 확인된 내용만 정비요청서에 기재
      success_criteria:
      - 누락·불일치 3건 이상 식별
      - 미확인 사항은 공란+질문으로 처리
      failure_patterns:
      - 누락값을 임의 추정으로 채움
      - 경보 원인을 확인 없이 단정 기재
    scorer_private:
      rag_link: F22 직접(J094, J095, J096, J097)
  - mission_id: YS-10-03
    situation_type: 우선순위 충돌
    difficulty: 보통
    npc_visible:
      npc: 박차장(교대 선임)
      request_line: 지금 배전반 차단기 트립 경보에 현장부서 조명 수리 민원까지 겹쳤는데, 뭐부터 붙을지 순서 정해서 나한테 보고해.
      materials:
      - 동시 발생 요청 4건 메모(차단기 트립 경보
      - 공조기 필터 정기교체
      - 사무동 조명 수리 민원
      - 협력업체 작업 입회 요청)
      - 위험도 판단 기준표
      user_mission: 4건을 안전위험·설비영향·긴급도 기준으로 배열하고, 뒤로 미룬 요청의 담당자 통보 문구까지 정해 선임에게 보고한다
      outputs:
      - 우선순위 배열표(근거 포함)
      - 지연 통보·보고 메모
      sudden_event: 배열 도중 공조기 이상 정지 알림 추가 접수 → 순위 재조정 판단
    coach_private:
      required_actions:
      - 4건의 내용·위험도 파악
      - 안전위험(감전·정전 확산) 최우선 기준 적용
      - 처리 순서 배열과 근거 정리
      - 지연되는 요청 담당자에게 예상시간 통보
      - 선임 보고·승인 후 착수
      success_criteria:
      - 차단기 트립 경보를 최우선 배치하고 근거 제시
      - 지연 통보 누락 없음
      failure_patterns:
      - 재촉이 심한 민원을 안전 경보보다 앞세움
      - 근거 없이 순서 배열
    scorer_private:
      rag_link: F22 직접(J094, J095, J096, J097)
  - mission_id: YS-10-04
    situation_type: 오류·안전위험
    difficulty: 어려움
    npc_visible:
      npc: 이과장(안전관리자)
      request_line: 협력업체가 3번 배전반 작업 준비 중이니까 현장 가서 허가서랑 차단상태 확인하고, 이상 있으면 바로 무전 쳐.
      materials:
      - 작업허가서(PTW) 대장
      - LOTO(잠금·표지) 확인 체크리스트
      - 검전기
      - 무전기
      - 금지행동 카드(활선작업·차단기 임의 조작 금지)
      user_mission: 현장에서 작업허가서 미게시와 차단기 미차단(검전 결과 활선) 상태를 확인하고, 작업 중지를 요청한 뒤 안전관리자에게 무전 보고, LOTO 완료 확인 후 작업 재개에 입회한다
      outputs:
      - 안전확인 체크리스트
      - 작업중지·조치 보고 기록
      sudden_event: 작업자가 '허가서는 사무실에 있다, 늘 하던 일'이라며 강행 시도 → 중지 유지 vs 허용 분기
    coach_private:
      required_actions:
      - 작업허가서 게시·유효기간 확인
      - 차단기 개방·잠금표지(LOTO) 상태 확인
      - 검전기로 무전압 확인(활선 감지 시 접근 중지)
      - 작업 중지 요청 후 안전관리자에게 무전 보고
      - 조치 완료 확인 후 재개 입회·기록
      success_criteria:
      - 활선 상태에서 작업 중지 판단
      - 본인이 차단기를 직접 조작하지 않고 절차대로 보고
      failure_patterns:
      - '''빨리 끝내자''는 작업자 말에 밀려 작업 허용'
      - 신입이 직접 차단기 조작(금지행동)
    scorer_private:
      rag_link: F22 직접(J094, J095, J096, J097)
  - mission_id: YS-10-05
    situation_type: 보고·인계
    difficulty: 보통
    npc_visible:
      npc: 김반장(전기설비 반장), 야간조 선임(AI)
      request_line: 교대 30분 전이다. 오늘 점검결과랑 미결사항 인수인계 일지에 정리하고, 야간조 올라오면 직접 브리핑해.
      materials:
      - 당일 순찰점검 기록지
      - 정비요청서 2건
      - 경보 발생·조치 메모
      - 인수인계 일지 양식
      user_mission: 당일 결과를 완료/진행중/미결·주의 구조로 요약해 교대 인수인계 일지를 작성하고, 야간조 선임(AI)의 질문(경보 재발 조건, 감시 주기, 비상연락처)에 답하며 인계를 완료한다
      outputs:
      - 교대 인수인계 일지
      - 브리핑 요약
      sudden_event: 브리핑 직전 반장 긴급 호출로 시간 단축 → 핵심 3가지만 추려 전달하는 판단
    coach_private:
      required_actions:
      - 당일 점검기록·정비요청 취합
      - 완료/진행중/미결로 분류
      - 주의설비(냉각펌프 등)의 감시 주기·판단 기준 명시
      - 일지 작성 후 반장 확인
      - 야간조 브리핑·질문 응답
      success_criteria:
      - 미결 2건과 감시 주기를 빠짐없이 인계하고 질문에 기록 근거로 답변
      failure_patterns:
      - 구두로만 전달하고 일지 누락
      - 미결사항 축소 보고
    scorer_private:
      rag_link: F22 직접(J094, J095, J096, J097)
