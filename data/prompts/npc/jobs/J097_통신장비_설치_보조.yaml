      - 김선임(선임 드론 정비사)
      - 운용고객(농업방제 조종자)
      outputs:
      - 정비일지(교체부품·측정값·판정)
      - 점검 체크리스트 판정결과
      - 셀전압·전류 측정기록표
      - 부품 교체내역
      - 야간조 인계 요약
      mission_candidate: 당일 작업메모를 정비일지로 정리하고 재점검 필요사항 포함 요약을 팀장에게 브리핑
    coach_private:
      success_criteria:
      - 측정값·교체내역 누락 없이 기록
