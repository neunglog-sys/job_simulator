schema_version: npc.job-override.v1
job:
  job_id: J097
  job_name: 통신장비 설치 보조
  family_id: F22
  family_name: 시설·설비·전기관리
  module: 장비·상태점검형
review:
  status: integrated_research
  generated: true
  human_review_required: false
prompt_contract:
  npc_visible:
    work_targets:
    - 설비점검표
    - 전기
    - 공조
    - 보일러
    - 이상신호
    npc_roles:
    - 시설팀장
    - 입주사
    - 외주업체
    outputs:
    - 점검표
    - 이상조치요청서
    - 안전확인서
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J097-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[통신장비 설치 보조/시설·설비·전기관리/장비·상태점검형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 설비점검표, 전기/공조/보일러, 이상신호. 주요상대/NPC는
    시설팀장, 입주사, 외주업체. 핵심산출물은 점검표, 이상조치요청서, 안전확인서. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 시설·설비·전기관리의 업무대상과
    산출물을 벗어난 미션 생성 금지.'
- chunk_id: J097-S2
  stage_id: S2
  name: 자료·현황 확인
  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[통신장비 설치 보조/시설·설비·전기관리/장비·상태점검형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 설비점검표, 전기/공조/보일러, 이상신호.
    주요상대/NPC는 시설팀장, 입주사, 외주업체. 핵심산출물은 점검표, 이상조치요청서, 안전확인서. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 시설·설비·전기관리의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
- chunk_id: J097-S3
  stage_id: S3
  name: 처리·제작·응대
  goal: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다.
  rag_chunk_text: '[통신장비 설치 보조/시설·설비·전기관리/장비·상태점검형] 처리·제작·응대: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다. 업무대상은 설비점검표, 전기/공조/보일러, 이상신호.
    주요상대/NPC는 시설팀장, 입주사, 외주업체. 핵심산출물은 점검표, 이상조치요청서, 안전확인서. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 시설·설비·전기관리의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
- chunk_id: J097-S4
  stage_id: S4
  name: 검수·판단
  goal: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다.
  rag_chunk_text: '[통신장비 설치 보조/시설·설비·전기관리/장비·상태점검형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 설비점검표, 전기/공조/보일러, 이상신호. 주요상대/NPC는
    시설팀장, 입주사, 외주업체. 핵심산출물은 점검표, 이상조치요청서, 안전확인서. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 시설·설비·전기관리의 업무대상과
    산출물을 벗어난 미션 생성 금지.'
- chunk_id: J097-S5
  stage_id: S5
  name: 보고·인계
  goal: 결과, 근거, 남은 이슈, 다음 액션을 공유한다.
  rag_chunk_text: '[통신장비 설치 보조/시설·설비·전기관리/장비·상태점검형] 보고·인계: 결과, 근거, 남은 이슈, 다음 액션을 공유한다. 업무대상은 설비점검표, 전기/공조/보일러, 이상신호. 주요상대/NPC는
    시설팀장, 입주사, 외주업체. 핵심산출물은 점검표, 이상조치요청서, 안전확인서. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 시설·설비·전기관리의 업무대상과
    산출물을 벗어난 미션 생성 금지.'
content_variants:
- category: 설비·장비 설치·정비
  module: 장비·상태점검형
  rag_status: 직접
  workflow: 작업지시·기체이력 확인 → 외관·프로펠러 점검 → 배터리 셀전압 측정 → 모터·ESC 구동시험 → 펌웨어·센서 캘리브레이션 → 부품 교체·조립 → 기능·안전성 검사 → 정비일지 기록·인계
  npc_visible:
    npc_roles:
    - 박팀장(드론정비팀장)
    - 김선임(선임 드론 정비사)
    - 운용고객(농업방제 조종자)
    input_materials:
    - 정비 작업지시서
    - 기체 정비이력카드
    - 제조사 정비매뉴얼·전기전자회로도면
    - 비행로그
    - 정기점검 체크리스트
    - 배터리 셀전압·모터전류 기준표
    outputs:
    - 정비일지(교체부품·측정값·판정)
    - 점검 체크리스트 판정결과
    - 셀전압·전류 측정기록표
    - 부품 교체내역
    - 야간조 인계 요약
    sudden_events:
    - 배터리 스웰링(부풀음) 발견
    - 구동시험 중 ESC 과열·이상소음
    - 도면과 실배선 불일치
    - 납기 임박 기체 긴급 추가 입고
    - 펌웨어 업데이트 중 오류
  stages:
  - stage_id: S1
    name: 작업지시·기체이력 파악
    goal: 정비 작업지시서와 기체 정비이력카드를 대조해 점검범위·주의사항을 정확히 파악한다
    npc_visible:
      materials:
      - 정비 작업지시서
      - 기체 정비이력카드
      - 제조사 정비매뉴얼·전기전자회로도면
      - 비행로그
      - 정기점검 체크리스트
      - 배터리 셀전압·모터전류 기준표
      npc_roles:
      - 박팀장(드론정비팀장)
      - 김선임(선임 드론 정비사)
      - 운용고객(농업방제 조종자)
      outputs:
      - 정비일지(교체부품·측정값·판정)
      - 점검 체크리스트 판정결과
      - 셀전압·전류 측정기록표
      - 부품 교체내역
      - 야간조 인계 요약
      mission_candidate: 입고 기체의 작업지시서·이력카드를 읽고 점검범위, 최근 수리내역, 추락이력 유무를 확인 목록으로 정리
    coach_private:
      success_criteria:
      - 기체번호·점검범위·이력상 주의사항(추락·침수 등)을 빠짐없이 식별
      failure_patterns:
      - 이력카드를 안 보고 바로 공구부터 잡음
      - 침수이력 기체를 일반 점검으로 분류
  - stage_id: S2
    name: 외관·배터리 상태 측정
    goal: 점검순서에 따라 외관·프로펠러·배터리 셀전압을 측정하고 기준표와 대조해 양호/불량을 판정한다
    npc_visible:
      materials:
      - 정비 작업지시서
      - 기체 정비이력카드
      - 제조사 정비매뉴얼·전기전자회로도면
      - 비행로그
      - 정기점검 체크리스트
      - 배터리 셀전압·모터전류 기준표
      npc_roles:
      - 박팀장(드론정비팀장)
      - 김선임(선임 드론 정비사)
      - 운용고객(농업방제 조종자)
      outputs:
      - 정비일지(교체부품·측정값·판정)
      - 점검 체크리스트 판정결과
      - 셀전압·전류 측정기록표
      - 부품 교체내역
      - 야간조 인계 요약
      mission_candidate: 프로펠러 크랙·프레임 변형 확인 후 배터리 셀전압을 측정해 기준표 대비 합격/불합격 기록
    coach_private:
      success_criteria:
      - 전 항목 측정값을 기록하고 기준 미달 셀을 정확히 '불량' 판정
      failure_patterns:
      - 측정 없이 눈대중으로 '양호' 일괄 체크
      - 부풀은 배터리를 충전기에 그대로 둠
  - stage_id: S3
    name: 부품 교체·조립·캘리브레이션
    goal: 회로도면을 해독해 불량부품을 교체·조립하고 IMU·나침반 캘리브레이션을 절차대로 수행한다
    npc_visible:
      materials:
      - 정비 작업지시서
      - 기체 정비이력카드
      - 제조사 정비매뉴얼·전기전자회로도면
      - 비행로그
      - 정기점검 체크리스트
      - 배터리 셀전압·모터전류 기준표
      npc_roles:
      - 박팀장(드론정비팀장)
      - 김선임(선임 드론 정비사)
      - 운용고객(농업방제 조종자)
      outputs:
      - 정비일지(교체부품·측정값·판정)
      - 점검 체크리스트 판정결과
      - 셀전압·전류 측정기록표
      - 부품 교체내역
      - 야간조 인계 요약
      mission_candidate: 도면 기준으로 ESC·모터 배선을 조립(극성 확인)하고 센서 캘리브레이션 절차를 순서대로 완료
    coach_private:
      success_criteria:
      - 커넥터 극성·배선 경로가 도면과 일치하고 캘리브레이션 완료 로그 확보
      failure_patterns:
      - 극성 반대 연결
      - 캘리브레이션 단계 건너뛰고 조립 완료 처리
  - stage_id: S4
    name: 기능·안전성 검사
    goal: 프로펠러 제거 상태에서 구동시험을 보조하며 전류·온도 측정값으로 이상을 탐지하고 중단 여부를 판단한다
    npc_visible:
      materials:
      - 정비 작업지시서
      - 기체 정비이력카드
      - 제조사 정비매뉴얼·전기전자회로도면
      - 비행로그
      - 정기점검 체크리스트
      - 배터리 셀전압·모터전류 기준표
      npc_roles:
      - 박팀장(드론정비팀장)
      - 김선임(선임 드론 정비사)
      - 운용고객(농업방제 조종자)
      outputs:
      - 정비일지(교체부품·측정값·판정)
      - 점검 체크리스트 판정결과
      - 셀전압·전류 측정기록표
      - 부품 교체내역
      - 야간조 인계 요약
      mission_candidate: 모터 구동시험 중 전류값을 모니터링해 기준 초과·이상소음 시 즉시 중단하고 조치
    coach_private:
      success_criteria:
      - 기준 초과 시점에 지체 없이 전원차단·배터리 분리·격리 순서 준수
      failure_patterns:
