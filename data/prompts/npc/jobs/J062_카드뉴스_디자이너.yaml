    주요상대/NPC는 기획자, 마케터, 클라이언트. 핵심산출물은 시안, 영상초안, 수정반영표. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 디자인·영상제작의 업무대상과
