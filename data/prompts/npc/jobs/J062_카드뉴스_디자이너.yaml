      - 관객·고객 피드백 요약
      - 인계 요약서 양식
      user_mission: 작품 정보·검수 결과·권리 상태·보존 위치·피드백 핵심을 담은 인계 요약서를 작성하고, AI 후임 담당자와의 대화에서 질문에 문서 근거로 답한다.
      outputs:
