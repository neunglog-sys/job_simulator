    scorer_private:
      rag_link: F14 부분(J062, J066)
  - mission_id: YG-02-03
    situation_type: 우선순위 충돌
    difficulty: 보통
    npc_visible:
      npc: 박도현 수석 작곡가, 정태호 품질·저작권 검수 과장
      request_line: '박도현: 오늘 6시까지 편곡 수정본 악보 정리 부탁해. / 정태호: 미안한데 4시 전시 납품 검수에 체크리스트 기록 보조로 들어와 줘야겠어.'
      materials:
      - 일정·예산표
      - 두 업무 요청 메모(마감 시각·소요 시간·미이행 시 영향)
      - 팀 업무 분장표
      - 대기 업무 목록(편곡 수정 정리
      - 납품 검수 보조
      - 레퍼런스 정리
      - 연습실 예약)
      user_mission: 대기 업무 4건을 마감 시각·영향도 기준으로 우선순위 배열하고, 겹치는 시간대의 조정안을 만들어 두 상사에게 충돌 사실과 함께 보고한다.
      outputs:
      - 우선순위 배열표
      - 충돌 조정 보고 메모
      sudden_event: 전시 납품 검수가 30분 앞당겨짐 — 배열표를 즉시 갱신해 재보고
    coach_private:
      required_actions:
      - 각 업무의 마감 시각·소요 시간·미이행 시 영향 정리
      - 마감 임박·영향도 순으로 우선순위 배열
      - 겹치는 시간대 조정안(순서 변경·지원 요청) 작성
      - 두 상사에게 충돌 사실과 조정안 보고
      - 합의된 순서를 배열표에 확정 기록
