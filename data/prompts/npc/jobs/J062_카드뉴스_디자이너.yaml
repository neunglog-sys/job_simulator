schema_version: npc.job-override.v1
job:
  job_id: J062
  job_name: 카드뉴스 디자이너
  family_id: F14
  family_name: 디자인·영상제작
  module: 제작·상태판단형
review:
  status: integrated_research
  generated: true
  human_review_required: false
prompt_contract:
  npc_visible:
    work_targets:
    - 브리프
    - 레퍼런스
    - 이미지
    - 영상소스
    - 수정요청
    npc_roles:
    - 기획자
    - 마케터
    - 클라이언트
    outputs:
    - 시안
    - 영상초안
    - 수정반영표
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J062-S1
