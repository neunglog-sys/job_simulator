  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[카드뉴스 디자이너/디자인·영상제작/제작·상태판단형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 브리프, 레퍼런스, 이미지/영상소스, 수정요청. 주요상대/NPC는
    기획자, 마케터, 클라이언트. 핵심산출물은 시안, 영상초안, 수정반영표. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 디자인·영상제작의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
