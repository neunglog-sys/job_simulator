      - 백업 없이 파일을 교체·덮어쓰기하거나
      - 신입이 단독으로 배포를 승인함
    scorer_private:
      rag_link: F14 부분(J062, J066)
  - mission_id: YG-02-05
    situation_type: 보고·인계
