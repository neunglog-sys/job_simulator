      request_line: 이번 작품 건, 검수표랑 권리 확인서까지 묶어서 한 장짜리 인계 요약으로 정리해 줘요. 다음 담당자가 이 문서만 보고도 보존 위치랑 권리 상태를 알 수 있게.
      materials:
      - 검수표
