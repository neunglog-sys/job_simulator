    scorer_private:
      rag_link: F14 부분(J062, J066)
  - mission_id: YG-02-04
    situation_type: 오류·안전위험
    difficulty: 어려움
    npc_visible:
      npc: 정태호 품질·저작권 검수 과장
      request_line: 내일 발매본 최종 파일, 큐시트랑 권리 확인서 마지막으로 대조해 봐요. 이상 있으면 바로 나한테 먼저 가져오고, 절대 혼자 판단해서 파일 건드리지 말아요.
      materials:
      - 마스터 음원 큐시트(포스트 프로덕션 완료본)
      - 권리 확인서(샘플 2건 사용허락란 공란)
      - 검수표
      - 배포 일정표
      - 원본 백업 규정
      user_mission: 큐시트의 삽입 음원 목록과 권리 확인서를 대조해 미확인 샘플을 찾아내고, 대응 분기(즉시 보고·배포 보류 건의 / 그대로 배포 / 무단 교체 후 덮어쓰기) 중 올바른 경로를 선택해 실행한다.
      outputs:
      - 권리 위험 보고 메모
      - 미확인 샘플 목록이 표시된 검수표(권리 확인서 보완 요청 포함)
      sudden_event: 유통사에서 '오늘 중 파일을 안 주면 발매 연기'라고 압박 전화 — 승인 권한이 없음을 밝히고 검수 과장에게 즉시 연결
    coach_private:
      required_actions:
      - 큐시트의 삽입 음원 목록과 권리 확인서 대조
      - 사용허락란이 공란인 샘플 2건 식별
      - 원본 백업 상태 확인(백업 없는 덮어쓰기 금지)
