  name: 보고·인계
  goal: 결과, 근거, 남은 이슈, 다음 액션을 공유한다.
  rag_chunk_text: '[카드뉴스 디자이너/디자인·영상제작/제작·상태판단형] 보고·인계: 결과, 근거, 남은 이슈, 다음 액션을 공유한다. 업무대상은 브리프, 레퍼런스, 이미지/영상소스, 수정요청. 주요상대/NPC는
