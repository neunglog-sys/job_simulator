schema_version: npc.job-override.v1
job:
  job_id: J035
  job_name: 상품기획·MD 보조
  family_id: F08
  family_name: 서비스·상품기획·PM보조
  module: 정보·판단형
review:
  status: researched_needs_human_review
  generated: true
  human_review_required: true
prompt_contract:
  npc_visible:
    work_targets:
    - 요구사항
    - 사용자 불편
    - 기능목록
    - 우선순위
    npc_roles:
    - PM
    - 개발자
    - 디자이너
    - 고객
    outputs:
    - 요구사항정리표
    - 우선순위표
    - 회의록
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J035-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[상품기획·MD 보조/서비스·상품기획·PM보조/정보·판단형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 요구사항, 사용자 불편, 기능목록, 우선순위.
    주요상대/NPC는 PM, 개발자, 디자이너, 고객. 핵심산출물은 요구사항정리표, 우선순위표, 회의록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 서비스·상품기획·PM보조의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
- chunk_id: J035-S2
  stage_id: S2
  name: 자료·현황 확인
  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[상품기획·MD 보조/서비스·상품기획·PM보조/정보·판단형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 요구사항, 사용자 불편, 기능목록, 우선순위.
    주요상대/NPC는 PM, 개발자, 디자이너, 고객. 핵심산출물은 요구사항정리표, 우선순위표, 회의록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 서비스·상품기획·PM보조의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
