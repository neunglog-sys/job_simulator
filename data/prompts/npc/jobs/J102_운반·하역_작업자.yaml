  family_name: 배송·운반·하역
  module: 돌발상황 대처형
review:
  status: integrated_research
  generated: true
  human_review_required: false
prompt_contract:
  npc_visible:
    work_targets:
    - 배송지
    - 운송장
    - 적재품
    - 시간표
    - 도로
    - 현장상황
    npc_roles:
    - 배차담당
    - 고객
    - 창고담당
    outputs:
    - 배송현황표
    - 지연보고
    - 인수증
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J102-S1
