  missions:
  - mission_id: JM-05-01
    situation_type: 정상업무
    difficulty: 보통
    npc_visible:
      npc: 박정도 반장(타워크레인 총괄 신호수)
      request_line: 신입, 오늘 양중 들어가기 전에 점검표 들고 와이어부터 풍속계까지 하나씩 확인해서 나한테 복명복창으로 보고해라.
      materials:
      - 작업 전 점검 체크리스트(10항목)
      - 풍속계 판독값(현재 순간풍속 8m
      - s)
      - 정격하중표
      - 양중작업계획서
      - 줄걸이·샤클 점검표
      - 훅 해지장치 사진 자료
      user_mission: 크레인 작업 전 일상점검 체크리스트를 순서대로 수행하고, 각 항목의 정상/이상 여부를 선택해 이상 항목을 반장에게 보고한다(와이어로프 소선 단선 1개소가 숨어 있음).
      outputs:
      - 완료된 점검 체크리스트
      - 이상 항목 보고 문장(복명복창 형식)
      sudden_event: 점검 중 순간풍속이 12m/s로 상승 — 운전(15m/s 기준)은 가능하지만 오전에 예정된 마스트 수리 작업(10m/s 기준)은 중지 대상임을 구분해 보고해야 한다.
    coach_private:
      required_actions:
      - 작업지시서·양중작업계획서에서 오늘 인양물 중량과 순서 확인
      - 풍속계 판독값을 법정 기준(설치·해체 10m/s, 운전 15m/s)과 대조
      - 와이어로프 소선 단선·킹크, 훅 해지장치 작동 상태 점검
      - 줄걸이(슬링)·샤클 마모 상태와 정격하중표 대조
      - 이상 항목을 표시하고 '와이어로프 3번 구간 소선 단선 발견, 교체 확인 요청'으로 복명복창 보고
      success_criteria:
      - 10항목 전부 수행 + 소선 단선 결함 탐지 + 풍속 기준을 수치로 정확히 언급하며 '현재 8m
      - s로 운전 가능' 판단까지 보고
      failure_patterns:
      - '''시간 없으니 주요 항목만'' 선택지를 골라 결함 미발견'
      - 훅 해지장치 점검 생략
      - 결함을 발견하고도 '작업 가능'으로 보고
    scorer_private:
      rag_link: F24 부분(J102)
  - mission_id: JM-05-02
    situation_type: 자료·정보 누락
    difficulty: 보통
    npc_visible:
      npc: 김하늘 팀장(드론운영팀장)
      request_line: 오후에 교량 점검 촬영 나갈 거니까, 비행승인서랑 기체 서류 이상 없는지 네가 먼저 검토해서 문제 있으면 질문으로 확인해 놔.
      materials:
      - 드론 비행승인서(승인 고도·시간대 일부 공란)
      - 드론원스톱 공역정보 지도(현장이 관제권 반경 9.3km 내)
      - 기체신고증
      - 조종자 증명(2종)
      - 배터리 점검표
      - 비행계획서(계획 고도 160m로 기재)
      user_mission: 서류 4종을 교차 검토해 누락·불일치 3건(관제권 내인데 승인 공란, 계획 고도 150m 초과, 승인 시간대와 일몰 후 촬영 계획 충돌)을 찾아 팀장에게 질문 형식으로 확인하고, 승인
        보완 전 비행 불가로 판단한다.
      outputs:
      - 누락·불일치 목록(3건)
      - 팀장 확인 질문 3개
      - 비행 가능
      - 보류 판단 결과
      sudden_event: 검토 중 팀장이 '발주처가 오늘 안에 영상 달라는데 그냥 낮게 날면 되지 않냐'고 재촉 — 승인 없는 관제권 비행은 불가함을 근거를 들어 답해야 한다.
    coach_private:
      required_actions:
      - 비행계획서의 장소·고도·시간을 먼저 파악
      - 공역정보 지도에서 관제권·비행금지구역 여부 대조
      - 비행승인서의 승인 고도·시간 공란과 계획 내용 비교
      - 항공안전법 조종자 준수사항(고도 150m, 야간비행 승인 필요)과 대조해 불일치 목록화
      - '''승인 고도가 공란인데 계획은 160m입니다. 드론원스톱 재신청이 필요하지 않습니까?''처럼 질문으로 확인 후 비행 보류 건의'
      success_criteria:
      - 3건 모두 탐지 + '서류 보완 전 이륙 불가' 판단 + 드론원스톱 재신청이라는 올바른 보완 경로 제시
      failure_patterns:
      - '''팀장님이 알아서 승인받았겠지''라며 서류 검토 생략'
      - 고도 160m를 문제로 인식하지 못함
      - 누락을 발견하고도 촬영 일정 때문에 묵인
    scorer_private:
      rag_link: F24 부분(J102)
  - mission_id: JM-05-03
    situation_type: 우선순위 충돌
    difficulty: 어려움
    npc_visible:
      npc: 오세만 소장(현장 안전관리소장) / 박정도 반장
      request_line: 소장님이 오늘 안에 자재 다 올리라고 성화신데 풍속이 애매하다. 네가 현재 상황을 정리해서 작업 우선순위 보고서 초안을 만들어 와라.
      materials:
      - 실시간 풍속 기록(순간풍속 16m
      - s 관측 2회)
      - 잔여 작업 목록 5건(철골 양중 2건
      - 판넬 양중 1건
      - 교체용 신품 와이어 입고 검수 1건(크레인 본체 접촉 없음)
      - 하부 대피통로 확보 1건)
      - 공기 지연 현황표(2일 지연)
      - 산업안전보건기준에 관한 규칙 제37조 발췌문
      user_mission: 잔여 작업 5건을 안전 기준으로 우선순위 배열하고, 순간풍속 15m/s 초과 상태의 양중 3건은 '작업 중지·풍속 안정 후 재개'로 분류해 법적 근거를 붙인 보고서를 반장에게 제출한다.
        공기 지연 압박(정시성)보다 안전을 선택하는 것이 핵심 판단이다.
      outputs:
      - 우선순위 배열표(5건)
      - 작업 중지 건의문(법 조항 근거 포함)
      sudden_event: 보고 직전 소장이 직접 찾아와 '네가 뭘 안다고 작업을 멈추냐'고 질책 — 감정 대응 대신 풍속 수치와 법 조항으로 답하고 최종 결정권자(반장·안전관리자) 판단을 요청해야 한다.
    coach_private:
      required_actions:
      - 풍속 기록에서 순간풍속 16m/s 관측 사실을 확인
      - 작업 5건을 '풍속 무관/풍속 제한' 두 그룹으로 분류
      - 하부 대피통로 확보 → 교체용 신품 와이어 입고 검수(지상 창고, 크레인 본체 접촉 없음) → 양중 3건(중지·대기) 순으로 배열
      - 제37조 '순간풍속 15m/s 초과 시 타워크레인 운전 중지'를 근거로 명기
      - '''중지 건의는 지연이 아니라 낙하 사고 예방입니다''라는 요지로 반장에게 보고하고 소장 설득 자료로 전달'
      success_criteria:
      - 풍속 초과 양중을 최상위가 아닌 '중지' 상태로 분류 + 제37조 수치 근거 인용 + 대기 시간에 할 수 있는 지상 작업을 대안으로 제시해 정시성 손실을 최소화하는 균형 판단
      failure_patterns:
      - 소장 압박에 '한 번만 빨리 올리자'며 양중을 1순위 배치
      - 풍속 기록을 보고서에서 누락
      - 근거 없이 '위험할 것 같다'고만 서술해 설득 실패
    scorer_private:
      rag_link: F24 부분(J102)
  - mission_id: JM-05-04
