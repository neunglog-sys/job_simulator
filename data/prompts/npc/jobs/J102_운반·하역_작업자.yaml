      request_line: 3번 무전기가 아까부터 자꾸 끊긴다. 너는 하부에서 신호 상태 계속 지켜보다가 조금이라도 이상하면 바로 조치하고 뛰어와라.
      materials:
      - 무전 교신 로그(잡음·두절 재현 음성)
      - 표준 수신호 도표
      - 위험구역 통제 라인 배치도
      - 현재 양중 상태(철골 인양 중
      - 지상 12m)
      - 예비채널표
      user_mission: 철골 인양 중 신호수 무전이 두절되는 돌발상황에서 대응 분기를 선택한다. 핵심은 '의심되면 정지' — 마지막 지시를 추측해 진행하지 않고 즉시 전동작 정지를 요청한 뒤, 인양물 하부
        위험구역 통제·근로자 대피 유도, 예비채널·수신호 전환, 보고·기록 순으로 진행한다. 신입이 임의로 크레인을 조작하거나 무단으로 양중을 재개하는 선택지는 금지행동이다.
      outputs:
      - 돌발대응 분기 선택 결과(4단계)
      - 돌발상황 보고서(시각·조치 포함)
      sudden_event: 정지 대기 중 순간 돌풍으로 공중의 철골이 회전하기 시작 — 태그라인을 잡으러 접근하지 말고(끼임·타격 위험) 통제 반경을 넓히는 것이 정답 분기.
    coach_private:
      required_actions:
      - '인지: 무전 잡음·지시 불명확을 감지하면 ''신호 불명확''으로 판단'
      - '초동조치: 약속된 비상 수신호로 ''전동작 정지'' 요청 후 인양물 하부 통제선 안 근로자 대피 유도'
      - '보고: 반장에게 ''3번 채널 두절, 철골 공중 정지 상태, 하부 통제 완료''를 6하원칙으로 보고'
      - '협조: 예비채널 전환 및 수신호 체계로 임시 교신 복구, 무전기 교체 요청'
      - '기록: 두절 시각·정지 시각·통제 조치를 돌발상황 보고서에 기록하고, 재개는 반드시 반장 지시 수령 후에만'
      success_criteria:
      - 신호 불명확 즉시 '정지' 선택(추측 진행 0회) + 보고보다 대피 유도를 먼저 수행 + 표준 콜 사용 + 무단 재개·임의 조작 선택지 회피
      failure_patterns:
      - '''마지막 지시가 권상이었으니 계속''을 선택해 인양물 충돌'
      - 보고하러 가느라 하부 통제를 비움
      - 무전 복구되자 반장 확인 없이 작업 재개 신호를 보냄
    scorer_private:
      rag_link: F24 부분(J102)
  - mission_id: JM-05-05
    situation_type: 보고·인계
    difficulty: 보통
    npc_visible:
      npc: 정미래 사수(크레인 조종 5년차 선임 기사)
      request_line: 오늘 무전 두절 건까지 있었으니까, 야간조 오기 전에 양중일지랑 돌발보고서 초안 네가 정리해서 나한테 검토받아라.
      materials:
      - 오늘 작업 타임라인(양중 6건
      - 무전 두절 1건
      - 풍속 대기 40분)
      - 양중작업일지 양식
      - 돌발상황 보고서 양식(인지→초동→보고→복구 4단계)
      - 드론 비행일지(교량 촬영 1소티)
      - 인수인계서 양식
      user_mission: 하루 작업을 요약해 양중작업일지·돌발상황 보고서·인수인계서를 작성하고, AI 야간조 반장과의 대화로 인계 질의응답(와이어 교체 여부, 무전기 수리 상태, 지브 자유회전 조치 확인)에
        답한다.
      outputs:
      - 양중작업일지
      - 4단계 구조 돌발상황 보고서
      - 인수인계서
      - AI 인계 대화 완료
      sudden_event: 인계 대화 중 야간조 반장이 '지브 풍향 자유회전(선회 브레이크 해제) 조치 확인했나?'라고 질문 — 본인이 직접 확인하지 않았다면 솔직히 밝히고 즉시 재확인을 건의해야 한다.
    coach_private:
      required_actions:
      - 타임라인에서 사실·수치(시각, 풍속, 인양 중량, 정지 시간)를 추출
      - 돌발 건을 4단계 구조(인지→초동 안전조치→보고·협조→복구·기록)로 재구성
      - 인수인계서 첫머리에 야간조 필수 확인사항(무전기 3번 수리 중, 와이어 3번 구간 교체 예정)을 배치
      - 드론 비행일지에 비행시간·배터리 사이클·특이사항 기재
      - AI 야간조 반장의 질문에 기록 근거로 답하고, 모르는 것은 추측 대신 '기록에 없어 확인 필요'로 답변
      success_criteria:
      - 돌발 건을 축소 없이 수치·시각 포함 기록 + 야간조가 즉시 확인할 항목을 인계서 최상단에 배치 + 질의응답에서 추측 답변 없이 기록 기반으로 응답
      failure_patterns:
      - '''특이사항 없음''으로 무전 두절 건 누락'
      - 풍속 대기 40분을 지연 책임 회피성으로 왜곡 기재
      - 인계 질문에 확인 없이 '아마 됐을 겁니다'로 답변
    scorer_private:
      rag_link: F24 부분(J102)
