    outputs:
    - 회의록
    - 요청정리표
    - 비품신청서
    - 공문 초안
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
