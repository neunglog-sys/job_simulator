    선배, 타부서 담당자. 핵심산출물은 회의록, 요청정리표, 비품신청서, 공문 초안. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 사무행정·총무의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
