    강사, 수강생, 운영매니저. 핵심산출물은 출석표, 안내공지, 문의응답안. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 교육운영·튜터보조의 업무대상과 산출물을
