      - 레벨 테스트 항목표
      - 상담 질문 예시
      user_mission: 기록 공란을 메우기 위한 확인 질문 목록을 만들고 회원 인터뷰로 수준·목표·제약을 파악해 카드를 완성한다
      outputs:
      - 완성된 회원 카드
      - 질문 목록
      sudden_event: 회원이 '무릎이 좀 안 좋다'고 답변 — 수업 강도 조정을 강사와 상의하는 판단
    coach_private:
      required_actions:
      - 공란 항목 식별(운동 경력·목표·통증 이력)
      - 질문 5개 설계(개방형)
      - 인터뷰 수행
      - 카드 기재
      - 담당 강사 공유
      success_criteria:
      - 통증·질환 이력 질문 포함
      - 추측 기재 0건
      failure_patterns:
      - 공란인 채 수업 투입
      - '''초보시죠?'' 단정 질문'
    scorer_private:
      rag_link: F13 직접(J058~J061)
  - mission_id: KTS-02-03
    situation_type: 우선순위 충돌
    difficulty: 어려움
    npc_visible:
      npc: 수석 트레이너(사수)
      request_line: 오늘 수업에 레벨 다른 회원이 섞였어. 순서랑 지도 동선 어떻게 갈지 짜서 말해 줘.
      materials:
      - 수업 명단(초급 3·중급 3)
      - 동작 난이도표
      - 수업 시간표(50분)
      - 개별 피드백 기록지
      user_mission: 레벨 혼합 수업의 진행 순서(공통 동작→난이도 분기→개별 피드백)를 설계하고 배분 근거와 함께 보고한다
      outputs:
      - 수업 진행 계획표
      - 배분 근거 메모
      sudden_event: 수업 직전 중급 1명 결석·초급 1명 추가 — 트랙 재조정 판단
    coach_private:
      required_actions:
      - 명단 레벨 분류
      - 공통 워밍업 배치
      - 난이도 2트랙 분기 설계
      - 개별 피드백 시간 배분
      - 사수 보고·조정
      success_criteria:
      - 전원 소외 없는 배분
      - 초급 무리 동작 배제
      failure_patterns:
      - 중급 기준으로만 진행해 초급 방치
      - 피드백이 특정 회원 편중
    scorer_private:
      rag_link: F13 직접(J058~J061)
  - mission_id: KTS-02-04
    situation_type: 오류·안전위험
    difficulty: 어려움
    npc_visible:
      npc: 초보 회원(중년)
      request_line: 선생님, 저 갑자기 좀 어지러운데... 괜찮아지겠죠? 그냥 할게요.
      materials:
      - 이상 증상 대응 절차(중단→휴식→관찰→보고→에스컬레이션)
      - 응급 연락 체계
      - 사고 보고서 양식
      user_mission: 수업 중 어지럼증 호소 회원에게 즉시 중단·휴식 절차를 적용하고 상태에 따른 대응 분기(재개/귀가 권유/119)를 판단한다
      outputs:
      - 이상 증상 대응 기록
      - 상태 관찰 메모
      sudden_event: 회복 후 회원이 '아까 일 비밀로 해달라' 요청 — 기록 원칙 설명 판단
    coach_private:
      required_actions:
      - 즉시 동작 중단·안전한 자세 유도
      - 수분·휴식 제공, 상태 관찰
      - 강사·데스크 보고
      - 회복 여부에 따라 분기 판단
      - 사고 기록 작성
      success_criteria:
      - '''그냥 할게요''에도 중단 원칙 유지'
      - 의학적 단정 발언 금지
      - 보고 완료
      failure_patterns:
      - 회원 의사만 믿고 수업 강행
      - '''저혈압이신가 봐요'' 진단성 발언'
    scorer_private:
      rag_link: F13 직접(J058~J061)
  - mission_id: KTS-02-05
    situation_type: 보고·인계
    difficulty: 보통
    npc_visible:
      npc: 센터장
      request_line: 학부모님이 전화로 아이 수업 태도랑 진도 물어보실 거야. 기록 보고 요약해서 응대 준비해 놔.
      materials:
      - 출석·진도 기록
      - 수업 관찰 메모
      - 상담 응대 원칙(사실 기반·비교 금지)
      - 개인정보 범위 기준
      user_mission: 기록을 근거로 학부모 상담 요약(잘한 점·보완점·다음 목표)을 준비하고 AI 학부모의 질문에 사실 기반으로 응답한다
      outputs:
      - 상담 준비 요약
      - 상담 결과 기록
      sudden_event: 학부모가 환불 규정 문의로 전환 — 규정 안내와 담당자 인계 판단
    coach_private:
      required_actions:
      - 기록에서 사실 추출(출석률·진도·관찰)
      - 잘한 점/보완점 균형 구성
      - 다른 수강생 비교 요구엔 원칙 설명
      - 상담 결과 기록
      - 원장 공유
      success_criteria:
      - 사실 기반 응답
      - 타 수강생 정보 노출 0건
      failure_patterns:
      - 기억에 의존한 과장('아주 잘해요')
      - 다른 아이와 비교 답변
    scorer_private:
      rag_link: F13 직접(J058~J061)
