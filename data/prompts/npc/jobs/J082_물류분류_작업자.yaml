  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[물류분류 작업자/물류창고·분류/작업순서·절차형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 입고품, 출고지시서, 로케이션, 바코드. 주요상대/NPC는
    창고관리자, 택배기사, 검수자. 핵심산출물은 입출고체크표, 재고차이보고. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 물류창고·분류의 업무대상과 산출물을 벗어난
    미션 생성 금지.'
