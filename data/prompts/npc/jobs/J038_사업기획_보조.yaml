  rag_chunk_text: '[사업기획 보조/서비스·상품기획·PM보조/정보·판단형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 요구사항, 사용자 불편, 기능목록, 우선순위. 주요상대/NPC는
