  goal: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다.
  rag_chunk_text: '[사업기획 보조/서비스·상품기획·PM보조/정보·판단형] 처리·제작·응대: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다. 업무대상은 요구사항, 사용자 불편, 기능목록, 우선순위.
    주요상대/NPC는 PM, 개발자, 디자이너, 고객. 핵심산출물은 요구사항정리표, 우선순위표, 회의록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 서비스·상품기획·PM보조의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
