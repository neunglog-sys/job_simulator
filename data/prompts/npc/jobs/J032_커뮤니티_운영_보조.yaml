    콘텐츠팀장, 디자이너, 고객/팔로워. 핵심산출물은 콘텐츠 캘린더, 게시문안, 댓글 대응안. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 콘텐츠·SNS운영의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
