    coach_private:
      success_criteria:
      - 목적·대상·매체가 명확히 정리되고 변경·승인 기준(누가 승인하는지)을 확인했으며
      - 모르는 항목을 추측하지 않고 질문으로 남겼는가
      failure_patterns:
