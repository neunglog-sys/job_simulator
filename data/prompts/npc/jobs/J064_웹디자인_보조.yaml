    - 마스터 파일에 개인정보 노출 프레임 발견
    - 백업 없는 원본 덮어쓰기 위험
    - 시사 직전 구버전 브리프 기준 시안 발견
  stages:
  - stage_id: S1
    name: 요청·범위 이해
    goal: '브리프에서 프로젝트 목적·대상·매체·일정·예산·제약조건을 파악하고 작업 범위와 변경·승인 기준을 확인한다 (원 단계 1: 의뢰·범위 정의)'
