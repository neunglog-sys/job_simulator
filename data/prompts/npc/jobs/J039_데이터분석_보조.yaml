    주요상대/NPC는 마케팅팀장, 영업팀, 데이터담당. 핵심산출물은 분석요약표, 인사이트 메모, 리포트. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 데이터·CRM·매출분석의
