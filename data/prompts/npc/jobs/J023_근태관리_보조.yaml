  job_name: 근태관리 보조
  family_id: F05
  family_name: 인사·채용·교육운영
  module: 대인응대형
review:
  status: researched_needs_human_review
  generated: true
  human_review_required: true
prompt_contract:
  npc_visible:
    work_targets:
    - 지원자 정보
    - 면접 일정
    - 교육 일정
    - 근태자료
    npc_roles:
    - 지원자
    - 면접관
    - 교육생
    - 강사
    outputs:
    - 면접일정표
    - 안내메일
    - 교육운영 체크리스트
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J023-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[근태관리 보조/인사·채용·교육운영/대인응대형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 지원자 정보, 면접 일정, 교육 일정, 근태자료. 주요상대/NPC는
    지원자, 면접관, 교육생, 강사. 핵심산출물은 면접일정표, 안내메일, 교육운영 체크리스트. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 인사·채용·교육운영의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
- chunk_id: J023-S2
  stage_id: S2
  name: 자료·현황 확인
  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[근태관리 보조/인사·채용·교육운영/대인응대형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 지원자 정보, 면접 일정, 교육 일정, 근태자료. 주요상대/NPC는
    지원자, 면접관, 교육생, 강사. 핵심산출물은 면접일정표, 안내메일, 교육운영 체크리스트. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 인사·채용·교육운영의
