schema_version: npc.job-override.v1
job:
  job_id: J103
  job_name: 배차현장 지원
  family_id: F24
  family_name: 배송·운반·하역
  module: 돌발상황 대처형
review:
  status: integrated_research
  generated: true
  human_review_required: false
prompt_contract:
  npc_visible:
    work_targets:
    - 배송지
    - 운송장
    - 적재품
    - 시간표
    - 도로
    - 현장상황
    npc_roles:
    - 배차담당
    - 고객
    - 창고담당
    outputs:
    - 배송현황표
    - 지연보고
    - 인수증
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J103-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[배차현장 지원/배송·운반·하역/돌발상황 대처형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 배송지, 운송장, 적재품, 시간표, 도로/현장상황. 주요상대/NPC는
    배차담당, 고객, 창고담당. 핵심산출물은 배송현황표, 지연보고, 인수증. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 배송·운반·하역의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
- chunk_id: J103-S2
  stage_id: S2
  name: 자료·현황 확인
  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[배차현장 지원/배송·운반·하역/돌발상황 대처형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 배송지, 운송장, 적재품, 시간표, 도로/현장상황.
    주요상대/NPC는 배차담당, 고객, 창고담당. 핵심산출물은 배송현황표, 지연보고, 인수증. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 배송·운반·하역의 업무대상과
    산출물을 벗어난 미션 생성 금지.'
- chunk_id: J103-S3
  stage_id: S3
  name: 처리·제작·응대
  goal: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다.
  rag_chunk_text: '[배차현장 지원/배송·운반·하역/돌발상황 대처형] 처리·제작·응대: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다. 업무대상은 배송지, 운송장, 적재품, 시간표, 도로/현장상황.
    주요상대/NPC는 배차담당, 고객, 창고담당. 핵심산출물은 배송현황표, 지연보고, 인수증. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 배송·운반·하역의 업무대상과
    산출물을 벗어난 미션 생성 금지.'
- chunk_id: J103-S4
  stage_id: S4
  name: 검수·판단
  goal: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다.
  rag_chunk_text: '[배차현장 지원/배송·운반·하역/돌발상황 대처형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 배송지, 운송장, 적재품, 시간표, 도로/현장상황. 주요상대/NPC는
    배차담당, 고객, 창고담당. 핵심산출물은 배송현황표, 지연보고, 인수증. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 배송·운반·하역의 업무대상과 산출물을
    벗어난 미션 생성 금지.'
