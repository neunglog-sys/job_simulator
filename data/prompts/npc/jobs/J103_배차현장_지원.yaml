  stage_id: S5
  name: 보고·인계
  goal: 결과, 근거, 남은 이슈, 다음 액션을 공유한다.
  rag_chunk_text: '[배차현장 지원/배송·운반·하역/돌발상황 대처형] 보고·인계: 결과, 근거, 남은 이슈, 다음 액션을 공유한다. 업무대상은 배송지, 운송장, 적재품, 시간표, 도로/현장상황. 주요상대/NPC는
