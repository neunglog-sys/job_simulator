  rag_chunk_text: '[CRM 운영자/데이터·CRM·매출분석/정보·판단형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 매출표, 고객데이터, 캠페인 결과, 대시보드. 주요상대/NPC는
