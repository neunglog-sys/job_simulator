content_variants:
- category: 의료·복지·상담 응대
  module: 대인응대형
  rag_status: 부분
  workflow: 접수·예약 확인 → 문진표·진료정보 확인 → 대기환자 안내·순번 관리 → 진료 전후 설명·수납 → 예약·기록·인계
  npc_visible:
    npc_roles:
    - 원무팀장
    - 수간호사
    - 고령 환자(보호자 동반)
    - 약사(복약지도)
    input_materials:
    - 예약자 명단
    - 문진표
    - 진료 접수 대장
    - 수납·비급여 안내표
    - 복약안내문
    - 개인정보 동의서
    outputs:
    - 접수 완료 대장
    - 대기 순번 안내 기록
    - 진료 전후 설명 확인
    - 수납 영수증·예약증
    - 인계 메모
    sudden_events:
    - 접수 몰림·시스템 지연
    - 문진표 알레르기 기재 누락
    - 대기 순서 항의
    - 응급 환자 끼어들기
    - 개인정보 유출 위험
  stages:
  - stage_id: S1
    name: 접수·예약 확인
    goal: 예약 명단과 신분을 대조해 접수를 처리하고 초진·재진을 구분한다
    npc_visible:
      materials:
      - 예약자 명단
      - 문진표
      - 진료 접수 대장
      - 수납·비급여 안내표
      - 복약안내문
      - 개인정보 동의서
      npc_roles:
      - 원무팀장
      - 수간호사
      - 고령 환자(보호자 동반)
      - 약사(복약지도)
      outputs:
      - 접수 완료 대장
      - 대기 순번 안내 기록
      - 진료 전후 설명 확인
      - 수납 영수증·예약증
      - 인계 메모
      mission_candidate: 예약자 명단과 신분증을 대조해 초진 2명·재진 3명을 구분 접수하고 초진에게 문진표를 안내한다
    coach_private:
      success_criteria:
      - 예약·신분 일치 확인
      - 초진·재진 구분 정확
      - 개인정보는 필요 최소만 확인
      failure_patterns:
      - 이름만 듣고 동명이인 오접수
      - 문진표 안내 누락
  - stage_id: S2
    name: 문진표·진료정보 확인
    goal: 문진표 필수 항목(증상·복용약·알레르기)의 누락을 찾아 보완 요청한다
    npc_visible:
      materials:
      - 예약자 명단
      - 문진표
      - 진료 접수 대장
