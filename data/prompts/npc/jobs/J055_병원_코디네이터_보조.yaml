  stage_id: S3
  name: 처리·제작·응대
  goal: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다.
  rag_chunk_text: '[병원 코디네이터 보조/안내·접수·예약·프론트/대인응대형] 처리·제작·응대: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다. 업무대상은 예약정보, 방문자, 일정, 시설/서비스 안내.
    주요상대/NPC는 방문객, 고객, 담당부서. 핵심산출물은 예약확인표, 방문안내문, 접수기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 안내·접수·예약·프론트의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
- chunk_id: J055-S4
  stage_id: S4
  name: 검수·판단
  goal: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다.
  rag_chunk_text: '[병원 코디네이터 보조/안내·접수·예약·프론트/대인응대형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 예약정보, 방문자, 일정, 시설/서비스 안내.
    주요상대/NPC는 방문객, 고객, 담당부서. 핵심산출물은 예약확인표, 방문안내문, 접수기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 안내·접수·예약·프론트의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
- chunk_id: J055-S5
  stage_id: S5
  name: 보고·인계
  goal: 결과, 근거, 남은 이슈, 다음 액션을 공유한다.
  rag_chunk_text: '[병원 코디네이터 보조/안내·접수·예약·프론트/대인응대형] 보고·인계: 결과, 근거, 남은 이슈, 다음 액션을 공유한다. 업무대상은 예약정보, 방문자, 일정, 시설/서비스 안내. 주요상대/NPC는
    방문객, 고객, 담당부서. 핵심산출물은 예약확인표, 방문안내문, 접수기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 안내·접수·예약·프론트의 업무대상과
