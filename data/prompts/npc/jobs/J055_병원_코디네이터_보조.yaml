    goal: 대기 현황을 파악해 순번·예상시간을 안내하고 응급·고령 배려를 판단한다
    npc_visible:
      materials:
      - 예약자 명단
      - 문진표
      - 진료 접수 대장
      - 수납·비급여 안내표
      - 복약안내문
      - 개인정보 동의서
      npc_roles:
