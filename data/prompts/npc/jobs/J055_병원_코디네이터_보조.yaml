      - 설명 확인 기록
      failure_patterns:
      - 비급여 사후 통보로 항의 유발
      - 효능·부작용을 임의로 설명
  - stage_id: S5
    name: 예약·기록·인계
    goal: 당일 특이사항을 기록하고 미결(검사결과 대기 등)을 다음 근무자에게 인계한다
    npc_visible:
