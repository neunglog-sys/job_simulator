  missions:
  - mission_id: KTS-01-01
    situation_type: 정상업무
    difficulty: 보통
    npc_visible:
      npc: 원무팀장
      request_line: 오전 예약 명단이야. 초진·재진 구분해서 접수하고, 초진분들 문진표 안내까지 부탁해.
