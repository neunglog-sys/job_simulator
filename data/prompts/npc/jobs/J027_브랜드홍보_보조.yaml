  rag_chunk_text: '[브랜드홍보 보조/마케팅·홍보/정보·판단형] 보고·인계: 결과, 근거, 남은 이슈, 다음 액션을 공유한다. 업무대상은 캠페인 목표, 타깃, 채널, 성과지표. 주요상대/NPC는 마케팅팀장,
