  rag_chunk_text: '[브랜드홍보 보조/마케팅·홍보/정보·판단형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 캠페인 목표, 타깃, 채널, 성과지표. 주요상대/NPC는 마케팅팀장,
