  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[서비스기획 보조/서비스·상품기획·PM보조/정보·판단형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 요구사항, 사용자 불편, 기능목록, 우선순위.
    주요상대/NPC는 PM, 개발자, 디자이너, 고객. 핵심산출물은 요구사항정리표, 우선순위표, 회의록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 서비스·상품기획·PM보조의
