  stage_id: S2
  name: 자료·현황 확인
  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[CRM마케팅 운영/마케팅·홍보/정보·판단형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 캠페인 목표, 타깃, 채널, 성과지표. 주요상대/NPC는
    마케팅팀장, 디자이너, 대행사, 고객. 핵심산출물은 캠페인 기획안, 문구안, 성과요약. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 마케팅·홍보의 업무대상과
    산출물을 벗어난 미션 생성 금지.'
