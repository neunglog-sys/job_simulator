      - 운영보고서 양식
      user_mission: 테스트 결과·결함 수정 내역·보류 사항을 릴리스노트 초안과 인수인계 요약으로 작성하고, AI 사수와 문답하며 빠진 항목을 보완한다
      outputs:
      - 릴리스노트 초안+인수인계 요약(보류 결함·롤백 방법 포함
      - 운영보고서 양식 준수) — 요구사항 확인하기·프로그램 디버깅 기록 반영
      sudden_event: 인계 문서 작성 중 운영 로그에서 수정했던 결함과 동일한 오류 재발 알림이 뜬다 — 재발 사실과 발생 시각을 인계 요약에 추가하고 사수에게 즉시 보고해야 함
    coach_private:
      required_actions:
      - 변경 이력과 결함 목록에서 수정 완료·보류 항목을 분류한다
