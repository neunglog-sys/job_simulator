  job_name: 주니어 웹개발자
  family_id: F16
  family_name: 웹·앱·소프트웨어개발
  module: 제작·상태판단형
review:
  status: integrated_research
  generated: true
  human_review_required: false
prompt_contract:
  npc_visible:
    work_targets:
    - 요구사항
    - 이슈
    - 코드
    - 테스트 결과
    npc_roles:
    - PM
    - 개발자
    - QA
    - 사용자
    outputs:
    - 기능명세
    - 구현메모
    - 테스트결과
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
