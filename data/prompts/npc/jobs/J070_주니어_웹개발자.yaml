    PM, 개발자, QA, 사용자. 핵심산출물은 기능명세, 구현메모, 테스트결과. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 웹·앱·소프트웨어개발의 업무대상과
