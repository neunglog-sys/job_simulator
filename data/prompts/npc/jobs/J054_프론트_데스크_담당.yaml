    coach_private:
      success_criteria:
      - 미결 상태·다음 조치 명시
      - 분실물 대장 일치
      failure_patterns:
      - '''특이사항 없음'' 한 줄 인계'
      - 분실물 기록 누락
  missions:
  - mission_id: KTS-05-01
    situation_type: 정상업무
    difficulty: 보통
    npc_visible:
      npc: 프론트 매니저
      request_line: 오늘 만실이야. 야간 로그 확인하고 인수인계 브리핑부터 하자.
