      - 교대 인계장
      mission_candidate: 만취 승객 소란에 단계 대응(정중 안내→거리 유지→보안/경찰 요청)을 수행하고 주변 고객을 보호한다
    coach_private:
      success_criteria:
      - 단독 물리 대응 금지
      - 단계별 에스컬레이션
      - 주변 안내 병행
      failure_patterns:
      - 혼자 제지 시도
      - 방송 없이 우왕좌왕
  - stage_id: S5
    name: 마감·로그 기록·인계
    goal: 당일 처리·미결을 로그로 남기고 다음 근무자에게 인계한다
    npc_visible:
