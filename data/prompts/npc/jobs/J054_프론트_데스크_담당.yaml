schema_version: npc.job-override.v1
job:
  job_id: J054
  job_name: 프론트 데스크 담당
  family_id: F12
  family_name: 안내·접수·예약·프론트
  module: 대인응대형
review:
  status: integrated_research
  generated: true
  human_review_required: false
prompt_contract:
  npc_visible:
    work_targets:
    - 예약정보
    - 방문자
    - 일정
    - 시설
    - 서비스 안내
    npc_roles:
    - 방문객
    - 고객
    - 담당부서
    outputs:
    - 예약확인표
    - 방문안내문
    - 접수기록
    forbidden:
    - 플레이어를 채점하거나 점수·통과 여부를 말하지 않는다.
    - 오류의 정답·모범답안·단계별 해설을 제공하지 않는다.
    - 업무상 필요한 지시·사실·자료·권한 범위만 전달한다.
  coach_private:
    success_criteria:
    - 목적·자료·기준·결과·다음액션 포함
    failure_patterns:
    - 추측 진행
    - 질문 누락
    - 산출물 혼동
kb_stages:
- chunk_id: J054-S1
  stage_id: S1
  name: 업무요청 이해
  goal: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다.
  rag_chunk_text: '[프론트 데스크 담당/안내·접수·예약·프론트/대인응대형] 업무요청 이해: 요청자의 목적, 결과물, 마감, 제한조건을 확인한다. 업무대상은 예약정보, 방문자, 일정, 시설/서비스 안내.
    주요상대/NPC는 방문객, 고객, 담당부서. 핵심산출물은 예약확인표, 방문안내문, 접수기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 안내·접수·예약·프론트의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
- chunk_id: J054-S2
  stage_id: S2
  name: 자료·현황 확인
  goal: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다.
  rag_chunk_text: '[프론트 데스크 담당/안내·접수·예약·프론트/대인응대형] 자료·현황 확인: 업무대상 자료를 읽고 누락/불일치/위험요소를 표시한다. 업무대상은 예약정보, 방문자, 일정, 시설/서비스 안내.
    주요상대/NPC는 방문객, 고객, 담당부서. 핵심산출물은 예약확인표, 방문안내문, 접수기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 안내·접수·예약·프론트의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
- chunk_id: J054-S3
  stage_id: S3
  name: 처리·제작·응대
  goal: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다.
  rag_chunk_text: '[프론트 데스크 담당/안내·접수·예약·프론트/대인응대형] 처리·제작·응대: 직무별 기준에 맞춰 문서/응대/작업/산출물을 만든다. 업무대상은 예약정보, 방문자, 일정, 시설/서비스 안내.
    주요상대/NPC는 방문객, 고객, 담당부서. 핵심산출물은 예약확인표, 방문안내문, 접수기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 안내·접수·예약·프론트의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
- chunk_id: J054-S4
  stage_id: S4
  name: 검수·판단
  goal: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다.
  rag_chunk_text: '[프론트 데스크 담당/안내·접수·예약·프론트/대인응대형] 검수·판단: 오류, 안전, 고객영향, 비용, 일정, 품질을 점검한다. 업무대상은 예약정보, 방문자, 일정, 시설/서비스 안내.
    주요상대/NPC는 방문객, 고객, 담당부서. 핵심산출물은 예약확인표, 방문안내문, 접수기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 안내·접수·예약·프론트의
    업무대상과 산출물을 벗어난 미션 생성 금지.'
- chunk_id: J054-S5
  stage_id: S5
  name: 보고·인계
  goal: 결과, 근거, 남은 이슈, 다음 액션을 공유한다.
  rag_chunk_text: '[프론트 데스크 담당/안내·접수·예약·프론트/대인응대형] 보고·인계: 결과, 근거, 남은 이슈, 다음 액션을 공유한다. 업무대상은 예약정보, 방문자, 일정, 시설/서비스 안내. 주요상대/NPC는
    방문객, 고객, 담당부서. 핵심산출물은 예약확인표, 방문안내문, 접수기록. 성공기준은 요청 목적, 누락자료, 판단근거, 다음 액션이 명확한 것이다. 금지혼합: 같은 모듈이라도 안내·접수·예약·프론트의 업무대상과
    산출물을 벗어난 미션 생성 금지.'
content_variants:
- category: 안내·접수·예약·프론트
  module: 대인응대형
  rag_status: 직접
  workflow: 근무 준비·인수인계 확인 → 체크인/개찰·예약 대조 → 요청 응대·시설/노선 안내 → 돌발 민원·안전상황 대응 → 체크아웃/마감·로그 기록·인계
  npc_visible:
    npc_roles:
    - 프론트 매니저(당번 책임자)
    - 프론트 선임(사수)
    - 외국인 투숙객(영어)
    - 만취 승객
    input_materials:
    - 예약 시스템 명단(PMS)
    - 객실
    - 좌석 배정표
    - 요금·규정 안내
    - 인수인계 로그
    - 분실물 대장
    - 비상 대응 매뉴얼
    outputs:
    - 체크인
    - 개찰 처리 기록
    - 요청 처리 로그
    - 민원 대응 보고
    - 분실물 접수증
    - 교대 인계장
    sudden_events:
    - 오버부킹 발생
    - 예약자명 불일치
    - 화재경보 오작동 안내
    - 만취 승객 소란
    - 분실물 주인 주장 충돌
  stages:
  - stage_id: S1
    name: 근무 준비·인수인계 확인
    goal: 전 근무 로그를 확인하고 당일 예약·특이사항을 파악한다
