      - 분실물 접수증
      - 교대 인계장
      mission_candidate: 동시 요청 4건(어메니티·길 안내·소음 민원·짐 보관)의 처리 순서를 정하고 각각 처리·회신한다
    coach_private:
      success_criteria:
      - 긴급도·소요시간 기준 우선순위
      - 처리 결과 회신 누락 0건
      failure_patterns:
      - 먼저 온 순서만 고집해 민원 방치
      - 처리 후 회신 생략
  - stage_id: S4
    name: 돌발·안전 대응
    goal: 만취·화재경보·오버부킹 등 돌발을 매뉴얼 단계로 대응한다
    npc_visible:
