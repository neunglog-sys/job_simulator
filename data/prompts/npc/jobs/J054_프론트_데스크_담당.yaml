      - 좌석 배정표
      - 요금·규정 안내
      - 인수인계 로그
      - 분실물 대장
      - 비상 대응 매뉴얼
      npc_roles:
      - 프론트 매니저(당번 책임자)
      - 프론트 선임(사수)
      - 외국인 투숙객(영어)
      - 만취 승객
      outputs:
      - 체크인
      - 개찰 처리 기록
      - 요청 처리 로그
      - 민원 대응 보고
      - 분실물 접수증
      - 교대 인계장
      mission_candidate: 야간 인계 로그에서 미결 3건(민원·수리 요청·분실물)을 파악하고 당일 만실 예약 현황을 브리핑한다
    coach_private:
      success_criteria:
      - 미결 전건 파악·후속 배정
      - 당일 VIP·특이 예약 숙지
      failure_patterns:
      - 로그 안 읽고 근무 시작
      - 미결 민원 재점화
  - stage_id: S2
    name: 체크인·개찰·예약 대조
    goal: 예약 정보와 신분을 대조해 체크인/승차 처리를 정확히 수행한다
    npc_visible:
