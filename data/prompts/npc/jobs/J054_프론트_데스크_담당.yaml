    coach_private:
      success_criteria:
      - 본인 확인 절차 준수
      - 불일치는 추궁이 아닌 확인 질문으로
      - 규정 내 처리
      failure_patterns:
      - 불일치 무시하고 키 발급
      - 고객 면전에서 의심 표현
  - stage_id: S3
    name: 요청 응대·안내
    goal: 시설·노선·주변 정보를 정확히 안내하고 요청을 접수·처리한다
    npc_visible:
      materials:
      - 예약 시스템 명단(PMS)
      - 객실
      - 좌석 배정표
      - 요금·규정 안내
      - 인수인계 로그
      - 분실물 대장
      - 비상 대응 매뉴얼
      npc_roles:
