# MANUALLY MAINTAINED — kts-03 오픈 준비·출고 운반 시나리오를 게임 흐름과 맞춰 관리합니다.
job: kts-03
slug: kts-03
title: 영업·판매·매장응대 — 신입의 하루
module: 대인응대형
initial_state:
  trust: 50
  schedule_stability: 70
  requirement_clarity: 20
steps:
- id: m1
  type: 정상업무
  title: 오픈 전 진열 상품 출고 및 안전 운반
  mission: '권채원: "출고 목록을 확인하고 창고에서 와인을 정확히 챙겨서, 카트로 매장 진열대까지 안전하게 옮겨 줘."


    출고 목록의 와인 종류와 수량을 확인해 정확히 피킹하고, 카트 속도를 조절하며 장애물을 피해 파손 없이 매장으로 운반한다'
  npcs:
  - npc_kts-03_02
  guide: '제공 자료: 오픈 진열용 출고 목록, 와인 창고 위치도, 카트 운반 안전수칙, 매장 진열 기준표'
  task:
    kind: checklist
    prompt: '출고 목록의 와인 종류와 수량을 확인해 정확히 피킹하고, 카트 속도를 조절하며 장애물을 피해 파손 없이 매장으로 운반한다


      아래 보기에서 이 업무에 필요한 행동을 모두 선택하세요.'
    criteria:
    - 출고 수량의 정확성과 운반 안전수칙을 모두 고려했는가
    pass_score: 70
    hints:
      warning: 목록을 확인하지 않고 임의로 피킹, 과속 운반, 장애물 사이를 무리하게 통과
      answer_guide: ① 출고 목록의 종류와 수량을 확인한다. ② 창고 위치를 파악해 동선을 정한다. ③ 종류별 수량을 정확히 피킹한다. ④ 와인이 흔들리지 않게 카트에 적재한다. ⑤ 보행자와 적치물을 확인하며
        적정 속도로 운반하고, 누락·파손이 있으면 즉시 매니저에게 보고한다.
    options:
    - key: a
      label: 출고 목록에 적힌 와인 종류와 수량을 먼저 확인한다
    - key: b
      label: 와인 위치를 확인해 불필요하게 창고를 왕복하지 않도록 동선을 정한다
    - key: c
      label: 목록보다 많이 가져가면 편하므로 여분의 와인을 임의로 더 싣는다
    - key: d
      label: 종류별 수량을 정확히 피킹하고 카트에서 흔들리지 않게 적재한다
    - key: e
      label: 직원과 고객, 적치물을 살피며 적정 속도로 카트를 운반한다
    - key: f
      label: 누락이나 파손을 발견하면 숨기지 않고 담당 매니저에게 보고한다
    - key: g
      label: 제한시간을 줄이기 위해 장애물 사이를 최고 속도로 통과한다
    answer:
      keys:
      - a
      - b
      - d
      - e
      - f
    on_pass: m2
- id: m2
  type: 자료·정보 누락
  title: 와인 선물 고객 니즈(고객의 요구사항) 파악
  mission: '권채원: "단골 유선우 님이 선물할 와인을 찾으세요. \"좋은 걸로 하나\"라고만 하시는데
    예산·취향 정보가 없네요. 질문으로 니즈를 파악해서 메모를 완성해봐요."


    정보가 없는 선물 요청에서 질문으로 니즈(받는 분·상황·예산·취향)를 파악해 니즈 메모를 완성한다'
  npcs:
  - npc_kts-03_02
  guide: '제공 자료: 상품 정보 카드(와인 12종), 니즈 질문 가이드, 재고 현황, 가격대별 추천 매트릭스'
  task:
    kind: choice
    prompt: '정보가 없는 선물 요청에서 질문으로 니즈(받는 분·상황·예산·취향)를 파악해 니즈 메모를 완성한다


      아래 행동 중 문제가 있는 것 하나를 골라내세요.'
    criteria:
    - 문제 있는 행동을 정확히 찾아냈는가
    pass_score: 70
    hints:
      warning: 비싼 상품부터 제시, 고객 말 끊고 추천 강행
      answer_guide: ① 고객의 취향을 파악할 수 있는 개방형 질문(자유롭게 답하는 질문) 4개를 설계한다. ② 자연스러운 대화를 통해 고객의 답변을 확인한다. ③ 수집한 답변을 다시 언급하며 고객의 의도를
        재확인한다. ④ 파악한 고객의 니즈(고객의 요구사항)를 메모에 상세히 기록한다. ⑤ 메모를 바탕으로 추천할 와인 후보군을 2~3종으로 선별한다.
    options:
    - key: a
      label: 고객이 원하는 스타일이 맞는지 다시 여쭤보며 확인하기
    - key: b
      label: 대화 속에서 자연스럽게 필요한 취향 정보를 이끌어내기
    - key: c
      label: 고객의 의중을 파악하기 위한 개방형 질문들을 미리 구상하기
    - key: d
      label: 고객의 예산 범위를 확인하지 않고 비싼 와인부터 추천하기
    answer:
      key: d
    on_pass: m3
- id: m3
  type: 우선순위 충돌
  title: 고객 요청 우선순위 정리
  mission: '조도윤: "지금 시음 행사 손님, 계산 대기, 전화 문의, 반품 접수가 한꺼번에 몰렸다. 순서 정해서 움직여."


    동시 발생 4건의 처리 순서를 원칙 기준으로 배열하고 지원 요청 여부를 판단해 보고한다'
  npcs:
  - npc_kts-03_01
  guide: '제공 자료: 동시 상황 4건 카드, 응대 우선순위 원칙(결제 완료>안전>대면>전화), 응원 요청 절차'
  task:
    kind: order
    prompt: '동시 발생 4건의 처리 순서를 원칙 기준으로 배열하고 지원 요청 여부를 판단해 보고한다


      아래 항목을 올바른 처리 순서대로 배열해 제출하세요.'
    criteria:
    - 업무 처리 순서를 올바르게 판단했는가
    pass_score: 70
    hints:
      warning: 전화부터 길게 응대해 대면 고객 이탈, 지원 요청 없이 방치
      answer_guide: ① 접수된 각 건의 긴급도와 소요 시간을 분류한다. ② 이탈 위험이 높은 계산 대기 업무를 최우선으로 처리한다. ③ 시음 행사 중 발생할 수 있는 알레르기 등 안전 요소를 확인한다.
        ④ 전화 문의는 추후 회신하기로 약속하고 통화를 종료한다. ⑤ 결정된 업무 처리 순서와 그 근거를 사수(일을 가르쳐주는 선배)에게 보고한다.
    options:
    - key: a
      label: 매장을 벗어나기 쉬운 결제 대기 고객을 가장 먼저 응대한다.
    - key: b
      label: 인입된 요청들의 긴급한 정도와 예상 소요 시간을 파악한다.
    - key: c
      label: 시음회 진행 시 알레르기 성분 등 안전 관련 사항을 점검한다.
    - key: d
      label: 유선 문의는 나중에 다시 연락하겠다고 안내한 뒤 전화를 끊는다.
    answer:
      keys:
      - b
      - a
      - c
      - d
    on_pass: m4
- id: m4
  type: 보고·인계
  title: 정산 차액 규명과 마감 인계
  mission: '조도윤: "마감 정산에서 현금이 안 맞아. 원인 찾아서 마감 인계까지 정리해 줘."


    정산 차액의 원인을 영수증·POS 대조로 찾아내고 마감 체크리스트와 인계장을 완성한다'
  npcs:
  - npc_kts-03_01
  guide: '제공 자료: POS 정산 내역, 영수증 묶음, 시재 기록표, 마감 체크리스트, 인계장 양식'
  task:
    kind: write
    prompt: '정산 차액의 원인을 영수증·POS 대조로 찾아내고 마감 체크리스트와 인계장을 완성한다


      제출 산출물: 차액 원인 보고, 마감 인계장'
    criteria:
    - 원인 규명까지 추적(사비 메꿈 금지)
    - 클레임 미결 명시
    - 흔한 실수를 피했는가 (차액을 사비로 채워 은폐, '내일 보자'로 원인 방치)
    pass_score: 70
    hints:
      warning: 차액을 사비로 채워 은폐, '내일 보자'로 원인 방치
      answer_guide: ① 보유 중인 현금 시재(보유 중인 현금)를 다시 계수(돈을 세는 것)한다. ② POS(결제 단말기) 거래 내역과 실물 영수증을 대조한다. ③ 결제 수단 정정 누락 등 차액 원인을 특정한다.
        ④ 확인된 오류에 대해 정정 절차를 처리하고 기록한다. ⑤ 미결(해결되지 않음)된 클레임(고객 불만 사항) 건을 포함하여 마감 인계장을 작성한다.
    on_pass: m5
- id: m5
  type: 실무 체험
  title: 오픈 진열분 출고 및 안전 운반
  mission: '권채원: "지금까지 익힌 내용을 실제 업무로 해볼 차례예요. 출고 목록을 확인해 와인을 정확히 챙기고, 카트로 매장까지 안전하게 옮겨 주세요."'
  npcs:
  - npc_kts-03_02
  guide: 출고 목록을 기억해 종류별 수량을 정확히 피킹한 뒤, 카트 속도를 조절하고 장애물을 피해 매장까지 운반합니다.
  activity:
    kind: minigame
    game_id: kts-03-supply
    label: 출고·운반 임무
    briefing:
    - 매장 오픈 전에 진열할 상품이 부족하지 않도록, 출고 목록에 맞춰 창고에서 와인을 가져오는 업무예요.
    - 먼저 목록에 적힌 와인의 종류와 수량을 확인하고 창고 위치를 파악한 뒤, 종류별 수량이 틀리지 않도록 정확히 피킹해 카트에 실어 주세요.
    - 운반할 때는 와인이 흔들리지 않게 적재하고, 이동 중인 직원과 고객, 통로의 적치물을 살피며 안전한 속도로 이동하세요. 누락이나 파손이 생기면 바로 보고해야 합니다.
    on_complete: m6
- id: m6
  type: 실무 회고
  title: 출고 및 운반 결과 돌아보기
  mission: '권채원: "출고와 운반은 마쳤군요. 수량을 맞추거나 카트를 옮기면서 헷갈렸던 부분이 있었다면 이유를 이야기해 주세요. 다음 고객 응대 업무 전에 한번 짚고 넘어가죠."'
  npcs:
  - npc_kts-03_02
  guide: 출고 목록 확인, 피킹 또는 카트 운반 과정에서 헷갈렸거나 시간이 걸린 부분과 그 이유를 권채원에게 답합니다.
  activity:
    kind: debrief
    label: 결과 돌아보기
    prompt: 출고 목록 확인과 와인 피킹, 카트 운반 과정에서 가장 헷갈렸거나 시간이 오래 걸린 부분과 그 이유를 이야기해 주세요.
    completion_message: 좋아요. 이야기해 준 내용은 다음 업무에 참고할게요. 조도윤 점장님이 찾고 있으니 가서 고객 응대 업무를 받아보세요.
    on_complete: m7
- id: m7
  type: 실무 체험
  title: 고객 니즈 파악 및 상품 추천
  mission: '조도윤: "이번에는 실제 매장 응대를 맡아보세요. 손님의 요구를 정확히 파악해 알맞은 와인을 추천하고, 돌발 환불 요구에도 원칙에 맞게 대응해 주세요."'
  npcs:
  - npc_kts-03_01
  guide: 손님의 상황·예산·취향을 확인해 적합한 와인을 추천하고, 품절·예산 초과 상품은 제외합니다. 돌발 고객에게는 사실 확인, 규정 안내, 대안 제시 후 필요한 경우 점장에게 인계합니다.
  activity:
    kind: minigame
    game_id: kts-03-customer
    label: 고객 응대 임무
    briefing:
    - 이번에는 매장을 찾은 고객의 상황을 듣고 알맞은 와인을 추천하는 업무를 맡아보세요.
    - 선물 용도나 마시는 상황, 선호하는 맛과 예산을 먼저 확인한 뒤 상품의 종류와 가격, 재고 상태를 함께 살펴야 해요. 예산을 넘거나 품절된 상품은 제외하고 고객에게 가장 적합한 와인을 제안해 주세요.
    - 환불을 요구하는 고객이 오면 영수증과 상품 상태를 먼저 확인하고 매장 규정을 안내하세요. 바로 처리하기 어려운 경우에는 가능한 대안을 제시하고, 고성이 계속되거나 판단이 필요하면 점장에게 인계하면 됩니다.
    on_complete: __reflection__
sudden_quest:
  npc: npc_kts-03_04
  intro: 오건우가 다급하게 찾아왔다. "영수증? 그런 거 없어도 여기서 산 거 맞다니까! 당장 환불해요! (개봉 상품·고성)"
  task:
    kind: choice
    prompt: '영수증 없는 개봉 상품 환불 요구에 규정 기반 대응을 하고 고성·위협 시 인계 기준에 따라 에스컬레이션한다


      아래 보기 중 지금 가장 먼저 해야 할 대응을 하나 고르세요.'
    criteria:
    - 가장 먼저 할 대응을 올바르게 판단했는가
    pass_score: 70
    hints:
      warning: 언쟁으로 맞대응, 조용히 시키려 규정 밖 환불 승인
      answer_guide: ① 경청·사실 확인(구매 이력 조회 시도) ② 규정 근거 안내 ③ 가능한 대안(교환·적립 확인) 제시 ④ 고성 지속 시 매니저 인계 ⑤ 대응 기록
    options:
    - key: a
      label: 경청·사실 확인(구매 이력 조회 시도)
    - key: b
      label: 언쟁으로 맞대응
    - key: c
      label: 조용히 시키려 규정 밖 환불 승인
    - key: d
      label: 규정 근거 안내
    answer:
      key: a
    type: 오류·안전위험
