# 손편집본 — 재생성(build_scenarios emit) 대상에서 제외됨. 위에 AUTO-GENERATED 마커를
# 다시 넣지 말 것(넣으면 다음 재생성 때 이 수정이 통째로 덮어써짐).
#
# 2026-07-20 변경: 4단계 미니게임(창구 대기열 배정 + 진상 손님 대처)에 맞춰 돌발 퀘스트를
# 교체. 기존 보이스피싱 의심 건(한하윤)은 로스터에 있던 '급한 민원 고객' 조선우의 새치기·
# 폭언 상황으로 바꿨다 — 게임의 '순서 배정 중 진상 난입'과 직접 대응한다.
# 보이스피싱 소재는 m1(창구 접수·안내)의 응대 대상으로 남아 있다.
job: kts-04
slug: kts-04
title: 상담·안내·중개 응대 — 신입의 하루
module: 대인응대형
initial_state:
  trust: 50
  schedule_stability: 70
  requirement_clarity: 20
steps:
- id: m1
  type: 정상업무
  title: 창구 고객 접수 및 안내
  mission: '최지훈: "창구 오픈이다. 오시는 분들 요건 분류해서 접수하고, 서류 모자란 분은 목록으로 안내해 드려."


    방문 고객 3명의 요건을 분류 접수하고 서류 미비 1건에 필요서류 목록과 재방문 안내를 제공한다'
  npcs:
  - npc_kts-04_02
  guide: '제공 자료: 상담 신청서, 업무별 필요서류 기준표, 신분 확인 절차, 번호표 시스템'
  task:
    kind: checklist
    prompt: '방문 고객 3명의 요건을 분류 접수하고 서류 미비 1건에 필요서류 목록과 재방문 안내를 제공한다


      아래 보기에서 이 업무에 필요한 행동을 모두 선택하세요.'
    criteria:
    - 필요한 행동을 빠짐없이 골랐는가
    pass_score: 70
    hints:
      warning: 서류 미비인데 접수 강행 후 반려, 확인 절차 생략
      answer_guide: ① 방문 고객의 요건을 파악하여 계좌, 대출, 증명서 등으로 분류한다. ② 고객의 신분을 확인하는 절차를 수행한다. ③ 누락되거나 부족한 서류를 목록으로 정리한다. ④ 대체 서류나 발급처를
        안내하여 고객의 재방문을 최소화하도록 돕는다. ⑤ 접수 처리한 내용을 기록한다.
    options:
    - key: a
      label: 고객의 본인 여부 확인 절차를 생략한다
    - key: b
      label: 신분증을 대조하여 내방객의 신원을 확인한다
    - key: c
      label: 접수한 세부 업무 내역을 시스템에 기록한다
    - key: d
      label: 방문 목적을 듣고 계좌나 대출 등 해당 업무로 분류한다
    - key: e
      label: 미비한 필요 서류들을 한눈에 볼 수 있게 목록화한다
    - key: f
      label: 대체할 수 있는 서류와 발급처를 안내해 추가 방문을 방지한다
    - key: g
      label: 필수 서류가 빠졌더라도 우선 접수를 완료한 뒤 추후 반려한다
    answer:
      keys:
      - b
      - c
      - d
      - e
      - f
    on_pass: m2
- id: m2
  type: 자료·정보 누락
  title: 고객 상담 내용 요약 작성
  mission: '조선우: "하여튼 그게 안 된다니까 이상하잖아요. 뭐가 문젠지 나도 모르겠고. (두서없는 설명)"


    두서없는 호소에서 핵심(무엇이·언제부터·어떤 조건)을 질문으로 구체화해 상담카드 3줄 요약을 완성한다'
  npcs:
  - npc_kts-04_04
  guide: '제공 자료: 상담카드 양식, 경청·질문 가이드(개방형→구체화→재확인), 업무 처리 기준'
  task:
    kind: choice
    prompt: '두서없는 호소에서 핵심(무엇이·언제부터·어떤 조건)을 질문으로 구체화해 상담카드 3줄 요약을 완성한다


      아래 행동 중 문제가 있는 것 하나를 골라내세요.'
    criteria:
    - 문제 있는 행동을 정확히 찾아냈는가
    pass_score: 70
    hints:
      warning: 지레짐작으로 엉뚱한 처리 시작, '그건 안 돼요'부터 말하기
      answer_guide: ① 고객의 말을 끊지 않고 경청한다 ② 핵심 파악을 위해 구체화 질문을 3개 던진다 ③ 확인한 내용이 맞는지 고객에게 다시 확인한다 ④ 사실 관계와 요구 사항을 구분하여 기록한다 ⑤
        즉시 처리할지 담당 부서에 배정할지 판단한다
    options:
    - key: a
      label: 고객의 발언을 중간에 끊지 않고 끝까지 주의 깊게 듣는다
    - key: b
      label: 정리한 정보가 고객이 말한 사실과 일치하는지 재차 점검한다
    - key: c
      label: 사실 관계를 명확히 파악하지 않은 채 임의로 판단하여 조치한다
    - key: d
      label: 상황을 구체적으로 파악하기 위해 세 가지 핵심 질문을 던진다
    answer:
      key: c
    on_pass: m3
- id: m3
  type: 우선순위 충돌
  title: 마감 전 업무 순서 조정
  mission: '유하은: "마감 30분 전인데 대기 5팀에 전화 예약, 급한 송금 요청까지 겹쳤다. 순서 정리해서 보고해."


    마감 전 동시 수요를 시간 제약(송금 컷오프)과 요건 난이도 기준으로 배열하고 대기 안내와 함께 보고한다'
  npcs:
  - npc_kts-04_01
  guide: '제공 자료: 대기 현황(5팀 요건별), 마감 업무 목록, 송금 마감 시각 규정, 우선순위 원칙'
  task:
    kind: order
    prompt: '마감 전 동시 수요를 시간 제약(송금 컷오프)과 요건 난이도 기준으로 배열하고 대기 안내와 함께 보고한다


      아래 항목을 올바른 처리 순서대로 배열해 제출하세요.'
    criteria:
    - 업무 처리 순서를 올바르게 판단했는가
    pass_score: 70
    hints:
      warning: 접수순만 고집해 송금 컷오프 초과, 안내 없이 대기 방치
      answer_guide: ① 요청된 업무들의 소요 시간과 마감 시각을 분류한다. ② 송금 제한 시간이 임박한 업무를 최우선으로 배치한다. ③ 빠르게 처리할 수 있는 단순 업무를 그 다음에 배치한다. ④ 시간이
        오래 걸리는 상담은 예약으로 전환하도록 안내한다. ⑤ 정리한 업무 처리 순서와 그 근거를 사수(업무 지도 선배)에게 보고한다.
    options:
    - key: a
      label: 마감 시한이 급한 송금 건을 최우선 순위로 지정한다
    - key: b
      label: 소요 시간이 긴 상담 업무는 추후 예약으로 돌려 안내한다
    - key: c
      label: 처리 과정이 간단하고 빠른 업무를 다음 순서에 배치한다
    - key: d
      label: 들어온 업무들의 예상 처리 시간과 마감 시점을 파악해 나눈다
    answer:
      keys:
      - d
      - a
      - c
      - b
    on_pass: m4
- id: m4
  type: 보고·인계
  title: 상담 마감 및 예약 안내
  mission: '최지훈: "오늘 상담 건들 카드 마감하고, 재방문 예약 두 분은 준비서류 안내까지 걸어놓고 퇴근해."


    당일 상담 5건을 결과·후속조치와 연결해 마감 기록하고 재방문 2건의 준비서류 안내를 발송한다'
  npcs:
  - npc_kts-04_02
  guide: '제공 자료: 당일 상담카드 5건, 예약 시스템, 준비서류 안내문 양식, 미결 처리 기준'
  task:
    kind: write
    prompt: '당일 상담 5건을 결과·후속조치와 연결해 마감 기록하고 재방문 2건의 준비서류 안내를 발송한다


      제출 산출물: 마감된 상담카드, 예약 안내 발송 기록'
    criteria:
    - 기록-결과-후속 연결 완결
    - 안내 발송 누락 0건
    - 흔한 실수를 피했는가 (결과 미기재로 재문의 시 처음부터, 예약만 잡고 서류 안내 누락)
    pass_score: 70
    hints:
      warning: 결과 미기재로 재문의 시 처음부터, 예약만 잡고 서류 안내 누락
      answer_guide: ① 상담 카드별로 처리 결과를 기재한다 ② 미결(아직 안 끝남)된 건의 후속 담당자를 지정한다 ③ 재방문 예약 고객 2명에게 서류 안내를 발송한다 ④ 후속 조치를 위한 리마인드(다시
        알림)를 설정한다 ⑤ 사수(직속 선임)에게 마감 보고를 완료한다
    on_pass: __end__
sudden_quest:
  npc: npc_kts-04_04
  intro: 조선우가 대기 줄을 가로질러 창구 앞에 끼어들었다. "번호표? 나 5분이면 끝나는 건데 왜 기다려요! 지금 당장 처리해요, 빨리!" 뒤에 서 있던 고객들이 항의하기 시작한다.
  task:
    kind: choice
    prompt: '순서를 무시한 요구와 폭언으로 대기열이 흐트러졌다. 대기 중인 다른 고객의 순서를 지키면서
      항의 고객을 응대하고, 창구에서 감당할 범위를 넘었는지 판단한다


      아래 보기 중 지금 가장 먼저 해야 할 대응을 하나 고르세요.'
    criteria:
    - 가장 먼저 할 대응을 올바르게 판단했는가
    pass_score: 70
    hints:
      warning: 조용히 시키려 순서를 바꿔 먼저 처리, 맞대응해 언쟁, 다른 고객 대기시간을 임의로 늘림
      answer_guide: ① 침착하게 대기 순서 원칙을 안내하고 번호표 절차를 다시 설명 ② 용건과 예상 소요시간을 확인해 실제로 짧은 건이면 마감 전 배정 가능 여부를 검토 ③ 순서를 바꿔야 한다면 대기 고객에게 양해를
        구한 뒤에만 진행 ④ 폭언·업무방해가 계속되면 선임 상담원·지점장에게 인계 ⑤ 대응 기록
    options:
    - key: a
      label: 대기 순서 원칙을 안내하고 용건·소요시간을 확인한 뒤 배정을 검토한다
    - key: b
      label: 소란을 멈추려고 대기 중인 고객보다 먼저 처리해준다
    - key: c
      label: 큰 소리로 맞받아 규정을 설명하며 언쟁한다
    - key: d
      label: 다른 고객들에게 양해도 구하지 않고 대기시간을 미뤄둔다
    answer:
      key: a
    type: 오류·안전위험
