      answer_guide: ①엄폐 유지하며 '정지' 3회 명령 ②'손들어' 후 이동 정지 확인 ③문어 제시 후 답어 확인 ④답어 불일치·불응 시 현 위치 고수하며 상황실에 무전보고(위치·인원·행동)
