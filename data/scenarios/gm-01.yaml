job: gm-01
slug: gm-01
title: 구매·자재 관리 — 신입의 하루
module: 돌발상황 대처형
initial_state:
  trust: 50
  schedule_stability: 70
  requirement_clarity: 20
steps:
- id: m1
  type: 정상업무
  title: 정상업무
  mission: '김민준: "김 신입 씨, 오늘 오후에 입고될 포장박스 발주 건 말입니다. 입고 전 준비사항들을 철저히 확인하고 준비해 주세요. 특히 안전 수칙과 전산 등록 절차를
    누락하면 안 됩니다."


    오후 입고 예정인 포장박스 자재 수령을 위해 안전 규정을 준수하고 필요한 행정 절차 및 공간을 사전 준비하는 단계입니다. (안전모 미착용 등 현장 안전 수칙 위반 금지)'
  npcs:
  - npc_gm-01_01
  guide: 오늘 자 입고 예정 리스트, 자재 창고 배치도, 안전 관리 수칙 매뉴얼
  task:
    kind: checklist
    prompt: '오후 입고 예정인 포장박스 자재 수령을 위해 안전 규정을 준수하고 필요한 행정 절차 및 공간을 사전 준비하는 단계입니다. (안전모 미착용 등 현장 안전 수칙 위반
      금지)


      필요한 행동을 모두 선택하세요.'
    criteria:
    - 입고 전 서류 검토, 부서 협업, 현장 안전 수칙을 모두 충족하는 행동 4개를 올바르게 선택했는가?
    pass_score: 70
    hints:
      warning: 업무 편의를 위해 소방시설을 막거나 무면허 지게차 운전을 하는 행위는 심각한 안전 규정 위반입니다.
      answer_guide: 입고 전에는 ① 서류 대조, ② 창고 부서 협조, ③ 안전 장구류 준비, ④ 품질 성적서 확인이 필수적입니다. 소방시설 차단이나 무면허 장비 조작은
        절대 금지됩니다.
    options:
    - key: a
      label: 발주서(P/O)와 협력사 송장(Invoice)의 수량 및 규격 일치 여부를 사전 대조한다.
    - key: b
      label: 창고 담당자에게 입고 예정 시간과 적재 위치를 공유하여 하역 공간을 확보해 둔다.
    - key: c
      label: 입고 검수 시 착용할 안전모, 안전화 등 필수 보호구를 미리 준비한다.
    - key: d
      label: 입고 예정인 포장재의 수입검사 성적서(COA)가 사전 제출되었는지 확인한다.
    - key: e
      label: 창고 공간이 부족해 보이니 일단 소방시설(소화전) 앞 통로에 적재 구역을 임시 지정해 둔다.
    - key: f
      label: 빠른 처리를 위해 지게차 면허가 없는 상태에서 직접 지게차를 운전하여 대기시킨다.
    answer:
      keys:
      - a
      - b
      - c
      - d
    on_pass: m2
- id: m2
  type: 자료·정보 누락
  title: 자료·정보 누락
  mission: '박창민: "김 신입 씨! 지금 대성패키징에서 트럭이 들어왔는데, 송장 수량이랑 실제 하역된 수량이 안 맞아요. 게다가 박스 모퉁이가 젖어서 찌그러진 것들이 꽤 보이는데
    이거 어떡합니까?"


    입고 현장에서 발생한 수량 불일치 및 외관 품질 불량(수침 손상)을 감지하고, 규정에 어긋나는 잘못된 조치를 찾아내는 단계입니다. (불량 자재를 정상 자재와 혼용 보관 금지)'
  npcs:
  - npc_gm-01_02
  guide: 입고 검수 보고서 양식, 불량 유형별 조치 매뉴얼
  task:
    kind: choice
    prompt: '입고 현장에서 발생한 수량 불일치 및 외관 품질 불량(수침 손상)을 감지하고, 규정에 어긋나는 잘못된 조치를 찾아내는 단계입니다. (불량 자재를 정상 자재와 혼용
      보관 금지)


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 불량 자재를 묵인하고 정상 입고 처리하려는 오답(규정 위반)을 정확히 식별해냈는가?
    pass_score: 70
    hints:
      warning: 불량 자재를 정상 자재로 전산 처리하면 추후 생산 과정에서 불량이 발생하고 재고 불일치의 원인이 됩니다.
      answer_guide: 물류 현장에서 불량이 발견되었을 때 '일단 정상 입고 후 사후 처리'하는 행동은 불량 혼입을 유발하는 잘못된 행동(정답)입니다. 사진 채증, 격리
        식별, 실수량 전산 등록이 올바른 대응입니다.
    options:
    - key: a
      label: 납기 일정이 급하니 젖은 박스들도 일단 정상 입고 처리하고 나중에 협력사에 정산 요청을 한다.
    - key: b
      label: 손상된 박스의 수량과 상태를 사진으로 촬영하여 증빙을 확보한다.
    - key: c
      label: 정상 제품과 불량 제품을 즉시 격리하고, 불량품에는 '입고 보류' 식별표를 부착한다.
    - key: d
      label: 실제 입고된 합격 수량만큼만 전산에 부분 입고 등록을 진행한다.
    answer:
      key: a
    on_pass: m3
- id: m3
  type: 우선순위 충돌
  title: 우선순위 충돌
  mission: '김민준: "김 신입 씨, 대성패키징 불량 건 보고 받았습니다. 당장 다음 주 월요일 생산라인에 투입되어야 하는 자재인데 큰일이군요. 지금 우리가 취할 수 있는 조치
    중 가장 먼저 해야 할 일이 무엇인지 판단해서 보고하세요."


    생산 차질을 방지하기 위해 자재 납기 불량 상황에서 가장 우선순위가 높고 적절한 대응책을 판단하는 단계입니다. (독단적인 납기 연장 합의 금지)'
  npcs:
  - npc_gm-01_01
  guide: 생산 계획 일정표, 대체 협력사 리스트, 계약서상 지체상금 조항
  task:
    kind: choice
    prompt: '생산 차질을 방지하기 위해 자재 납기 불량 상황에서 가장 우선순위가 높고 적절한 대응책을 판단하는 단계입니다. (독단적인 납기 연장 합의 금지)


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 생산 라인 가동 중단을 막기 위한 긴급 납기 조율 및 내부 부서 소통을 최우선으로 선택했는가?
    pass_score: 70
    hints:
      warning: 생산 일정 변경은 구매팀 독단으로 결정할 수 없으며, 거래처 변경이나 법적 대응은 사후적인 조치입니다.
      answer_guide: 가장 적절한 대응은 협력사의 긴급 납품 일정을 확보하는 동시에 생산관리팀과 소통하여 생산 차질을 최소화하는 것입니다.
    options:
    - key: a
      label: 대성패키징에 즉시 연락하여 불량 수량만큼 긴급 재작업 및 대차 발송 일정을 확약받고, 동시에 생산관리팀에 생산 일정 조정 가능 여부를 문의한다.
    - key: b
      label: 대성패키징과의 거래를 즉시 중단하고 신규 업체 발굴을 위한 시장 조사를 시작한다.
    - key: c
      label: 팀장님께 보고 없이 독단적으로 다음 주 생산 일정을 한 주 뒤로 미루겠다고 생산라인에 통보한다.
    - key: d
      label: 계약서에 의거하여 대성패키징에 지체상금 독촉장부터 공식 발송하고 답변을 기다린다.
    answer:
      key: a
    on_pass: m4
- id: m4
  type: 보고·인계
  title: 보고·인계
  mission: '김민준: "이번 대성패키징 입고 불량 건에 대해 경위와 후속 조치 계획을 정리해서 정식 보고서로 제출해 주세요. 임원 보고용이니 명확하게 작성해야 합니다."


    발생한 구매 자재 이슈의 원인, 현황, 대책을 포함한 공식 ''입고 불량 및 납기 대책 보고서''를 작성하는 단계입니다. (추측성 원인 분석 배제)'
  npcs:
  - npc_gm-01_01
  guide: null
  task:
    kind: write
    prompt: '발생한 구매 자재 이슈의 원인, 현황, 대책을 포함한 공식 ''입고 불량 및 납기 대책 보고서''를 작성하는 단계입니다. (추측성 원인 분석 배제)


      제출 산출물: 입고 불량 및 납기 대책 보고서 (HWP 또는 PDF)'
    criteria:
    - 발생 개요(일시, 업체명, 품목, 발주량 대비 불량 수량)가 정량적으로 작성되었는가?
    - 불량의 직접적인 원인(운송 중 우천으로 인한 수침)과 현장 격리 조치 현황이 명시되었는가?
    - 협력사의 긴급 대차 납품 예정일과 생산라인 영향도 분석 결과가 포함되었는가?
    - 재발 방지를 위한 협력사 포장 방식 개선 및 검수 강화 대책이 수립되었는가?
    pass_score: 70
    hints:
      warning: 객관적 사실에 기반하지 않고 '협력사의 부주의로 추정됨'과 같은 모호한 표현을 사용하면 보고서의 신뢰성이 떨어집니다.
      answer_guide: 보고서에는 [1. 발생 현황] -> [2. 원인 분석 및 긴급 조치] -> [3. 생산 영향 및 대책] -> [4. 재발 방지책]의 구조로 수치화된
        데이터를 제시해야 합니다.
    on_pass: __end__
sudden_quest:
  npc: npc_gm-01_03
  intro: 사무실 전화가 울립니다. 대성패키징의 최두식 부장입니다. 수화기 너머로 다급한 목소리가 들려옵니다.
  task:
    kind: choice
    prompt: '협력사의 2차 납기 지연 돌발 상황에서 생산 라인 셧다운을 막기 위해 구매 담당자로서 취해야 할 가장 신속하고 올바른 초기 대응을 선택하는 단계입니다. (독단적
      약속 금지)


      가장 먼저 할 대응을 하나 고르세요.'
    criteria:
    - 생산 라인 가동 여부에 미치는 실질적 영향을 파악하기 위해 생산 부서와 즉각 소통했는가?
    pass_score: 70
    hints:
      warning: 협력사의 사정을 봐주기 위해 독단적으로 납기를 유예해 주었다가 생산 라인이 멈추면 회사에 막대한 손실을 입히게 됩니다.
      answer_guide: 돌발 납기 지연이 발생했을 때 가장 먼저 할 일은 '실제 생산 라인에 미치는 타격 시간'을 파악하는 것입니다. 생산 부서와 소통하여 오후 2시 입고가
        허용 범위 내인지 확인한 후 팀장에게 대안과 함께 보고해야 합니다.
    options:
    - key: a
      label: 즉시 생산관리팀의 자재 담당자에게 연락하여 내일 오전 생산 라인에 해당 박스가 투입되는 정확한 시각을 재확인하고, 오후 2시 입고 시 라인이 멈추는지 긴급 체크한다.
    - key: b
      label: 최 부장의 사정이 안타까우니 팀장님께 보고하지 않고 내일 오후 2시까지 오라고 독단적으로 승인해 준다.
    - key: c
      label: 납기 약속을 어겼으므로 계약 파기 사유에 해당한다고 최 부장에게 화를 내며 전화를 끊는다.
    - key: d
      label: 일단 알겠다고 한 뒤, 내일 오후 2시에 물건이 들어오는지 아무 조치 없이 기다려 본다.
    answer:
      key: a
    type: 오류·안전위험
