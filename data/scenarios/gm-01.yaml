job: gm-01
slug: gm-01
title: 구매·자재 관리 — 신입의 하루
module: 돌발상황 대처형
initial_state:
  trust: 50
  schedule_stability: 70
  requirement_clarity: 20
steps:
- id: m1
  type: 정상업무
  title: 포장박스 입고 사전 준비
  mission: '김민준: "김 신입 씨, 오늘 오후에 입고될 포장박스 발주 건 말입니다. 입고 전 준비사항들을 철저히 확인하고 준비해 주세요. 특히 안전 수칙과 전산 등록 절차를 누락하면 안 됩니다."


    오후 입고 예정인 포장박스 자재 수령을 위해 안전 규정을 준수하고 필요한 행정 절차 및 공간을 사전 준비하는 단계입니다. (안전모 미착용 등 현장 안전 수칙 위반 금지)'
  npcs:
  - npc_gm-01_01
  guide: 오늘 자 입고 예정 리스트, 자재 창고 배치도, 안전 관리 수칙 매뉴얼
  task:
    kind: checklist
    prompt: '오후 입고 예정인 포장박스 자재 수령을 위해 안전 규정을 준수하고 필요한 행정 절차 및 공간을 사전 준비하는 단계입니다. (안전모 미착용 등 현장 안전 수칙 위반 금지)


      필요한 행동을 모두 선택하세요.'
    criteria:
    - 입고 전 서류 검토, 부서 협업, 현장 안전 수칙을 모두 충족하는 행동 4개를 올바르게 선택했는가?
    pass_score: 70
    hints:
      warning: 업무 편의를 위해 소방시설을 막거나 무면허 지게차 운전을 하는 행위는 심각한 안전 규정 위반입니다.
      answer_guide: ① 발주서(물건 주문서)와 송장(배송 확인 문서) 등의 서류를 대조하여 확인한다. ② 창고 담당 부서와 협조하여 하역(짐을 싣고 내림) 공간을 확보한다. ③ 입고 검수(물건 상태 확인)에
        필요한 안전 장구류를 사전에 준비한다. ④ 입고 예정 자재의 품질 성적서(품질 검사 결과서)를 미리 확인한다. ⑤ 소방시설을 가로막거나 무면허로 장비를 조작하지 않는다.
    options:
    - key: a
      label: 구매 주문서와 납품서의 수량 및 규격이 일치하는지 미리 대조한다.
    - key: b
      label: 물류창고 담당자에게 도착 시간과 적재 구역을 공유하고 하역 공간을 마련한다.
    - key: c
      label: 현장 검수 시 착용해야 하는 안전모와 안전화 등 개인 보호구를 미리 챙겨 둔다.
    - key: d
      label: 반입될 포장재의 수입검사 성적서(COA)가 사전에 접수되었는지 점검한다.
    - key: e
      label: 적재 공간이 부족하므로 소화전 앞 통로를 임시 적재 구역으로 지정한다.
    - key: f
      label: 신속한 하역을 위해 지게차 면허가 없더라도 직접 장비를 운전하여 대기시킨다.
    answer:
      keys:
      - a
      - b
      - c
      - d
    on_pass: m2
- id: m2
  type: 자료·정보 누락
  title: 입고(물건이 들어옴) 자재 불량 대응
  mission: '박창민: "김 신입 씨! 지금 대성패키징에서 트럭이 들어왔는데, 송장 수량이랑 실제 하역된 수량이 안 맞아요. 게다가 박스 모퉁이가 젖어서 찌그러진 것들이 꽤 보이는데 이거 어떡합니까?"


    입고 현장에서 발생한 수량 불일치 및 외관 품질 불량(수침 손상)을 감지하고, 규정에 어긋나는 잘못된 조치를 찾아내는 단계입니다. (불량 자재를 정상 자재와 혼용 보관 금지)'
  npcs:
  - npc_gm-01_02
  guide: 입고 검수 보고서 양식, 불량 유형별 조치 매뉴얼
  task:
    kind: choice
    prompt: '입고 현장에서 발생한 수량 불일치 및 외관 품질 불량(수침 손상)을 감지하고, 규정에 어긋나는 잘못된 조치를 찾아내는 단계입니다. (불량 자재를 정상 자재와 혼용 보관 금지)


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 불량 자재를 묵인하고 정상 입고 처리하려는 오답(규정 위반)을 정확히 식별해냈는가?
    pass_score: 70
    hints:
      warning: 불량 자재를 정상 자재로 전산 처리하면 추후 생산 과정에서 불량이 발생하고 재고 불일치의 원인이 됩니다.
      answer_guide: ① 입고(물건이 들어옴) 현장에서 자재의 수량 불일치와 외관 손상을 확인한다. ② 손상된 박스의 사진을 촬영하여 증빙 자료를 확보한다. ③ 정상 제품과 불량 제품을 즉시 격리하고 식별표(구분용
        꼬리표)를 부착한다. ④ 실제 합격한 수량만 전산 시스템에 등록한다.
    options:
    - key: a
      label: 일정이 촉박하므로 손상된 박스도 먼저 전산에 정상 등록한 뒤 추후 협력사와 정산 절차를 밟는다.
    - key: b
      label: 문제가 발생한 박스의 상태와 수량이 잘 보이도록 현장 사진을 찍어 증거를 남긴다.
    - key: c
      label: 양품과 불량품이 섞이지 않게 바로 분류하고 불량품에 보류 표식을 붙여 구분한다.
    - key: d
      label: 문제가 없는 정상 수량만 확인하여 시스템에 부분적으로 입고 처리를 완료한다.
    answer:
      key: a
    on_pass: m3
- id: m3
  type: 우선순위 충돌
  title: 불량 자재 긴급 대응책 수립
  mission: '김민준: "김 신입 씨, 대성패키징 불량 건 보고 받았습니다. 당장 다음 주 월요일 생산라인에 투입되어야 하는 자재인데 큰일이군요. 지금 우리가 취할 수 있는 조치 중 가장 먼저 해야 할 일이 무엇인지
    판단해서 보고하세요."


    생산 차질을 방지하기 위해 자재 납기 불량 상황에서 가장 우선순위가 높고 적절한 대응책을 판단하는 단계입니다. (독단적인 납기 연장 합의 금지)'
  npcs:
  - npc_gm-01_01
  guide: 생산 계획 일정표, 대체 협력사 리스트, 계약서상 지체상금 조항
  task:
    kind: choice
    prompt: '생산 차질을 방지하기 위해 자재 납기 불량 상황에서 가장 우선순위가 높고 적절한 대응책을 판단하는 단계입니다. (독단적인 납기 연장 합의 금지)


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 생산 라인 가동 중단을 막기 위한 긴급 납기 조율 및 내부 부서 소통을 최우선으로 선택했는가?
    pass_score: 70
    hints:
      warning: 생산 일정 변경은 구매팀 독단으로 결정할 수 없으며, 거래처 변경이나 법적 대응은 사후적인 조치입니다.
      answer_guide: ① 협력사의 긴급 납품 일정을 확보하고 생산관리팀(일정 조율 부서)과 소통하여 생산 차질을 최소화한다.
    options:
    - key: a
      label: 협력사로부터 긴급 재생산 및 배송 일정을 약속받고, 생산관리부서와 일정 조정을 협의한다.
    - key: b
      label: 기존 협력업체와의 계약을 즉시 해지하고 대체 납품이 가능한 신규 업체를 찾아본다.
    - key: c
      label: 보고 없이 다음 주 생산 일정을 임의로 미룬 뒤 해당 내용을 생산 현장에 통보한다.
    - key: d
      label: 계약서에 의거해 지체상금 청구서부터 발송하고 협력사의 공식 답변이 올 때까지 기다린다.
    answer:
      key: a
    on_pass: m4
- id: m4
  type: 보고·인계
  title: 입고 불량 대책 보고
  mission: '김민준: "이번 대성패키징 입고 불량 건에 대해 경위와 후속 조치 계획을 정리해서 정식 보고서로 제출해 주세요. 임원 보고용이니 명확하게 작성해야 합니다."


    발생한 구매 자재 이슈의 원인, 현황, 대책을 포함한 공식 ''입고 불량 및 납기 대책 보고서''를 작성하는 단계입니다. (추측성 원인 분석 배제)'
  npcs:
  - npc_gm-01_01
  guide: null
  task:
    kind: write
    prompt: '발생한 구매 자재 이슈의 원인, 현황, 대책을 포함한 공식 ''입고 불량 및 납기 대책 보고서''를 작성하는 단계입니다. (추측성 원인 분석 배제)


      제출 산출물: 입고 불량 및 납기 대책 보고서 (HWP 또는 PDF)'
    criteria:
    - 발생 개요(일시, 업체명, 품목, 발주량 대비 불량 수량)가 정량적으로 작성되었는가?
    - 불량의 직접적인 원인(운송 중 우천으로 인한 수침)과 현장 격리 조치 현황이 명시되었는가?
    - 협력사의 긴급 대차 납품 예정일과 생산라인 영향도 분석 결과가 포함되었는가?
    - 재발 방지를 위한 협력사 포장 방식 개선 및 검수 강화 대책이 수립되었는가?
    pass_score: 70
    hints:
      warning: 객관적 사실에 기반하지 않고 '협력사의 부주의로 추정됨'과 같은 모호한 표현을 사용하면 보고서의 신뢰성이 떨어집니다.
      answer_guide: ① 발생 일시, 업체명, 품목, 불량 수량 등 발생 현황을 정량적으로(수치로 표현) 작성한다 ② 운송 중 수침(물에 잠김)이라는 직접적 원인과 현장 격리 조치 현황을 분석한다 ③ 긴급
        대차(대체 물품) 납품일과 생산라인 영향도를 파악하여 대책을 수립한다 ④ 포장 방식 개선 및 검수(물건 검사) 강화 등 재발 방지책을 마련하여 보고서를 완성한다
    on_pass: __end__
sudden_quest:
  npc: npc_gm-01_03
  intro: 사무실 전화가 울립니다. 대성패키징의 최두식 부장입니다. 수화기 너머로 다급한 목소리가 들려옵니다.
  task:
    kind: choice
    prompt: '협력사의 2차 납기 지연 돌발 상황에서 생산 라인 셧다운을 막기 위해 구매 담당자로서 취해야 할 가장 신속하고 올바른 초기 대응을 선택하는 단계입니다. (독단적 약속 금지)


      가장 먼저 할 대응을 하나 고르세요.'
    criteria:
    - 생산 라인 가동 여부에 미치는 실질적 영향을 파악하기 위해 생산 부서와 즉각 소통했는가?
    pass_score: 70
    hints:
      warning: 협력사의 사정을 봐주기 위해 독단적으로 납기를 유예해 주었다가 생산 라인이 멈추면 회사에 막대한 손실을 입히게 됩니다.
      answer_guide: 돌발 납기 지연이 발생했을 때 가장 먼저 할 일은 '실제 생산 라인에 미치는 타격 시간'을 파악하는 것입니다. 생산 부서와 소통하여 오후 2시 입고가 허용 범위 내인지 확인한 후 팀장에게
        대안과 함께 보고해야 합니다.
    options:
    - key: a
      label: 즉시 생산관리팀의 자재 담당자에게 연락하여 내일 오전 생산 라인에 해당 박스가 투입되는 정확한 시각을 재확인하고, 오후 2시 입고 시 라인이 멈추는지 긴급 체크한다.
    - key: b
      label: 최 부장의 사정이 안타까우니 팀장님께 보고하지 않고 내일 오후 2시까지 오라고 독단적으로 승인해 준다.
    - key: c
      label: 납기 약속을 어겼으므로 계약 파기 사유에 해당한다고 최 부장에게 화를 내며 전화를 끊는다.
    - key: d
      label: 일단 알겠다고 한 뒤, 내일 오후 2시에 물건이 들어오는지 아무 조치 없이 기다려 본다.
    answer:
      key: a
    type: 오류·안전위험
