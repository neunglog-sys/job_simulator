job: sns-01
slug: sns-01
title: 콘텐츠·SNS 운영 — 신입의 하루
module: 돌발상황 대처형
initial_state:
  trust: 50
  schedule_stability: 70
  requirement_clarity: 20
steps:
- id: m1
  type: 정상업무
  title: SNS 홍보 콘텐츠 업로드 준비
  mission: '김지수: "지수 씨, 오늘 오후 2시에 인스타그램에 업로드할 신제품 홍보 카드뉴스 세트와 본문 텍스트 준비해 주세요. 업로드 전에 가이드라인에 맞게 준비되었는지 필수 체크리스트 항목들을 순서대로 실행해
    주셔야 합니다. 임의로 순서를 바꾸거나 단계를 건너뛰시면 안 됩니다."


    SNS 콘텐츠 업로드 전 필수 준비 단계를 올바른 순서대로 수행하는 미션 (가이드라인 미확인 및 임의 업로드 금지)'
  npcs:
  - npc_sns-01_01
  guide: 신제품 카드뉴스 이미지 5장, 본문 텍스트 초안, 해시태그 가이드라인, 브랜드 톤앤매너 매뉴얼
  task:
    kind: checklist
    prompt: 'SNS 콘텐츠 업로드 전 필수 준비 단계를 올바른 순서대로 수행하는 미션 (가이드라인 미확인 및 임의 업로드 금지)


      필요한 행동을 모두 선택하세요.'
    criteria:
    - 제시된 4개의 올바른 업무 준비 행동을 논리적 순서에 맞게 모두 선택했는가?
    pass_score: 70
    hints:
      warning: 업무 편의를 위해 브랜드 가이드라인 확인이나 링크 작동 테스트를 건너뛰면 치명적인 링크 오류나 브랜드 이미지 실추로 이어집니다.
      answer_guide: ① 브랜드 톤앤매너 매뉴얼을 열어 금지 단어 및 권장 서체를 확인한다. ② 카드뉴스 이미지 5장의 순서가 기획안과 일치하는지 슬라이드 순서를 대조한다. ③ 본문 텍스트의 맞춤법 검사기를
        돌리고 필수 해시태그 누락 여부를 검수한다. ④ 이미지 내 텍스트와 본문 텍스트에 포함된 랜딩 페이지 URL 링크의 작동 여부를 테스트한다.
    options:
    - key: a
      label: '1단계: 공식 브랜드 가이드라인을 확인해 권장 폰트와 금지 표현을 점검한다.'
    - key: b
      label: '2단계: 제작된 카드뉴스 슬라이드가 기획서에 적힌 순서대로 배치되었는지 비교한다.'
    - key: c
      label: '3단계: 업로드할 글의 오탈자를 교정하고 지정된 해시태그가 모두 들어갔는지 확인한다.'
    - key: d
      label: '4단계: 본문과 이미지에 삽입된 웹사이트 연결 링크가 정상적으로 접속되는지 확인한다.'
    - key: e
      label: 절차를 건너뛰고 포토샵 원본 파일의 레이어 구성부터 상세히 뜯어본다.
    - key: f
      label: 빠른 업로드를 위해 텍스트 검수 과정을 건너뛰고 곧바로 결재를 올린다.
    answer:
      keys:
      - a
      - b
      - c
      - d
    on_pass: m2
- id: m2
  type: 자료·정보 누락
  title: 신제품 카드뉴스 시안 검수
  mission: '이지원: "지수 씨, 요청하신 신제품 카드뉴스 디자인 시안 다 나왔어요! 제가 지금 다른 급한 건이 있어서 검수용 파일만 먼저 전달해 드려요. 텍스트 오타나 이미지 레이아웃에 문제 없는지 확인해 주시고
    피드백 주세요!"


    디자이너가 제작한 카드뉴스 시안에서 브랜드 가이드라인 위반 및 치명적인 누락/오류 사항을 찾아내는 미션 (피드백 없이 방치하거나 무조건 수용 금지)'
  npcs:
  - npc_sns-01_02
  guide: 디자이너가 전달한 카드뉴스 이미지 파일 5장, 원본 기획안 텍스트 문서
  task:
    kind: choice
    prompt: '디자이너가 제작한 카드뉴스 시안에서 브랜드 가이드라인 위반 및 치명적인 누락/오류 사항을 찾아내는 미션 (피드백 없이 방치하거나 무조건 수용 금지)


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 디자이너의 시안에서 브랜드 신뢰도에 치명적인 가이드라인 위반 사항(타사 로고 노출 묵인)을 올바르게 골라내었는가?
    pass_score: 70
    hints:
      warning: 디자이너의 작업물이라는 이유로 검수를 소홀히 하거나, 저작권 및 브랜드 가이드라인에 위배되는 타사 로고 노출을 묵인하면 법적 문제가 발생할 수 있습니다.
      answer_guide: ① 전달받은 카드뉴스 시안의 오탈자와 레이아웃을 점검한다. ② 브랜드 가이드라인 위반 및 치명적인 정보 누락 여부를 검수한다. ③ 발견한 오류 사항을 정리하여 디자이너에게 피드백을 전달한다.
    options:
    - key: a
      label: 3페이지에 타사 로고가 노출된 것을 발견했으나, 전체적인 조화를 위해 수정 요청 없이 그대로 승인한다.
    - key: b
      label: 1페이지 메인 타이틀에 발생한 오타를 확인하고, 수정이 필요한 위치에 표시하여 전달한다.
    - key: c
      label: 5페이지 유의사항의 폰트 크기가 브랜드 가이드라인 기준보다 작게 설정된 것을 확인하고 수정을 요청한다.
    - key: d
      label: 카드뉴스 이미지 규격이 인스타그램 권장 사이즈인 1:1 비율에 부합하는지 픽셀 크기를 검증한다.
    answer:
      key: a
    on_pass: m3
- id: m3
  type: 우선순위 충돌
  title: SNS 채널 긴급 이슈 대응
  mission: '김지수: "지수 씨, 지금 인스타그램 채널에 세 가지 이슈가 동시에 터졌어요. 어떤 것부터 먼저 처리해야 할지 우선순위를 판단해서 보고해 주세요. 채널의 신뢰도와 직결된 긴급한 이슈부터 해결해야 합니다."


    동시다발적으로 발생한 SNS 채널 이슈들의 긴급도와 중요도를 판단하여 가장 먼저 처리할 업무를 결정하는 미션 (사소한 이슈에 매몰되어 긴급 장애 방치 금지)'
  npcs:
  - npc_sns-01_01
  guide: '이슈 목록: A. 공식 홈페이지 랜딩 링크 클릭 시 404 에러 발생, B. 지난주 이벤트 당첨자의 단순 경품 배송 문의 DM, C. 신규 게시물에 달린 광고성 스팸 댓글 3개'
  task:
    kind: choice
    prompt: '동시다발적으로 발생한 SNS 채널 이슈들의 긴급도와 중요도를 판단하여 가장 먼저 처리할 업무를 결정하는 미션 (사소한 이슈에 매몰되어 긴급 장애 방치 금지)


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 매출 및 브랜드 신뢰도에 직접적인 타격을 주는 시스템 오류(링크 깨짐)를 최우선 순위로 판단하였는가?
    pass_score: 70
    hints:
      warning: 단순 스팸 삭제나 일반 문의 응대에 시간을 허비하다가, 구매 전환과 직결되는 랜딩 페이지 오류를 방치하면 마케팅 예산 낭비와 심각한 고객 이탈이 발생합니다.
      answer_guide: ① 공식 홈페이지 랜딩 링크의 404 에러를 즉시 확인하고, 사수에게 보고한 뒤 임시 랜딩 페이지로 대체한다.
    options:
    - key: a
      label: 홈페이지 접속 링크의 404 오류를 즉시 점검한 뒤, 담당자에게 보고하고 임시 연결 페이지로 전환한다.
    - key: b
      label: 새 글에 등록된 광고성 스팸 댓글 몇 개를 삭제하는 단순 정화 작업을 가장 먼저 처리한다.
    - key: c
      label: 이벤트 경품 배송 일정을 묻는 고객의 단순 문의 메시지에 정성스러운 답변을 쓰느라 한 시간을 보낸다.
    - key: d
      label: 발생한 문제들을 혼자 힘으로 해결하려 애쓰다 조치 타이밍을 놓치고 두 시간 동안 지켜보기만 한다.
    answer:
      key: a
    on_pass: m4
- id: m4
  type: 보고·인계
  title: SNS 운영 및 이슈 대응 보고
  mission: '김지수: "오늘 발생한 인스타그램 업로드 결과와 유입 링크 오류 조치 사항에 대해 일일 업무 보고서를 작성해서 메일로 제출해 주세요. 보고서에는 정량적인 수치와 조치 결과가 명확히 드러나야 합니다."


    일일 SNS 운영 현황 및 이슈 대응 결과를 명확한 산출물 형태로 작성하여 보고하는 미션 (주관적 감정 서술 및 수치 누락 금지)'
  npcs:
  - npc_sns-01_01
  guide: null
  task:
    kind: write
    prompt: '일일 SNS 운영 현황 및 이슈 대응 결과를 명확한 산출물 형태로 작성하여 보고하는 미션 (주관적 감정 서술 및 수치 누락 금지)


      제출 산출물: 일일 SNS 운영 및 이슈 대응 보고서 (PDF/Word 형식)'
    criteria:
    - 오늘 업로드된 신제품 카드뉴스 게시물의 URL과 업로드 완료 시각이 명시되어 있는가?
    - 랜딩 링크 404 오류 발생 시각, 인지 시각, 조치 완료 시각 및 대체된 임시 링크가 정확히 기록되었는가?
    - 오류 발생 기간 동안의 예상 유입 손실 수치 또는 클릭 수 데이터가 포함되어 있는가?
    - 향후 재발 방지를 위한 검수 가이드라인 보완 계획이 1문장 이상 포함되어 있는가?
    pass_score: 70
    hints:
      warning: '''오늘 링크 오류가 있었으나 잘 해결했습니다''와 같은 추상적이고 감정적인 서술은 보고서로서 가치가 없으며, 정확한 타임라인과 수치 데이터가 포함되어야 합니다.'
      answer_guide: ① 신제품 카드뉴스 게시물의 업로드 완료 시각과 URL을 기록한다. ② 링크 오류 발생, 인지, 조치 완료 시각과 대체 임시 링크를 작성한다. ③ 오류 기간 동안의 예상 유입 손실 수치
        또는 클릭 수 데이터를 포함한다. ④ 향후 재발 방지를 위한 검수 가이드라인 보완 계획을 작성한다.
    on_pass: __end__
sudden_quest:
  npc: npc_sns-01_03
  intro: 오후 4시, 공식 인스타그램 다이렉트 메시지(DM)로 한 고객의 격양된 메시지가 도착합니다. 알림창에 빨간 불이 들어옵니다.
  task:
    kind: choice
    prompt: '이벤트 경품 배송 누락으로 분노한 고객의 DM 문의에 대해 브랜드 가이드라인을 준수하며 가장 신속하고 안전하게 초기 대응하는 미션 (독단적인 경품 즉시 발송 및 감정적 맞대응 금지)


      가장 먼저 할 대응을 하나 고르세요.'
    criteria:
    - 사실관계(당첨자 명단 및 발송 여부)를 먼저 파악하고, 사수 보고를 거쳐 브랜드 톤앤매너에 맞는 공식 답변을 구상하였는가?
    pass_score: 70
    hints:
      warning: 고객의 압박에 당황하여 사수 보고 없이 임의로 경품을 중복 발송하거나, 감정적으로 맞대응할 경우 브랜드 이미지에 심각한 타격을 입히고 2차 컴플레인을 유발합니다.
      answer_guide: 가장 먼저 할 올바른 대응은 '당첨자 명단 및 발송 시스템 로그를 즉시 확인하여 고객의 아이디 누락 여부와 발송 상태를 파악한 뒤, 사수에게 보고하고 승인된 사과 메시지 템플릿에 맞춰
        발송 예정 시간을 안내한다'입니다. 사실 확인과 사내 보고가 선행되어야 합니다.
    options:
    - key: a
      label: 당첨자 명단 및 발송 시스템 로그를 즉시 확인하여 고객의 아이디 누락 여부와 발송 상태를 파악한 뒤, 사수에게 보고하고 승인된 사과 메시지 템플릿에 맞춰 발송 예정 시간을 안내한다.
    - key: b
      label: 고객이 화를 내고 있으므로 사수 보고 없이 개인 소장하고 있던 예비용 기프티콘 일련번호를 DM으로 즉시 전송하여 상황을 무마한다.
    - key: c
      label: 우리 브랜드는 절대 차별하지 않는다고 감정적으로 반박하며, 커뮤니티에 올리겠다는 협박에 대해 법적 대응을 하겠다는 경고 메시지를 보낸다.
    - key: d
      label: 당첨자 취합은 디자이너의 업무이므로 디자이너에게 DM을 캡처해 보내고 알아서 고객에게 직접 연락하라고 떠넘긴다.
    answer:
      key: a
    type: 오류·안전위험
