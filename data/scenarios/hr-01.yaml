job: hr-01
slug: hr-01
title: 인사·채용 운영 — 신입의 하루
module: 돌발상황 대처형
initial_state:
  trust: 50
  schedule_stability: 70
  requirement_clarity: 20
steps:
- id: m1
  type: 정상업무
  title: 정상업무
  mission: '김지아: "민우 씨, 오늘 오후에 진행될 ''개발본부 경력직 기술 면접'' 준비를 시작해 주세요. 면접실 세팅부터 면접관 안내, 지원자 응대까지 매뉴얼대로 빈틈없이
    준비해야 합니다. 특히 개인정보가 포함된 이력서 관리에 유의하세요."


    면접 시작 전 필요한 준비 사항을 빠짐없이 수행하되, 보안 규정을 위반하는 행동을 배제하고 올바른 행동 4가지를 선택 및 순서대로 배치해야 합니다.'
  npcs:
  - npc_hr-01_01
  guide: 오후 기술 면접 대상자 명단, 면접관 명단, 면접실 예약 현황표, 인사팀 채용운영 보안 가이드라인
  task:
    kind: checklist
    prompt: '면접 시작 전 필요한 준비 사항을 빠짐없이 수행하되, 보안 규정을 위반하는 행동을 배제하고 올바른 행동 4가지를 선택 및 순서대로 배치해야 합니다.


      필요한 행동을 모두 선택하세요.'
    criteria:
    - 개인정보 보호 가이드라인을 준수하면서 면접 환경 및 면접관 리마인드를 선제적으로 완료했는가?
    pass_score: 70
    hints:
      warning: 편의를 위해 지원자의 개인정보가 담긴 서류를 암호화 없이 공용 메신저나 오픈된 공간에 공유하는 것은 심각한 보안 규정 위반입니다.
      answer_guide: 올바른 준비 순서는 ① 면접실 환경 및 기자재 점검 -> ② 면접실 내 평가표 및 이력서 비치 -> ③ 지원자 대기실 및 동선 세팅 -> ④ 면접관
        대상 일정 리마인드 메신저 발송입니다. 보안 규정을 위반하는 메신저 파일 업로드와 공정성을 해치는 면접 족보 공유는 금지 행동입니다.
    options:
    - key: a
      label: 면접 시작 1시간 전 예약된 면접실의 환기 상태와 기자재(노트북, 빔프로젝터) 작동 여부를 점검한다.
    - key: b
      label: 면접관용 채용 평가표와 지원자 이력서를 출력하여 면접실 내 면접관 자리에 미리 비치해 둔다.
    - key: c
      label: 지원자 대기실을 세팅하고, 안내 표지판을 부착하여 지원자가 길을 헤매지 않도록 동선을 확보한다.
    - key: d
      label: 면접관들에게 면접 시작 30분 전 알림 메신저를 발송하여 일정과 면접실 위치를 리마인드한다.
    - key: e
      label: 면접관들의 편의를 위해 지원자의 상세 이력서와 포트폴리오 파일을 보안 설정 없이 팀 공용 메신저 단톡방에 업로드한다.
    - key: f
      label: 대기 중인 지원자가 긴장을 풀 수 있도록 면접관들의 성향과 이전 면접 질문 기출 리스트를 미리 구두로 알려준다.
    answer:
      keys:
      - a
      - b
      - c
      - d
    on_pass: m2
- id: m2
  type: 자료·정보 누락
  title: 자료·정보 누락
  mission: '박민수: "민우 씨, 아까 보내주신 개발팀 채용 요청서 양식이요. 제가 일정이 너무 바빠서 대충 적어서 보냈는데, 그냥 이대로 공고 올려주시면 안 될까요? 필수
    자격요건이나 우대사항은 대기업 채용공고 대충 긁어서 넣었어요."


    현업 부서에서 제출한 채용 요청서의 누락 및 오류 사항을 점검하고, 규정에 어긋나거나 법적 문제가 발생할 수 있는 잘못된 행동(오류) 딱 1가지를 찾아내야 합니다.'
  npcs:
  - npc_hr-01_02
  guide: 개발팀 제출 채용 요청서 양식, 채용절차법 준수 가이드라인, 사내 채용 공고 표준 템플릿
  task:
    kind: choice
    prompt: '현업 부서에서 제출한 채용 요청서의 누락 및 오류 사항을 점검하고, 규정에 어긋나거나 법적 문제가 발생할 수 있는 잘못된 행동(오류) 딱 1가지를 찾아내야 합니다.


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 채용절차법상 법적 문제가 될 수 있는 차별적 요소를 정확히 식별하고 반려할 수 있는가?
    pass_score: 70
    hints:
      warning: 성별, 연령, 출신 지역 등 채용절차법상 금지된 차별적 요소를 공고에 포함하는 것은 과태료 처분 및 기업 이미지 실추로 이어집니다.
      answer_guide: 정답은 첫 번째 옵션입니다. '남성 우대'나 '연령 제한'과 같은 문구는 채용절차법 위반이므로 반드시 발견 즉시 반려하고 수정해야 합니다. 나머지
        옵션들은 채용 운영 보조로서 수행해야 하는 정상적이고 올바른 점검 행동입니다.
    options:
    - key: a
      label: 채용 요청서 내 '우대사항' 항목에 '남성 우대', '연령 30세 이하' 등 차별적 요소가 포함되어 있음에도 이를 수정하지 않고 그대로 공고를 승인 요청한다.
    - key: b
      label: 필수 자격요건 중 기술 스택이 구체적으로 명시되어 있는지 확인하고 모호한 표현에 대해 현업 담당자에게 수정을 요청한다.
    - key: c
      label: 채용 요청서상에 기재된 영입 인원수와 예산 승인 여부가 인사팀 내부 TO 현황과 일치하는지 대조 확인한다.
    - key: d
      label: 직무 기술서(JD)의 포지션 설명이 구직자 관점에서 이해하기 쉽도록 표준 템플릿 양식에 맞춰 문맥을 윤문한다.
    answer:
      key: a
    on_pass: m3
- id: m3
  type: 우선순위 충돌
  title: 우선순위 충돌
  mission: '김지아: "민우 씨, 지금 업무가 몰려서 많이 바쁘죠? 하지만 채용 운영은 우선순위를 잘못 판단하면 우수 인재를 놓치거나 면접 노쇼(No-Show)가 발생할 수
    있어요. 현재 쌓여있는 태스크들의 우선순위를 판단해서 가장 먼저 처리해야 할 일을 결정해 주세요."


    동시다발적으로 발생한 채용 운영 태스크 중 업무의 시급성과 중요도를 고려하여 가장 먼저 처리해야 할 대응 1가지를 선택해야 합니다.'
  npcs:
  - npc_hr-01_01
  guide: 금일 채용 운영 태스크 리스트 (면접 불참 통보, 채용 공고 오탈자 수정, 합격자 증빙 서류 검토, 내일 면접 대상자 안내 메일 발송)
  task:
    kind: choice
    prompt: '동시다발적으로 발생한 채용 운영 태스크 중 업무의 시급성과 중요도를 고려하여 가장 먼저 처리해야 할 대응 1가지를 선택해야 합니다.


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 당장 오늘 진행될 채용 전형의 파행을 막기 위한 긴급 일정을 최우선으로 판단하고 처리하는가?
    pass_score: 70
    hints:
      warning: 당일 면접 일정 변동은 면접관(임원 및 현업)의 일정 조율과 지원자 경험에 직격타를 주므로 초 단위로 신속하게 대응해야 합니다.
      answer_guide: 정답은 첫 번째 옵션입니다. 당일 면접 대상자의 급작스러운 일정 변경 요청은 면접관들의 일정 조정 및 대안 마련이 즉시 필요하므로 가장 시급하고 중요한
        업무입니다. 나머지 업무들은 기한에 여유가 있거나 중요도가 상대적으로 낮습니다.
    options:
    - key: a
      label: 오늘 오후 면접 예정이었던 핵심 지원자가 갑작스러운 독감으로 일정 변경을 요청한 건에 대해 현업 면접관들과 즉시 일정을 재조율하고 지원자에게 안내한다.
    - key: b
      label: 다음 주에 입사 예정인 신입 사원들의 최종 제출 증빙 서류(졸업증명서, 경력증명서) 진위 여부 검토를 시작한다.
    - key: c
      label: 어제 게시된 마케팅 직무 채용 공고 본문 중 사소한 오탈자 1개를 수정하기 위해 채용 플랫폼 에디터를 켠다.
    - key: d
      label: 다음 달에 진행될 하반기 인턴십 채용 설명회 기획안 작성을 위한 타사 사례 조사 자료를 수집한다.
    answer:
      key: a
    on_pass: m4
- id: m4
  type: 보고·인계
  title: 보고·인계
  mission: '김지아: "민우 씨, 오늘 진행된 기술 면접 결과와 지원자 현황을 정리해서 보고해 주세요. 우리 팀은 모든 보고를 규격화된 양식에 맞춰 진행합니다. 면접관들의 평가
    점수 취합본과 특이사항을 명확히 정리해서 인계해 주시기 바랍니다."


    오늘 진행된 면접 결과를 취합하여 사수에게 보고하기 위한 ''면접 결과 종합 보고서''를 작성하고 인계해야 합니다.'
  npcs:
  - npc_hr-01_01
  guide: null
  task:
    kind: write
    prompt: '오늘 진행된 면접 결과를 취합하여 사수에게 보고하기 위한 ''면접 결과 종합 보고서''를 작성하고 인계해야 합니다.


      제출 산출물: 금일 기술 면접 결과 종합 보고서 (xlsx 또는 pdf)'
    criteria:
    - 지원자별 면접관 평가 점수 및 합격/불합격/보류 여부가 명확히 분류되어 있는가?
    - 면접 과정에서 발생한 특이사항(지원자의 태도, 일정 지연 여부, 면접관 피드백)이 객관적으로 기록되었는가?
    - 개인정보 보호를 위해 마스킹 처리(이름 일부, 전화번호 일부)가 적용되었는가?
    pass_score: 70
    hints:
      warning: 보고서에 주관적인 감정이나 추측성 의견을 배제하고, 면접관들이 작성한 평가표의 텍스트와 점수를 있는 그대로 정확하게 이관해야 합니다.
      answer_guide: 보고서 작성 시에는 ① 지원자 인적사항 마스킹 처리, ② 면접관별 평가 점수 수식 검증, ③ 면접관 종합 의견 텍스트 원본 유지, ④ 불참자 및 일정
        변경자 특이사항 별도 표기를 준수하여 작성 후 팀장님께 대면 보고 및 이메일 아카이빙을 진행합니다.
    on_pass: __end__
sudden_quest:
  npc: npc_hr-01_03
  intro: 오후 2시 면접 예정이었던 이정우 지원자가 면접 시작 10분 전인 1시 50분에 다급한 목소리로 전화를 걸어왔습니다. 면접 장소로 오던 중 지하철 고장으로 인해 약 20분
    정도 지각할 것 같다고 합니다. 면접관들은 이미 면접실에 대기 중입니다.
  task:
    kind: choice
    prompt: '지원자의 불가항력적인 지각 상황에서 기업 이미지를 지키고 면접 프로세스를 매끄럽게 유지하기 위해 가장 먼저 취해야 할 올바른 조치를 선택해야 합니다.


      가장 먼저 할 대응을 하나 고르세요.'
    criteria:
    - 지원자 응대 매너를 유지하면서 현업 면접관들과의 소통을 통해 유연하고 신속하게 일정을 조율하는가?
    pass_score: 70
    hints:
      warning: 지원자의 불가피한 사유를 무시하고 기계적으로 탈락 처리하거나, 면접관들에게 상황 공유 없이 무작정 대기하게 만드는 것은 채용 브랜딩에 치명적인 악영향을 줍니다.
      answer_guide: 정답은 첫 번째 옵션입니다. 불가항력적 사유(지하철 고장 등)로 인한 지각의 경우, 지원자를 진정시키고 도착 예정 시간을 파악한 뒤, 대기 중인 면접관들에게
        양해를 구하고 일정을 미세 조정하는 것이 가장 프로페셔널한 채용 운영 방식입니다.
    options:
    - key: a
      label: 지원자를 안심시킨 후, 대기 중인 현업 면접관들에게 상황을 즉시 공유하고 면접 시작 시간을 20분 늦추거나 면접 순서를 조정할 수 있는지 양해를 구한다.
    - key: b
      label: 규정상 지각은 탈락 사유이므로 지원자에게 즉시 불합격 처리를 통보하고 면접관들에게 면접 취소를 안내한다.
    - key: c
      label: 지원자에게 무조건 빨리 오라고 재촉한 뒤, 면접관들에게는 아무런 보고를 하지 않은 채 지원자가 도착할 때까지 대기하게 한다.
    - key: d
      label: 사수(인사팀장)에게 보고하지 않고 독단적으로 오늘 면접을 전면 취소한 뒤 다음 주 중으로 전체 일정을 재잡아 통보한다.
    answer:
      key: a
    type: 오류·안전위험
