job: cln-01
slug: cln-01
title: 청소·객실관리 — 신입의 하루
module: 돌발상황 대처형
initial_state:
  trust: 50
  schedule_stability: 70
  requirement_clarity: 20
steps:
- id: m1
  type: 정상업무
  title: 정상업무
  mission: '김지수: "김지수 팀장: "오늘 첫 근무네요. 객실 정비의 시작은 카트 준비와 안전 장비 착용입니다. 하우스키퍼 카트에 오늘 필요한 품목들을 매뉴얼대로 세팅하고
    근무 준비를 마치세요. 규정을 위반하는 행동은 절대 금지입니다.""


    객실 정비 시작 전, 카트 세팅 및 개인 보호구 착용 필수 항목을 올바르게 선택하여 준비를 완료하는 미션 (보호구 미착용 및 위험 물질 임의 혼합 금지)'
  npcs:
  - npc_cln-01_01
  guide: '하우스키핑 표준 운영 매뉴얼(SOP): 카트 적재 기준(린넨류, 어메니티, 세제류 분리 적재), MSDS(물질안전보건자료) 기준 개인보호구(라텍스 장갑, 마스크) 착용
    필수.'
  task:
    kind: checklist
    prompt: '객실 정비 시작 전, 카트 세팅 및 개인 보호구 착용 필수 항목을 올바르게 선택하여 준비를 완료하는 미션 (보호구 미착용 및 위험 물질 임의 혼합 금지)


      필요한 행동을 모두 선택하세요.'
    criteria:
    - 매뉴얼에 따른 보호구 착용 및 카트 분리 적재 여부
    pass_score: 70
    hints:
      warning: 보호 장갑 미착용이나 과적은 안전사고와 직결되므로 절대로 피해야 합니다.
      answer_guide: ①라텍스 장갑/마스크 착용 -> ②린넨 분리 적재 -> ③어메니티 구분 적재 -> ④눈높이 이하 적재 순으로 안전하게 준비를 완료해야 합니다.
    options:
    - key: a
      label: 피부 보호를 위해 라텍스 장갑과 마스크를 착용한다.
    - key: b
      label: 깨끗한 린넨(시트, 타월)과 오염된 린넨 수거함을 카트에 분리하여 적재한다.
    - key: c
      label: 객실 어메니티(샴푸, 바디워시 등)를 세제류와 섞이지 않도록 전용 트레이에 구분해 담는다.
    - key: d
      label: 카트 이동 시 시야 확보를 위해 물품을 눈높이 이하로 적재한다.
    - key: e
      label: 작업 속도를 높이기 위해 보호 장갑을 벗고 맨손으로 락스 등 강한 세제를 다룬다.
    - key: f
      label: 더 많은 양을 한 번에 옮기기 위해 카트 앞이 안 보일 정도로 린넨을 높게 쌓는다.
    answer:
      keys:
      - a
      - b
      - c
      - d
    on_pass: m2
- id: m2
  type: 자료·정보 누락
  title: 자료·정보 누락
  mission: '박미란: "박미란 룸메이드: "신입 선생님, 제가 방금 805호 객실 정비를 마쳤는데 깜빡하고 체크리스트 검수를 못 했어요. 혹시 누락되거나 잘못 정비된 부분이
    있는지 한 번만 꼼꼼하게 점검해 줄래요?""


    정비가 완료된 객실에서 매뉴얼과 맞지 않는 누락이나 오류 사항을 찾아내는 미션 (고객 개인정보나 소지품을 임의로 만지거나 폐기하는 행동 금지)'
  npcs:
  - npc_cln-01_02
  guide: '805호 객실 정비 체크리스트: 베드 메이킹(시트 팽팽함 유지), 욕실 비품(타월 대/중/소 각 2개, 컵 2개), 미니바(생수 2병), 메모지와 펜 배치 여부.'
  task:
    kind: choice
    prompt: '정비가 완료된 객실에서 매뉴얼과 맞지 않는 누락이나 오류 사항을 찾아내는 미션 (고객 개인정보나 소지품을 임의로 만지거나 폐기하는 행동 금지)


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 이전 투숙객의 흔적(낙서된 메모지)을 방치하지 않고 교체하는지 여부
    pass_score: 70
    hints:
      warning: 이전 투숙객의 흔적을 방치하면 고객 불만의 직접적인 원인이 됩니다.
      answer_guide: 낙서가 있는 메모지를 그대로 두는 행동은 잘못된 정비입니다. 새 메모지로 완전히 교체해야 합니다.
    options:
    - key: a
      label: 고객이 이전 투숙 시 남겨둔 것으로 보이는 메모지 낙서를 발견했으나, 귀찮아서 그대로 두고 새 메모지만 위에 얹어놓는다.
    - key: b
      label: 베드 시트의 주름을 팽팽하게 당겨 정리하고 오염 여부를 다시 확인한다.
    - key: c
      label: 욕실 내 타월 수량이 대/중/소 각각 2개씩 비치되어 있는지 개수를 세어본다.
    - key: d
      label: 냉장고 안 무라벨 생수가 규정 수량인 2병이 맞는지 확인하고 유통기한을 점검한다.
    answer:
      key: a
    on_pass: m3
- id: m3
  type: 우선순위 충돌
  title: 우선순위 충돌
  mission: '김지수: "김지수 팀장: "지금 당일 체크인 예정 객실이 급하게 늘어났습니다. 현재 대기 중인 업무들의 상황을 보고, 어떤 객실부터 먼저 정비해야 할지 우선순위를
    판단해서 진행하세요.""


    한정된 시간 내에 효율적인 객실 가동을 위해 정비 우선순위를 올바르게 판단하는 미션 (고객 대기 상황을 무시하고 임의 순서로 정비하는 행동 금지)'
  npcs:
  - npc_cln-01_01
  guide: '객실 우선순위 가이드라인: 1순위: 얼리 체크인(Early Check-in) 요청 객실 및 VIP 객실, 2순위: 일반 체크인 예정 객실(DIRTY), 3순위: 재투숙(STAYOVER)
    정비 객실, 4순위: 체크아웃 완료 객실(VACANT DIRTY).'
  task:
    kind: choice
    prompt: '한정된 시간 내에 효율적인 객실 가동을 위해 정비 우선순위를 올바르게 판단하는 미션 (고객 대기 상황을 무시하고 임의 순서로 정비하는 행동 금지)


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 고객 대기 상태 및 객실 상태에 따른 우선순위 적용 여부
    pass_score: 70
    hints:
      warning: 얼리 체크인 고객이 대기 중일 때는 해당 객실을 최우선으로 정비해야 고객 불만을 예방할 수 있습니다.
      answer_guide: 대기 고객이 있는 '얼리 체크인' 객실을 1순위로 정비하는 것이 가장 적절한 대응입니다.
    options:
    - key: a
      label: 로비에서 대기 중인 '얼리 체크인' 요청 고객의 객실을 가장 먼저 정비한다.
    - key: b
      label: 정비하기 가장 편해 보이는 빈 방(Vacant Dirty)부터 내 마음대로 청소한다.
    - key: c
      label: 현재 투숙 중이며 오후 늦게 복귀 예정인 연박 고객(Stayover) 방을 최우선으로 들어간다.
    - key: d
      label: 체크인 시간이 5시간 이상 남은 일반 예약 객실을 먼저 정비하느라 얼리 체크인 객실을 방치한다.
    answer:
      key: a
    on_pass: m4
- id: m4
  type: 보고·인계
  title: 보고·인계
  mission: '김지수: "김지수 팀장: "오늘 근무 수고하셨습니다. 퇴근 전 오늘 사용한 린넨 수량, 객실 정비 완료 현황, 그리고 특이사항을 정리하여 하우스키핑 일일 보고서로
    작성해 제출해 주세요.""


    하루 동안의 업무 결과를 정확한 수치와 객관적 사실을 바탕으로 보고서로 작성하는 미션 (허위 수치 작성 및 특이사항 묵인 금지)'
  npcs:
  - npc_cln-01_01
  guide: null
  task:
    kind: write
    prompt: '하루 동안의 업무 결과를 정확한 수치와 객관적 사실을 바탕으로 보고서로 작성하는 미션 (허위 수치 작성 및 특이사항 묵인 금지)


      제출 산출물: 하우스키핑 일일 업무 보고서 (정비 완료 객실 번호, 교체 린넨 수량, 객실 내 파손/특이사항 기록)'
    criteria:
    - 정비 완료한 객실 번호가 정확히 기록되었는가?
    - 사용한 린넨(시트, 타월 등)의 총수량이 정확히 일치하는가?
    - '객실 점검 중 발견된 특이사항(예: 805호 컵 미세 균열 등)이 누락 없이 기재되었는가?'
    pass_score: 70
    hints:
      warning: 보고서의 수량 불일치는 자산 관리의 문제로 이어지므로 정확한 실사가 필요합니다.
      answer_guide: 오늘 정비한 객실 목록과 카트 잔량 계산을 통한 린넨 소모량, 그리고 근무 중 발견한 시설 특이사항을 일지 양식에 맞춰 작성해 팀장에게 제출합니다.
    on_pass: __end__
sudden_quest:
  npc: npc_cln-01_03
  intro: 복도를 지나가던 중, 808호 투숙객인 마이클 스미스 씨가 문을 열고 나와 다급한 표정으로 말을 겁니다.
  task:
    kind: choice
    prompt: '외국인 투숙객이 객실 내 시트 오염으로 급박한 교체를 요청했을 때, 당황하지 않고 신속하고 안전하게 대처하는 미션 (의사소통 불가로 무시하거나 동의 없이 방에
      들어가는 행동 금지)


      가장 먼저 할 대응을 하나 고르세요.'
    criteria:
    - 고객의 급박한 요구에 대한 신속한 인지 및 즉각적인 협업 대응 여부
    pass_score: 70
    hints:
      warning: 고객이 30분 뒤 외출해야 하므로, 혼자 해결하려 하기보다 동료와 협력하여 신속히 해결하는 것이 핵심입니다.
      answer_guide: 고객의 요청에 즉시 긍정적으로 응대하고, 동료 미란 씨에게 지원을 요청하여 신속하게 베드 시트를 교체하는 것이 가장 올바른 대처입니다.
    options:
    - key: a
      label: 상황을 즉시 이해했음을 알리고("Sure, I will help you right away"), 동료 룸메이드에게 즉시 협조를 요청하여 10분 내로 시트를 신속히
        교체해 준다.
    - key: b
      label: 영어를 못 알아듣는 척하며 고개를 젓고 자리를 피한다.
    - key: c
      label: 고객의 동의나 확인 없이 무작정 객실 안으로 뛰어 들어가 침대를 뒤엎는다.
    - key: d
      label: 팀장님에게 보고해야 한다며 고객을 복도에 세워둔 채 20분 동안 보고서만 작성하고 있는다.
    answer:
      key: a
    type: 오류·안전위험
