job: wh-01
slug: wh-01
title: 물류창고·분류 — 신입의 하루
module: 돌발상황 대처형
initial_state:
  trust: 50
  schedule_stability: 70
  requirement_clarity: 20
steps:
- id: m1
  type: 정상업무
  title: 안전장구 및 장비 사전 점검
  mission: '마동식: "어서 오세요. 오늘 입고 예정 리스트랑 안전 수칙입니다. 작업 시작 전에 준비 상태부터 철저히 점검합시다. 안전장구 미착용이나 장비 미점검 상태로 현장에 들어가는 건 절대 금지입니다."


    안전한 작업을 위해 필요한 필수 준비 사항 4가지를 선택하고, 위험하거나 불필요한 행동을 배제하십시오.'
  npcs:
  - npc_wh-01_01
  guide: 신입 사원 안전 수칙, 일일 개인보호구(PPE) 점검표
  task:
    kind: checklist
    prompt: '안전한 작업을 위해 필요한 필수 준비 사항 4가지를 선택하고, 위험하거나 불필요한 행동을 배제하십시오.


      필요한 행동을 모두 선택하세요.'
    criteria:
    - 개인 보호구(PPE) 착용 및 장비 사전 점검 수칙 준수 여부
    pass_score: 70
    hints:
      warning: 편의를 위해 안전 장비를 임의로 변경하거나 지게차 통로로 보행하는 것은 대형 사고로 이어집니다.
      answer_guide: ① 안전모와 안전화를 바르게 착용한다. ② 작업용 코팅 장갑을 착용한다. ③ 수동 핸드 자키의 작동 상태를 점검한다. ④ 스마트폰을 포함한 개인 소지품을 사물함에 보관한다.
    options:
    - key: a
      label: 머리와 발을 안전하게 보호할 장구를 착용한다.
    - key: b
      label: 미끄럼을 방지하는 작업용 장갑을 손에 맞게 착용한다.
    - key: c
      label: 수동 핸드 리프트의 바퀴와 유압 장치 작동 여부를 확인한다.
    - key: d
      label: 업무 집중을 위해 개인 휴대폰과 소지품을 보관함에 넣어둔다.
    - key: e
      label: 편안한 움직임을 위해 안전화 대신 가벼운 운동화를 착용한다.
    - key: f
      label: 신속한 이동을 위해 지게차 전용 이동 경로로 보행한다.
    answer:
      keys:
      - a
      - b
      - c
      - d
    on_pass: m2
- id: m2
  type: 자료·정보 누락
  title: 피킹 상품과 송장 대조
  mission: '김지수: "지수 씨가 피킹해온 A구역 가전 부품 박스들인데요, 수량이랑 송장이 좀 안 맞는 것 같아요. 바빠서 그런데 신입 선생님이 이것 좀 오류가 있는지 잡아내 주실래요?"


    피킹된 상품과 송장의 일치 여부를 점검하여 ''잘못된 오류 행동(실수)'' 1가지를 찾아내십시오.'
  npcs:
  - npc_wh-01_02
  guide: A구역 출고 송장 리스트, 피킹 완료 상품 적재 카트
  task:
    kind: choice
    prompt: '피킹된 상품과 송장의 일치 여부를 점검하여 ''잘못된 오류 행동(실수)'' 1가지를 찾아내십시오.


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 누락 발견 시 임의 행동을 하지 않고 절차에 따라 확인 및 공유하는지 여부
    pass_score: 70
    hints:
      warning: 누락을 발견했을 때 보고나 공유 없이 혼자 선반으로 뛰어가는 행동은 추가적인 동선 꼬임과 안전사고를 유발합니다.
      answer_guide: ① 바코드 스캐너로 실물 박스의 바코드와 송장 일련번호를 대조한다. ② 송장의 상품명과 실물 박스의 모델명이 일치하는지 확인한다. ③ 수량 누락 등 오류 발견 시 임의로 행동하지 않고
        피킹 작업자나 관리자에게 공유하여 상호 확인한다.
    options:
    - key: a
      label: 송장보다 실물 상자가 1개 부족한 것을 보고, 빈자리를 채우기 위해 곧바로 재고 보관 구역으로 달려간다.
    - key: b
      label: 스캐너 기기를 활용해 실제 박스 바코드와 전산 송장 번호를 하나씩 비교하며 검수한다.
    - key: c
      label: 전표에 적힌 제품 이름이 실제 상자 겉면에 인쇄된 모델 번호와 똑같은지 대조해 본다.
    - key: d
      label: 수량이 맞지 않는 문제를 인지한 후 담당 작업자인 지수 씨에게 전달하여 교차 검증을 부탁한다.
    answer:
      key: a
    on_pass: m3
- id: m3
  type: 우선순위 충돌
  title: 동시 도착 차량 우선순위 결정
  mission: '마동식: "지금 B구역 급송 택배 차량이 도착했는데, 동시에 C구역 정기 입고 화물차도 들어왔습니다. 도크(Dock)는 하나밖에 없고요. 어떻게 우선순위를 두고 처리해야 할까요?"


    물류 창고의 병목 현상을 방지하기 위해 가장 적절한 우선순위 판단 대응 1가지를 선택하십시오.'
  npcs:
  - npc_wh-01_01
  guide: 일일 입출고 스케줄러, 도크 사용 매뉴얼
  task:
    kind: choice
    prompt: '물류 창고의 병목 현상을 방지하기 위해 가장 적절한 우선순위 판단 대응 1가지를 선택하십시오.


      가장 적절한 것 하나를 고르세요.'
    criteria:
    - 납기 준수(출고 우선) 및 대기 공간 관리를 고려한 우선순위 결정 능력
    pass_score: 70
    hints:
      warning: 물류에서는 출고(배송 시간 제한)가 입고보다 시간적 민감도가 높으므로, 급송 출고를 우선 처리하는 것이 병목을 줄입니다.
      answer_guide: ① 급송 출고 차량을 도크에 우선 접안시켜 발송한다. ② 입고 차량은 대기 구역에 안전하게 대기하도록 조치한다.
    options:
    - key: a
      label: 긴급한 발송 차량을 도크에 먼저 배치하고 입고 화물차는 대기 구역으로 안내한다.
    - key: b
      label: 먼저 도착한 순서대로 처리하기 위해 입고 차량을 도크에 우선 진입시킨다.
    - key: c
      label: 하나의 도크에 두 차량을 임의로 주차하여 상하차 작업을 동시에 진행한다.
    - key: d
      label: 순서를 정하기 어려우므로 운전기사들이 자체적으로 순번을 합의하도록 둔다.
    answer:
      key: a
    on_pass: m4
- id: m4
  type: 보고·인계
  title: 물류 작업 인계서 작성
  mission: '마동식: "오늘 오전 파트 작업은 여기까지 하고 교대합시다. 다음 조가 와서 바로 작업할 수 있게 오전 입출고 현황이랑 미처리 내역을 정리해서 인계해 주세요. 대충 말로 하지 말고 문서로 남겨야 합니다."


    오후 작업 조에게 인계할 ''입출고 및 분류 작업 일지''를 작성하십시오. 임의 누락이나 구두 전달은 금지됩니다.'
  npcs:
  - npc_wh-01_01
  guide: null
  task:
    kind: write
    prompt: '오후 작업 조에게 인계할 ''입출고 및 분류 작업 일지''를 작성하십시오. 임의 누락이나 구두 전달은 금지됩니다.


      제출 산출물: 오전 물류 입출고 및 분류 작업 인계서 (양식)'
    criteria:
    - 오전 입고 완료 수량 및 출고 대기 수량의 정확한 수치 기재
    - A구역 수량 누락 발생 건의 조치 결과(추가 피킹 완료 여부) 명시
    - C구역 입고 화물 임시 대기 상태 및 오후 작업 필요 사항 인계
    pass_score: 70
    hints:
      warning: 인계서에 수치 오류가 있거나 특이사항(대기 차량)을 누락하면 오후 조의 작업 지연으로 이어집니다.
      answer_guide: ① 오전의 정확한 입출고 처리 수량을 기록한다. ② A구역 수량 불일치에 대한 조치 결과를 작성한다. ③ C구역 대기 차량 입고 등 오후 인계 사항을 명시한다.
    on_pass: __end__
sudden_quest:
  npc: npc_wh-01_03
  intro: 최기사님이 땀을 흘리며 급하게 창고 안으로 뛰어 들어옵니다. '아이고, 신입 양반! 상차하다가 저기 3번 도크 앞 팔레트에 쌓인 박스 하나가 무너져서 제품이 깨진 것 같아요! 액체가 막 흘러나오는데 어떡하죠?'
  task:
    kind: choice
    prompt: '물품 파손 및 액체 물질 누출이라는 돌발 상황 발생 시, 안전 확보와 2차 피해 방지를 위해 가장 먼저 취해야 할 조치를 선택하십시오.


      가장 먼저 할 대응을 하나 고르세요.'
    criteria:
    - 안전 최우선 원칙에 따른 현장 통제, 보고 및 화학물질(액체) 안전 대응 절차 준수 여부
    pass_score: 70
    hints:
      warning: 누출된 액체가 유해 화학물질일 수 있으므로 맨손 접촉이나 무분별한 흡입은 절대 금물이며, 즉각적인 보고와 통제가 필수입니다.
      answer_guide: 안전사고 발생 시 ① 현장 통제 -> ② 관리자 보고 -> ③ 성분 확인(MSDS) 후 안전 장구 착용 하에 방제 작업을 실시하는 ①번이 정답입니다.
    options:
    - key: a
      label: 즉시 주변 작업자들의 접근을 통제하고, 마동식 반장에게 상황을 보고한 뒤 물질안전보건자료(MSDS)에 따라 누출액 방제 작업을 준비한다.
    - key: b
      label: 제품이 아까우니 깨진 박스 안으로 손을 넣어 파손되지 않은 나머지 제품들부터 빠르게 꺼낸다.
    - key: c
      label: 최기사님에게 상차 과실이 있으니 기사님이 직접 치우셔야 한다고 소리치며 책임을 묻는다.
    - key: d
      label: 대걸레를 가져와서 무슨 액체인지 확인하지 않고 바닥부터 빠르게 닦아낸다.
    answer:
      key: a
    type: 오류·안전위험
