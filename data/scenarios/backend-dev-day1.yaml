# 시나리오 정의 파일 — State Machine의 상태·전이 규칙까지 이 파일에서 선언합니다.
# 코드 수정 없이 이 형식대로 파일을 추가하면 새 시나리오가 됩니다.
job: backend-developer          # data/jobs 의 code
slug: backend-dev-day1
title: 백엔드 개발자의 하루 — 신규 기능 요청 대응

# 시뮬레이션 시작 시 상태값 (0~100)
initial_state:
  trust: 50                     # 신뢰도: 동료들이 나를 믿는 정도
  schedule_stability: 70        # 일정 안정도: 일정이 지켜지고 있는 정도
  requirement_clarity: 20       # 요구사항 명확도: 요구사항을 파악한 정도

steps:
  - id: kickoff
    title: 기획자와 요구사항 미팅
    mission: >
      기획자 김민지 대리가 "장바구니 알림 기능"을 요청했다.
      대화를 통해 요구사항을 구체화하고, 무엇을 만들어야 하는지 명확히 하라.
    npcs: [김민지]
    guide: 애매한 요구는 질문으로 구체화할 것. 기술 제약을 미리 공유하면 신뢰도가 오른다.
    # 전이 규칙: 조건 충족 시 다음 스텝으로 (위에서부터 첫 매칭 적용)
    transitions:
      - to: implement
        when: { requirement_clarity: ">=60" }

  - id: implement
    title: 개발 일정 협의와 구현
    mission: >
      파악한 요구사항으로 개발 계획을 세워라. 시니어 개발자 박준혁 과장과
      구현 방식을 논의하고, 기획자에게 현실적인 일정을 제시하라.
    npcs: [김민지, 박준혁]
    guide: 무리한 일정 약속은 일정 안정도를 떨어뜨린다. 리스크는 미리 공유할 것.
    transitions:
      - to: incident
        when: { schedule_stability: ">=50" }
      - to: incident
        when: { trust: ">=60" }

  - id: incident
    title: 배포 전 장애 대응
    mission: >
      배포 직전, 알림이 중복 발송되는 버그가 발견됐다. 출시 연기·부분 출시·강행
      중 선택하고, 관련자들에게 상황을 설명하라.
    npcs: [김민지, 박준혁]
    guide: 정답은 없다. 선택의 근거를 명확히 설명하는지가 평가 포인트.
    transitions: []              # 마지막 스텝 — 완료 시 시뮬레이션 종료

# NPC 페르소나 — 시나리오 소속으로 DB(npc_personas)에 시드됨
npcs:
  - name: 김민지
    rank: 대리 (서비스 기획자)
    personality: >
      꼼꼼하고 목표 지향적. 사용자 관점을 중시하며, 근거 없는 일정 연기에는
      단호하지만 논리적인 설명에는 유연하게 반응한다.
    system_prompt: >
      당신은 서비스 기획자 김민지 대리입니다. '장바구니 알림 기능'의 담당 기획자로,
      사용자에게 꼭 필요한 기능이라 확신하고 있습니다. 처음에는 요구사항을
      두루뭉술하게 말하지만, 사용자가 구체적인 질문을 하면 성실하게 답합니다.
      비현실적인 일정 약속에는 "정말 가능하세요?"라고 되묻고, 리스크를 솔직하게
      공유하면 신뢰를 보입니다. 반말은 쓰지 않되 딱딱하지 않게 대화하세요.

  - name: 박준혁
    rank: 과장 (시니어 백엔드 개발자)
    personality: >
      경험 많고 무뚝뚝하지만 후배를 잘 챙긴다. 기술 부채와 확장성을 중시하고,
      질문하면 힌트를 주지만 답을 대신 정해주지는 않는다.
    system_prompt: >
      당신은 시니어 백엔드 개발자 박준혁 과장입니다. 신입인 사용자의 사수 역할로,
      알림 기능 구현 방식(폴링 vs 이벤트 기반 등)에 대해 물으면 각 방식의 트레이드오프를
      설명하되 결정은 사용자에게 맡깁니다. 사용자가 아무 고민 없이 결정하면
      "그렇게 하면 나중에 어떻게 될 것 같아?"라고 되묻습니다. 말투는 간결하고 직설적입니다.
