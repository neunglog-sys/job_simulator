# 시나리오 정의 파일 — 게임 루프: NPC 대화로 정보 수집 → 과제(task) 제출 → AI 채점 → 통과 시 다음 스텝.
# 코드 수정 없이 이 형식대로 파일을 추가하면 새 시나리오가 됩니다.
job: backend-developer          # data/jobs 의 code
slug: backend-dev-day1
title: 백엔드 개발자의 하루 — 신규 기능 요청 대응
module: 제작·상태판단형          # 8모듈 중 하나 — 프론트가 배경 세트 선택에 사용

# 시작 상태값 (0~100) — 진행 조건이 아니라 대화 태도 누적 지표 (최종 리포트 재료)
initial_state:
  trust: 50                     # 신뢰도: 동료들이 나를 믿는 정도
  schedule_stability: 70        # 일정 안정도: 일정이 지켜지고 있는 정도
  requirement_clarity: 20       # 요구사항 명확도: 요구사항을 파악한 정도

steps:
  - id: kickoff
    title: 기획자와 요구사항 미팅
    mission: >
      기획자 김민지 대리가 "장바구니 알림 기능"을 요청했다.
      대화를 통해 요구사항을 파악한 뒤, 요구사항 정리서를 작성해 제출하라.
    npcs: [김민지]
    guide: 김민지 대리에게 질문하지 않으면 과제에 쓸 내용을 알 수 없다. 애매한 요구는 구체화 질문으로 파고들 것.
    task:
      prompt: >
        파악한 내용을 바탕으로 '요구사항 정리서'를 작성해 제출하세요.
        (기능의 목적 / 대상 사용자 / 알림 발송 조건 / 예외 상황을 포함할 것)
      criteria:
        - 기능의 목적이 명확히 정리되어 있는가
        - 대상 사용자가 구체적으로 정의되어 있는가
        - 알림 발송 조건이 파악한 내용과 일치하게 정리되어 있는가
        - 예외 상황(중복 발송·수신 거부 등)을 고려했는가
      pass_score: 70
      # 힌트 3단계용 (선택) — warning: 1차 미달 시 경고 / answer_guide: 3차 미달 시 정답 골격
      hints:
        warning: 김민지 대리에게 확인하지 않은 내용을 지어내면 감점됩니다. 발송 조건·대상은 대화에서 확인했나요?
        answer_guide: >
          다음 순서로 작성하세요: ① 기능 목적(장바구니 이탈 방지) ② 대상(수신 동의한 사용자)
          ③ 발송 조건(담은 후 24시간 내 미구매 시 1회) ④ 예외(야간 22~08시 금지, 중복 발송 방지).
          각 항목은 김민지 대리와의 대화에서 확인한 내용과 일치해야 합니다.
      on_pass: implement

  - id: implement
    title: 개발 계획 수립
    mission: >
      요구사항이 확정됐다. 시니어 개발자 박준혁 과장과 구현 방식을 논의하고,
      개발 계획서를 작성해 제출하라.
    npcs: [김민지, 박준혁]
    guide: 박 과장에게 구현 방식의 트레이드오프를 물어볼 것. 무리한 일정 약속은 신뢰도를 떨어뜨린다.
    task:
      prompt: >
        '개발 계획서'를 작성해 제출하세요.
        (선택한 구현 방식과 그 이유 / 예상 일정 / 예상되는 리스크와 대응 방안을 포함할 것)
      criteria:
        - 구현 방식 선택에 근거(트레이드오프 비교)가 있는가
        - 일정이 현실적으로 산정되어 있는가
        - 리스크와 대응 방안을 스스로 식별했는가
      pass_score: 70
      on_pass: incident

  - id: incident
    title: 배포 전 장애 대응
    mission: >
      배포 직전, 알림이 중복 발송되는 버그가 발견됐다. 출시 연기·부분 출시·강행 중
      하나를 선택한 뒤, 관련자들에게 보낼 상황 공지문을 작성해 제출하라.
    npcs: [김민지, 박준혁]
    guide: 정답은 없다. 선택의 근거를 명확히 설명하는지가 평가 포인트.
    # 선택지: effects는 룰 기반 상태 변화 (클라이언트에는 노출 안 됨)
    choices:
      - id: postpone
        text: 출시를 1주 연기하고 버그를 완전히 수정한다
        effects: { schedule_stability: -15, trust: +10 }
      - id: partial
        text: 알림 기능만 제외하고 나머지를 예정대로 출시한다
        effects: { schedule_stability: +5, trust: +5 }
      - id: push
        text: 예정대로 강행 출시하고 핫픽스로 대응한다
        effects: { schedule_stability: +10, trust: -15 }
    task:
      prompt: >
        선택한 대응 방안을 관련자(기획·개발·운영)에게 알리는 '상황 공지문'을 작성해 제출하세요.
        (현재 상황 / 선택한 대응과 그 근거 / 각 관련자가 해야 할 일을 포함할 것)
      criteria:
        - 상황이 사실 그대로 정확히 전달되는가
        - 선택의 근거가 논리적으로 설명되는가
        - 관련자별 액션 아이템이 명확한가
      pass_score: 70
      on_pass: __end__          # 마지막 과제 통과 → 시뮬레이션 완료

# ⚡ 돌발 퀘스트 — 스텝 전환 시 확률 발동 (시뮬레이션당 1회 보장, 실패해도 진행 비차단)
sudden_quest:
  npc: 운영팀 주임
  intro: >
    갑자기 운영팀 주임이 다급하게 찾아왔다. "지금 고객센터에 '앱이 자꾸 튕긴다'는
    문의가 몰리고 있어요! 개발팀에서 확인 좀 해주세요. 뭐라고 안내해야 하죠?"
  task:
    prompt: >
      운영팀이 고객센터에서 바로 쓸 수 있는 '임시 안내문'을 작성해 제출하세요.
      (확인된 사실 / 고객 안내 문구 / 운영팀이 수집해줘야 할 정보를 포함할 것)
    criteria:
      - 확인되지 않은 원인을 단정하지 않는가
      - 고객 안내 문구가 정중하고 구체적인가
      - 재현 정보(기기·OS·발생 화면 등) 수집 요청이 포함됐는가
    pass_score: 70
    hints:
      warning: 원인을 아직 모르는 상태입니다. "서버 문제입니다" 같은 단정은 감점 요인이에요.
      answer_guide: >
        ① 확인된 사실만 기술(문의 급증, 원인 파악 중) ② 고객 안내("불편을 드려 죄송하며
        신속히 확인 중입니다") ③ 수집 요청(기기 모델·OS 버전·발생 시점·마지막 행동).

# NPC 페르소나 — 시나리오 소속으로 DB(npc_personas)에 시드됨
npcs:
  - name: 김민지
    rank: 대리 (서비스 기획자)
    personality: >
      꼼꼼하고 목표 지향적. 사용자 관점을 중시하며, 근거 없는 일정 연기에는
      단호하지만 논리적인 설명에는 유연하게 반응한다.
    system_prompt: >
      당신은 서비스 기획자 김민지 대리입니다. '장바구니 알림 기능'의 담당 기획자로,
      사용자에게 꼭 필요한 기능이라 확신하고 있습니다. 처음에는 요구사항을
      두루뭉술하게 말하지만, 사용자가 구체적인 질문을 하면 성실하게 답합니다.
      요구사항의 실제 내용: 장바구니에 담고 24시간 내 구매하지 않은 사용자에게
      1회 푸시 알림 발송, 수신 동의자만 대상, 야간(22시~08시) 발송 금지.
      이 내용은 사용자가 물어봐야만 조금씩 알려주세요. 비현실적인 일정 약속에는
      "정말 가능하세요?"라고 되묻고, 리스크를 솔직하게 공유하면 신뢰를 보입니다.
      반말은 쓰지 않되 딱딱하지 않게 대화하세요.

  - name: 박준혁
    rank: 과장 (시니어 백엔드 개발자)
    personality: >
      경험 많고 무뚝뚝하지만 후배를 잘 챙긴다. 기술 부채와 확장성을 중시하고,
      질문하면 힌트를 주지만 답을 대신 정해주지는 않는다.
    system_prompt: >
      당신은 시니어 백엔드 개발자 박준혁 과장입니다. 신입인 사용자의 사수 역할로,
      알림 기능 구현 방식(배치 폴링 vs 이벤트 기반 등)에 대해 물으면 각 방식의
      트레이드오프(구현 난이도, 실시간성, 인프라 비용)를 설명하되 결정은 사용자에게
      맡깁니다. 사용자가 아무 고민 없이 결정하면 "그렇게 하면 나중에 어떻게 될 것
      같아?"라고 되묻습니다. 말투는 간결하고 직설적입니다.

  - name: 운영팀 주임
    rank: 주임 (서비스 운영·CS)
    personality: >
      다급하지만 협조적. 고객 불만에 민감하고, 개발 용어를 모르는 대신
      고객 상황(문의량, 증상 표현)은 정확히 전달한다.
    system_prompt: >
      당신은 서비스 운영팀 주임입니다. 고객센터에 "앱이 튕긴다"는 문의가 몰려
      다급하게 개발팀을 찾아온 상황입니다. 물어보면 아는 것: 문의는 30분 전부터
      급증, 대부분 안드로이드 사용자, 결제 화면에서 발생한다는 공통점. 모르는 것:
      기술적 원인(추측하지 않음). 사용자가 침착하게 정보를 정리해주면 안도하고,
      단정적인 원인 추측을 하면 "확실한 거예요? 고객한테 그렇게 말해도 돼요?"라고
      되묻습니다. 말이 빠르고 급한 톤입니다.
