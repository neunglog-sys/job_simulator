# 시나리오 정의 파일 — 게임 루프: NPC 대화로 정보 수집 → 과제(task) 제출 → AI 채점 → 통과 시 다음 스텝.
# 코드 수정 없이 이 형식대로 파일을 추가하면 새 시나리오가 됩니다.
job: backend-developer
slug: backend-dev-day1
title: 백엔드 개발자의 하루 — 신규 기능 요청 대응
module: 제작·상태판단형
initial_state:
  trust: 50
  schedule_stability: 70
  requirement_clarity: 20
steps:
- id: kickoff
  type: 자료·정보 누락
  title: 기획자와 요구사항 미팅
  mission: '기획자 김민지 대리가 "장바구니 알림 기능"을 요청했다. 대화를 통해 요구사항을 파악한 뒤, 요구사항 정리서를 작성해 제출하라.

    '
  npcs:
  - npc_bdd_01
  guide: 김민지 대리에게 질문하지 않으면 과제에 쓸 내용을 알 수 없다. 애매한 요구는 구체화 질문으로 파고들 것.
  task:
    prompt: '파악한 내용을 바탕으로 ''요구사항 정리서''를 작성해 제출하세요. (기능의 목적 / 대상 사용자 / 알림 발송 조건 / 예외 상황을 포함할 것)

      '
    criteria:
    - 기능의 목적이 명확히 정리되어 있는가
    - 대상 사용자가 구체적으로 정의되어 있는가
    - 알림 발송 조건이 파악한 내용과 일치하게 정리되어 있는가
    - 예외 상황(중복 발송·수신 거부 등)을 고려했는가
    pass_score: 70
    hints:
      warning: 김민지 대리에게 확인하지 않은 내용을 지어내면 감점됩니다. 발송 조건·대상은 대화에서 확인했나요?
      answer_guide: '다음 순서로 작성하세요: ① 기능 목적(장바구니 이탈 방지) ② 대상(수신 동의한 사용자) ③ 발송 조건(담은 후 24시간 내 미구매 시 1회) ④ 예외(야간 22~08시 금지, 중복
        발송 방지). 각 항목은 김민지 대리와의 대화에서 확인한 내용과 일치해야 합니다.

        '
    on_pass: implement
- id: implement
  type: 우선순위 충돌
  title: 개발 계획 수립
  mission: '요구사항이 확정됐다. 시니어 개발자 박준혁 과장과 구현 방식을 논의하고, 개발 계획서를 작성해 제출하라.

    '
  npcs:
  - npc_bdd_01
  - npc_bdd_02
  guide: 박 과장에게 구현 방식의 트레이드오프를 물어볼 것. 무리한 일정 약속은 신뢰도를 떨어뜨린다.
  task:
    prompt: '''개발 계획서''를 작성해 제출하세요. (선택한 구현 방식과 그 이유 / 예상 일정 / 예상되는 리스크와 대응 방안을 포함할 것)

      '
    criteria:
    - 구현 방식 선택에 근거(트레이드오프 비교)가 있는가
    - 일정이 현실적으로 산정되어 있는가
    - 리스크와 대응 방안을 스스로 식별했는가
    pass_score: 70
    on_pass: coding
- id: coding
  type: 정상업무
  title: 알림 발송 예외 처리 구현
  mission: '박준혁: "계획대로 가자. 알림 발송 로직에서 예외 케이스 세 개만 먼저 막아줘 — 같은 사용자에게 중복 발송, 수신거부한 사용자, 야간 시간대. 조건문 빠뜨리면 그대로 고객한테 나가니까 정확하게."


    중복 발송·수신거부·야간 발송 세 가지 예외 조건을 코드로 구현하고, 각 조건을 왜 걸러야 하는지 근거와 함께 제출한다'
  npcs:
  - npc_bdd_02
  guide: 세 조건을 모두 막아야 한다. 하나라도 빠지면 실제 사용자에게 잘못된 알림이 나간다.
  task:
    kind: checklist
    prompt: '알림 발송 전 걸러야 할 예외 조건을 빠짐없이 구현한다


      아래 보기에서 이 업무에 필요한 처리를 모두 선택하세요.'
    criteria:
    - 필요한 예외 처리를 빠짐없이 골랐는가
    pass_score: 70
    hints:
      warning: 세 조건 중 하나라도 빠뜨린 채 발송, 예외 처리 없이 전체 발송부터 시도
      answer_guide: ① 같은 사용자·같은 알림의 중복 발송을 막는다 ② 수신거부 설정을 확인해 제외한다 ③ 야간 시간대 발송을 보류 처리한다 ④ 걸러진 건을 이유와 함께 기록해 확인 가능하게 한다
    options:
    - key: a
      label: 동일 사용자에게 같은 알림이 이미 나갔는지 확인해 중복을 막는다
    - key: b
      label: 수신거부 설정을 조회해 해당 사용자를 발송 대상에서 제외한다
    - key: c
      label: 야간 시간대에 해당하면 발송을 보류하고 다음 발송 시각으로 넘긴다
    - key: d
      label: 조건 확인 없이 전체 대상에게 먼저 발송하고 문제가 생기면 취소한다
    - key: e
      label: 걸러진 건을 사유와 함께 기록해 나중에 확인할 수 있게 남긴다
    answer:
      keys:
      - a
      - b
      - c
      - e
    on_pass: incident
- id: incident
  type: 보고·인계
  title: 배포(프로그램 출시) 전 장애(시스템 오류) 대응
  mission: '배포 직전, 알림이 중복 발송되는 버그가 발견됐다. 출시 연기·부분 출시·강행 중 하나를 선택한 뒤, 관련자들에게 보낼 상황 공지문을 작성해 제출하라.

    '
  npcs:
  - npc_bdd_01
  - npc_bdd_02
  guide: 정답은 없다. 선택의 근거를 명확히 설명하는지가 평가 포인트.
  choices:
  - id: postpone
    text: 출시를 1주 연기하고 버그를 완전히 수정한다
    effects:
      schedule_stability: -15
      trust: 10
  - id: partial
    text: 알림 기능만 제외하고 나머지를 예정대로 출시한다
    effects:
      schedule_stability: 5
      trust: 5
  - id: push
    text: 예정대로 강행 출시하고 핫픽스로 대응한다
    effects:
      schedule_stability: 10
      trust: -15
  task:
    prompt: '선택한 대응 방안을 관련자(기획·개발·운영)에게 알리는 ''상황 공지문''을 작성해 제출하세요. (현재 상황 / 선택한 대응과 그 근거 / 각 관련자가 해야 할 일을 포함할 것)

      '
    criteria:
    - 상황이 사실 그대로 정확히 전달되는가
    - 선택의 근거가 논리적으로 설명되는가
    - 관련자별 액션 아이템이 명확한가
    pass_score: 70
    on_pass: __end__
sudden_quest:
  npc: npc_bdd_03
  intro: '갑자기 운영팀 주임이 다급하게 찾아왔다. "지금 고객센터에 ''앱이 자꾸 튕긴다''는 문의가 몰리고 있어요! 개발팀에서 확인 좀 해주세요. 뭐라고 안내해야 하죠?"

    '
  task:
    type: 오류·안전위험
    prompt: '운영팀이 고객센터에서 바로 쓸 수 있는 ''임시 안내문''을 작성해 제출하세요. (확인된 사실 / 고객 안내 문구 / 운영팀이 수집해줘야 할 정보를 포함할 것)

      '
    criteria:
    - 확인되지 않은 원인을 단정하지 않는가
    - 고객 안내 문구가 정중하고 구체적인가
    - 재현 정보(기기·OS·발생 화면 등) 수집 요청이 포함됐는가
    pass_score: 70
    hints:
      warning: 원인을 아직 모르는 상태입니다. "서버 문제입니다" 같은 단정은 감점 요인이에요.
      answer_guide: '① 확인된 사실만 기술(문의 급증, 원인 파악 중) ② 고객 안내("불편을 드려 죄송하며 신속히 확인 중입니다") ③ 수집 요청(기기 모델·OS 버전·발생 시점·마지막 행동).

        '
