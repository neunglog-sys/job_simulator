      answer_guide: ① 지시서에서 장비 모델명·점검항목 확인 ② 유압 잔압 제거 확인 후 게이지 연결·3회 측정값 기록 ③ 캐비닛 기준표가 타 모델용임을 탐지 ④ 임의
        판정 보류하고 선임에게 해당 모델 정비지침서를 질문으로 요청 ⑤ 확보한 기준값(190~210bar)과 대조해 판정·기록
