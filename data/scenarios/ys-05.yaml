  npc: 공사부장 / 박 과장
  intro: 공사부장 / 박 과장이(가) 다급하게 찾아왔다. "바람 좀 부는 걸로 크레인을 세우면 공정 다 밀린다, 오늘 양중은 그냥 진행하자."
