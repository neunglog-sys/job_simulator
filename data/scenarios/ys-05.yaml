      측정값을 법정 기준과 대조해 작업중지 상황임을 판단하고, 공정 압박에도 임의 진행을 허용하지 않고 안전관리자에게 보고한다 (신입이 직접 크레인 조작·지휘하는 것은 금지행동)

      아래 보기 중 지금 가장 먼저 해야 할 대응을 하나 고르세요.
    criteria:
    - 가장 먼저 할 대응을 올바르게 판단했는가
    pass_score: 70
    hints:
      warning: '''1m/s 차이니 괜찮다''며 진행을 허용하거나 측정값 재확인 없이 자의적으로 판단'
      answer_guide: ① 풍속계 측정값을 재확인 ② 규칙 기준(15m/s 초과 시 운전 중지)과 대조 ③ 운전원·신호수에게 중지 기준 안내 ④ 부장에게 '기준 초과로 임의
        진행 불가' 원칙 답변 ⑤ 박 과장에게 측정값·조항을 붙여 무전 보고 후 중지 조치 확인
    options:
    - key: a
      label: 풍속계 측정값을 재확인
    - key: b
      label: 규칙 기준(15m/s 초과 시 운전 중지)과 대조
    - key: c
      label: '''1m/s 차이니 괜찮다''며 진행을 허용하거나 측정값 재확인 없이 자의적으로 판단'
    - key: d
      label: 운전원·신호수에게 중지 기준 안내
